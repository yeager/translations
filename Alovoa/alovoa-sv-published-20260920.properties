backend.privacy=<h3>Integritetspolicy</h3><p>Denna integritetspolicy förklarar hur vår organisation använder de personuppgifter som vi samlar in om dig när du använder vår webbplats.</p><h3>Vilka uppgifter samlar vi in?</h3><p>COMPANY_NAME samlar in följande uppgifter:</p><ul><li>Personidentifierande uppgifter (namn, e-postadress, födelsedatum osv.).</li><li>Din plats och dina inställningar.</li><li>All interaktion du har med en annan användare.</li></ul><h3>Hur samlar vi in dina uppgifter?</h3><p>Du lämnar själv direkt merparten av de uppgifter som COMPANY_NAME samlar in. Vi samlar in och behandlar uppgifter när du:</p><ul><li>registrerar dig online.</li><li>lämnar information i din profil.</li><li>söker efter andra användare.</li><li>besöker en sida på webbplatsen.</li><li>interagerar med användare på plattformen.</li><li>frivilligt fyller i en kundenkät eller lämnar återkoppling.</li></ul><h3>Hur använder vi dina uppgifter?</h3><p>COMPANY_NAME samlar in dina uppgifter för att vi ska kunna:</p><ul><li>hantera ditt konto.</li><li>skicka e-post om viktiga ändringar och nyheter.</li><li>låta andra användare hitta dig.</li></ul><h3>API:er från tredje part</h3><p>COMPANY_NAME använder API:er från tredje part för följande webbplatser:</p><ul><li>openstreetmap.org. Din ungefärliga plats används för att visa kartdata när du söker efter användare.</li><li>meet.jit.si. Inga personuppgifter delas, men tjänsten används för att möjliggöra video- och ljudkommunikation mellan användare.</li><li>google.com och facebook.com. Dina personuppgifter är säkra i vår lokala databas, men dessa OAuth-leverantörer kan identifiera dig varje gång du använder deras tjänster.</li></ul><h3>Hur lagrar vi dina uppgifter?</h3><p>COMPANY_NAME lagrar dina uppgifter i en säker databas.</p><p>COMPANY_NAME behåller dina personuppgifter under obegränsad tid. Du kan alltid begära att dina uppgifter raderas.</p><p>COMPANY_NAME vill säkerställa att du är fullt medveten om alla dina dataskyddsrättigheter. Varje användare har rätt till följande:</p><p><strong>Rätt till tillgång</strong>– Du har rätt att begära kopior av dina personuppgifter från COMPANY_NAME. Vi kan ta ut en mindre avgift för denna tjänst.</p><p><strong>Rätt till rättelse</strong>– Du har rätt att begära att COMPANY_NAME rättar uppgifter som du anser är felaktiga. Du har också rätt att begära att COMPANY_NAME kompletterar uppgifter som du anser vara ofullständiga.</p><p><strong>Rätt till radering</strong>– Du har rätt att, under vissa villkor, begära att COMPANY_NAME raderar dina personuppgifter.</p><p><strong>Rätt till begränsning av behandling</strong>– Du har rätt att, under vissa villkor, begära att COMPANY_NAME begränsar behandlingen av dina personuppgifter.</p><p><strong>Rätt att invända mot behandling</strong>– Du har rätt att, under vissa villkor, invända mot COMPANY_NAME:s behandling av dina personuppgifter.</p><p><strong>Rätt till dataportabilitet</strong>– Du har rätt att, under vissa villkor, begära att COMPANY_NAME överför de uppgifter vi har samlat in till en annan organisation eller direkt till dig.</p><p>Om du gör en begäran har vi en månad på oss att svara. Om du vill utöva någon av dessa rättigheter följer du anvisningarna för hur du kontaktar oss längst ned på sidan.</p><h3>Cookies</h3><p>Cookies är textfiler som placeras på din dator för att samla in standardinformation från internetloggar och information om besökares beteende. När du besöker våra webbplatser kan vi automatiskt samla in information från dig genom cookies eller liknande teknik.</p><p>Mer information finns på allaboutcookies.org.</p><h3>Hur använder vi cookies?</h3><p>COMPANY_NAME använder cookies på flera sätt för att förbättra din upplevelse av vår webbplats, bland annat genom att:</p><ul><li>hålla dig inloggad.</li><li>lagra icke-personliga uppgifter.</li></ul><h3>Vilka typer av cookies använder vi?</h3><p>Det finns flera olika typer av cookies, men vår webbplats använder:</p><ul><li>Funktionella cookies – COMPANY_NAME använder dessa cookies för att känna igen dig på vår webbplats och komma ihåg dina tidigare valda inställningar. Det kan till exempel vara vilket språk du föredrar och var du befinner dig.</li><li>Det är allt. Till skillnad från våra konkurrenter använder vi inga cookies som kan spåra dig.</li></ul><h3>Så hanterar du cookies</h3><p>Du kan ställa in webbläsaren så att den inte accepterar cookies, och webbplatsen ovan förklarar hur du tar bort cookies från webbläsaren. I några fall kan dock vissa av webbplatsens funktioner sluta fungera.</p><h3>Andra webbplatsers integritetspolicyer</h3><p>COMPANY_NAME:s webbplats innehåller länkar till andra webbplatser. Vår integritetspolicy gäller endast vår webbplats, så om du följer en länk till en annan webbplats bör du läsa dess integritetspolicy.</p><h3>Ändringar i vår integritetspolicy</h3><p>COMPANY_NAME ser regelbundet över sin integritetspolicy och publicerar eventuella uppdateringar på denna webbsida. Denna integritetspolicy uppdaterades senast PRIVACY_UPDATE_DATE.</p><h3>Så kontaktar du oss</h3><p>Om du har frågor om COMPANY_NAME:s integritetspolicy, de uppgifter vi har om dig eller vill utöva någon av dina dataskyddsrättigheter, är du välkommen att kontakta oss <a href="/imprint">här</a>. Dina kontaktuppgifter sparas i upp till 90 dagar.</p><h3>Så raderar du dina uppgifter</h3><p>Följ <a href="/faq#delete-data">anvisningarna på vår FAQ-sida</a></p>#do not translate
backend.tos=<h3>Användarvillkor</h3><p>Uppdaterade TOS_UPDATE_DATE</p><h3>1. Inledning</h3><p>Genom att använda våra tjänster accepterar du användarvillkoren, som kan uppdateras från tid till annan, och vår integritetspolicy. Om du inte accepterar och samtycker till att vara bunden av samtliga villkor ska du inte använda våra tjänster.</p><p>Plattformen finns på flera språk, men endast engelska och tyska stöds officiellt. Vi kan inte garantera att innehåll på andra språk är korrekt.</p><h3>2. Behörighet</h3><p>Genom att skapa ett konto och använda tjänsten försäkrar och garanterar du att:</p><ul><li>du kan ingå ett bindande avtal med COMPANY_NAME.</li><li>du är minst MIN_AGE år gammal.</li><li>du inte har fler än ett konto hos våra tjänster.</li><li>du följer detta avtal samt alla nationella och internationella lagar.</li><li>du aldrig har befunnits skyldig till sexualbrott eller våldsrelaterat brott.</li><li>du behandlar andra med respekt.</li><li>du bara laddar upp uppgifter som tillhör dig.</li><li>du inte utger dig för att vara någon annan.</li><li>du inte delar olagligt innehåll.</li><li>du inte delar länkar i din offentliga profil.</li><li>du inte trakasserar, mobbar, förföljer, skrämmer, angriper, förtalar, skadar eller på annat sätt behandlar någon illa.</li><li>du inte laddar upp underförstått eller uttryckligt sexuellt innehåll.</li><li>du inte tidigare har stängts av från våra tjänster.</li></ul><h3>4. Ditt innehåll</h3><p>Du är ensam ansvarig för allt innehåll du laddar upp. Genom att ladda upp ditt innehåll bekräftar du att du äger alla rättigheter att göra det.</p><h3>5. Integritet</h3><p>För all information om integritet, läs vår integritetspolicy.</p><h3>6. Donationer och återbetalningar</h3><p>COMPANY_NAME tar endast emot donationer och säljer inte virtuella varor eller prenumerationer. Donationer återbetalas inte, utom när lagen i landet där du bor kräver det.</p><h3>7. Våra rättigheter</h3><p>Vi förbehåller oss rätten att avsluta ditt konto när som helst utan föregående meddelande.</p><h3>8. Ansvarsfriskrivning</h3><p>COMPANY_NAME TILLHANDAHÅLLER TJÄNSTEN I ”BEFINTLIGT SKICK” OCH ”I MÅN AV TILLGÄNGLIGHET” OCH GER, I DEN UTSTRÄCKNING SOM TILLÅTS ENLIGT TILLÄMPLIG LAG, INGA GARANTIER AV NÅGOT SLAG.</p><p>COMPANY_NAME UTFÄSTER ELLER GARANTERAR INTE ATT TJÄNSTEN KOMMER ATT VARA OAVBRUTEN ELLER FELFRI, ELLER ATT INNEHÅLL ELLER INFORMATION SOM DU ERHÅLLER PÅ ELLER GENOM TJÄNSTEN ÄR KORREKT.</p><p>COMPANY_NAME TAR INGET ANSVAR FÖR INNEHÅLL SOM DU ELLER EN ANNAN ANVÄNDARE PUBLICERAR ELLER SKICKAR.</p><p>COMPANY_NAME ANSVARAR INTE FÖR SKADOR PÅ DIN DATORS MASKIN- ELLER PROGRAMVARA.</p>
