explainer:
  no_reply_prefix: "⚠️ Inget svar: "
  empty_response: "{model} gav inget svar den här gången, inte heller efter nya försök.
    Skicka `continue` för att försöka igen eller byt modell med /model."
  exit:
    all_retries_exhausted_no_response: modellleverantören svarade inte efter alla
      nya försök. Skicka /retry eller byt modell med /model.
    partial_stream_recovery: strömningen stoppade tidigt och bara ett delsvar kunde
      återställas. Skicka `continue` för att fortsätta där den slutade.
    fallback_prior_turn_content: inget nytt innehåll skapades denna tur; tidigare
      återställt sammanhang visas. Skicka `continue` för att försöka igen.
    redirect_restart_limit_exceeded: begäran avbröts av en ny rättelse vid varje försök,
      så turen stoppades i stället för att försöka igen för alltid. Din senaste rättelse
      har köats som nästa meddelande.
    rebuilt_restart_limit_exceeded: varje leverantör i reservkedjan fortsatte att
      fallera, så turen stoppades i stället för att försöka igen för alltid. Skicka
      `continue` eller byt leverantör.
    budget_exhausted: budgeten för iterationer och kostnad per tur tog slut före ett
      slutsvar. Skicka `continue` för att fortsätta.
    ollama_runtime_context_too_small: den lokala modellens kontextfönster var för
      litet för att slutföra. Öka kontextstorleken eller använd en större modell.
    pending_tool_result: turen stoppades medan ett verktygsresultat fortfarande väntade
      och modellen gav ingen uppföljande text. Skicka `continue` för att låta den
      sammanfatta.
    interrupted_during_api_call: begäran avbröts mitt i anropet innan ett svar togs
      emot. Skicka `continue` för att försöka igen.
    max_iterations_reached: gränsen för verktygsiterationer nåddes före ett slutsvar.
      Skicka `continue` för att fortsätta eller höj `max_iterations`.
    error_near_max_iterations: ett fel uppstod nära iterationsgränsen före ett slutsvar.
      Kontrollera verktygsutdata ovan och skicka sedan `continue`.
    repeated_outer_errors: turen fortsatte att misslyckas med upprepade fel och stoppades
      tidigt i stället för att försöka igen för alltid. Kontrollera felen ovan och
      skicka sedan `continue` för att försöka igen.
  persistence:
    compression: Turen stoppades eftersom en annan process komprimerade sessionen.
      Ditt meddelande bör redan vara sparat — skicka det igen när komprimeringen är
      klar.
    compression_closed: Turen stoppades eftersom sessionen roterades av kontextkomprimeringen
      och dess aktiva fortsättning inte kunde tas över. Lagringen fungerar som den
      ska — uppdatera klienten (eller starta en ny tur) så att den hämtar det nya
      sessions-id:t och skicka sedan meddelandet igen.
    turn_lease: Turen stoppades eftersom en annan Hermes-process tog över sessionen.
      Ditt svar sparades inte — vänta tills den andra processen är klar och skicka
      sedan meddelandet igen.
    session_row_missing: Den här sessionen togs bort från lagringen medan chatten
      fortfarande var öppen och Hermes kunde inte återskapa den. Därför sparades inte
      meddelandet. Skicka det igen. Om felet fortsätter kör du `hermes {profile_arg}doctor`.
    locked: Turen stoppades eftersom sessionslagringen var upptagen (en annan Hermes-process
      skrev till tillståndsdatabasen). Ditt meddelande bör redan vara sparat — skicka
      det igen om en stund.
    replaced: Sessionsdatabasfilen ersattes medan Hermes körde, så meddelandet sparades
      inte (en kopia finns i {home}/sessions/). Stoppa Hermes (`hermes {profile_arg}gateway
      stop`), kör `hermes {profile_arg}doctor` — inte `hermes {profile_arg}doctor
      --fix`, som skulle reparera fel fil på plats — starta sedan Hermes igen och
      skicka meddelandet en gång till. Avancerade återställningssteg finns i loggen.
    deleted_wal: 'En annan Hermes-process håller fortfarande en gammal kopia av sessionsdatabasens
      skrivlogg, så Hermes slutade skriva för att skydda filen och meddelandet sparades
      inte (en kopia finns i {home}/sessions/). Inget har gått förlorat. Avsluta alla
      Hermes-processer i den här profilen (skrivbordsappen, `hermes {profile_arg}gateway
      stop`, instrumentpanelen, cron), kör `hermes {profile_arg}doctor` — det anger
      alla processer som fortfarande håller loggen — starta sedan Hermes igen och
      skicka meddelandet en gång till. Kör inte `doctor --fix` och ta inte bort några
      state.db-filer medan de körs. Guide: {recovery_docs}'
    corrupt: |-
      Turen stoppades eftersom tillståndsdatabasen rapporterade strukturell skada (transkriptet skulle ha gått förlorat vid omstart). Att frigöra diskutrymme hjälper inte. Återställningsalternativ:
      1. Kör `hermes {profile_arg}doctor --fix`
      2. Stoppa gatewayen och återställ sedan med:
         hermes {profile_arg}sessions recover --source {db_path} --inspect-only
         (om kommandot rapporterar återställbar data) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db
         — återställningen skapar först en ögonblicksbild av den skadade filen. Kör INTE `sqlite3 ... ".recover"` mot den aktiva state.db-filen, eftersom en sårbar sqlite3-klient kan skada den ytterligare
      3. Återställ från en säkerhetskopia i {backups_dir}/
      Skicka sedan meddelandet igen.
    fts_index: Turen stoppades eftersom sessionssökindexet (FTS5) är skadat och inte
      kunde kopplas bort, så meddelandet sparades inte. Själva meddelandelagringen
      är inte skadad. Kör inga återställningsverktyg och återställ inte från säkerhetskopia.
      Kör `hermes {profile_arg}doctor --fix` (eller starta om Hermes, som reparerar
      indexet när det öppnas) och skicka sedan meddelandet igen.
    disk: Hermes kunde inte spara konversationen på disken och stoppade därför i stället
      för att förlora dina meddelanden. Disken är troligen full. Frigör utrymme (eller
      rätta behörigheterna för {home}/state.db) och skicka sedan meddelandet igen.
    default: Hermes kunde inte spara konversationen och stoppade därför i stället
      för att förlora dina meddelanden. Möjliga orsaker är att disken är full eller
      att en annan Hermes-process håller databasen. Stäng andra Hermes-fönster, kör
      `hermes {profile_arg}doctor` för att kontrollera lagringen och skicka sedan
      meddelandet igen.
  file_mutation:
    header: "⚠️ Verifiering av filändringar: {count} filändring(ar) MISSLYCKADES denna
      tur trots eventuell formulering ovan som antyder något annat. Kör `git status`
      eller `read_file` för att bekräfta vad som faktiskt genomfördes."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: misslyckades
  shared:
    and_more: "  • … och {count} till"
    the_model: Modellen
tips:
  t001: "/bg <prompt> kör en uppgift i en separat session medan den aktuella sessionen
    förblir ledig; /btw <question> besvarar en sidofråga om den här konversationen
    utan att avbryta den."
  t002: "/branch förgrenar den aktuella sessionen så att du kan utforska en annan
    riktning utan att förlora framsteg."
  t003: "/compress komprimerar konversationskontexten manuellt när den blir lång."
  t004: "/rollback listar filsystemets återställningspunkter — återställ filer som
    agenten har ändrat till ett tidigare tillstånd."
  t005: "/rollback diff 2 förhandsvisar vad som har ändrats sedan återställningspunkt
    2 utan att återställa något."
  t006: "/rollback 2 src/file.py återställer en enskild fil från en viss återställningspunkt."
  t007: /title "my project" namnger sessionen — återuppta den senare med /resume eller
    hermes -c.
  t008: "/resume fortsätter där du slutade i en tidigare namngiven session."
  t009: "/queue <prompt> köar ett meddelande för nästa tur utan att avbryta den aktuella."
  t010: "/undo tar bort det senaste utbytet mellan användare och assistent från konversationen."
  t011: "/retry skickar det senaste meddelandet igen — användbart när agentens svar
    inte blev helt rätt."
  t012: "/verbose växlar visning av verktygsförlopp: off → new → all → verbose."
  t013: "/reasoning high ökar modellens tankedjup. /reasoning show visar resonemanget."
  t014: "/fast växlar prioritetsbearbetning för snabbare API-svar (beroende på leverantör)."
  t015: "/yolo hoppar över alla frågor om godkännande av farliga kommandon för resten
    av sessionen."
  t016: "/model låter dig byta modell mitt i sessionen — prova /model sonnet eller
    /model gpt-5."
  t017: "/model --global ändrar standardmodellen permanent."
  t018: "/personality pirate anger en rolig personlighet — 14 inbyggda alternativ
