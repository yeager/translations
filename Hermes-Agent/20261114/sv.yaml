    träffar hittades (inte ett fel)”.'
  t226: Terminalkommandon i förgrunden som misslyckas försöks automatiskt igen upp
    till tre gånger med exponentiellt ökat intervall (2 s, 4 s, 8 s).
  t227: Rena sudo-kommandon skrivs automatiskt om för att leda SUDO_PASSWORD från
    .env via pipe — ingen interaktiv fråga krävs.
  t228: 'Hjälpfunktionerna i execute_code kräver uttryckliga importer: from hermes_tools
    import json_parse, shell_quote, retry.'
  t229: De sju sandlådeverktygen i execute_code (web_search, terminal, read/write/search/patch)
    använder RPC — de hamnar aldrig i kontexten.
  t230: Att läsa samma filområde tre gånger eller fler utlöser en varning. Vid fyra
    gånger eller fler blockeras det för att förhindra loopar.
  t231: write_file och patch upptäcker om en fil har ändrats externt sedan den senast
    lästes och varnar för inaktuellt innehåll.
  t232: Patchformatet V4A stöder direktiven Add File, Delete File och Move File —
    inte bara Update.
  t233: MCP-servrar kan begära LLM-svar via sampling — agenten blir ett verktyg för
    servern.
  t234: MCP-servrar skickar notifications/tools/list_changed för att utlösa automatisk
    omregistrering av verktyg utan omstart.
  t235: 'delegate_task med acp_command: ''claude'' startar Claude Code som underagent
    från valfri plattform.'
  t236: Delegering har en pulssignalstråd — underagentens aktivitet sprids till den
    överordnade agenten och förhindrar gatewaytidsgränser.
  t237: När en leverantör returnerar HTTP 402 (betalning krävs) växlar den extra klienten
    automatiskt till nästa.
  t238: agent.tool_use_enforcement styr modeller som beskriver åtgärder i stället
    för att anropa verktyg — automatiskt för GPT/Codex.
  t239: agent.restart_after_turn_timeout låter pågående turer slutföras innan /restart
    anropar stop(); restart_drain_timeout är bara budgeten för tvingat avbrott när
    stop() börjar.
  t240: agent.api_max_retries (standardvärde 3) styr hur många gånger agenten försöker
    igen efter ett misslyckat API-anrop innan felet visas — sänk värdet för snabb
    reservväg.
  t241: Gatewayen cachelagrar AIAgent-instanser per session — om denna cache förstörs
    fungerar inte Anthropics promptcachning.
  t242: Alla webbplatser kan exponera färdigheter via /.well-known/skills/index.json
    — färdighetshubben upptäcker dem automatiskt.
  t243: Granskningsloggen för färdigheter i ~/.hermes/skills/.hub/audit.log spårar
    varje installation och borttagning.
  t244: 'Inaktuella git-arbetskopior rensas automatiskt: rena sammanslagna arbetskopior
    tas bort, medan oanvända smutsiga eller opushade arbetskopior först arkiveras
    och kan återställas med hermes worktree restore.'
  t245: Profiler avgränsar Hermes tillstånd via HERMES_HOME. Underprocesser för värdverktyg
    behåller ditt faktiska HOME om inte terminal.home_mode är profile.
  t246: Miljövariabeln HERMES_HOME_MODE (oktalt, till exempel 0701) anger anpassade
    katalogbehörigheter för åtkomst till underkataloger i webbservern.
  t247: 'Behållarläge: lägg .container-mode i HERMES_HOME så kör värd-CLI:t automatiskt
    exec i behållaren.'
  t248: 'Ctrl+C har fem prioritetsnivåer: avbryt inspelning → avbryt promptar → avbryt
    väljare → avbryt agent → avsluta.'
  t249: Avbrott under en agentkörning loggas i agent.log (visa med `hermes logs`);
    ange HERMES_DEBUG_INTERRUPT=1 för en detaljerad spårning.
  t250: BROWSER_CDP_URL ansluter webbläsarverktyg till valfri webbläsare i Chromium-familjen
    — accepterar WebSocket, HTTP eller värd:port.
  t251: BROWSERBASE_ADVANCED_STEALTH=true aktiverar avancerat skydd mot upptäckt med
    anpassad Chromium (Scale Plan).
  t252: CLI:t växlar automatiskt till kompakt läge i terminaler som är smalare än
    80 kolumner.
  t253: 'Snabbkommandon stöder två typer: exec (kör skalkommandot direkt) och alias
    (omdirigerar till ett annat kommando).'
  t254: 'Delegeringsmodell per uppgift: delegation.model och delegation.provider i
    konfigurationen dirigerar underagenter till billigare modeller.'
  t255: delegation.reasoning_effort styr oberoende resonemangsdjupet för underagenter.
  t256: 'display.platforms i config.yaml tillåter åsidosättning av visning per plattform:
    {telegram: {tool_progress: all}}.'
  t257: human_delay.mode i konfigurationen simulerar mänsklig skrivhastighet — intervallet
    min_ms/max_ms kan konfigureras.
  t258: Migreringar av konfigurationsversioner körs automatiskt vid inläsning — nya
    konfigurationsnycklar visas utan manuella åtgärder.
  t259: GPT- och Codex-modeller får särskild vägledning i systemprompten för verktygsdisciplin
    och obligatorisk verktygsanvändning.
  t260: Gemini-modeller får anpassade instruktioner för absoluta sökvägar, parallella
    verktygsanrop och icke-interaktiva kommandon.
  t261: context.engine i config.yaml kan sättas till namnet på en insticksmodul för
    alternativa strategier för kontexthantering.
  t262: Med en molnwebbläsare öppnas localhost- och LAN-URL:er i stället i en lokal
    Chromium (browser.auto_local_for_private_urls, aktiverat som standard).
  t263: 'Komprimeraren gör en billig första bearbetning: verktygsutdata på fler än
    200 tecken ersätts med platshållare innan LLM körs.'
  t264: När komprimeringen misslyckas pausas ytterligare försök i tio minuter för
    att undvika att överbelasta API:t.
  t265: Långa riskfyllda kommandon (>70 tecken) får alternativet ”view” i frågan om
    godkännande så att hela texten kan visas först.
  t266: Visualisering av ljudnivå visar staplarna ▁▂▃▄▅▆▇ under röstinspelning baserat
    på mikrofonens RMS-nivåer.
  t267: Profilnamn får inte krocka med befintliga binärfiler i PATH — 'hermes profile
    create ls' skulle avvisas.
  t268: hermes profile create backup --clone-all kopierar allt (config, keys, SOUL.md,
    minnen, färdigheter, sessioner).
  t269: Tangenten för röstinspelning kan konfigureras via voice.record_key i config.yaml
    — inte bara Ctrl+B.
  t270: Filerna .cursorrules och .cursor/rules/*.mdc upptäcks automatiskt och läses
    in som projektkontext.
  t271: Kontextfiler har stöd för fler än tio mönster för promptinjektion — osynlig
    Unicode, ”ignore instructions”, försök till datautfiltrering.
  t272: GPT-5 och Codex använder rollen 'developer' i stället för 'system' i meddelandeformatet.
  t273: 'Åsidosättningar för extraklienten per uppgift: auxiliary.vision.provider,
    auxiliary.compression.model med mera i config.yaml.'
  t274: Den extra klienten behandlar 'main' som ett leverantörsalias — det löses till
    din verkliga primära leverantör + modell.
  t275: hermes import-agent openclaw --dry-run förhandsvisar migrering från OpenClaw
    utan att skriva något.
  t276: Filsökvägar som klistras in med citationstecken eller avskärmade mellanslag
    hanteras automatiskt — ingen manuell rensning behövs.
  t277: Snedstreckskommandon utlöser aldrig hopfällning av stora inklistringar — /command
    med stora argument fungerar korrekt.
  t278: I avbrottsläge kringgår snedstreckskommandon som skrivs under agentkörning
    avbrottslogiken och körs direkt.
  t279: HERMES_DEV=1 kringgår identifiering av behållarläge för lokal utveckling.
  t280: Varje MCP-server får en egen verktygsuppsättning (mcp-servername) som kan
    växlas oberoende via hermes tools.
  t281: MCP-platshållare av typen ${ENV_VAR} i konfigurationen löses när servern startas
    — även variabler från ~/.hermes/.env.
  t282: Färdigheter från betrodda förråd (NousResearch) får säkerhetsnivån 'trusted';
    färdigheter från gemenskapen får extra granskning.
  t283: Karantänen för färdigheter i ~/.hermes/skills/.hub/quarantine/ innehåller
    färdigheter som väntar på säkerhetsgranskning.
  t284: "/steer <prompt> injicerar en anteckning efter nästa verktygsanrop — styr
    riktningen mitt i uppgiften utan att avbryta."
  t285: "/goal <text> anger ett fortlöpande Ralph-loopmål — Hermes fortsätter automatiskt
    tur efter tur tills en bedömare säger att det är klart."
  t286: "/snapshot create [label] sparar en fullständig tillståndsbild av Hermes konfiguration;
    /snapshot restore <id> återställer den senare."
  t287: "/copy [N] kopierar det senaste assistentsvaret till urklipp, eller det n:te
    senaste med ett nummer."
  t288: "/redraw tvingar fram en fullständig omritning av gränssnittet och åtgärdar
    terminalförskjutning efter ändrad tmux-storlek eller artefakter från musmarkering."
  t289: "/agents (alias /tasks) visar aktiva agenter och körande bakgrundsuppgifter
    i den aktuella sessionen."
  t290: "/footer växlar gatewayens sidfot i slutsvar, som visar modell, kontextprocent
    och cwd."
  t291: "/busy queue|steer|interrupt styr vad en tryckning på Enter gör medan Hermes
    arbetar."
  t292: "/topic i Telegram-direktmeddelanden aktiverar användarhanterat ämnesläge
    med flera sessioner — /topic <id> återställer tidigare sessioner direkt i chatten."
  t293: "/approve session|always kör ett väntande riskfyllt kommando med din valda
    omfattning för förtroendet; /deny avvisar det."
  t294: "/restart startar om gatewayen kontrollerat efter att aktiva körningar har
    tömts och pingar sedan begäraren när den är igång igen."
  t295: "/kanban boards switch <slug> ändrar den aktiva Kanban-tavlan för flera projekt
    inifrån chatten."
  t296: "/reload läser in ~/.hermes/.env på nytt i den körande sessionen — nya API-nycklar
    används utan omstart."
  t297: Ett cronjobb med no_agent=True kör ett skript enligt schema och skickar standardutdata
    direkt — noll token, ingen LLM.
  t298: Tomma standardutdata från ett cron-skript innebär en tyst körning — inget
    levereras, perfekt för övervakare av tröskelvärden.
  t299: HERMES_CRON_MAX_PARALLEL (standardvärde 4) begränsar hur många cronjobb som
    körs per körning så att toppar inte mättar dina nycklar.
  t300: Gatewaykrokar finns under ~/.hermes/hooks/<name>/ med HOOK.yaml + handler.py
    — hanteraren måste heta `handle`.
  t301: Krokhändelser omfattar gateway:startup, session:start, agent:step och jokerteckenprenumerationer
    på command:*.
  t302: Lägg en checklista i ~/.hermes/BOOT.md så kör en gateway:startup-krok den
    som en engångsagent vid varje uppstart.
  t303: hermes curator run --dry-run förhandsvisar vad kuratorn skulle arkivera eller
    konsolidera utan att ändra något.
  t304: hermes curator pin <skill> skyddar en färdighet mot både automatisk arkivering
    och agentens verktyg skill_manage.
  t305: hermes curator rollback återställer färdigheter från en ögonblicksbild före
    körning — säkerhetskopior finns under skills/.curator_backups/.
  t306: hermes auth reset <provider> [target] rensar karenstider och uttömningsflaggor
    för en hel uppsättning autentiseringsuppgifter, eller för en enskild uppgift efter
    index, id eller etikett.
  t307: 'credential_pool_strategies.<provider>: round_robin växlar nycklar jämnt i
    stället för standardvärdet fill_first.'
  t308: 'use_gateway: true per verktyg dirigerar web, image, tts eller browser via
    din Nous-prenumeration — inga extra nycklar.'
  t309: 'provider_routing.data_collection: deny utesluter leverantörer som lagrar
    data på OpenRouter.'
  t310: 'provider_routing.require_parameters: true dirigerar bara till leverantörer
    som stöder alla parametrar i din begäran.'
  t311: HERMES_TUI_RESUME=1 återansluter automatiskt till den senaste TUI-sessionen
    vid start — praktiskt efter avbruten SSH-anslutning.
  t312: HERMES_TUI_THEME=light|dark|<hex> tvingar fram TUI-temat i terminaler som
    inte ställer in COLORFGBG.
  t313: Ctrl+G eller Ctrl+X Ctrl+E i TUI:t öppnar indatabufferten i $EDITOR för långa
    flerradiga promptar.
  t314: TUI:t återger LaTeX direkt i texten — $E=mc^2$ blir Unicode-matematik i stället
    för rå TeX.
  t315: hermes dashboard startar ett lokalt webbgränssnitt på 127.0.0.1:9119 — ingen
    data lämnar localhost.
  t316: hermes dashboard bäddar in hela Hermes TUI i webbläsaren via xterm.js och
    en WebSocket-PTY.
  t317: Lägg en YAML-fil med två palettfärger i ~/.hermes/dashboard-themes/ för att
    ge hela instrumentpanelen ett nytt utseende.
  t318: 'Insticksmoduler för instrumentpanelen kan läggas direkt: manifest.json +
    JS-paket i ~/.hermes/dashboard-plugins/ — ingen npm-byggning krävs.'
  t319: 'layoutVariant: cockpit i ett instrumentpanelstema lägger till en vänsterspalt
    på 260 px som insticksmoduler kan fylla via sidofältsplatsen.'
  t320: 'display.tool_progress_command: true exponerar /verbose på meddelandeplattformar;
    det är endast CLI som standard.'
  t321: HERMES_BACKGROUND_NOTIFICATIONS=result pingar endast när bakgrundsuppgifter
    är klara (jämfört med concise/all/error/off).
  t322: 'HERMES_WRITE_SAFE_ROOT begränsar write_file/patch till katalogprefix; flera
    sökvägar via os.pathsep (: eller ;).'
  t323: HERMES_IGNORE_RULES hoppar över automatisk injicering av AGENTS.md, SOUL.md,
    .cursorrules, minne och förinlästa färdigheter.
  t324: HERMES_ACCEPT_HOOKS godkänner automatiskt skalkrokar som inte har setts tidigare
    och som anges i config.yaml, utan en TTY-fråga.
  t325: auxiliary.goal_judge.model dirigerar /goal-bedömaren till en billig snabb
    modell för att hålla loopkostnaden nära noll.
  t326: Återställningspunkter hoppar över kataloger med fler än 50 000 filer för att
    undvika långsamma git-åtgärder i mycket stora monorepon.
  t327: 'tts.provider: piper kör lokal TTS på CPU för 44 språk — röster hämtas automatiskt
    till ~/.hermes/cache/piper-voices/.'
  t328: 'tts.providers.<name>.type: command kopplar valfri CLI-baserad TTS-motor med
    platshållarna {input_path} och {output_path}.'
  t329: API_SERVER_ENABLED=true kör en OpenAI-kompatibel ändpunkt parallellt med gatewayen
    för Open WebUI och LibreChat.
  t330: 'GATEWAY_PROXY_URL kör en uppdelad konfiguration: plattforms-I/O lokalt och
    agentarbete delegerat till en fjärransluten API-server.'
  t331: MATRIX_DEVICE_ID fäster ett stabilt enhets-ID för E2EE — utan det roteras
    nycklar vid varje start och historisk dekryptering slutar fungera.
  t332: TELEGRAM_WEBHOOK_SECRET krävs när TELEGRAM_WEBHOOK_URL är angiven — skapa
    den med openssl rand -hex 32.
  t333: batch_runner.py --resume matchar slutförda promptar mot innehållet så att
    omordnade datauppsättningar inte kör färdigt arbete igen.
  t334: "/new startar en ny session på plats (alias /reset) — nytt sessions-ID, ren
    historik, CLI:t förblir öppet."
  t335: "/clear tömmer terminalskärmen och startar en ny session — en genväg för visuell
    återställning."
  t336: "/history skriver ut den aktuella konversationen direkt i CLI:t utan att lämna
    det — användbart för en snabb omläsning."
  t337: "/save skriver den aktuella konversationen till disk utan att avsluta sessionen."
  t338: "/status visar sessionsinformation med en blick: ID, titel, modell, tokenanvändning
    och förfluten tid."
  t339: "/image <path> bifogar en lokal bildfil till nästa prompt utan inklistring
    eller dra-och-släpp."
  t340: "/platforms visar anslutningsstatus för gatewayen och meddelandeplattformar
    direkt i chatten."
  t341: "/commands delar upp den fullständiga listan över snedstreckskommandon och
    installerade färdigheter i sidor — användbart på plattformar utan tabbkomplettering."
  t342: "/toolsets listar alla tillgängliga verktygsuppsättningar så att du vet vad
    -t/--toolsets accepterar."
  t343: "/voice tts växlar läget för enbart TTS — agenten svarar högt men du skriver
    fortfarande dina promptar."
  t344: "/reload-skills skannar om ~/.hermes/skills/ så att färdigheter som lagts
    direkt visas utan att sessionen startas om."
  t345: "/indicator kaomoji|emoji|unicode|ascii väljer stilen för TUI:ts upptagenindikator
    som visas under agentkörningar."
  t346: "/debug upload laddar upp en sammanfattning (versioner, konfigurationsnycklar,
    antal fel; ingen loggtext) och returnerar en delbar länk — fungerar även i chatten."
  t347: 'hermes -z "<prompt>" är den renaste engångskörningen: slutsvar på standardutdata,
    inget annat — perfekt för att skicka vidare i skript.'
  t348: hermes chat --pass-session-id injicerar sessions-ID:t i systemprompten så
    att agenten kan referera till det själv.
  t349: hermes chat --image path/to/pic.png bifogar en lokal bild till en enskild
    -q-fråga utan ett separat uppladdningssteg.
  t350: hermes chat --ignore-user-config hoppar över den aktiva användarkonfigurationen
    — reproducerbara felrapporter och CI-körningar.
  t351: hermes chat --source tool märker programmatiska chattar så att de inte fyller
    listan över hermes-sessioner.
  t352: hermes dump --show-keys inkluderar maskerade API-nyckelfingeravtryck för mer
    djupgående felsökning av supportärenden.
  t353: hermes sessions rename <ID> "new title" byter namn på valfri tidigare session;
    hermes sessions delete <ID> tar bort en.
  t354: hermes import återställer en fullständig Hermes-säkerhetskopia i zip-format;
    sessionsexporter i JSON/JSONL importeras från Sessions-sidan i instrumentpanelen.
  t355: hermes fallback hanterar kedjan fallback_model interaktivt — ingen manuell
    redigering av config.yaml.
  t356: hermes pairing roterar token för DM-parkoppling — den första som skickar meddelande
    efter rotationen får åtkomst till boten.
  t357: hermes setup guidar förstagångsanvändare genom leverantör, nycklar och plattformsanslutning
    i ett interaktivt flöde.
  t358: hermes status --deep kör den fullständiga hälsogenomgången av alla komponenter;
    vanliga hermes status är snabbvyn.
  t359: HERMES_AGENT_TIMEOUT=0 inaktiverar gatewayens avslutning på grund av inaktivitet
    för en körande agent — använd för långa forskningskörningar.
  t360: HERMES_ENABLE_PROJECT_PLUGINS=1 läser automatiskt in lokala insticksmoduler
    från ./.hermes/plugins/ — med avsikt skyddat av en förtroendekontroll.
  t361: HERMES_DISABLE_FILE_STATE_GUARD=1 stänger av skyddet ”filen har ändrats sedan
    du läste den” i patch och write_file.
  t362: HERMES_ALLOW_PRIVATE_URLS=true låter webbverktyg nå localhost och privata
    nätverk — avstängt som standard i gatewayläge.
  t363: HERMES_OPTIONAL_SKILLS=name1,name2 installerar automatiskt ytterligare färdigheter
    från den valfria katalogen vid första körningen per profil.
  t364: HERMES_BUNDLED_SKILLS pekar på ett anpassat träd med medföljande färdigheter
    — används av paketering för Homebrew och Nix.
  t365: HERMES_DUMP_REQUEST_STDOUT=1 skriver nyttolasten för varje API-begäran till
    standardutdata i stället för loggfiler.
  t366: HERMES_OAUTH_TRACE=1 loggar maskerat OAuth-tokenutbyte och uppdateringsförsök
    för felsökning av leverantörsautentisering.
  t367: HERMES_STREAM_RETRIES (standardvärde 3) styr återanslutningsförsök under pågående
    strömning vid tillfälliga nätverksfel.
  t368: HERMES_GATEWAY_BUSY_ACK_ENABLED=false tystar ⚡/⏳/⏩-bekräftelsemeddelanden
    när en användare skriver till en upptagen agent.
  t369: HERMES_AGENT_NOTIFY_INTERVAL (standardvärde 180 s) anger hur ofta gatewayen
    pingar med förlopp vid långa turer.
  t370: HERMES_RESTART_DRAIN_TIMEOUT (standardvärde 900 s) begränsar hur länge /restart
    väntar på pågående körningar innan den tvingar fram avbrott.
  t371: HERMES_CHECKPOINT_TIMEOUT (standardvärde 30 s) begränsar hur länge skapandet
    av en återställningspunkt i filsystemet får ta — höj värdet för mycket stora monorepon.
  t372: 'image_gen.model i config.yaml väljer FAL-modell: flux-2/klein, gpt-image-2,
    nano-banana-pro med flera.'
  t373: image_gen.provider dirigerar bildgenerering via en insticksmodul (OpenAI Images,
    Codex, FAL) i stället för standardvägen.
  t374: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY pekar bildanalys mot
    valfri OpenAI-kompatibel ändpunkt.
  t375: API_SERVER_MODEL_NAME anpassar modellnamnet på /v1/models — avgörande för
    Open WebUI-konfigurationer med flera profiler.
  t376: Insticksmoduler för instrumentpanelen levereras från /dashboard-plugins/<name>/
    — lägg filer i ~/.hermes/dashboard-plugins/.
  t377: Chattar med --source tool undantas från listan över hermes sessions som standard
    — ange --source uttryckligen för att se dem.
  placeholder:
    p01: Fråga vad som helst eller skriv / för kommandon…
    p02: Sammanfatta innehållet i den här mappen
    p03: Skriv ett utkast till svar på det senaste mejlet i inkorgen
    p04: Planera en funktion och bygg den sedan steg för steg
    p05: Hitta och åtgärda ett test som misslyckas
    p06: Undersök det här ämnet och skriv en kort sammanfattning
    p07: Vad har nyligen ändrats i det här förvaret?
    p08: Gör om dessa anteckningar till en att-göra-lista
    p09: Förklara det här felet och hur det åtgärdas
    p10: Ställ in en påminnelse eller schemalägg en återkommande uppgift
    p11: Skriv / för att bläddra bland kommandon eller Ctrl+P för paletten
plan_usage:
  level_free: Gratis
  level_top_tier: Stor
  resets_in: återställs om {duration}
  resets_soon: återställs snart
  limit_reached: gränsen för {name} har nåtts · {resets}
  limit_day: dagligen
  limit_week: veckovis
  limit_month: månadsvis
  limit_top_tier: månatlig gräns för stora modeller
  then_credits: betalda modeller använder nu dina krediter (betala efter användning)
  then_credits_large: stora modeller använder nu dina krediter (betala efter användning)
  then_wait: endast gratismodeller tills dess
