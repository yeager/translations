    username_changed:
      subject: Ditt Plex användarnamn har ändrats!
      title: Ditt Plex användarnamn har ändrats
      new_username_info_markup: Hej! Vi ville berätta för dig att vi var tvugna att byta ditt Plex användarnamn från %{old_name} till %{bold_start}%{new_name}%{bold_end}. Vi har nyligen gjort ändringar i våra villkor beträffande användarnamn och tyvärr var ditt del av den lilla procent som blev påverkade. Med omedelbar början kommer du behöva använda ditt nya användarnamn, %{bold_start}%{new_name}%{bold_end}, var gång du loggar in på Plex.
      reasons: Vi vet att detta är irriterande och vi beklagar, men vi anser att denna ändring är nödvändig för att förhindra förvirring framöver. Vi har från början varit för släpphänta med att låta folk välja namn. Vi brukade t.ex. tillåta namn som enbart skiljde sig åt med stor bokstav. Så om vi hade en Plex användare som hette "barkley", tillät vi även någon att välja namnet "Barkley" med stort "B". Det här visade sig bli frustrerande för många människor eftersom det var väldigt enkelt att skriva in fel namn av misstag och även möjligt att låsa någon annan ute från sitt konto genom att försöka för många gånger.
      your_change_explanation_text: Vi vill vara så rättvisa som möjligt när vi gör denna ändring, så om du får denna e-post betyder det att någon annan hade en variation av ditt användarnamn först. Om du inte trivs med ditt nya användarnamn kan du ändra det när du vill i dina kontoinställningar på%{account_settings_link}.
      your_change_explanation_markup: Vi vill vara så rättvisa som möjligt när vi gör denna ändring, så om du får denna e-post betyder det att någon annan hade en variation av ditt användarnamn först. Om du inte trivs med ditt nya användarnamn kan du ändra det när du vill i %{account_settings_link_start}dina kontoinställningar på%{link_end}.
      thank_you: Tack för din förståelse och fortsätt Plexa!
    username_stripped:
      subject: Ditt Plex användarnamn har ändrats!
      title: Ditt Plex användarnamn har ändrats
      new_username_info_markup: Hallå! Vi ville meddela att vi måste ändra ditt användarnamn som är kopplat till%{email} Plex-kontot till%{bold_start}%{new_name}%{bold_end}. Under en granskning av kontoinformationen upptäckte vi att ditt tidigare användarnamn innehöll en eller flera speciella "dolda" tecken som en flik- eller vagnretur. När sådana speciella dolda tecken togs bort resulterade det i att ditt användarnamn för kontot var identiskt med ett befintligt konto.
      new_username_info_text: Hallå! Vi ville meddela att vi måste ändra ditt användarnamn som är kopplat till %{email}Plex-kontot till%{new_name}. Under en granskning av kontoinformation upptäckte vi att ditt tidigare användarnamn innehöll en eller flera speciella "dolda" tecken som en flik- eller vagnretur. När sådana speciella dolda tecken togs bort resulterade det i att ditt användarnamn för kontot var identiskt med ett befintligt konto.
      reasons: Eftersom vi kräver att användarnamn ska vara unika måste vi justera ditt användarnamn för ditt konto så att det fortfarande var unikt efter att ha rättats. Vi vill vara så rättvisa som möjligt när vi gör den här typen av förändring, så om du får det här mailet betyder det att någon annan hade en variation av ditt användarnamn först.
      explanation_intro: 'Vad detta betyder för dig:'
      explanation_1_markup: Från och med nu måste du använda ditt nya användarnamn (%{bold_start}%{new_name}%{bold_end}) eller din e-postadress för konto (%{email}) när du loggar in på Plex
      explanation_1_text: Från och med nu måste du använda ditt nya användarnamn (%{new_name}) eller din e-postadress för konto (%{email}) när du loggar in på Plex
      explanation_2_markup: Om du är missnöjd med ditt nya användarnamn kan du ändra det när som helst %{account_settings_link_start}under dina kontoinställningar%{link_end}.
      explanation_2_text: Om du är missnöjd med ditt nya användarnamn kan du ändra det när som helst under dina kontoinställningar på%{account_settings_link}
      explanation_end: Vi vet att en sådan förändring kan vara irriterande, och vi är verkligen ledsna för det, men vi anser att denna förändring är nödvändig för att undvika förvirring i framtiden. Vi uppskattar din förståelse med denna förändring.
      thank_you: Tack för att du använder Plex!
    home_invite:
      subject: Du har fått en inbjudan att gå med på en Plex hemsida
      title: Du har fått en inbjudan att gå med på någons Plex hemsida!
      greeting: Hallå där!
      invited_by: Du har blivit inbjuden av %{username}att gå med i deras Plex hem. För att acceptera denna inbjudan klickar du bara på nedan.
      description: Att gå med i ett hem gör att du snabbt kan växla mellan konton bland dina Plex klienter. Det kan även tillåta andra medlemmar på hemsidan att administrera ditt konto och din Plex Media Server, så gå inte med i någons hem som du inte känner (och litar på).
      current_home_warning_markup: '%{bold_start}Observera:%{bold_end} Vi visar att du redan är en del av ett Plex Home. Om du accepterar en inbjudan att ansluta till ett annat hem, lämnar du något aktuellt hem. Om du är administratör för det Plex Home, kommer det att raderas, vilket leder till att andra medlemmar lämnar och alla hanterade användare ska raderas.'
