scenes.heroselectscene.daily=Dagens omgång
scenes.heroselectscene.daily_desc=Varje dag finns en ny omgång som är likadan för alla! Den här ”dagliga omgången” genererar samma fängelsehåla för alla som spelar den, förutsatt att de använder samma spelversion.\n\nDu kan ta hur lång tid du vill på dig för att slutföra en daglig omgång, men kan bara ha en aktiv åt gången. _Dagliga omgångar kan inte ge märken och har en egen rankningssida._\n\nVill du börja dagens dagliga omgång med den hjälte och de utmaningar du har valt?
scenes.heroselectscene.daily_yes=Ja
scenes.heroselectscene.daily_no=Nej
scenes.heroselectscene.daily_repeat=Du har redan spelat dagens omgång. Du kan spela om den om du vill, men bara som en orankad träningsomgång.\n\nNär du har slutfört omspelet kan du se det i fönstret för dagliga rankningar en kort tid innan resultatet raderas.\n\nVill du spela om dagens dagliga omgång med den hjälte och de utmaningar du har valt?
scenes.heroselectscene.daily_unavailable_long=Det verkar som om du har startat en daglig omgång som ligger i framtiden! Det kan hända om du nyligen bytt tidszon eller ändrat systemklockan. _Nästa dagliga omgång blir tillgänglig om %d dagar._
scenes.heroselectscene.daily_existing=Du har redan en daglig omgång på gång. Du måste avsluta den innan du startar en ny.
scenes.heroselectscene.daily_nowin=Varje dag finns en ny omgång som är likadan för alla! Den här ”dagliga omgången” genererar samma fängelsehåla för alla som spelar den, förutsatt att de använder samma spelversion.\n\n_Du måste vinna minst en omgång innan du kan spela dagliga omgångar._
scenes.heroselectscene.custom_seed_title=Ange ett eget frö
scenes.heroselectscene.custom_seed_desc=Spelet använder en frökod för att generera fängelsehålor. Samma frö och spelversion genererar alltid samma fängelsehåla! _Omgångar med egna frön kan inte ge märken, räknas inte som spelade omgångar och visas längst ned på rankningssidan._
scenes.heroselectscene.custom_seed_duplicate=Du har redan en vanlig omgång på gång med det fröet. Du måste avsluta den innan du kan använda det egna fröet.
scenes.heroselectscene.custom_seed_nowin=Spelet använder en frökod för att generera fängelsehålor. Samma frö och spelversion genererar alltid samma fängelsehåla!\n\n_Du måste vinna minst ett spel innan du kan ange egna frön._
scenes.heroselectscene.custom_seed_set=Ställ in
scenes.heroselectscene.custom_seed_clear=Töm
scenes.heroselectscene.challenges_nowin=Utmaningar är valfria modifierare som gör spelet svårare. Vissa utmaningar gör fängelsehålan farligare, andra minskar kraften i dina förmågor eller föremål.\n\n_Du måste vinna minst ett spel innan du kan aktivera utmaningar._
