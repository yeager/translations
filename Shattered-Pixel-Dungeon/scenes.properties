scenes.supporterscene.title=Stöd spelet
scenes.supporterscene.intro=Jag vill att Shattered Pixel Dungeon ska vara fritt från reklam och påträngande mikrotransaktioner, som förstör så många gratisspel. I stället ber jag hellre spelarna att stötta spelet direkt!
scenes.supporterscene.patreon_msg=Om du gillar Shattered och vill hjälpa mig att fortsätta utveckla spelet kan du överväga att stötta mig på _Patreon!_ Där finns flera exklusiva förmåner:\n_- Tidig åtkomst_ till betaversioner av kommande uppdateringar.\n_- Veckovisa minibloggar_ med information om vad jag arbetar med.\n_- Månatliga omröstningar_ som direkt påverkar innehållet jag utvecklar.\n_- Fysiska belöningsnålar_ efter 1, 2 och 3 års stöd.\n_- En Discord-gemenskap_ med utvecklingslogg och chattkanaler.\n\n_Och mycket mer!_ Besök Patreon-sidan för mer information. Tack för din tid och lycka till i fängelsehålan!
scenes.supporterscene.patreon_english=(Observera att Patreon-belöningar endast är tillgängliga på engelska.)
scenes.supporterscene.supporter_link=Gå till Patreon-sidan

