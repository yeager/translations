###features
levels.features.chasm.chasm=Avgrund
levels.features.chasm.yes=Ja, jag vet vad jag gör
levels.features.chasm.no=Nej, jag ändrade mig
levels.features.chasm.jump=Vill du verkligen hoppa ner i avgrunden? Ett fall så långt ner kommer att bli smärtsamt.
levels.features.chasm.ondeath=Du föll till döds …
levels.features.chasm.rankings_desc=Dog vid nedslaget



###rooms
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_name=Råttkungastaty
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_name=Kunglig kudde
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_desc=En staty föreställande Råttkungen. Vem har gjort den här?
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_desc=Den här fluffiga lila kudden vore en för liten säng för dig, men den har perfekt storlek för världens viktigaste råtta.

levels.rooms.special.magicalfireroom$eternalfire.desc=Här finns en vägg av tät ljusgrön eld, till synes orsakad av magi. Den är så tät att du inte kan röra dig genom den och den antänder allt som kommer för nära. Den visar inga tecken på att brinna ner naturligt, så du måste använda något för att släcka den.

levels.rooms.special.sentryroom$sentry.name=röd vaktpost
levels.rooms.special.sentryroom$sentry.desc=Den här blodröda vaktposten verkar ha placerats här för att vakta skatten i rummets andra ände. Den avfyrar strålar av upplösningsmagi mot dig om du går in i området den försvarar.\n\nDen är immun mot alla skadliga effekter och kan se genom osynlighet, men det verkar ta en stund att ladda upp innan den börjar skjuta.\n\nAv någon anledning vill vaktposten bara skjuta på dig, som om den vet att fängelsehålans invånare inte utgör ett hot mot skatten.
levels.rooms.special.sentryroom$sentry.discover_hint=Du kan hitta den här fienden var som helst i fängelsehålan.

levels.rooms.special.toxicgasroom$toxicvent.name=giftventil
levels.rooms.special.toxicgasroom$toxicvent.desc=En oförsiktig äventyrare måste ha utlöst den här fällan för länge sedan. Trots att den är inaktiv sprider den fortfarande giftig gas i rummet och visar inga tecken på att sluta. Du behöver kunna undvika skadan från gasen för att utforska rummet.

levels.rooms.special.weakfloorroom$hiddenwell.name=Avlägsen brunn
levels.rooms.special.weakfloorroom$hiddenwell.desc=Du kan precis urskilja en brunn i djupet under dig, kanske finns det något där nere?

levels.rooms.quest.ambitiousimproom$questentrance.name=Valvingång
levels.rooms.quest.ambitiousimproom$questentrance.desc=Den här olycksbådande gropen verkar vara ingången till ett uråldrigt dvärgvalv. En magisk barriär hindrar inträde, men du kan gå ovanpå den som om det fanns golv där.

levels.rooms.quest.blacksmithroom$questentrance.name=Gruvans ingång
levels.rooms.quest.blacksmithroom$questentrance.desc=Den här stegen leder till en gammal gruva strax nedanför smedjan.

levels.rooms.quest.blacksmithroom$smithyvisuals.name=Smedja
levels.rooms.quest.blacksmithroom$smithyvisuals.desc=En liten smedja som trollsmeden har inrättat, komplett med en kolbricka, en ässja och ett vattenkar som ser alldeles vidrigt smutsigt ut.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ritualmarkör
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=En målad markör för någon mörk ritual. Ljus placeras vanligtvis i de fyra hörnen.
levels.rooms.quest.ritualsiteroom$table.name=Olycksbådande bord
levels.rooms.quest.ritualsiteroom$table.desc=Det här tunga bordet ser ut att ha byggts om grovt till något slags tortyrbänk.

levels.rooms.quest.massgraveroom$massgravedeco.name=Massgrav
levels.rooms.quest.massgraveroom$massgravedeco.desc=Ben ligger strödda över golvet. Vad hände här?

levels.rooms.quest.mineentrance$questexit.name=Mineutgång
levels.rooms.quest.mineentrance$questexit.desc=Den här stegen leder ut ur gruvan, tillbaka in i smedjan.

levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.name=Plattform
levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.desc=Den här stora plattformen är lika stor som gropen ovanför. Den ingår troligen i någon sorts hissmekanism när valvet nås på vanligt sätt.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=När du kliver in i det stora rummet verkar tiden sakta ned och du hör imps röst:\n\n”Jag tror att du har kommit in i valvets yttersta kammare. Min statyett borde finnas strax bortom den! Det finns säkert någon otäck fälla eller väktare, så _du bör verkligen utforska och förbereda dig innan du går längre!_ Jag vill att du faktiskt får min skatt, inte dör medan du försöker!”
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=När du kliver in i det stora rummet verkar tiden sakta ned och du hör imps röst:\n\n”Okej, jag tror att du är i valvets yttersta kammare. Min statyett borde finnas strax bortom den! Det finns säkert någon otäck fälla eller väktare, så _se till att du är helt uppladdad och redo för en stor strid!_ Jag vill att du faktiskt får min skatt, inte dör medan du försöker!”
levels.rooms.quest.vault.vaultfinalroom.final_warning=Du hör hur något laddas upp. Ett steg till utlöser något!
levels.rooms.quest.vault.vaultfinalroom$markertiles.name=Jättelik symbol
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=Mönstret i golvplattorna ser ut som en jättelik version av en frammaningssymbol från fängelset.\n\nHela golvet surrar av energi, som om en enorm kraft bara väntar på att släppas lös.
levels.rooms.quest.vault.vaultfinalroom$vaulttreasure.desc=Guld ligger staplat på golvet här. Synd att du inte kan ta med det ut ur valvet.

###traps
levels.traps.alarmtrap.name=larmfälla
levels.traps.alarmtrap.alarm=Fällan avger ett genomträngande ljud som ekar genom hela fängelsehålan!
levels.traps.alarmtrap.desc=Den här fällan verkar vara kopplad till en högljudd larmmekanism. Om den utlöses varnas troligen allt på våningen.

levels.traps.blazingtrap.name=eldfälla
levels.traps.blazingtrap.desc=Om du trampar på den här fällan antänds en kraftfull kemisk blandning som sätter eld på ett stort område.

levels.traps.burningtrap.name=brinnande fälla
levels.traps.burningtrap.desc=Om man trampar på den här fällan antänds en kemisk blandning som sätter eld på omgivningen.

levels.traps.chillingtrap.name=frostfälla
levels.traps.chillingtrap.desc=När den aktiveras fryser kemikalierna i fällan snabbt luften runt den.

levels.traps.confusiontrap.name=förvirringsgasfälla
levels.traps.confusiontrap.desc=När fällan utlöses släpps ett moln av förvirringsgas ut i det närmaste området.

levels.traps.cursingtrap.name=förbannelsefälla
levels.traps.cursingtrap.curse=Din burna utrustning blir förbannad!
levels.traps.cursingtrap.desc=Fällan innehåller samma illvilliga magi som finns i förbannad utrustning. När du utlöser den förbannas vissa föremål i det närmaste området.

levels.traps.disarmingtrap.name=avväpningsfälla
levels.traps.disarmingtrap.disarm=Ditt vapen teleporteras bort!
levels.traps.disarmingtrap.desc=Fällan innehåller mycket specifik teleporteringsmagi som förflyttar offrets vapen till en annan plats.

levels.traps.disintegrationtrap.name=upplösningsfälla
levels.traps.disintegrationtrap.one=Fällan upplöser din %s!
levels.traps.disintegrationtrap.some=Fällan löser upp några av dina %s!
levels.traps.disintegrationtrap.ondeath=Du dödades av upplösningsfällan …
levels.traps.disintegrationtrap.desc=När fällan utlöses träffas det närmaste målet av strålar av upplösning som ger betydande skada och förstör föremål.\n\nSom tur är är utlösningsmekanismen inte dold.

levels.traps.distortiontrap.name=distortionsfälla
levels.traps.distortiontrap.desc=Den här fällan är byggd av märklig magi med okänt ursprung och frammanar alla slags varelser till platsen.

levels.traps.explosivetrap.name=sprängfälla
levels.traps.explosivetrap.desc=Fällan innehåller ett pulveriserat sprängämne och en utlösningsmekanism. När du aktiverar den orsakar den en explosion i det närmaste området.

levels.traps.flashingtrap.name=bländfälla
levels.traps.flashingtrap.desc=När fällan aktiveras antänds ett kraftigt bländpulver inuti den, vilket tillfälligt förblindar, förlamar och skadar offret.\n\nFällan måste ha ett stort lager av pulvret, eftersom den kan aktiveras många gånger utan att gå sönder.

levels.traps.flocktrap.name=fårfälla
levels.traps.flocktrap.desc=Kanske ett skämt från någon amatörmagiker: när fällan utlöses skapas en flock magiska får.

levels.traps.frosttrap.name=frostfälla
levels.traps.frosttrap.desc=När fällan aktiveras fryser kemikalierna i den snabbt luften i ett stort område runt den.

levels.traps.gatewaytrap.name=portalfälla
levels.traps.gatewaytrap.desc=Den här särskilda teleporteringsfällan kan aktiveras hur många gånger som helst och teleporterar alltid till samma plats.

levels.traps.geysertrap.name=gejserfälla
levels.traps.geysertrap.desc=När fällan utlöses sprutar en vattengejser fram som skadar eldiga fiender, knuffar bort alla närliggande varelser, släcker bränder och förvandlar den omgivande terrängen till vatten.

levels.traps.gnollrockfalltrap.name=gnollrasfälla
levels.traps.gnollrockfalltrap.desc=Den här rasfällan är tillverkad med någon form av magisk hjälp. När den utlöses lossnar stenar och faller genast ovanifrån i ett område på 5×5 rutor runt fällan. På grund av områdets mjukare stenar gör den inte lika mycket skada som en vanlig rasfälla, men rustningen skyddar inte heller mot den. Stenar faller inte på platser med en angränsande barrikad, eftersom barrikaderna hjälper till att hålla taket uppe.\n\n_Den här fällan kan inte skilja vän från fiende och skadar därför gnoller lika mycket som dig._

levels.traps.grimtrap.name=dödsfälla
levels.traps.grimtrap.ondeath=Du dödades av en dödsfällas explosion …
levels.traps.grimtrap.desc=Fällan innehåller extremt kraftfull förstörelsemagi, tillräcklig för att omedelbart döda alla utom de friskaste hjältarna. När du utlöser den sänds en dödlig magisk stråle mot den närmaste varelsen.\n\nSom tur är är utlösningsmekanismen inte dold.

levels.traps.grippingtrap.name=greppfälla
levels.traps.grippingtrap.desc=Fällan låser fast fötterna på den som utlöser den, skadar målet och saktar ned dess rörelser.\n\nPå grund av sin enkla konstruktion kan fällan aktiveras många gånger utan att gå sönder.

levels.traps.guardiantrap.name=väktarfälla
levels.traps.guardiantrap.alarm=Fällan avger ett genomträngande ljud som ekar genom hela fängelsehålan!
levels.traps.guardiantrap.desc=Fällan är kopplad till en märklig magisk mekanism som frammanar väktare och varnar alla fiender på våningen.
levels.traps.guardiantrap$guardian.name=tillkallad väktare
levels.traps.guardiantrap$guardian.desc=Den här blå uppenbarelsen verkar vara ett framkallat eko av en av fängelsehålans stenväktare.
levels.traps.guardiantrap$guardian.desc_weapon=Statyn själv är nästan okroppslig, men _%s_ som den bär ser verklig ut.
levels.traps.guardiantrap$guardian.discover_hint=Du kan hitta den här fienden med en specifik fälla.

levels.traps.oozetrap.name=sörjfälla
levels.traps.oozetrap.desc=Fällan stänker ut frätande sörja när den aktiveras, och den bränner tills den sköljs bort.

levels.traps.pitfalltrap.name=fallgropsfälla
levels.traps.pitfalltrap.triggered_hero=Marken börjar ge vika runt dig!
levels.traps.pitfalltrap.triggered=Marken börjar ge vika runt den utlösta fällan!
levels.traps.pitfalltrap.no_pit=Marken är för fast för att en fallgropsfälla ska fungera här.
levels.traps.pitfalltrap.desc=Fällan är kopplad till en stor falluckemekanism. Strax efter att den utlösts glider allt i närheten rakt genom marken och faller! Den fungerar dock inte i områden med särskilt solida golv.

levels.traps.poisondarttrap.name=giftpilfälla
levels.traps.poisondarttrap.ondeath=Du dödades av giftpilfällan …
levels.traps.poisondarttrap.desc=En liten pilblåsare måste vara gömd i närheten. När fällan aktiveras skjuter den en förgiftad pil mot det närmaste målet.\n\nSom tur är är utlösningsmekanismen inte dold.

levels.traps.rockfalltrap.name=rasfälla
levels.traps.rockfalltrap.ondeath=Du krossades av rasfällan …
levels.traps.rockfalltrap.desc=Fällan är kopplad till en samling lösa stenar ovanför. När du utlöser den rasar de ned över hela rummet! Om fällan inte finns i ett särskilt rum faller stenarna i ett område runt fällan i stället.\n\nSom tur är är utlösningsmekanismen inte dold.

levels.traps.shockingtrap.name=stötfälla
levels.traps.shockingtrap.desc=En mekanism med en stor mängd lagrad energi. När fällan utlöses laddas energin ur i ett fält runt den.

levels.traps.stormtrap.name=stormfälla
levels.traps.stormtrap.desc=En mekanism med en enorm mängd lagrad energi. När fällan utlöses laddas energin ur i en stor elektrisk storm.

levels.traps.summoningtrap.name=frammaningsfälla
levels.traps.summoningtrap.desc=När fällan utlöses frammanas ett antal av områdets monster till platsen.

levels.traps.teleportationtrap.name=teleportationsfälla
levels.traps.teleportationtrap.desc=När den här fällan utlöses kommer allt runt omkring att teleporteras till slumpmässiga platser på den här våningen.

levels.traps.tengudarttrap.desc=Tengu har uppenbarligen förberett sig för en strid. Fällan aktiverar en dold pilblåsare som skjuter en giftpil mot det närmaste som inte är Tengu.\n\nFällan är så välgjord att utlösningsmekanismen inte kan upptäckas utan magisk hjälp. Fällan blir dock synlig en kort stund när den ställs in.

levels.traps.toxictrap.name=giftgasfälla
levels.traps.toxictrap.desc=När fällan utlöses släpps ett moln av giftig gas ut i området runt den.

levels.traps.trap.discover_hint=Du kan hitta den här fällan slumpmässigt i fängelsehålan. Varje region har olika fällor som kan dyka upp.
levels.traps.trap.rankings_desc=Dödad av: %s

levels.traps.corrosiontrap.name=frätgasfälla
levels.traps.corrosiontrap.desc=När fällan utlöses släpps ett moln av dödlig frätande gas ut i det närmaste området.

levels.traps.warpingtrap.name=förvrängningsfälla
levels.traps.warpingtrap.desc=Fällan liknar en teleporteringsfälla, men gör också att hjälten glömmer våningens utformning!

levels.traps.weakeningtrap.name=försvagningsfälla
levels.traps.weakeningtrap.desc=Den mörka magin i den här fällan suger energin ur allt som kommer i kontakt med den. Kraftfulla fiender kan dock motstå effekten.

levels.traps.worndarttrap.name=sliten pilfälla
levels.traps.worndarttrap.ondeath=Du dödades av den slitna pilfällan …
levels.traps.worndarttrap.desc=En liten pilblåsare måste vara gömd i närheten. När fällan aktiveras skjuter den mot det närmaste målet.\n\nPå grund av sin ålder är den dock inte särskilt skadlig och den är inte ens dold …



###levels
levels.cavesbosslevel.wires_name=Exponerade ledningar
levels.cavesbosslevel.wires_desc=Marken är delvis uppgrävd här och blottar några stora ledningar. De måste koppla samman de olika elektriska maskinerna.\n\nDet måste gå ström genom ledningarna. Om DM-300 kliver här kan den kanske dra kraft från dem.
levels.cavesbosslevel.energy_desc=Marken här sprakar av elektricitet och är skadlig att gå på. _Gnistorna verkar dras i en viss riktning …_ Kanske leder de till kraftkällan?
levels.cavesbosslevel.gate_name=Metallgrind
levels.cavesbosslevel.gate_desc=En stor metallgrind blockerar vägen in i dvärgmetropolen. Metallådan i mitten ger ifrån sig ett högt brummande ljud och måste vara ansluten till kretsarna och maskinerna i närheten. Kanske öppnas grinden om du förstör DM-300?
levels.cavesbosslevel.gate_desc_broken=Porten måste ha varit kopplad till DM-300 på något sätt, eftersom den exploderade när DM-300 besegrades. Nu återstår bara trasiga bitar.
levels.cavesbosslevel.water_desc=Med all elektricitet här är vatten kanske inte alltid säkert …

levels.citybosslevel.throne_name=Tron
levels.citybosslevel.throne_desc=Den här imponerande stora tronen är säte för dvärgimperiet och har nu tagits över av en maktgalen nekromantiker.\n\nTronen verkar innehålla magiska eller mekaniska delar. Dvärgkungen kan ha ytterligare kraft när han sitter på den.
levels.citybosslevel.summoning_name=Frammaningspiedestal
levels.citybosslevel.summoning_desc=Den här piedestalen har en stor öppning i mitten som praktiskt taget strålar av mörk energi.\n\nDvärgkungen använder piedestalerna som fokuspunkter för sin nekromantiska magi och kan frammana hantlangare till dem. Piedestalen måste laddas i några turer innan hantlangaren dyker upp, och den uppbyggda magiska kraften visar vilken sorts hantlangare som frammanas.

levels.caveslevel.grass_name=Fluorescerande mossa
levels.caveslevel.high_grass_name=Fluorescerande svampar
levels.caveslevel.water_name=Iskallt vatten
levels.caveslevel.entrance_desc=Stegen leder upp till föregående nivå.
levels.caveslevel.exit_desc=Stegen leder ned till nästa nivå.
levels.caveslevel.high_grass_desc=Stora svampar blockerar utsikten.
levels.caveslevel.wall_deco_desc=En åder av någon sorts malm syns på väggen. Guld?
levels.caveslevel.bookshelf_desc=Vem skulle behöva en bokhylla i en grotta?
levels.caveslevel.region_deco_name=Metallstruktur
levels.caveslevel.region_deco_desc=En stor struktur helt av metall, troligen byggd av dvärgarna när de bröt malm här. Du tycker dig se sedan länge oanvända gruvvagnsspår längs toppen.

levels.citylevel.water_name=Misstänkt färgat vatten
levels.citylevel.high_grass_name=Höga blommande blommor
levels.citylevel.entrance_desc=En ramp leder upp till föregående nivå.
levels.citylevel.exit_desc=En ramp leder ned till nästa nivå.
levels.citylevel.deco_desc=Flera golvplattor saknas här.
levels.citylevel.statue_desc=Statyn föreställer en dvärg i heroisk ställning.
levels.citylevel.bookshelf_desc=Bokhyllan är fylld med rader av böcker om olika ämnen.
levels.citylevel.region_deco_name=Flamande piedestal
levels.citylevel.region_deco_desc=En upphöjd piedestal med en ljusgrön magisk flamma ovanpå. Flamman är så tät att den lika gärna skulle kunna vara fast.

levels.hallslevel.water_name=Kall lava
levels.hallslevel.grass_name=Glödmossa
levels.hallslevel.high_grass_name=Glödsvamp
levels.hallslevel.statue_name=Pelare
levels.hallslevel.water_desc=Det ser ut som lava, men det är kallt och förmodligen säkert att röra vid.
levels.hallslevel.statue_desc=Pelaren är gjord av riktiga humanoida skallar. Imponerande.
levels.hallslevel.bookshelf_desc=Böcker på uråldriga språk pyr i bokhyllan.
levels.hallslevel.region_deco_name=Bråtestycke
levels.hallslevel.region_deco_desc=En enorm stenbit som verkar ha brutits loss från taket eller en närliggande vägg.


levels.level.hidden_trap=En dold %s aktiveras!
levels.level.chasm_name=Avgrund
levels.level.floor_name=Golv
levels.level.grass_name=Gräs
levels.level.water_name=Vatten
levels.level.wall_name=Vägg
levels.level.closed_door_name=Stängd dörr
levels.level.open_door_name=Öppen dörr
levels.level.entrace_name=Ingång till nivå
levels.level.exit_name=Utgång från nivå
levels.level.embers_name=Glöd
levels.level.furrowed_grass_name=Fårad växtlighet
levels.level.locked_door_name=Låst dörr
levels.level.crystal_door_name=Kristalldörr
levels.level.pedestal_name=Piedestal
levels.level.barricade_name=Barrikad
levels.level.high_grass_name=Högt gräs
levels.level.locked_exit_name=Låst nivåutgång
levels.level.unlocked_exit_name=Upplåst nivåutgång
levels.level.well_name=Brunn
levels.level.empty_well_name=Tom brunn
levels.level.statue_name=Staty
levels.level.inactive_trap_name=Utlöst fälla
levels.level.bookshelf_name=Bokhylla
levels.level.alchemy_name=Alkemikruka
levels.level.default_name=???
levels.level.chasm_desc=Du kan inte se botten.
levels.level.water_desc=Om du brinner kan du kliva ned i vattnet för att släcka elden.
levels.level.entrance_desc=Trappor leder upp till föregående nivå.
levels.level.exit_desc=Trappor leder ned till nästa nivå.
levels.level.embers_desc=Glöd täcker golvet.
levels.level.high_grass_desc=Tät vegetation blockerar utsikten.
levels.level.locked_door_desc=Dörren är låst. Du behöver en passande nyckel för att låsa upp den.
levels.level.crystal_door_desc=Den här låsta dörren är gjord av magisk kristall. Du kan se igenom den, men behöver en kristallnyckel för att öppna den.
levels.level.locked_exit_desc=Tunga galler blockerar trapporna som leder ned.
levels.level.barricade_desc=Träbarrikaden sitter stadigt, men har torkat under årens lopp. Kan den brinna?
levels.level.inactive_trap_desc=Fällan har utlösts tidigare och är inte farlig längre.
levels.level.statue_desc=Någon ville pryda den här platsen, men misslyckades uppenbarligen.
levels.level.alchemy_desc=Den här krukan är fylld med magiskt vatten. Föremål kan blandas i krukan för att skapa något nytt!
levels.level.empty_well_desc=Brunnen har sinat.

levels.level$feeling.chasm_title=Avgrundsnivå
levels.level$feeling.water_title=Vattennivå
levels.level$feeling.grass_title=Gräsnivå
levels.level$feeling.dark_title=Mörk nivå
levels.level$feeling.large_title=Stor nivå
levels.level$feeling.traps_title=Fällnivå
levels.level$feeling.secrets_title=Hemlighetsnivå
levels.level$feeling.chasm_desc=Dina steg ekar över fängelsehålan.
levels.level$feeling.water_desc=Du hör vatten skvalpa runtomkring dig!
levels.level$feeling.grass_desc=Doften av växtlighet ligger tung i luften.
levels.level$feeling.dark_desc=Du kan höra fiender röra sig i mörkret.
levels.level$feeling.large_desc=Den här fängelsehålenivån verkar ovanligt stor.
levels.level$feeling.traps_desc=Markytan verkar särskilt förrädisk här.
levels.level$feeling.secrets_desc=Atmosfären antyder att den här våningen döljer många hemligheter.

levels.mininglevel.wall_desc=En slät bergvägg som är lite mjukare än vanligt. Du kan bryta dig igenom den med din hacka, men det kräver lite ansträngning och ökar din hunger en aning.
levels.mininglevel.gold_extra_desc=Du kan förmodligen bryta ut den med din hacka.
levels.mininglevel.crystal_name=Kristallspira
levels.mininglevel.boulder_name=Stenblock
levels.mininglevel.crystal_desc=Här finns en stor och färgglad kristallspira. Kristallerna är ömtåliga och kan lätt krossas med en hacka eller om något bryts intill dem.
levels.mininglevel.boulder_desc=Ett stort stenblock blockerar vägen. Det borde vara ganska lätt att krossa med en hacka.
levels.mininglevel.barricade_desc=Träbarrikaden sitter stadigt och stöttar taket.\n\nDen byggdes troligen av gnollerna som skydd mot fallande stenar. _Alla angränsande rutor skyddas mot rasfällor och attacker._\n\nDen ser ut att kunna brinna lika bra som vilken annan barrikad som helst.

levels.prisonlevel.water_name=Mörkt, kallt vatten
levels.prisonlevel.empty_deco_desc=Det finns gamla blodfläckar på golvet.
levels.prisonlevel.bookshelf_desc=Det här är förmodligen en kvarleva från fängelsebiblioteket. Kan den brinna?
levels.prisonlevel.region_deco_name=Fängelsebur
levels.prisonlevel.region_deco_desc=En metallbur som är precis stor nog att rymma en person. Den verkar vara fastlåst i marken på något sätt och går inte att flytta.
levels.prisonlevel.region_deco_alt_name=Hängande bur
levels.prisonlevel.region_deco_alt_desc=En metallbur som är precis tillräckligt stor för att hålla en person. Den hänger över en djup avgrund och är upphängd i en kedja.

levels.sewerlevel.water_name=Grumligt vatten
levels.sewerlevel.empty_deco_desc=Våt, gulaktig mossa täcker golvet.
levels.sewerlevel.bookshelf_desc=Bokhyllan är full av billiga, värdelösa böcker. Kan den brinna?
levels.sewerlevel.region_deco_name=Förrådstunna
levels.sewerlevel.region_deco_desc=En stadig tunna som nästan är lika stor som du. Den måste vara full av något, för den är för tung att flytta.

levels.vaultlevel$vaultflametrap.name=Valvflamventil
levels.vaultlevel$vaultflametrap.desc=Ventilen verkar skjuta upp utbrott av grön eld med jämna mellanrum. Du ser hur lågorna börjar byggas upp precis innan den avfyrar. Lågorna kan oftast undvikas, men _allt som låter dig stå emot eld eller områdesbundna effekter_ fungerar också.



###Tiles
tiles.custom.carpet.name=Matta
tiles.custom.carpet.desc=En tjock matta täcker golvet. Den måste ha behandlats på något sätt; den är inte brandfarlig.
