store.short_desc=Ett roguelike-rollspel i en fängelsehåla som är lätt att börja spela men svårt att bemästra! Sex olika hjältar, slumpmässiga nivåer och fiender samt hundratals föremål att hitta.

store.med_desc=Shattered Pixel Dungeon är ett traditionellt roguelike-rollspel i en fängelsehåla som är lätt att börja spela men svårt att bemästra! Varje spelomgång är en unik utmaning med sex olika hjältar, slumpmässiga nivåer och fiender samt hundratals föremål att samla och använda.

store.full_desc.intro=<b>Shattered Pixel Dungeon</b> är ett traditionellt roguelike-rollspel i en fängelsehåla som är lätt att börja spela men svårt att bemästra! Varje spelomgång är en unik utmaning med sex olika hjältar, slumpmässiga nivåer och fiender samt hundratals föremål att samla och använda. ShatteredPD uppdateras dessutom med nytt innehåll ungefär var tredje månad, så det finns alltid något nytt.

store.full_desc.heroes=<h2><b><u>Välj din hjälte</u></b></h2>\nVar och en av ShatteredPD:s sex spelbara hjältar har sin egen unika spelmekanik och spelstil. Besegra fiender som den tåliga krigaren eller dödliga duellanten, bränn dem som den mystiske magikern eller gudomliga prästen, eller utnyttja terrängen som den smygande skurken eller träffsäkra jägarinnan!\n\nNär du tar dig genom fängelsehålan tjänar du poäng att använda på talanger, väljer en underklass och får kraftfulla förmågor för slutspelet. Du kan göra duellanten till en tvåvapenförande kämpe, prästen till en rättfärdig paladin, jägarinnan till en precisionsskytt eller utforska många andra möjligheter!

store.full_desc.dungeon=<h2><b><u>Utforska fängelsehålan</u></b></h2>\nShatteredPD:s fängelsehåla genereras med slumpmässiga planlösningar, rumstyper, föremål, fällor och fiender. I varje spelomgång hittar du utrustning och samlar eller tillverkar förbrukningsföremål som stärker dig eller hjälper dig ur knipan. Det finns enorm variation mellan spelomgångar och regioner.\n\nNär du tar dig genom fängelsehålan hittar du utrustning som kan förtrollas, uppgraderas och modifieras när du utrustar hjälten. Sätt eld på fiender med ett förtrollat vapen, träng genom fiender med uppgraderad rustning eller få kraftfulla fördelar för skada, försvar eller nytta från någon av de många magiska trollstavarna, ringarna, artefakterna eller prydnadssakerna.

store.full_desc.challenges=<h2><b><u>Lyckas eller dö i försöket</u></b></h2>\nFängelsehålan är fylld av fiender, fällor, faror och bossar som vill avsluta spelomgången! Kämpa mot fientliga vilddjur i kloakerna och grottorna, galna tjuvar och vakter i fängelset, ockulta tjänare i den fallna dvärgstaden och kanske något ännu värre längre ned …\n\nAlla faror kan göra spelet ganska svårt, men låt dig inte avskräckas! Du vinner förmodligen inte på första försöket, men det finns många knep och strategier att upptäcka och lära på vägen till första segern. Därefter finns valfria utmaningar och prestationer om du vill sätta färdigheterna på prov!

store.full_desc.origin=<h2><b><u>Över ett årtionde under utveckling</u></b></h2>\nShattered Pixel Dungeon är ett spel med öppen källkod som bygger på källkoden till Pixel Dungeon av Watabou (först utgivet sent 2012). Det startade 2014 som ett projekt för att ombalansera Pixel Dungeon, men har under de senaste tio åren vuxit till ett eget spel!

store.full_desc.features=<b>Funktioner:</b>\n• 6 hjältar, var och en med 2 underklasser, 3 förmågor för slutspelet och över 25 talanger.\n• Över 300 föremål, bland annat utrustning, förbrukningsföremål och föremål tillverkade med alkemi.\n• 5 regioner i fängelsehålan, 26 våningar, över 100 rumstyper och biljoner möjliga våningsplaner.\n• Över 60 vanliga fiendetyper, 30 fällor och 10 bossar som sätter dina färdigheter på prov.\n• En katalog i spelet med drygt 500 poster att fylla.\n• 9 stapelbara utmaningar och över 100 prestationer för den som vill klara allt.\n• Gränssnittslägen för stora och små skärmar samt stöd för flera inmatningssätt.\n• Uppdateringar ungefär var tredje månad med nytt innehåll, rättningar och förbättringar.\n• Stöd för många språk tack vare spelets engagerade grupper.
