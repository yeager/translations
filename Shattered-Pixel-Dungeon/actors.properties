###blobs
actors.blobs.blizzard.name=snöstorm
actors.blobs.blizzard.desc=Här virvlar en snöstorm.

actors.blobs.confusiongas.name=förvirringsgas
actors.blobs.confusiongas.desc=Här virvlar ett moln av förvirringsgas.

actors.blobs.electricity.name=elektricitet
actors.blobs.electricity.desc=Ett fält av elektricitet gnistrar starkt här.
actors.blobs.electricity.rankings_desc=Elektrifierad
actors.blobs.electricity.ondeath=Du dog av en elchock…

actors.blobs.fire.name=eld
actors.blobs.fire.desc=Här härjar en eld.

actors.blobs.foliage.name=lövverk
actors.blobs.foliage.desc=Här och var genomborrar ljusstrålar den underjordiska trädgårdens dunkel.

actors.blobs.freezing.name=frysande luft
actors.blobs.freezing.desc=Luften är onaturligt kylig här.

actors.blobs.goowarn.name=mörk energi
actors.blobs.goowarn.desc=Här virvlar partiklar av mörk energi!

actors.blobs.inferno.name=inferno
actors.blobs.inferno.desc=Här rasar ett inferno.

actors.blobs.paralyticgas.name=förlamningsgas
actors.blobs.paralyticgas.desc=Här virvlar ett moln av förlamande gas.

actors.blobs.regrowth.name=återväxt

actors.blobs.sacrificialfire.name=offereld
actors.blobs.sacrificialfire.desc=Här finns ett altare med en offereld. Varje varelse som dödas här förtärs som ett offer åt fängelsehålans andar.\n\nKanske får du en belöning om tillräckligt många offer görs?
actors.blobs.sacrificialfire.worthy=Elden förtär ditt offer och växer sig starkare.
actors.blobs.sacrificialfire.unworthy=Elden förtär din offring, men förändras inte.
actors.blobs.sacrificialfire.reward=Elden flammar upp och försvinner. En belöning ligger kvar!

actors.blobs.smokescreen.name=rökridå
actors.blobs.smokescreen.desc=Här virvlar ett moln av tjock svart rök.

actors.blobs.stenchgas.name=stinkgas
actors.blobs.stenchgas.desc=Här virvlar ett moln av fruktansvärd stank.

actors.blobs.stormcloud.name=åskmoln
actors.blobs.stormcloud.desc=Här virvlar ett moln av böljande vattenånga.

actors.blobs.toxicgas.name=giftgas
actors.blobs.toxicgas.desc=Här virvlar ett moln av grönaktig giftgas.
actors.blobs.toxicgas.rankings_desc=Kvävd
actors.blobs.toxicgas.ondeath=Du dog av den giftiga gasen…

actors.blobs.corrosivegas.name=frätande gas
actors.blobs.corrosivegas.desc=Här virvlar ett moln av dödligt frätande gas.

actors.blobs.waterofawareness.name=vatten från vishetens brunn
actors.blobs.waterofawareness.procced=När du tar en klunk känner du hur kunskap strömmar in i ditt sinne.
actors.blobs.waterofawareness.desc=Kunskapens kraft strålar ut från vattnet i den här brunnen. Om du dricker ur brunnen identifieras alla utrustade föremål fullt ut, förbannelser på alla föremål i din packning avslöjas och alla föremål på den aktuella nivån visas.

actors.blobs.waterofhealth.name=hälsovatten
actors.blobs.waterofhealth.procced=När du tar en klunk läker alla dina sår.
actors.blobs.waterofhealth.desc=Hälsans kraft strålar ut från vattnet i den här brunnen. Om du dricker ur brunnen läker såren, hungern stillas och förbannelser på alla burna föremål tas bort.

actors.blobs.web.name=spindelnät
actors.blobs.web.desc=Ett tjockt nät täcker omgivningen. Allt som rör nätet eller kastas genom det förstör det men fastnar också på plats.



###buffs
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenaline.desc=Ett rus av fysisk kraft gör att adrenalin ökar både attack- och rörelsehastigheten.\n\nAdrenalin låter målet springa med 2× hastighet och attackera med 1,5× hastighet.\n\nÅterstående turer: %s.

actors.buffs.adrenalinesurge.name=styrkeökning
actors.buffs.adrenalinesurge.desc=Ett rus av oerhörd styrka, men tyvärr inte permanent.\n\nStyrkeökning: +%d.\nTurer tills effekten avtar: %s.

actors.buffs.amok.name=amok
actors.buffs.amok.desc=Amok framkallar ett tillstånd av starkt raseri och förvirring hos sitt mål.\n\nNär en varelse löper amok anfaller den allt i närheten, oavsett om det är vän eller fiende.\n\nÅterstående amokomgångar: %s.

actors.buffs.arcanearmor.name=magisk rustning
actors.buffs.arcanearmor.desc=En tunn sköld omger dig och blockerar en del av skadan från magiska attacker.\n\nDin magiska rustning är för närvarande förstärkt med: 0–%d.\n\nTurer tills den magiska rustningen avtar: %s.

actors.buffs.artifactrecharge.name=uppladdning av artefakt
actors.buffs.artifactrecharge.desc=Energi strömmar genom dig och ökar laddningshastigheten för artefakterna du bär.\n\nVarje artefakt påverkas lite olika, men alla laddas mycket snabbare än normalt.\n\nÅterstående turer: %s.

actors.buffs.ascensionchallenge.name=amulettens förbannelse
actors.buffs.ascensionchallenge.desc=På något vis behåller Yog-Dzewa sitt inflytande över världen genom amuletten och försöker stoppa din uppstigning!\n\nYogs kraft gör fängelsehålan mycket farligare genom att öka antalet fiender och göra dem starkare. Kraften fortsätter att växa om den inte hejdas, men kan försvagas genom att du besegrar fiender som har förstärkts av Yogs kraft.
actors.buffs.ascensionchallenge.desc_clear=Den mörka energin som strålar ut från amuletten har för tillfället försvagats så mycket som möjligt.
actors.buffs.ascensionchallenge.desc_beckon=Amuletten _ropar just nu på avlägsna fiender_ och informerar dem om din position.
actors.buffs.ascensionchallenge.desc_haste=Amuletten _påskyndar just nu avlägsna fiender_ så att de når dig snabbare!
actors.buffs.ascensionchallenge.desc_slow=Amuletten _saktar ner dig_ och motverkar hastighetsökande effekter!
actors.buffs.ascensionchallenge.desc_damage=Energin från amuletten har blivit så stark att den _skadar dig direkt!_
actors.buffs.ascensionchallenge.beckon=Amuletten börjar ropa på avlägsna fiender.
actors.buffs.ascensionchallenge.haste=Amuletten börjar påskynda avlägsna fiender!
actors.buffs.ascensionchallenge.slow=Amuletten börjar kännas som en vikt av bly i din packning!
actors.buffs.ascensionchallenge.damage=Amuletten börjar utstråla mörk energi. Det bränner!
actors.buffs.ascensionchallenge.weaken_info=Amulettens förbannelse kan försvagas genom att besegra fler fiender.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Om du besegrar fiender kommer amulettens förbannelse att försvagas!
actors.buffs.ascensionchallenge.weaken=Du känner hur amulettens förbannelse försvagas något.
actors.buffs.ascensionchallenge.break=Du tar en stund och hämtar andan och känner hur dina sår börjar sluta sig!
actors.buffs.ascensionchallenge.almost=Du känner Yogs grepp om amuletten börja försvagas, du är nästan där!
actors.buffs.ascensionchallenge.on_kill=Den mörka energin förtär dig…

actors.buffs.barkskin.name=barkhud
actors.buffs.barkskin.desc=Din hud är härdad och känns sträv och fast som bark.\n\nDen härdade huden ökar din effektiva rustning så att du bättre kan försvara dig mot fysiska attacker.\n\nDin rustning är för närvarande ökad med: 0–%d.\nTurer tills barkhuden avtar: %s.\n\nOm du får barkhud från flera källor gäller bara den starkaste.

actors.buffs.barrier.name=barriär
actors.buffs.barrier.desc=En hållbar bubbla av kraft som blockerar all skada.\n\nBarriären tar skada i stället för det den skyddar så länge det finns skydd kvar. Skyddet avtar också sakta med tiden.\n\nÅterstående skydd: %d.

actors.buffs.berserk.angered=förargad
actors.buffs.berserk.berserk=bärsärkar
actors.buffs.berserk.exhausted=utmattad
actors.buffs.berserk.recovering=återhämtar
actors.buffs.berserk.angered_desc=Bärsärkarens skador gör hans slag starkare. När bärsärkaren tar fysisk skada ökar hans raseri och ger honom extra skada. Skada som blockeras av rustning räknas fortfarande när raseriet byggs upp.\n\nRaseriet avtar med tiden. Ju lägre bärsärkarens hälsa är, desto längre varar raseriet.\n\nVid 100 %% raseri kan bärsärkaren gå bärsärkargång. Då får han skydd som beror på rustningens nivå och den hälsa han saknar. Under bärsärkargång avtar skyddet med tiden. När det är slut måste han vila innan raseriet kan byggas upp igen.\n\nNuvarande raseri: _%1$.0f %%_\n_+%2$.0f %%_ skada\n\nBärsärkarskydd vid nuvarande rustning och hälsa: _%3$d_
actors.buffs.berserk.berserk_desc=Rädsla och osäkerhet försvinner och lämnar bara ilska kvar. I det här tillståndet är bärsärkaren mycket kraftfull, _gör +50 %% skada och får extra skydd,_ men förlorar också skydd varje tur.\n\nNär allt skydd har minskat till 0 upphör bärsärkargången.\n\nEfter raseriet måste bärsärkaren återhämta sig innan raseriet kan byggas upp igen.\n\nÅterstående skydd: %d
actors.buffs.berserk.recovering_desc=Inre styrka har sina gränser. Bärsärkaren måste vila innan han kan använda sitt raseri igen.\n\nNär bärsärkaren återhämtar sig byggs inget raseri upp när han tar skada.
actors.buffs.berserk.recovering_desc_turns=Turer tills återställd: _%d_
actors.buffs.berserk.recovering_desc_levels=Nivåer tills återställd: _%.2f_
actors.buffs.berserk.rankings_desc=Dog i bärsärkargång
actors.buffs.berserk.action_name=Bärsärk
actors.buffs.berserk.no_seal=Du behöver ditt brustna sigill för att bärsärka!

actors.buffs.bleeding.name=blöder
actors.buffs.bleeding.ondeath=Du förblödde…
actors.buffs.bleeding.heromsg=Du blöder!
actors.buffs.bleeding.rankings_desc=Förblödde
actors.buffs.bleeding.desc=Såret blöder oroande mycket.\n\nBlödningen skadar dig varje tur. Varje tur minskar skadan med en slumpmässig mängd tills blödningen till slut upphör.\n\nNuvarande blödningsskada: %d.

actors.buffs.bless.name=välsignad
actors.buffs.bless.desc=En kraftig koncentrationsökning, som vissa säger kommer från gudarna.\n\nVälsignelse ökar precision och undvikande med 25 %%, vilket gör den välsignade mycket effektivare i strid.\n\nÅterstående välsignelseturer: %s.

actors.buffs.blindness.name=bländad
actors.buffs.blindness.heromsg=Du är bländad!
actors.buffs.blindness.desc=Förblindning gör världen omkring dig till ett mörkt dis.\n\nNär en karaktär är förblindad begränsas synfältet till en ruta. Det gör distansattacker värdelösa och det blir lätt att tappa bort avlägsna fiender. En förblindad hjälte kan dessutom inte läsa skriftrullar eller böcker.\n\nÅterstående blindhetsturer: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=brinner
actors.buffs.burning.heromsg=Du fattar eld!
actors.buffs.burning.burnsup=%s brinner upp!
actors.buffs.burning.ondeath=Du brann ihjäl…
actors.buffs.burning.rankings_desc=Bränd till aska
actors.buffs.burning.desc=Få saker är mer plågsamma än att vara omgiven av lågor.\n\nEld orsakar skada varje tur tills den släcks av vatten eller brinner ut. Elden kan släckas genom att du går ut i vatten eller av stänket från en krossad dryck.\n\nElden kan dessutom antända brandfarlig terräng eller föremål som den kommer i kontakt med.\n\nÅterstående brinnturer: %s.

actors.buffs.championenemy.warn=Du känner en dödlig närvaro.
actors.buffs.championenemy$blazing.name=blossande kämpe
actors.buffs.championenemy$blazing.desc=Blossande kämpar gör 25 % mer närstridsskada, antänder fiender de attackerar, är immuna mot eld och sprider eld omkring sig när de dör. De kan dock inte sprida eld till vatten.
actors.buffs.championenemy$projecting.name=projicerande kämpe
actors.buffs.championenemy$projecting.desc=Projicerande kämpar gör 25 % mer närstridsskada och har +3 i attackräckvidd.
actors.buffs.championenemy$antimagic.name=antimagisk kämpe
actors.buffs.championenemy$antimagic.desc=Antimagiska kämpar tar 50 % mindre skada och är helt immuna mot magiska effekter.
actors.buffs.championenemy$giant.name=gigantkämpe
actors.buffs.championenemy$giant.desc=Gigantkämpar tar 80 % mindre skada och har +1 i attackräckvidd, men kan inte ta sig genom trånga utrymmen.
actors.buffs.championenemy$blessed.name=välsignad kämpe
actors.buffs.championenemy$blessed.desc=Välsignade kämpar har fyra gånger så hög träffsäkerhet och undvikandeförmåga.
actors.buffs.championenemy$growing.name=växande kämpe
actors.buffs.championenemy$growing.desc=Växande kämpar får en stadigt ökande bonus till träffsäkerhet, undvikandeförmåga och fysisk skada samt minskad mottagen skada.\n\nNuvarande bonus till träffsäkerhet/undvikande/skada: %1$d %%\nNuvarande skademinskning: %2$d %%

actors.buffs.charm.name=förtjust
actors.buffs.charm.heromsg=Du är tjusad!
actors.buffs.charm.cant_attack=Du är förtjusad i fienden och kan inte attackera den.
actors.buffs.charm.desc=En tjusning är en form av manipulativ magi som tillfälligt får fiender att tycka om varandra.\n\nKaraktärer som är tjusade kan inte direkt attackera fienden som har tjusat dem. De kan dock fortfarande attackera andra mål. Smärtchocken förkortar tjusningens varaktighet.\n\nÅterstående tjusningsturer: %s.

actors.buffs.chill.name=nedkyld
actors.buffs.chill.freezes=%s fryser!
actors.buffs.chill.desc=Inte helt frusen, men fortfarande alldeles för nedkyld.\n\nNedkylda mål utför alla handlingar långsammare beroende på hur många turer effekten återstår. Som värst motsvarar detta att vara förslöad.\n\nÅterstående nedkylningsturer: %1$s.\nHastigheten minskar med: %2$s %%

actors.buffs.combo.name=kombination
actors.buffs.combo.action_name=kombinationsattack
actors.buffs.combo.combo=%d träffkombination!
actors.buffs.combo.bad_target=Du måste välja en fiende inom attackens räckvidd.
actors.buffs.combo.prompt=Välj en måltavla att attackera.
actors.buffs.combo.desc=Gladiatorn bygger upp momentum när han träffar med sina slag. Varje attack ökar kombinationsräknaren med ett, men om det tar för lång tid mellan träffarna återställs räknaren till 0. Så länge gladiatorn har en kombination börjar inte skyddet från hans brutna sigill avta.\n\nNär du bygger upp kombinationen låses särskilda kombinationsattacker upp som inte kan missa. En ny attack låses upp vid 2, 4, 6, 8 och 10 kombinationspoäng. Vissa drag återställer kombinationen och andra gör det inte, men varje drag kan bara användas en gång per kombination.\n\nAktuell kombination: %1$d.\n\nTurer tills kombinationen går förlorad: %2$s.
actors.buffs.combo$combomove.clobber.name=klamp
actors.buffs.combo$combomove.clobber.desc=Slår tillbaka en fiende två rutor, men orsakar ingen skada och kan inte slå ned fienden i gropar. Ökar kombinationen med 1.
actors.buffs.combo$combomove.clobber.empower_desc=Slår tillbaka en fiende _tre rutor, ger yrsel och kan slå ned fienden i gropar,_ men orsakar ingen skada. Ökar kombinationen med 1.
actors.buffs.combo$combomove.slam.name=dräm
actors.buffs.combo$combomove.slam.desc=Orsakar %d %% (kombination × 20 %%) av din skadeblockeringskraft som bonusskada. Återställer kombinationen när den används.
actors.buffs.combo$combomove.slam.empower_desc=_Hoppar upp till %1$d ruta/rutor_ och orsakar %2$d %% (kombination × 20 %%) av din skadeblockeringskraft som bonusskada. Återställer kombinationen när den används.
actors.buffs.combo$combomove.parry.name=parera
actors.buffs.combo$combomove.parry.desc=Blockerar nästa attack inom 1 tur när den aktiveras och ger omedelbart igen. Återställer kombinationen om ingenting pareras.
actors.buffs.combo$combomove.parry.empower_desc=Blockerar _alla attacker_ inom 1 tur när den aktiveras och ger omedelbart igen. Återställer kombinationen om inget pareras.
actors.buffs.combo$combomove.crush.name=krossa
actors.buffs.combo$combomove.crush.desc=Orsakar %d %% (kombination × 25 %%) skada på det primära målet och hälften av den skadan på alla andra fiender inom ett 7 × 7-område. Återställer kombinationen när den används.
actors.buffs.combo$combomove.crush.empower_desc=_Hoppar upp till %1$d ruta/rutor_ och orsakar %2$d %% (kombination × 25 %%) skada på det primära målet och hälften av den skadan på alla andra fiender inom ett 7 × 7-område. Återställer kombinationen när den används.
actors.buffs.combo$combomove.fury.name=raseri
actors.buffs.combo$combomove.fury.desc=Träffar en fiende en gång för varje kombinationspoäng du har. Varje träff orsakar 60 % skada och kan utlösa förtrollningar. Återställer kombinationen när den används.
actors.buffs.combo$combomove.fury.empower_desc=_Hoppar upp till %d ruta/rutor_ och träffar en fiende en gång för varje kombinationspoäng du har. Varje träff orsakar 60 %% skada och kan utlösa förtrollningar. Återställer kombinationen när den används.

actors.buffs.corruption.name=korrupt
actors.buffs.corruption.desc=Korruption tränger in i en varelses innersta väsen och förvrider den så att den går emot sin tidigare natur.\n\nKorrupta varelser attackerar sina allierade och ignorerar sina tidigare fiender. Korruption orsakar också skada och får långsamt sitt mål att duka under.\n\nKorruption är permanent. Dess effekter upphör bara vid döden.

actors.buffs.cripple.name=förlamad
actors.buffs.cripple.heromsg=Du är förlamad!
actors.buffs.cripple.desc=Du är ganska säker på att ben inte ska kunna böjas åt det hållet.\n\nFörlamning halverar förflyttningshastigheten, vilket gör att det vanligtvis tar två turer att förflytta sig en ruta i stället för en.\n\nÅterstående förlamningsturer: %s.

actors.buffs.daze.name=förvirrad
actors.buffs.daze.heromsg=Du är förvirrad!
actors.buffs.daze.desc=Öronringningar och suddig syn gör det svårt att slåss.\n\nNär du är omtöcknad minskar träffsäkerhet och undvikandeförmåga med 50 %%, vilket gör det mycket svårare att både träffa och undvika slag.\n\nÅterstående omtöckningsturer: %s.

actors.buffs.degrade.name=degraderad
actors.buffs.degrade.heromsg=Din utrustning känns svagare!
actors.buffs.degrade.desc=Kraftfull mörk magi tär på den styrka som uppgraderingsrullarna har gett din utrustning!\n\nVid försämring behandlas uppgraderad utrustning som om den vore av lägre nivå än den faktiskt är. Varje uppgradering efter +3 blir exponentiellt svagare än den föregående. Beskrivningarna av dina föremål ändras för att återspegla deras minskade effektnivå.\n\nFörsämringen påverkar inte styrkekrav, trollstavsladdningar, kastvapeners hållbarhet eller artefakter.\n\nÅterstående försämringsturer: %s. Användning av en uppgraderingsrulle eller en skriftrulle för att ta bort förbannelser avslutar försämringen omedelbart.

actors.buffs.doom.name=dömd
actors.buffs.doom.desc=Det är svårt att fortsätta när det känns som om hela universum vill se dig död.\n\nDömda karaktärer får +67 % skada från alla källor.\n\nDödsdom är permanent, dess effekter upphör först vid döden.

actors.buffs.dread.name=skräck
actors.buffs.dread.desc=En skräck så stor att den får målet att fly från fängelsehålan!\n\nVarelser som drabbas av skräck flyr från sin motståndare i hög hastighet och försvinner helt från fängelsehålan när de är utom synhåll. Fiender som besegras på detta sätt ger halva erfarenhetspoängen och släpper inga föremål. Smärtchocken minskar skräckens varaktighet.\n\nÅterstående skräckturer: %d.

actors.buffs.drowsy.name=sömnig
actors.buffs.drowsy.desc=En magisk kraft gör det svårt att hålla sig vaken. Efter några turer faller målet in i en djup magisk sömn.\n\nHjälten kan motstå sömnighet genom att ta skada eller ha full hälsa.\n\nTurer tills sömn: %s.

actors.buffs.earthimbue.name=genomsyrad av jord
actors.buffs.earthimbue.desc=Du är fylld av jordens kraft!\n\nAlla fysiska attacker får marken under fienden att skifta och förlamar den en kort stund.\n\nÅterstående jordkraftsturer: %s.

actors.buffs.enhancedrings.name=förstärkta ringar
actors.buffs.enhancedrings.desc=Skurken har nyligen använt en artefakt som stärker hans ringar och ger dem +1 nivå.\n\nÅterstående turer: %s.

actors.buffs.fireimbue.name=genomsyrad av eld
actors.buffs.fireimbue.desc=Du är fylld av eldens kraft!\n\nAlla fysiska attacker kan sätta eld på fiender. Du är dessutom helt immun mot eldens effekter.\n\nÅterstående eldkraftsturer: %s.

actors.buffs.foresight.name=förutseende
actors.buffs.foresight.desc=Du kan på något sätt med tankekraft se utformningen av terrängen omkring dig.\n\nUnder förutseendets effekt avslöjas alla rutor inom en stor radie för dig, inklusive hemliga fällor och dörrar.\n\nÅterstående förutseendeturer: %s.

actors.buffs.frost.name=frusen
actors.buffs.frost.freezes=%s fryser!
actors.buffs.frost.desc=Detta ska inte förväxlas med att frysa fast, utan är en mer ofarlig form av frysning som helt enkelt omsluter målet med is.\n\nFrysning fungerar på samma sätt som förlamning och gör det omöjligt för målet att agera. Till skillnad från förlamning upphör frysningen omedelbart om målet tar skada, eftersom isen då går sönder.\n\nÅterstående frysningsturer: %s.

actors.buffs.frostimbue.name=genomsyrad av frost
actors.buffs.frostimbue.desc=Du är fylld av iskall kraft!\n\nAlla fysiska attacker bygger successivt upp nedkylning på fiender. Du är dessutom helt immun mot kyla.\n\nÅterstående frostkraftsturer: %s.

actors.buffs.fury.name=rasande
actors.buffs.fury.heromsg=Du blir rasande!
actors.buffs.fury.desc=Du är arg och fiender gillar dig inte när du är arg.\n\nEtt starkt raseri brinner inom dig och ökar skadan från dina fysiska attacker med 50 %%.\n\nRaseriet varar så länge din hälsa är under 50 %%.

actors.buffs.blobimmunity.name=reningsbarriär
actors.buffs.blobimmunity.desc=En märklig kraft omsluter dig med en tunn skyddande barriär som blockerar alla skadliga luftburna effekter.\n\nDu är immun mot alla områdesbundna effekter så länge barriären består.\n\nÅterstående immunitetsturer: %s.

actors.buffs.gravitychaostracker.name=gravitetskaos
actors.buffs.gravitychaostracker.desc_intro=Varje gång det går några turer kastas alla karaktärer på den aktuella våningen i fängelsehålan i en slumpmässig riktning.
actors.buffs.gravitychaostracker.desc_positive=Du och dina allierade verkar dock vara immuna.
actors.buffs.gravitychaostracker.desc_duration=Det är oklart hur länge effekten varar, men den kan inte vara för evigt.

actors.buffs.greaterhaste.name=otrolig hastighet
actors.buffs.greaterhaste.desc=En otrolig hastighetsökning. För ett ögonblick känns det som om allt annat står stilla.\n\nUnder effekten av större hastighet tar förflyttningar ingen tid alls, men andra handlingar utförs fortfarande i normal hastighet. Varje steg förbrukar en tur av större hastighet.\n\nÅterstående turer av större hastighet: %d.

actors.buffs.haste.name=snabbhet
actors.buffs.haste.desc=Energi strömmar genom dina muskler och låter dig springa i otroliga hastigheter!\n\nUnder snabbhetens effekt springer du med tre gånger så hög hastighet, men utför alla andra handlingar i normal hastighet.\n\nÅterstående snabbhetsturer: %s.

actors.buffs.healing.name=läkande
actors.buffs.healing.desc=Ett magiskt botemedel får sår att läka och kött att växa ihop.\n\nVarje tur regenereras hälsan stadigt tills läkningseffekten upphör. Mängden läkning kan avta med tiden.\n\nNästa läkning: %d.\n\nÅterstående läkning: %d.

actors.buffs.herodisguise.name=förklädnad
actors.buffs.herodisguise.desc=Illusionsmagi har förändrat ditt fysiska utseende! Effekten är rent kosmetisk men känns ändå mycket märklig.\n\nÅterstående förklädnadsturer: %s.

actors.buffs.hex.name=förtrollad
actors.buffs.hex.heromsg=Du har blivit förtrollad!
actors.buffs.hex.desc=Mörk magi som försvagar koncentrationen och gör målet något desorienterat.\n\nFörbannelsen minskar träffsäkerhet och undvikandeförmåga med 20 %%, vilket gör målet mindre effektivt i strid.\n\nÅterstående förbannelseturer: %s.

actors.buffs.holdfast.name=hållfast
actors.buffs.holdfast.desc=Krigaren håller sin position, ökar sin rustning med %1$d–%2$d och saktar ned hur fort vissa förstärkningar avtar med %3$d %%. Detta varar tills han rör sig.

actors.buffs.hunger.hungry=hungrig
actors.buffs.hunger.starving=svälter
actors.buffs.hunger.onhungry=Du är hungrig.
actors.buffs.hunger.onstarving=Du är utsvulten!
actors.buffs.hunger.ondeath=Du svalt till döds…
actors.buffs.hunger.cursedhorn=Det förbannade hornet stjäl en del av matenergin medan du äter.
actors.buffs.hunger.rankings_desc=Svalt ihjäl
actors.buffs.hunger.desc_intro_hungry=Din mage har börjat kurra lite, men det är inte så farligt än.
actors.buffs.hunger.desc_intro_starving=Du är så hungrig att det gör ont.
actors.buffs.hunger.desc=\n\nAllteftersom du utforskar underjorden blir du hungrigare och hungrigare och till slut börjar du svälta. När du svälter förlorar du långsamt livspoäng istället för att regenerera dem.\n\nDet är viktigt att ransonera! Om du har livspoäng över kan det vara en bra idé att svälta ett tag för att spara på maten. Ordentlig ransonering kan få maten att räcka mycket längre!

actors.buffs.invisibility.name=osynlig
actors.buffs.invisibility.desc=Du smälter helt in i omgivande terräng och blir omöjlig att se.\n\nNär du är osynlig kan fiender inte attackera eller följa dig. Fysiska attacker och magiska effekter, till exempel skriftrullar och trollstavar, upphäver omedelbart osynligheten.\n\nÅterstående osynlighetsturer: %s.

actors.buffs.invulnerability.name=osårbar
actors.buffs.invulnerability.desc=Denna karaktär är genomsyrad av en stark skyddande kraft som ger dem en kort period av osårbarhet! \n\nÅterstående turer: %s.

actors.buffs.levitation.name=svävar
actors.buffs.levitation.desc=En magisk kraft får dig att sväva över marken och du känner dig viktlös.\n\nSvävande karaktärer rör sig ljudlöst och ignorerar alla markbaserade effekter. Fällor utlöses inte, vatten släcker inte eld, växter trampas inte ned, rötter missar och du svävar över gropar. Var försiktig, eftersom allt detta åter får effekt i samma ögonblick som svävningen upphör!\n\nÅterstående svävningsturer: %s.

actors.buffs.lifelink.name=livslänk
actors.buffs.lifelink.ondeath=Den livslänkade skadan dödade dig…
actors.buffs.lifelink.desc=Den här karaktärens livskraft är knuten till en annan karaktär i närheten. All mottagen skada delas mellan dem.\n\nNär karaktären tar skada tillfogas livslänksmålet hälften av skadan i stället.\n\nÅterstående livslänksturer: %s.

actors.buffs.light.name=upplyst
actors.buffs.light.desc=Även i den mörkaste fängelsehålan är ett stadigt ljus vid din sida alltid betryggande.\n\nLjuset håller mörkret på avstånd så att du kan se en rimlig sträcka trots omgivningen.\n\nÅterstående upplysningsturer: %s.

actors.buffs.lockedfloor.name=våningen är låst
actors.buffs.lockedfloor.desc=Den aktuella våningen är låst och du kan inte lämna den!\n\nNär en våning är låst blir du inte hungrigare och tar ingen skada av svält. Om du inte arbetar för att besegra våningens boss upphör dessutom passiva regenereringseffekter.\n\nOm du återupplivas av en ovälsignad ankh medan våningen är låst återställs den.\n\nDöda våningens boss för att bryta låset.

actors.buffs.lostinventory.name=förlorad packning
actors.buffs.lostinventory.desc=Din packning har förlorats någonstans i fängelsehålan! Du kan inte plocka upp eller använda de flesta föremål förrän du hämtar den.

actors.buffs.magicalsight.name=magisk syn
actors.buffs.magicalsight.desc=På något sätt kan du se med ditt sinne istället för med dina ögon.\n\nMedan magisk syn är aktiv kan du se genom all terräng inom en radie av 12 rutor.\n\nÅterstående turer med magisk syn: %s.

actors.buffs.magicalsleep.name=magisk sömn
actors.buffs.magicalsleep.toohealthy=Du är för frisk och står emot sömnigheten.
actors.buffs.magicalsleep.fallasleep=Du faller i en djup magisk sömn.
actors.buffs.magicalsleep.wakeup=Du vaknar uppfräschad och hälsosam.
actors.buffs.magicalsleep.desc=Denna karaktär har fallit i en djup magisk sömn som de inte kommer att vakna upp ur naturligt.\n\nMagisk sömn liknar vanlig sömn, förutom att endast skada kan väcka målet.\n\nFör hjälten och deras allierade har magisk sömn vissa återställande egenskaper, vilket gör att de snabbt kan läka vid vila.

actors.buffs.magicimmune.name=immun mot magi
actors.buffs.magicimmune.desc=Alla magiska effekter har förlorat sin verkan på dig, du är helt immun mot dem.\n\nMedan du är immun mot magi kommer inga skadliga eller hjälpsamma magiska effekter att påverka dig, inklusive förbannelser, förtrollningar, trollstavar, skriftrullar, ringar, artefakter etc. Hjältarnas rustningsförmågor är tillräckligt starka för att fungera oavsett denna effekt.\n\nÅterstående turer med immunitet mot magi: %s.

actors.buffs.mindvision.name=sinnesyn
actors.buffs.mindvision.desc=På något sätt kan du med tankekraft se alla varelser på den här våningen. Det känns märkligt.\n\nAlla karaktärer på våningen är synliga för dig så länge sinnesynen varar. Att se en varelse genom sinnesyn räknas som att den är synlig eller i närheten för många magiska effekter.\n\nÅterstående sinnesynsturer: %s.

actors.buffs.momentum.momentum=samlar fart
actors.buffs.momentum.running=frilöpning
actors.buffs.momentum.resting=återhämtar
actors.buffs.momentum.action_name=frilopp
actors.buffs.momentum.momentum_desc=När frilöparen rör sig bygger han upp fart som han kan använda för att börja frilöpa.\n\nVarje fartladdning ger två turer av frilöpning och frilöparen kan bygga upp till 10 laddningar. Farten förloras snabbt när frilöparen slutar röra sig.\n\nAktuell fartladdning: %d.
actors.buffs.momentum.running_desc=När frilöparen rör sig bygger han upp fart som han kan använda för att börja frilöpa.\n\nUnder frilöpning rör sig frilöparen med dubbelt så hög hastighet och får extra undvikandeförmåga baserat på sin nivå.\n\nÅterstående turer: %d.
actors.buffs.momentum.resting_desc=När frilöparen rör sig bygger han upp fart som han kan använda för att börja frilöpa.\n\nFrilöparen behöver tid för att återfå sin uthållighet innan han kan bygga upp fart igen.\n\nÅterstående turer: %d.

actors.buffs.monkenergy.name=energi
actors.buffs.monkenergy.action=Munkförmågor
actors.buffs.monkenergy.desc=När hon besegrar fiender får munken energi som hon kan använda till olika förmågor. De flesta fiender ger 1 energi när de besegras, och munken förlorar inte energi med tiden.\n\nAktuell energi: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Monken har nyligen använt en förmåga och måste vänta innan hen kan använda en annan.\n\nAktuell nedkylning: %d turer.
actors.buffs.monkenergy$monkability$flurry.name=mängder av slag
actors.buffs.monkenergy$monkability$flurry.desc=Två omedelbara slag som orsakar %1$d-%2$d skada och ignorerar rustning. Denna förmåga kan inte användas upprepade gånger.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Två omedelbara slag som orsakar %1$d-%2$d skada, ignorerar rustning och använder ditt vapens förtrollning. Denna förmåga kan inte användas upprepade gånger.
actors.buffs.monkenergy$monkability$focus.name=fokus
actors.buffs.monkenergy$monkability$focus.desc=Munken tar en tur för att fokusera, vilket gör att hon kan parera nästa attack mot henne.
actors.buffs.monkenergy$monkability$focus.empower_desc=Munken fokuserar omedelbart, vilket gör att hon kan parera nästa attack mot henne.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=fokuserad
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Munken är fokuserad på sin omgivning och förutser nästa attack mot henne. Vid fokusering är hon garanterad att parera nästa inkommande attack.
actors.buffs.monkenergy$monkability$dash.name=rusning
actors.buffs.monkenergy$monkability$dash.prompt=Välj en plats
actors.buffs.monkenergy$monkability$dash.desc=En omedelbar sprint upp till 4 rutor bort. Denna förmåga kan passera hinder, men inte fiender eller fast terräng.
actors.buffs.monkenergy$monkability$dash.empower_desc=En omedelbar sprint upp till _8 rutor_ bort. Denna förmåga kan passera hinder, men inte fiender eller fast terräng.
actors.buffs.monkenergy$monkability$dragonkick.name=drakspark
actors.buffs.monkenergy$monkability$dragonkick.desc=En förödande spark som orsakar %1$d-%2$d skada och ignorerar rustning. Sparken knuffar iväg måltavlan och paralyserar dem för varje ruta de korsar.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=En förödande spark som orsakar _%1$d-%2$d skada_ och ignorerar rustning. Sparkar iväg _alla intilliggande mål_ och förlamar dem för varje ruta de korsar.
actors.buffs.monkenergy$monkability$meditate.name=meditera
actors.buffs.monkenergy$monkability$meditate.desc=Munken fokuserar energi i sin kropp i fem turer. Detta tar bort de flesta negativa effekter och ger henne åtta turer av uppladdning för trollstavar och artefakter.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Munken fokuserar energi i sin kropp i fem turer. Detta tar bort de flesta negativa effekter och ger henne åtta turer av uppladdning för trollstavar och artefakter. _Hon får också 80 %% skademotstånd när hon mediterar och läker långsamt 20 %% av sin saknade hälsa._

actors.buffs.ooze.name=frätande gyttja
actors.buffs.ooze.heromsg=Frätande syra smälter dig. Skölj av den!
actors.buffs.ooze.ondeath=Du smälte bort…
actors.buffs.ooze.rankings_desc=Upplöst
actors.buffs.ooze.desc=Den här klibbiga syran fastnar på köttet och smälter långsamt bort det.\n\nFrätande gyttja orsakar stadig skada över tid, men kan genast tvättas bort i vatten.\n\nÅterstående gyttjeturer: %s.

actors.buffs.paralysis.name=förlamad
actors.buffs.paralysis.heromsg=Du är förlamad!
actors.buffs.paralysis.out=stod emot förlamning
actors.buffs.paralysis.desc=Ofta är det värsta man kan göra att inte göra någonting alls. \n\nFörlamning stoppar alla åtgärder helt och tvingar målet att vänta tills effekten avtar. Smärtan från skadan kan få karaktärer att motstå förlamningen och bryta effekten. \n\nÅterstående förlamningsturer: %s.

actors.buffs.physicalempower.name=fysiskt stärkt
actors.buffs.physicalempower.desc=Dina slag har förstärkts, vilket ökar skadan du kan åstadkomma när du träffar fiender med fysiska attacker.\n\nBonusskada: %1$d.\nÅterstående träffar: %2$d.

actors.buffs.pincushion.name=nåldyna
actors.buffs.pincushion.desc=De kastvapen du har använt mot denna karaktär sitter fast på dem och faller till marken när de besegras.\n\nFöljande föremål sitter fast:

actors.buffs.poison.name=förgiftad
actors.buffs.poison.heromsg=Du är förgiftad!
actors.buffs.poison.ondeath=Du dog av giftet…
actors.buffs.poison.rankings_desc=Dog av förgiftning
actors.buffs.poison.desc=Giftet sprider sig i kroppen och försämrar långsamt dess inre funktioner.\n\nGift orsakar skada varje tur i proportion till hur lång tid det är kvar tills det upphör att verka.\n\nÅterstående turer med gift: %s.

actors.buffs.preparation.name=förberedelse
actors.buffs.preparation.action_name=förberett slag
actors.buffs.preparation.desc=Lönnmördaren väntar tålmodigt, beredd att slå från skuggorna.
actors.buffs.preparation.desc_dmg=Hans nästa attack kommer att orsaka _%1$d%% bonusskada_ och döda vanliga fiender med mindre än _%2$d%% hälsa_ eller bossar med mindre än _%3$d%% hälsa_.
actors.buffs.preparation.desc_dmg_likely=Attacken kommer också mer sannolikt göra en större mängd skada.
actors.buffs.preparation.desc_blink=Han kan teleportera sig mot en fiende innan han slår till, med ett maximalt avstånd på _%d._
actors.buffs.preparation.desc_invis_time=Turer tillbringade som osynlig: _%d._
actors.buffs.preparation.desc_invis_next=Turer tills starkare attack: _%d._
actors.buffs.preparation.prompt=Välj ett mål att attackera!\nMax blinkavstånd: %d
actors.buffs.preparation.no_target=Det finns inget att attackera där.
actors.buffs.preparation.out_of_reach=Målet är utom räckhåll.
actors.buffs.preparation.assassinated=lönnmördad

actors.buffs.prismaticguard.name=prismatisk väktare
actors.buffs.prismaticguard.desc=Du skyddas av en prismatisk bild som för närvarande är inaktiv. När fiender är närvarande kommer den prismatiska bilden att träda i aktion och skydda dig!\n\nNär den är inaktiv återhämtar sig den prismatiska bilden stadigt från alla skador den har tagit.\n\nAktuell HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Denna prismatiska bild drar också nytta av Power of Many. Återstående turer: %d.

actors.buffs.recharging.name=uppladdning
actors.buffs.recharging.desc=Energi strömmar genom dig och förbättrar laddningshastigheten för dina trollstavar och stavar.\n\nVarje tur ökar denna buff den aktuella laddningen med en fjärdedel, utöver den vanliga laddningen.\n\nÅterstående laddningsturer: %s.

actors.buffs.revealedarea.name=synliggjort område
actors.buffs.revealedarea.desc=Ett område i kryptan har tillfälligt blivit synligt för hjälten. De ser det oavsett var de är.\n\nÅterstående turer: %s.

actors.buffs.revealedchar.name=synliggjord
actors.buffs.revealedchar.desc=Denna karaktären är synliggjord för hjälten. De är synliga oavsett var de är.\n\nTurer återstående: %s.

actors.buffs.roots.name=fastrotad
actors.buffs.roots.heromsg=Du kan inte röra dig!
actors.buffs.roots.desc=Rötter (magiska eller naturliga) griper tag i fötterna och tvingar dem ner mot marken.\n\nRötter låser ett mål på plats, vilket gör rörelse och de flesta rörelseförmågor omöjliga. Andra åtgärder påverkas inte, inklusive teleporteringseffekter.\n\nÅterstående rötter: %s.

actors.buffs.scrollempower.name=skriftrulleförstärkning
actors.buffs.scrollempower.desc=Energin från magikerns nyligen lästa skriftrulle ger hans trollstavar extra kraft!\n\nNivåhöjning: +%1$d.\nÅterstående avfyrningar: %2$d.

actors.buffs.shadows.name=sammansmält med skuggorna
actors.buffs.shadows.desc=Du smälter in i skuggorna omkring dig, vilket ger dig osynlighet och saktar ned din ämnesomsättning.\n\nNär du är osynlig kan fiender inte attackera eller följa dig. De flesta fysiska attacker och magiska effekter, till exempel skriftrullar och trollstavar, upphäver omedelbart osynligheten. När du är sammansmält med skuggorna ökar dessutom hungern långsammare.\n\nDu förblir sammansmält med skuggorna tills du lämnar dem eller en fiende kommer i kontakt med dig.

actors.buffs.slow.name=förslöad
actors.buffs.slow.desc=Saktande magi påverkar målets tidsuppfattning, så att allt rör sig extremt snabbt för dem. \n\nEn saktad karaktär utför alla handlingar på dubbelt så lång tid som normalt. \n\nÅterstående turer med saktning: %s.

actors.buffs.snipersmark.name=prickskyttens märke
actors.buffs.snipersmark.action_name_snapshot=snabbskott
actors.buffs.snipersmark.action_name_volley=salva
actors.buffs.snipersmark.action_name_sniper=prickskytteskott
actors.buffs.snipersmark.desc=Prickskytten är inriktad på det mål hon senast attackerade. Hon kan utföra en specialattack med sin båge som varierar beroende på hur bågen är förstärkt.\n\nEn oförstärkt båge avfyrar ett _snabbskott_ som gör mindre skada men inte tar någon tid att avfyra.\n\nEn båge förstärkt för hastighet avfyrar en _salva_ med tre pilar. Varje pil gör mindre skada men kan fortfarande aktivera förtrollningar. Salvan tar en tur att avfyra.\n\nEn båge förstärkt för skada avfyrar ett _prickskytteskott._ Skottet träffar garanterat, gör bonusskada utifrån avståndet till målet och tar två turer att avfyra.\n\nÅterstående turer: %s.

actors.buffs.soulmark.name=själmärkt
actors.buffs.soulmark.desc=Häxmästaren har fått kontakt med den här varelsens själ, vilket låter honom läka när varelsen tar fysisk skada.\n\nÅterstående själsmärkesturer: %s.

actors.buffs.stamina.name=uthållighet
actors.buffs.stamina.desc=Du har outtömlig uthållighet och kan röra dig snabbare!\n\nUnder uthållighetens effekt springer du med 50 %% högre hastighet, men utför alla andra handlingar i normal hastighet.\n\nÅterstående uthållighetsturer: %s.

actors.buffs.swarminteltracker.name=svärmintelligens
actors.buffs.swarminteltracker.desc=Svärmintelligens gör att fiender drar andra fiender till din position när de ser dig eller dina allierade.\n\nLockningen har begränsad räckvidd, men ju längre du syns, desto större blir räckvidden, upp till 12. Om siktlinjen bryts, även ett ögonblick, återställs räckvidden.\n\nAktuell största lockningsräckvidd: %d.

actors.buffs.vulnerable.name=sårbar
actors.buffs.vulnerable.heromsg=Du känner dig ömtålig!
actors.buffs.vulnerable.desc=Sårbarhetsmagi ökar all fysisk skada som en karaktär tar med 33%% efter att skadan har reducerats av rustning. \n\nÅterstående turer med sårbarhet: %s.

actors.buffs.terror.name=förskräckt
actors.buffs.terror.desc=Terror är manipulativ magi som tvingar sitt mål in i en okontrollerbar panik.\n\nSkräckslagna karaktärer tvingas fly från sin motståndare och försöker placera så många dörrar och väggar som möjligt mellan sig och motståndaren. Smärtan från chocken minskar dock terrorens varaktighet.\n\nÅterstående turer av terror: %s.

actors.buffs.toxicimbue.name=genomsyrad av gift
actors.buffs.toxicimbue.desc=Du är genomsyrad av giftig energi!\n\nNär du rör dig väller giftig gas ständigt ut från dig och skadar dina fiender. Du är immun mot giftig gas och gift medan effekten varar samt i några turer efteråt.\n\nÅterstående giftkraftsturer: %s.

actors.buffs.corrosion.name=korrosion
actors.buffs.corrosion.heromsg=Du smälter!
actors.buffs.corrosion.ondeath=Du smälter bort…
actors.buffs.corrosion.rankings_desc=Upplöst
actors.buffs.corrosion.desc=Kraftig syra smälter bort kött, metall och ben i en alarmerande takt.\n\nKorrosionsskadan ökar med tiden, i takt med att målet fortsätter att smälta bort.\n\nÅterstående turer med korrosion: %1$s.\nAktuell korrosionsskada: %2$d.

actors.buffs.vertigo.name=yrsel
actors.buffs.vertigo.desc=Det kan vara svårt att gå rakt fram när hela världen snurrar.\n\nNär karaktärer är drabbade av yrsel kommer de att röra sig i slumpmässiga riktningar istället för i den riktning de avsåg att gå.\n\nÅterstående yrselturer: %s.

actors.buffs.wandempower.name=stavar stärkta
actors.buffs.wandempower.desc=Dina skadegörande trollstavar har förstärkts, vilket ökar skadan de gör under några träffar.\n\nBonusskada: %1$d.\nÅterstående träffar: %2$d.

actors.buffs.weakness.name=försvagad
actors.buffs.weakness.heromsg=Du känner dig helt plötsligt svag!
actors.buffs.weakness.desc=Allt känns plötsligt mycket tyngre.\n\nFörsvagande magi minskar en karaktärs fysiska styrka så att den orsakar 33 %% mindre skada.\n\nÅterstående svaghetsturer: %s.

actors.buffs.wellfed.name=proppmätt
actors.buffs.wellfed.desc=Du känner dig ganska mätt och belåten.\n\nNär du är mätt ökar inte din hunger och du återfår extra hälsa över tid.\n\nÅterstående turer: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Du kan inte sikta på dig själv!
actors.hero.abilities.armorability.no_target=Det finns inget att sikta på här!
actors.hero.abilities.armorability.prompt=Välj en plats att sikta på
actors.hero.abilities.armorability.cost=Laddningskostnad: _%d_

actors.hero.abilities.warrior.heroicleap.name=Hjältemodigt språng
actors.hero.abilities.warrior.heroicleap.prompt=Välj riktning att hoppa
actors.hero.abilities.warrior.heroicleap.short_desc=Krigaren utför ett _Heroiskt språng_ mot en vald plats och flyger över fiender och faror.
actors.hero.abilities.warrior.heroicleap.desc=Krigaren hoppar mot en vald plats och flyger över alla fiender och faror som finns i vägen. Han kan dock inte hoppa över murar eller annan fast terräng.
actors.hero.abilities.warrior.shockwave.name=tryckvåg
actors.hero.abilities.warrior.shockwave.short_desc=Krigaren släpper lös en _tryckvåg_ i ett konformat område genom att slå i marken. Fiender som träffas av tryckvågen skadas och förlamas.
actors.hero.abilities.warrior.shockwave.desc=Krigaren slår i marken och skapar en chockvåg som sprider sig upp till 5 rutor i en 60 graders kon.\n\nFiender som träffas av chockvågen blir handikappade i 5 turer. De får också 5-10 skada, plus 1-2 extra skada för varje styrkepunkt som krigaren har över 10.
actors.hero.abilities.warrior.endure.name=utstå
actors.hero.abilities.warrior.endure$enduretracker.name=uthållighet
actors.hero.abilities.warrior.endure$enduretracker.desc=Krigaren gör nu extra skada baserat på den skada han har uthärdat.\n\nExtra skada: %1$d\nÅterstående träffar: %2$d
actors.hero.abilities.warrior.endure.short_desc=Krigaren _uthärdar_, hoppar över flera turer men får hög skaderesistens. Han gör sedan bonusskada baserat på vad han uthärdat.
actors.hero.abilities.warrior.endure.desc=Krigaren uthärdar i 3 turer och tar hälften av skadan från alla källor. Denna minskning tillämpas före skaderesistenta effekter som rustning.\n\nEfter att ha uthärdat får krigarens nästa träff inom 10 turer bonusskada. Denna bonusskada är lika med hälften av all skada som han åsamkats vid uthärdandet, före eventuella skademinskande effekter!\n\nOm krigaren har någon kombo ökar användningen av denna förmåga dess återstående tid med 3 turer.

actors.hero.abilities.mage.elementalblast.name=elementexplosion
actors.hero.abilities.mage.elementalblast.no_staff=Du kan inte använda denna förmåga utan din stav.
actors.hero.abilities.mage.elementalblast.short_desc=Magikern avger en _elementexplosion_ från sin stav som täcker ett stort område runt honom med en effekt som varierar beroende på trollstaven i staven.
actors.hero.abilities.mage.elementalblast.desc=Magikern avger en magisk explosion som täcker ett cirkulärt område upp till fyra rutor bort och orsakar upp till 15–25 skada. Elementexplosionens specifika effekt beror på trollstaven som är infogad i magikerns stav.
actors.hero.abilities.mage.elementalblast.generic_desc=Elementexplosionens effekt liknar trollstavens effekt när den avfyras mot en fiende eller allierad.
actors.hero.abilities.mage.wildmagic.name=vild magi
actors.hero.abilities.mage.wildmagic.no_wands=Du har inga stavar att zappa med!
actors.hero.abilities.mage.wildmagic.short_desc=Magikern släpper lös den vilda magi som finns i hans stavar och avfyrar dem slumpmässigt flera gånger mot ett valt mål under en enda tur.
actors.hero.abilities.mage.wildmagic.desc=Magikern släpper loss kraften i sina trollstavar och avfyrar dem slumpmässigt upp till 4 gånger under en enda tur. Magikerns stav ingår inte i denna effekt.\n\nVarje trollstav får också sin nivå höjd med 2, upp till +3. Denna förmåga använder en halv trollstavsladdning för varje trollslag, och ingen trollstav kan avfyras mer än 2 gånger.
actors.hero.abilities.mage.warpbeacon.name=teleportfyr
actors.hero.abilities.mage.warpbeacon.depths=Du kan inte varpa mellan olika djup!
actors.hero.abilities.mage.warpbeacon.locked_floor=Du kan inte lämna en låst våning!
actors.hero.abilities.mage.warpbeacon.too_far=Den platsen är för långt bort!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Du kan inte placera en fyr där!
actors.hero.abilities.mage.warpbeacon.window_desc=Din fyr står för tillfället på våning %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleportera till fyr
actors.hero.abilities.mage.warpbeacon.window_clear=ta bort fyr
actors.hero.abilities.mage.warpbeacon.window_cancel=avbryt
actors.hero.abilities.mage.warpbeacon.short_desc=Magikern placerar en _teleportfyr_ på sin aktuella plats som han omedelbart kan teleportera tillbaka till.
actors.hero.abilities.mage.warpbeacon.desc=Magikern placerar en fyr som han sedan kan teleportera till när han vill. Det tar en tur att placera fyren men teleporteringen sker omedelbart.\n\nMagikern kan normalt inte teleportera mellan våningar eller använda fyren för att nå otillgängliga platser som låsta rum. Han kan teleportera in i fiender, vilket knuffar dem åt sidan.

actors.hero.abilities.rogue.smokebomb.name=rökbomb
actors.hero.abilities.rogue.smokebomb.fov=Du kan bara hoppa till en tom plats i ditt synfält.
actors.hero.abilities.rogue.smokebomb.prompt=Välj en plats att hoppa till
actors.hero.abilities.rogue.smokebomb$ninjalog.name=träspärr
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=På något sätt blir fiender helt övertygade att denna träbulvan är den riktiga Skurken!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Du kan hitta denna karaktär med en specifik hjälteförmåga.
actors.hero.abilities.rogue.smokebomb.short_desc=Skurken kastar ut en _rökbomb_ och teleporteras bort. Han bländar fiender nära sin tidigare position.
actors.hero.abilities.rogue.smokebomb.desc=Skurken kastar en rökbomb och blinkar upp till 6 rutor bort. Han kan blinka genom faror och fiender, men inte genom fast terräng som väggar.\n\nFiender som är intill Skurkens gamla position blir bländade i 5 turer.
actors.hero.abilities.rogue.deathmark.name=dödsmärke
actors.hero.abilities.rogue.deathmark.ally_target=Du kan endast markera fiender
actors.hero.abilities.rogue.deathmark.short_desc=Skurken placerar ett _Dödsmärke_ på en vald fiende. Märkta fiender tar extra skada, men kan inte dö förrän märket upphör.
actors.hero.abilities.rogue.deathmark.desc=Skurken placerar ett märke på en vald fiende så att den tar 25 % extra skada. Märket appliceras omedelbart och varar i fem turer.\n\nMärkta fiender tar bonusskada men kan inte dö förrän märket upphör. Om en fiende har 0 HP när märket upphör dör den omedelbart.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=märkt för att dö
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Denna fiende har märkts, vilket gör att den tar 25%% extra skada, men också att den inte kan dö förrän märket upphör.\n\nÅterstående turer: %s.
actors.hero.abilities.rogue.shadowclone.name=skuggklon
actors.hero.abilities.rogue.shadowclone.short_desc=Skurken frammanar en _skuggklon_, som kan dirigeras för att hjälpa honom i strid.
actors.hero.abilities.rogue.shadowclone.desc=Skurken frammanar en skuggig kopia av sig själv, som kan dirigeras för att hjälpa honom i strid. Det kostar inget att dirigera skuggklonen.\n\nKlonen har 80 HP, ingen rustning och gör 10-20 skada. Alla dessa egenskaper kan förbättras med talanger, så att klonen drar nytta av vapen och rustningar som hjälten har.
actors.hero.abilities.rogue.shadowclone$shadowally.name=skuggskurk
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Din klon rör sig till den platsen.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Din klon rör sig för att följa efter dig.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Din klon rör sig för att attackera!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=En kopia av skurken, skapad av skuggmörker. Den står helt stilla med tomma ögon och små mörka slöjor som stiger från den som ånga.\n\nKlonen är inte en perfekt kopia av skurken men är ändå en duglig kämpe och kan med rätt talanger dra nytta av skurkens utrustning.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Du kan hitta den här karaktären med en specifik hjälteförmåga.

actors.hero.abilities.huntress.spectralblades.name=spektralblad
actors.hero.abilities.huntress.spectralblades.short_desc=Jägaren kastar _spektralblad_ mot ett mål och orsakar skada utifrån sitt för närvarande utrustade närstridsvapen.
actors.hero.abilities.huntress.spectralblades.desc=Jägaren kastar en spektralklinga mot en fiende, som fungerar som ett distansangrepp från hennes närstridsvapen. Alla normala effekter av ett närstridsvapen aktiveras, inklusive förtrollningar.
actors.hero.abilities.huntress.naturespower.name=naturens kraft
actors.hero.abilities.huntress.naturespower.short_desc=Jägaren anropar naturens kraft, vilket ökar hennes rörelsehastighet och bågens eldhastighet under en kort tid.
actors.hero.abilities.huntress.naturespower.desc=Jägaren ger sig själv och sin båge tillfällig kraft från naturen! Effekten varar i 8 turer.\n\nUnder denna tid rör sig jägarinnan dubbelt så fort och attackerar 33 % snabbare med sin båge. De extra bågeffekterna aktiveras inte om prickskytten använder sina specialattacker.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=naturens kraft
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Jägaren får tillfälligt ökad styrka, vilket ökar hennes rörelsehastighet och attackhastighet med bågen.\n\nÅterstående turer: %s.
actors.hero.abilities.huntress.spirithawk.name=andehök
actors.hero.abilities.huntress.spirithawk.no_space=Det finns inget fritt utrymme nära dig.
actors.hero.abilities.huntress.spirithawk.short_desc=Jägaren kallar fram en _andehök_ som kan hjälpa henne att spana efter platser och distrahera fiender.
actors.hero.abilities.huntress.spirithawk.desc=Jägaren kallar fram en andehök som kan styras genom att förmågan används igen medan höken är frammanad. Höken varar i 100 turer och det kostar ingen laddning att styra den.\n\nHöken har låg hälsa och liten attackkraft men är snabb, undvikande och träffsäker. Den delar alltid hela sitt synfält med jägaren. Den är immun mot områdesbundna effekter som eld och giftgas. Den attackerar inte utan en uttrycklig order.
actors.hero.abilities.huntress.spirithawk$hawkally.name=andehök
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Din hök rör sig till den platsen.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Din hök rör sig för att följa efter dig.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Din hök rör sig för att attackera!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=En magisk hök, frammanad av Jägaren. Den lyser i en klar, eterisk blå färg och dess huvud rör sig ständigt medan den övervakar området.\n\nDen är inte särskilt bra på att slåss, men dess snabbhet och syn gör den utmärkt för att spana och distrahera fiender.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Återstående turer: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Garanterade undanflykter som återstår: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Du kan hitta den här karaktären med en specifik hjälteförmåga.

actors.hero.abilities.duelist.challenge.name=utmana
actors.hero.abilities.duelist.challenge.prompt=Välj en fiende att utmana
actors.hero.abilities.duelist.challenge.already_dueling=Du kan bara vara i en duell åt gången.
actors.hero.abilities.duelist.challenge.ally_target=Du kan endast utmana fiender.
actors.hero.abilities.duelist.challenge.unreachable_target=Du måste kunna nå din måltavla.
actors.hero.abilities.duelist.challenge.distant_target=Den fienden är för långt bort för att utmana.
actors.hero.abilities.duelist.challenge.short_desc=Duellanten utmanar en fiende i närheten till en duell och fryser tillfälligt alla andra fiender.
actors.hero.abilities.duelist.challenge.desc=Duellanten utmanar en fiende i närheten till en duell. Fienden tvingas slåss mot henne medan alla andra fiender tillfälligt fryses i tiden.\n\nMålet måste kunna nås och vara inom fem rutor från duellanten. Duellen varar tills tio turer har gått, fienden dör eller duellanten befinner sig mer än fem rutor från fienden.\n\nFrysta fiender är osårbara. Duellantens allierade fryses inte av förmågan, men om målet är en boss fryses inte heller dess underhuggare.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duelldeltagare
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Denna karaktär deltar i en duell. De och alla deras allierade eller underhuggare får agera normalt vid frysning av andra karaktärer.\n\nDuellen pågår under en viss tid, tills en deltagare dör eller tills deltagarna flyttar sig mer än 5 rutor från varandra.\n\nÅterstående turer: %d.
actors.hero.abilities.duelist.elementalstrike.name=elementärt slag
actors.hero.abilities.duelist.elementalstrike.short_desc=Duellanten utför ett _Elementärt slag_ som sprider en effekt i en konisk AOE baserat på hennes vapenförtrollning.
actors.hero.abilities.duelist.elementalstrike.desc=Duellanten slår mot en fiende eller plats och utför en vanlig attack som garanterat träffar och sprider en magisk effekt som når upp till 4 rutor i en 65 graders kon. Denna magiska effekt varierar beroende på förtrollningen på duellantens primära vapen.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Ett elementärt slag utan förtrollning utlöser en liten magisk explosion som orsakar 6–12 skada på alla fiender inom räckvidden.
actors.hero.abilities.duelist.feint.name=fint
actors.hero.abilities.duelist.feint.prompt=Välj en plats att sprinta till
actors.hero.abilities.duelist.feint.too_far=Den platsen ligger inte i närheten av dig.
actors.hero.abilities.duelist.feint.bad_location=Du kan inte flytta till den platsen.
actors.hero.abilities.duelist.feint.short_desc=Duellanten gör en finte och låtsas attackera vid en sprint till en intilliggande ruta. Fiender attackerar hennes efterbild och blir därmed utsatta för en kontring.
actors.hero.abilities.duelist.feint.desc=Duellanten låtsas attackera medan hon gör en snabb förflyttning till en intilliggande ruta och lämnar kvar en kortvarig efterbild. Fiender som attackerade duellanten attackerar i stället efterbilden.\n\nFiender som attackerar efterbilden blir förvirrade, vilket avbryter deras nästa handling och lämnar dem öppna för en överraskningsattack.

actors.hero.abilities.cleric.ascendedform.name=upphöjd form
actors.hero.abilities.cleric.ascendedform.short_desc=Prästen antar en _upphöjd form_ och får nya trollformler, attackräckvidd och skydd.
actors.hero.abilities.cleric.ascendedform.desc=Prästen projicerar helig energi från sig själv och antar en utsträckt strålande form i 10 turer. Vid denna form kan prästen kasta nya trollformler, får 2 attackräckvidd, 30 sköld och alla ytterligare trollformler som de kastar ger 10 sköld per helig bokladd som används. Skölden från upphöjd form och dess trollformler försvinner inte normalt, men försvinner omedelbart när upphöjd form upphör. Förmågan kan återanvändas för att uppdatera upphöjd forms varaktighet.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=upphöjd form
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Strålande energi strålar ut från prästens kropp. Vid denna form får prästen 2 attackräckvidd (från den heliga energi som strålar ut från dem) och 10 sköld när de använder en helig bokladdning. De kan också kasta de trollformler som låses upp via den upphöjda formens talanger.\n\nSkölden som ges av den upphöjda formen och dess trollformler försvinner inte normalt, utan försvinner omedelbart när den upphöjda formen upphör.\n\nAktuell sköld: %1$d.\nÅterstående turer: %2$d.
actors.hero.abilities.cleric.trinity.name=treenighet
actors.hero.abilities.cleric.trinity.no_imbue=Treenighet har för närvarande ingen effekt inställd för någon av sina former, använd en av dess besvärjelser!
actors.hero.abilities.cleric.trinity.no_duplicate=Treenigheten kan inte kopiera en effekt som redan är aktiv på dig!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Treenighet kommer att tillämpa denna effekt i _%1$d turer_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Treenighet kommer att tillämpa denna _kraftfulla_ effekt i _%1$d turer_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.wand_use=Treenigheten avfyrar den här trollstaven på _+%1$d_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.wand_multi_use=Treenigheten använder denna _flerladdade_ trollstav på _+%1$d_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.thrown_use=Treenigheten kastar det här vapnet på _+%1$d_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.ring_use=Trinity kommer att tillämpa denna rings effekt på _+%1$d_ i 20 turer, till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Treenigheten aktiverar detta verktyg för en _fjärralkemieffekt_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Treenigheten aktiverar den här bägaren för en _passiv hälsoåterhämtningseffekt_ på _+%1$d_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.driedrose_use=Treenigheten aktiverar den här rosen och frammanar ett spöke på _+%1$d_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity tillämpar denna artefakts kedjekastningseffekt med räckvidd _+%1$d_, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.hornofplenty_use=Treenigheten aktiverar det här hornet för en _mellanmålseffekt_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity tillämpar denna artefakts fiendestöldseffekt vid _+%1$d_, till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity tillämpar denna artefakts rotningseffekt med ett slumpmässigt skadligt frö, till en kostnad av _%2$s laddning.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Treenigheten kommer att tillämpa denna artefakts insatseffekt, till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Treenigheten aktiverar den här talismanen för en _spådomseffekt_ på _+%1$d_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Treenigheten aktiverar det här timglaset med en varaktighet på _%1$d_ turer till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Treenigheten aktiverar den här boken för en _slumpmässig skriftrulleffekt_ på _+%1$d_ till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.cost=Laddningskostnaden för denna förmåga varierar, men är oftast _%d._
actors.hero.abilities.cleric.trinity.short_desc=Treenigheten efterliknar utrustning som prästen bär.
actors.hero.abilities.cleric.trinity.desc=Prästen får en _Treenighet_ av rustningsförmågor, som kan tilldelas olika föremålseffekter med hjälp av tre nya trollformler. Var och en av dessa trollformler fokuserar på att emulera effekterna av olika typer av utrustning som prästen har identifierat under denna omgång: kroppsform (vapen och rustningar), sinnesform (trollstavar och kastvapen) och andeform (ringar och artefakter).\n\nVarje treenighetsform kan förses med en effekt åt gången, och prästen väljer vilken som ska aktiveras när treenighet används. Treenighet duplicerar inte effekten av något du redan har utrustat dig med.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Välj vilken treenighetsform du vill använda. Effekterna av olika former kan vara aktiva samtidigt.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Kroppsform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Sinnesform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Andeform: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Välj en effekt som ska tilldelas Treenigheten. Ytterligare information visas före bekräftelse.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Tilldela till kroppsform
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Tilldela till sinnesform
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Tilldela till andeform
actors.hero.abilities.cleric.powerofmany.name=mångas kraft
actors.hero.abilities.cleric.powerofmany.prompt_default=Välj en allierad eller plats
actors.hero.abilities.cleric.powerofmany.prompt_ally=Styr din ljusallierade
actors.hero.abilities.cleric.powerofmany.ally_exists=Du har redan en förstärkt allierad.
actors.hero.abilities.cleric.powerofmany.no_vision=Du kan inte välja en plats som du inte kan se.
actors.hero.abilities.cleric.powerofmany.only_allies=Du kan bara stärka allierade.
actors.hero.abilities.cleric.powerofmany.short_desc=Prästen kanaliserar _mångas kraft_ och förstärker en befintlig allierad eller skapar en ny.
actors.hero.abilities.cleric.powerofmany.desc=Prästen kanaliserar _mångas kraft_, som antingen förstärker en befintlig allierad eller skapar en ny förstärkt allierad i 100 turer. Om du väljer en tom ruta skapas en ny allierad.\n\nNär en allierad förstärks av mångas kraft orsakar den +25 % mer skada, tar -25 % mindre skada och delar sitt synfält med prästen. Den får också 25 skydd när förmågan används.\n\nPrästen får också tre nya trollformler som bara kan kastas med en förstärkt allierad. Mångas kraft upphör inte medan någon av trollformlerna är aktiv.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=mångas kraft
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Den här allierade har förstärkts av mångas kraft, vilket gör att den orsakar +25 %% mer skada och tar -25 %% mindre skada. Den delar också sitt synfält med prästen och kan dra nytta av trollformlerna för mångas kraft.\n\nMångas kraft kvarstår när allierade, till exempel prismatiska bilder, gömmer sig, men varaktigheten räknas fortfarande ned.\n\nÅterstående turer: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=ljusallierad
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Din allierade flyttar sig till den positionen.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Din allierade flyttar sig för att följa dig.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Din allierade rör sig för att attackera!
actors.hero.abilities.cleric.powerofmany$lightally.desc=En kopia av en av prästens äventyrskamrater, skapad av fast ljus. Den har en annan hjältes form men inga av dennes unika förmågor. Den här allierade finns kvar så länge mångas kraft verkar på den.\n\nDen kan styras utan kostnad genom att rustningsförmågan Mångas kraft används igen.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Du kan hitta denna karaktär med en specifik hjälte-rustningsförmåga.


actors.hero.abilities.ratmogrify.name=råttmogrifiera
actors.hero.abilities.ratmogrify.cant_transform=Du kan inte råttmogrifiera det där!
actors.hero.abilities.ratmogrify.too_strong=Den fienden är för stark för att råttmogrifiera!
actors.hero.abilities.ratmogrify.short_desc=Hjälten _Råttmogrifierar_ en fiende! Detta förvandlar dem tillfälligt till en råtta utan några förmågor.
actors.hero.abilities.ratmogrify.desc=Hjälten förvandlar en fiende till en råtta i 6 turer! Bossar, allierade och råttor kan inte råttmogrifieras.\n\nRåttmogrifierade fiender behåller sina ursprungliga statistik, men har inga förmågor.
actors.hero.abilities.ratmogrify$transmograt.name=råttmogrifierad %s
actors.hero.abilities.ratmogrify$transmograt.desc=Denna fiende har förvandlats till en råtta. En stor förbättring, om du frågar mig! - Råttkungen
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Dödad av: råttmogrifierad fiende

##Cleric Spells
actors.hero.spells.auraofprotection.name=skyddsaura
actors.hero.spells.auraofprotection.short_desc=Ökar försvaret för paladinen och närliggande allierade.
actors.hero.spells.auraofprotection.desc=Paladinen utstrålar skyddande energi i en glittrande aura runt sig själv i 20 turer. Alla allierade inom två rutor från paladinen, även paladinen själv, tar %1$d %% mindre skada och får effekten av paladinens rustningsglyf med +%2$d %% styrka.\n\nSkadereduktionen tillämpas före andra skadereducerande effekter, till exempel rustning. Förstärkningen av glyfens styrka tillämpas alltid, men besvärjelsen kan inte få paladinens glyf att tillämpas mer än en gång om en karaktär redan påverkas av den, till exempel paladinen själv eller en prismatisk bild.
actors.hero.spells.auraofprotection$aurabuff.name=skyddsaura
actors.hero.spells.auraofprotection$aurabuff.desc=Paladinen utstrålar skyddande energi omkring sig.\n\nAlla närliggande allierade, även paladinen själv, tar mindre skada och får effekten av paladinens rustningsglyf med förstärkt styrka.\n\nÅterstående turer: %s.

actors.hero.spells.beamingray.name=strålljus
actors.hero.spells.beamingray.no_space=Det finns inget utrymme för din allierade att dyka upp där.
actors.hero.spells.beamingray.out_of_range=Den platsen är utanför räckvidden.
actors.hero.spells.beamingray.short_desc=Teleporterar din allierade och ger bonusskada.
actors.hero.spells.beamingray.desc=Prästen kanaliserar kraften hos sin allierade till en ljusstråle som teleporteras till en plats. Om strålen kolliderar med en fiende placeras den allierade i närheten och styrs mot fienden.\n\nStrålen har en maximal räckvidd på %1$d rutor och ökar mångas krafts bonusskada till +%2$d %% i 10 turer mot den närmaste fienden inom fyra rutor. Strålljus kan även teleportera normalt orörliga allierade, men räckvidden halveras då.
actors.hero.spells.beamingray$beamingrayboost.name=strålljus
actors.hero.spells.beamingray$beamingrayboost.desc=Den här allierade har nyligen teleporterats av strålljus, vilket ger bonusskada mot den närmaste fienden efter teleporteringen. Mångas kraft upphör inte heller medan denna förstärkning är aktiv.\n\nÅterstående turer: %s.

actors.hero.spells.blessspell.name=välsigna
actors.hero.spells.blessspell.short_desc=Välsignar och skyddar prästen samt välsignar och läker andra.
actors.hero.spells.blessspell.desc=Prästen lägger en helig välsignelse på sig själv eller en annan synlig karaktär.\n\nNär den kastas på prästen själv är effekten svagare och ger %1$d turer av välsignelse och %2$d barriär.\n\nNär den kastas på andra karaktärer är besvärjelsen kraftfullare och ger %3$d turer av välsignelse och %4$d läkning. Överflödig läkning omvandlas till barriär.

actors.hero.spells.bodyform.name=kroppsform
actors.hero.spells.bodyform.short_desc=Tilldelar Treenigheten en förtrollning eller glyf.
actors.hero.spells.bodyform.desc=Prästen väljer en förtrollning eller glyf som hen har identifierat under den här omgången och förser Treenigheten med dess effekt.\n\nNär Treenigheten används får prästen effekten av den valda förtrollningen eller glyfen i %d turer. Den tillfälliga förtrollningen eller glyfen fungerar med alla effekter som en vanlig förtrollning eller glyf skulle fungera med.\n\nBesvärjelsen ersätter alla andra kroppseffekter som Treenigheten för närvarande är försedd med.
actors.hero.spells.bodyform$bodyformbuff.name=kroppsform
actors.hero.spells.bodyform$bodyformbuff.desc=Treenighetens kroppsform ger dig för närvarande kraften hos en förtrollning eller glyf, som om du hade den utrustad på ditt nuvarande vapen eller din nuvarande rustning.\n\nKroppsformen kan inte ge ytterligare en kopia av en effekt som du redan påverkas av.\n\nNuvarande effekt: %1$s.\n\nÅterstående turer: %2$s.

actors.hero.spells.cleanse.name=rena
actors.hero.spells.cleanse.short_desc=Tar bort negativa effekter och ger skydd.
actors.hero.spells.cleanse.desc=Prästen tar bort alla skadliga statuseffekter från sig själv och synliga allierade. När besvärjelsen upphör får alla berörda karaktärer även %1$d turers immunitet mot negativa effekter och %2$d barriär.

actors.hero.spells.clericspell.prompt=Välj ett mål
actors.hero.spells.clericspell.no_target=Det finns inget mål där.
actors.hero.spells.clericspell.invalid_target=Du kan inte välja den platsen som mål.
actors.hero.spells.clericspell.invalid_enemy=Du kan inte rikta in dig på den fienden.
actors.hero.spells.clericspell.charge_cost=Laddningskostnad: %d

actors.hero.spells.divinesense.name=gudomlig känsla
actors.hero.spells.divinesense.short_desc=Ger tillfällig tankesyn inom ett stort område.
actors.hero.spells.divinesense.desc=Prästen fokuserar sina sinnen på omgivningen och får tankesyn med en räckvidd på %d rutor i 50 turer. Besvärjelsen tar ingen tid att kasta.
actors.hero.spells.divinesense$divinesensetracker.name=gudomlig känsla
actors.hero.spells.divinesense$divinesensetracker.desc=Denna karaktär kan tillfälligt se andra varelser i närheten med sitt sinne!\n\nÅterstående turer: %s.

actors.hero.spells.divineintervention.name=gudomligt ingripande
actors.hero.spells.divineintervention.short_desc=Ger prästen och allierade en kraftig sköldförstärkning.
actors.hero.spells.divineintervention.desc=Prästen häller en enorm mängd kraft från sin bok över sig själv och sina allierade, vilket ger alla %1$d skydd och förlänger upphöjd form med %2$d turer. Besvärjelsens otroliga försvarskraft vägs mot dess mycket höga laddningskostnad.\n\nPrecis som annat skydd från upphöjd form avtar detta skydd inte normalt, men upphör genast när upphöjd form upphör.

actors.hero.spells.flash.name=blixt
actors.hero.spells.flash.prompt=Välj en plats
actors.hero.spells.flash.short_desc=Teleportera till en närliggande plats.
actors.hero.spells.flash.desc=Prästen kanaliserar sin upphöjda form till en närliggande plats och teleporterar dit. Blixt kan teleportera prästen till vilken upptäckt, ledig plats som helst inom räckvidden. Besvärjelsen kostar fler bokladdningar varje gång den används i samma upphöjda form.

actors.hero.spells.guidinglight.name=vägledande ljus
actors.hero.spells.guidinglight.short_desc=Orsakar magisk skada på avstånd och garanterar träff.
actors.hero.spells.guidinglight.desc=Prästen avfyrar en magisk energistråle som träffar ett mål, orsakar 2-8 skada och lyser upp det. Nästa obehindrade fysiska attack mot en upplyst fiende träffar garanterat.
actors.hero.spells.guidinglight.desc_priest=_Den här besvärjelsen är kraftfullare när den kastas av prästen._ Första gången besvärjelsen kastas under varje 50-turersperiod kostar den inga bokladdningar. Upplysning förbrukas av strålglans, trollstavar, andra karaktärer och artefakter som direkt påverkar fiender. När upplysning används på detta sätt orsakar den magisk bonusskada motsvarande prästens nivå + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=vägledande ljus
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Prästen kan använda vägledande ljus gratis igen efter 50 turer.\n\nÅterstående turer: %s.
actors.hero.spells.guidinglight$illuminated.name=upplyst
actors.hero.spells.guidinglight$illuminated.desc=Den här karaktären lyser efter att ha träffats av vägledande ljus. Ljuset är inte tillräckligt starkt för att lysa upp omgivningen, men den magiska effekten gör det mycket lättare för prästen att träffa karaktären.
actors.hero.spells.guidinglight$illuminated.desc_priest=Prästen kan dessutom förbruka upplysning med strålglans, en trollstavsstråle, en allierads attack eller effekter från vissa artefakter. När upplysning används på detta sätt orsakar den magisk bonusskada motsvarande prästens nivå + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Andra hjältar kan fortfarande använda upplysning för att dra nytta av talangen brännande ljus, men får ingen ökad träffsäkerhet.

actors.hero.spells.hallowedground.name=helgad mark
actors.hero.spells.hallowedground.prompt=Välj en plats
actors.hero.spells.hallowedground.short_desc=Läker allierade, saktar ned fiender och sprider gräs inom ett område.
actors.hero.spells.hallowedground.desc=Prästen fokuserar sin gudomliga magi på marken i närheten och skapar ett %1$dx%1$d stort område med helgad mark i 20 turer.\n\nNär den kastas läker besvärjelsen alla allierade med 15 HP. Friska allierade och prästen får skydd, fiender rotas kortvarigt och kort gräs sprids.\n\nDen helgade marken läker allierade med 1 HP per tur. Friska allierade och prästen får skydd, fiender förlamas och högt gräs växer slumpmässigt.\n\nHelgad mark förstörs av eld och ger upphov till fårat gräs om passiva regenereringseffekter är inaktiverade eller prästen inte har fått erfarenhet på ett tag.
actors.hero.spells.hallowedground$hallowedterrain.desc=Marken har helgats här. Helgad mark saktar ned fiender, läker allierade och får gräs att sprida sig.

actors.hero.spells.holyintuition.name=helig intuition
actors.hero.spells.holyintuition.prompt=Välj ett föremål
actors.hero.spells.holyintuition.cursed=Du känner av ond magi i detta föremål.
actors.hero.spells.holyintuition.uncursed=Det här föremålet är fritt från ond magi.
actors.hero.spells.holyintuition.short_desc=Identifierar om ett föremål är förbannat.
actors.hero.spells.holyintuition.desc=Prästen fokuserar sina sinnen på ett föremål och avgör om det är förbannat eller inte utan att behöva utrusta sig med det.

actors.hero.spells.holylance.name=helig lans
actors.hero.spells.holylance.short_desc=Orsakar kraftig magisk skada på avstånd.
actors.hero.spells.holylance.desc=Prästen koncentrerar en stor mängd energi till en förödande kastad lans av ljus. Lansen orsakar %1$d–%2$d skada och orsakar alltid maximal skada på odöda och demoniska mål.\n\nBesvärjelsen är mycket dyr och har en nedkylningstid på 30 turer.
actors.hero.spells.holylance$lancecooldown.name=nedkylning för helig lans
actors.hero.spells.holylance$lancecooldown.desc=Prästen har nyligen kastat Helig lans och måste vänta innan han kan använda den igen.\n\nÅterstående turer: %s.

actors.hero.spells.holyward.name=heligt beskydd
actors.hero.spells.holyward.glyph_name=%s av ljus
actors.hero.spells.holyward.glyph_desc=Denna glyf ökar något mängden skada som rustningen kan blockera.
actors.hero.spells.holyward.short_desc=Åsidosätter tillfälligt glyfer för att öka rustningens blockeringsförmåga.
actors.hero.spells.holyward.desc=Prästen förser sin burna rustning med en glyf av heligt ljus, vilket ökar rustningens skadeblockering med 1. Besvärjelsen tar ingen tid att kasta.\n\nGlyfen varar i 50 turer och åsidosätter under tiden alla fördelaktiga glyfer som rustningen har. Prästen drar nytta av effekten även utan rustning.
actors.hero.spells.holyward.desc_paladin=_Den här besvärjelsen är kraftfullare när den kastas av paladinen._ Den extra skadeblockeringen ökar till 3. Besvärjelsen åsidosätter inte längre befintliga glyfer och andra besvärjelser som kastas medan heligt beskydd är aktivt förlänger varaktigheten med 10 turer per använd laddning.
actors.hero.spells.holyward$holyarmbuff.name=heligt beskydd
actors.hero.spells.holyward$holyarmbuff.desc=Prästen har försett sin burna rustning med helig energi, vilket tillfälligt åsidosätter befintliga glyfer och gör att rustningen blockerar ytterligare 1 skadepoäng.\n\nÅterstående turer: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Paladinen har försett sin burna rustning med helig energi, vilket gör att rustningen blockerar ytterligare 3 skadepoäng.\n\nAndra besvärjelser som kastas medan heligt beskydd är aktivt förlänger varaktigheten med 10 turer per förbrukad laddning.\n\nÅterstående turer: %s.

actors.hero.spells.holyweapon.name=heligt vapen
actors.hero.spells.holyweapon.ench_name=helig %s
actors.hero.spells.holyweapon.ench_desc=Fiender som träffas av ett heligt vapen får extra magisk skada.
actors.hero.spells.holyweapon.short_desc=Åsidosätter tillfälligt förtrollningar för att öka skadan.
actors.hero.spells.holyweapon.desc=Prästen förtrollar sitt vapen med helig energi, vilket gör att vapnet orsakar 2 extra magiska skador varje gång det träffar en fiende. Denna besvärjelse tar ingen tid att kasta.\n\nDenna förtrollning varar i 50 turer och åsidosätter alla fördelaktiga förtrollningar som vapnet har under den tiden. Obeväpnade attacker kan också dra nytta av denna effekt.
actors.hero.spells.holyweapon.desc_paladin=_Den här besvärjelsen är kraftfullare när den kastas av paladinen._ Den extra magiska skadan ökar till 6. Besvärjelsen åsidosätter inte längre befintliga förtrollningar och andra besvärjelser som kastas medan heligt vapen är aktivt förlänger varaktigheten med 10 turer per använd laddning.
actors.hero.spells.holyweapon$holywepbuff.name=heligt vapen
actors.hero.spells.holyweapon$holywepbuff.desc=Prästen har ingjutit helig energi i sitt vapen, vilket tillfälligt åsidosätter alla befintliga förtrollningar och gör att vapnet orsakar 2 extra magiska skador vid varje attack.\n\nÅterstående turer: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Paladinen har ingjutit helig energi i sitt burna vapen, vilket gör att attackerna orsakar ytterligare 6 magisk skada.\n\nAndra besvärjelser som kastas medan heligt vapen är aktivt förlänger varaktigheten med 10 turer per förbrukad laddning.\n\nÅterstående turer: %s.

actors.hero.spells.judgement.name=dom
actors.hero.spells.judgement.short_desc=Skadar alla synliga fiender.
actors.hero.spells.judgement.desc=Prästen slår näven i marken och orsakar en ljusexplosion som skadar alla synliga fiender. Den orsakar %1$d–%2$d grundskada samt ytterligare 33 %% skada för varje besvärjelse som prästen har kastat sedan upphöjd form inleddes, eller sedan Dom senast kastades.\n\nDom orsakar för närvarande %3$d–%4$d skada.

actors.hero.spells.layonhands.name=handpåläggning
actors.hero.spells.layonhands.short_desc=Läker omedelbart en intilliggande karaktär eller skyddar paladinen.
actors.hero.spells.layonhands.desc=Paladinen kanaliserar helig energi genom händerna och läker eller skyddar det som berörs.\n\nPaladinen kan kasta besvärjelsen på en intilliggande karaktär för att ge den %1$d läkning eller på sig själv för att få %1$d skydd. Överflödig läkning omvandlas till skydd.\n\nBesvärjelsen kastas omedelbart och kan kastas upprepade gånger, men kan inte ge mer skydd än tre kast åt gången.

actors.hero.spells.lifelinkspell.name=livslänk
actors.hero.spells.lifelinkspell.short_desc=Delar skada med en allierad och minskar skadan som den tar.
actors.hero.spells.lifelinkspell.desc=Prästen stärker bandet mellan sig själv och sin förstärkta allierade. Med det förstärkta bandet delas all skada mellan hjälten och den allierade i %1$d turer och mångas krafts defensiva förstärkning ökar till -%2$d %% mottagen skada. Skadan delas efter rustning men före mångas krafts skadereduktion.\n\nMedan effekten är aktiv tillämpas fördelaktiga prästbesvärjelser på nivå T3 eller lägre på både prästen och den allierade om de annars bara hade tillämpats på en av dem.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=livslänkskydd
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Prästen har nyligen kastat livslänk på den här allierade.\n\nUtöver livslänkens vanliga fördelar tar karaktären mindre skada. Alla positiva prästbesvärjelser tillämpas på både prästen och den allierade i stället för bara en av dem, och mångas kraft upphör inte medan förstärkningen är aktiv.\n\nÅterstående turer: %s.

actors.hero.spells.mindform.name=sinnesform
actors.hero.spells.mindform.short_desc=Tilldelar Treenigheten en trollstav eller ett kastvapen.
actors.hero.spells.mindform.desc=Prästen väljer en trollstav eller ett kastvapen som hen har identifierat under den här omgången och förser Treenigheten med dess effekt.\n\nNär Treenigheten används kan prästen göra en enda attack som om det valda föremålet användes med +%d. Det utlöser alla effekter som normalt utlöses av den typen av föremål.\n\nBesvärjelsen ersätter alla andra sinneffekter som Treenigheten för närvarande är försedd med.

actors.hero.spells.mnemonicprayer.name=minnesbön
actors.hero.spells.mnemonicprayer.short_desc=Förlänger positiva eller negativa effekter på en allierad eller fiende och tillämpar upplysning igen.
actors.hero.spells.mnemonicprayer.desc=Prästen uttalar en bön som förlänger varaktigheten för alla positiva eller negativa effekter på ett visst mål med %1$d turer. Besvärjelsen tar ingen tid att kasta. Positiva effekter varar längre på allierade, även prästen själv, och skadliga effekter varar längre på fiender.\n\nMinnesbön kan bara förlänga en viss instans av en positiv eller negativ effekt en gång och kan inte förlänga effekter som ges av rustningsförmågor.

actors.hero.spells.radiance.name=strålglans
actors.hero.spells.radiance.short_desc=Belyser och bedövar synliga fiender kortvarigt.
actors.hero.spells.radiance.desc=Prästen utstrålar heligt ljus och bedövar alla synliga fiender i tre turer. Om en fiende redan är upplyst utlöser strålglans upplysningens bonusskada och tillämpar sedan den negativa effekten upplysning. Strålglans får också prästen att lysa i 100 turer om den aktuella våningen är mörk.

actors.hero.spells.recallinscription.name=återkalla inskription
actors.hero.spells.recallinscription.short_desc=Upprepar en nyligen använd runsten eller skriftrulle.
actors.hero.spells.recallinscription.desc=Prästen använder helig magi för att kasta om effekten av en magisk runa på en runsten eller skriftrulle som hen har använt under de senaste %s turerna.\n\nÅterkalla inskription kan inte användas för att kopiera skriftrullar med uppgradering. Laddningskostnaden varierar beroende på vilket föremål som användes senast: 2 för en runsten, 3 för en skriftrulle och 4 för en exotisk skriftrulle. Laddningskostnaden fördubblas också när en skriftrulle med transmutation eller alkemiföremål som måste tillverkas med transmutation eller uppgradering kopieras.
actors.hero.spells.recallinscription$useditemtracker.name=nyligen använd runa
actors.hero.spells.recallinscription$useditemtracker.desc=Prästen har nyligen använt ett föremål som fungerar med den inskrivna återkallningsbesvärjelsen. Prästen kan kasta besvärjelsen för att upprepa föremålets effekt.\n\nAnvänt föremål: %1$s.\n\nÅterstående turer: %2$s.

actors.hero.spells.shieldoflight.name=ljussköld
actors.hero.spells.shieldoflight.short_desc=Ger tillfälligt rustningsskydd mot en fiende.
actors.hero.spells.shieldoflight.desc=Prästen skapar en tunn ljusbarriär mellan sig själv och en fiende som ökar rustningens blockeringsförmåga mot den fienden med %1$d–%2$d i fem turer.\n\nBesvärjelsen tar ingen tid att kasta men kan inte användas mot flera mål samtidigt.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=ljussköld
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=En tunn ljussköld står mellan den här karaktären och en fiende. Den är inte tillräckligt stark för att helt blockera attacker men dämpar dem.\n\nÅterstående turer: %s

actors.hero.spells.spiritform.name=andeform
actors.hero.spells.spiritform.short_desc=Tilldelar Treenigheten en ring eller artefakt.
actors.hero.spells.spiritform.desc=Prästen väljer en ring eller artefakt, utom den heliga boken, som hen har identifierat under den här omgången och förser Treenigheten med dess effekt.\n\nOm en ring väljs ger Treenigheten ringens effekt med +%1$d i 20 turer.\n\nOm en artefakt väljs kopierar Treenigheten artefaktens effekt med +%2$d. Varje artefakt har olika särskilda beteenden och laddningskostnader för rustning när den används med Treenigheten.\n\nBesvärjelsen ersätter alla andra andeeffekter som Treenigheten för närvarande är försedd med.
actors.hero.spells.spiritform$spiritformbuff.name=andeform
actors.hero.spells.spiritform$spiritformbuff.desc=Treenighetens andeform ger dig för närvarande kraften hos ett föremål, som om du hade det utrustat.\n\nAndeformen kan inte ge ytterligare en kopia av en effekt som du redan påverkas av.\n\nNuvarande effekt: %1$s.\n\nÅterstående turer: %2$s.

actors.hero.spells.smite.name=smita
actors.hero.spells.smite.short_desc=Garanterar en träff med bonusskada och förtrollningskraft.
actors.hero.spells.smite.desc=Paladinen genomsyrar en närstridsattack med rättfärdig förstörelsekraft.\n\nUtöver normal närstridsskada gör Smita att obehindrade attacker alltid träffar, har +300 %% förtrollningsstyrka och orsakar %1$d–%2$d magisk bonusskada.\n\nSmitas magiska bonusskada skalar med paladinens nivå och orsakar alltid maximal bonusskada mot odöda eller demoniska fiender.

actors.hero.spells.stasis.name=stasis
actors.hero.spells.stasis.short_desc=Tar bort och bevarar en allierad i fängelsehålan.
actors.hero.spells.stasis.desc=Prästen riktar förbindelsen med sin allierade mot sig själv, vilket gör att allieraden tillfälligt hålls i en sorts energistillestånd inom prästen. Allieraden bevaras i upp till %d turer och alla positiva effekter på den påverkas inte av tiden i stasis.\n\nAllieraden dyker upp bredvid prästen när stasis upphör naturligt. Prästen kan också kasta om besvärjelsen utan kostnad för att avsluta effekten i förtid. Stasis kan även flytta orörliga allierade men inte flytta dem mellan våningar.
actors.hero.spells.stasis$stasisbuff.name=allierad i stasis
actors.hero.spells.stasis$stasisbuff.left_behind=Din orörliga allierade blir kvar.
actors.hero.spells.stasis$stasisbuff.desc=Prästen har för närvarande en allierad lagrad i stasis. Alla positiva effekter på den allierade bevaras, även mångas kraft, och den dyker upp bredvid prästen när effekten upphör. Effekten kan även avslutas i förtid genom att stasis kastas igen.\n\nAllierad i stasis: %1$s.\nÅterstående turer: %2$s.

actors.hero.spells.sunray.name=solstråle
actors.hero.spells.sunray.short_desc=Orsakar magisk skada på avstånd och bländar ett mål en gång.
actors.hero.spells.sunray.desc=Prästen avfyrar en bländande ljusstråle mot ett mål som orsakar %1$d–%2$d skada och bländar målet i %3$d turer. Solstråle orsakar alltid maximal skada på odöda och demoniska mål.\n\nNär en fiende träffats av besvärjelsen anpassas synen, vilket hindrar den från att bländas av den igen. Träffas den igen medan den är bländad av besvärjelsen blir ljuset dock överväldigande och förlamar den i stället.

actors.hero.spells.walloflight.name=ljusvägg
actors.hero.spells.walloflight.short_desc=Skapar en vägg som blockerar fiender.
actors.hero.spells.walloflight.desc=Paladinen skapar en vägg av solida ljuspaneler direkt framför sig. Den är en ruta tjock, %1$d rutor bred och varar i 20 turer.\n\nVäggen fungerar som en vanlig vägg men går att se igenom. Fiender som fångas i väggen när den skapas blir kortvarigt bedövade och knuffas tillbaka om möjligt. Allt som fastnar i väggen kan röra sig ut ur den.\n\nVäggen kan kastas i någon av de fyra huvudriktningarna eller fyra diagonala riktningarna. Om en vägg redan är aktiv kan besvärjelsen kastas igen utan kostnad för att genast ta bort väggen.
actors.hero.spells.walloflight.early_end=Du upplöser ljusväggen.
actors.hero.spells.walloflight$lightwall.desc=Skinnande ljuspaneler blockerar passagen här.

##main hero
actors.hero.hero.name=du
actors.hero.hero.leave=Du kan inte gå ännu, resten av fängelsehålan väntar nedanför!
actors.hero.hero.level_up=Nivåhöjning!
actors.hero.hero.new_level=Nivåhöjning! +träffsäkerhet, +undvikande, +5 HP!
actors.hero.hero.new_talent=+1 talangpoäng!
actors.hero.hero.unspent=Du har talangpoäng att spendera!
actors.hero.hero.level_cap=Du kan inte bli starkare, men dina erfarenheter ger dig en kraftökning!
actors.hero.hero.you_now_have=Du plockade upp: %s.
actors.hero.hero.you_cant_have=Du kan inte bära: %s.
actors.hero.hero.locked_chest=Denna kista är låst och du har inte en nyckel som passar.
actors.hero.hero.locked_door=Du har ingen nyckel som passar.
actors.hero.hero.noticed_smth=Du märkte något.
actors.hero.hero.wait=…
actors.hero.hero.search=sök
actors.hero.hero.search_distracted=Det är svårt att koncentrera sig, sökandet är utmattande.
actors.hero.hero.key_distracted=Du kan inte riktigt få upp låset, du måste fortsätta försöka.
actors.hero.hero.pain_resist=Smärtan hjälper dig att motstå sömnen.
actors.hero.hero.revive=Ankhen exploderar med livgivande energi!

##classes
actors.hero.heroclass.warrior=krigare
actors.hero.heroclass.warrior_desc_short=Krigaren tål extra skada genom skyddet från sitt _brutna sigill._ Sigillet kan flyttas mellan rustningar och _överför en enda uppgradering._
actors.hero.heroclass.warrior_desc=Krigaren börjar med ett _unikt brutet sigill_ som ger en omgång skydd när hälsan är under hälften. Sigillet kan flyttas mellan rustningar och _överföra en enda uppgradering_ tillsammans med sig.\n\nKrigaren börjar också med ett _slitet kortsvärd_, _tre kaststenar_, tygrustning, en vattensäck och en sammetspåse.\n\nKrigaren identifierar automatiskt:\n_-_ Identifieringsskriftrullar\n_-_ Läkningsdrycker\n_-_ Raseriskriftrullar
actors.hero.heroclass.warrior_unlock=Krigaren är automatiskt upplåst.

actors.hero.heroclass.mage=magiker
actors.hero.heroclass.mage_desc_short=Magikern är en expert på arkana krafter och bär en _magisk stav_ som är kraftfullare än en trollstav. Staven kan _förses med vilken trollstav som helst_ som magikern hittar.
actors.hero.heroclass.mage_desc=Magikern börjar med en _unik stav_ som laddas avsevärt snabbare än en trollstav och har en laddning mer. Staven _kan förses med vilken trollstav som helst_ som magikern hittar i fängelsehålan.\n\nMagikern börjar också med en _trollstav med magisk missil_ infogad i staven, tygrustning, en vattensäck och en sammetspåse.\n\nMagikern identifierar automatiskt:\n_-_ Identifieringsskriftrullar\n_-_ Drycker med flytande eld\n_-_ Uppgraderingsskriftrullar
actors.hero.heroclass.mage_unlock=_Använd en uppgraderingsskriftrulle för att göra ett föremål starkare_ så låser du upp Magikern.

actors.hero.heroclass.rogue=skurk
actors.hero.heroclass.rogue_desc_short=Skurken kan undvika fiender och slå till från osynlighet med hjälp av sin _skuggmantel._ Han kan också _upptäcka hemligheter och fällor_ på längre avstånd.
actors.hero.heroclass.rogue_desc=Skurken börjar med en _unik skuggmantel_ som kan användas för att bli osynlig när som helst.\n\nSkurken kan _upptäcka hemligheter och fällor_ på längre avstånd.\n\nSkurken börjar också med _en dolk_, _tre kastknivar_, tygrustning, en vattensäck och en sammetspåse.\n\nSkurken identifierar automatiskt:\n_-_ Identifieringsskriftrullar\n_-_ Osynlighetsdrycker\n_-_ Magiska kartskriftrullar
actors.hero.heroclass.rogue_unlock=_Genomför 10 överraskningsattacker under ett spel_ för att låsa upp Skurken.

actors.hero.heroclass.huntress=jägare
actors.hero.heroclass.huntress_desc_short=Jägaren är en mästare på kastvapen och har en _magisk båge_ med oändligt många pilar. Hon kan också springa genom högt gräs _utan att trampa ner det._
actors.hero.heroclass.huntress_desc=Jägaren börjar med en _unik andebåge_ som kan avfyra ett obegränsat antal frammanade pilar.\n\nJägaren kan röra sig genom högt gräs _utan att trampa ned det_.\n\nJägaren börjar också med _spikförsedda handskar_, tygrustning, en vattensäck och en sammetspåse.\n\nJägaren identifierar automatiskt:\n_-_ Identifieringsskriftrullar\n_-_ Drycker med tankesyn\n_-_ Vaggviseskriftrullar
actors.hero.heroclass.huntress_unlock=Lås upp Jägaren genom att _träffa fiender med kastvapen 10 gånger under ett spel._

actors.hero.heroclass.duelist=duellanten
actors.hero.heroclass.duelist_desc_short=Duellanten är en vapenmästare som kan använda sitt vapen för att utlösa en _särskild vapenförmåga._ Den särskilda förmågan är _olika för varje vapen._
actors.hero.heroclass.duelist_desc=Duellanten börjar med en _unik värja_ med en särskild förmåga som laddas över tid.\n\nVarje vapen i spelet har en _egen särskild förmåga_ som duellanten kan använda.\n\nDuellanten börjar också med _två kastspikar_, tygrustning, en vattensäck och en sammetspåse.\n\nDuellanten identifierar automatiskt:\n_-_ Identifieringsskriftrullar\n_-_ Styrkedrycker\n_-_ Spegelbildsskriftrullar
actors.hero.heroclass.duelist_unlock=Lås upp Duellanten genom att _utrusta ett vapen av nivå 2 eller högre utan styrkestraf._

actors.hero.heroclass.cleric=präst
actors.hero.heroclass.cleric_desc_short=Prästen är en gudomlig trollkarl som använder sin unika _heliga bok_ för att kanalisera gudomlig magi. Prästen kan _lära sig och uppgradera trollformler_ genom talanger.
actors.hero.heroclass.cleric_desc=Prästen börjar med en _unik helig bok_ som kan användas för att kasta olika trollformler.\n\nDe flesta av prästens talanger är inriktade på att lära sig eller uppgradera trollformler.\n\nPrästen börjar också med _en klubba_, tygrustning, en vattensäck och en sammetspåse.\n\nPrästen identifierar automatiskt:\n_-_ Identifieringsskriftrullar\n_-_ Renhetsdrycker\n_-_ Skriftrullar med ta bort förbannelse
actors.hero.heroclass.cleric_unlock=Lås upp prästen genom att _helt rena förbannelsen från någon förbannad utrustningsdel._

actors.hero.herosubclass.berserker=bärsärk
actors.hero.herosubclass.berserker_short_desc=_Bärsärkaren_ bygger upp raseri när hen tar skada. Raseri ökar skadan och kan aktiveras vid 100 % för extra skydd.
actors.hero.herosubclass.berserker_desc=Bärsärkaren får raseri när hen tar fysisk skada, även skada som blockeras av rustningen! Raseriet avtar gradvis med tiden men långsammare vid låg HP.\n\nRaseri kan göra att bärsärkaren orsakar upp till +50 % skada. Vid maximalt raseri kan hen gå bärsärk och få en omgång skydd samt behålla raseriet så länge skydd finns kvar. Skyddet skalar med bärsärkarens rustningsnivå och kan förstärkas kraftigt vid låg hälsa. Bärsärkaren behöver tid att återhämta sig efter att ha gått bärsärk.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_short_desc=Gladiatorn bygger upp kombinationer med lyckade attacker. Kombinationer kan användas för unika förmågor.
actors.hero.herosubclass.gladiator_desc=Gladiatorn bygger upp en kombinationspoäng varje gång hen lyckas med en attack med närstridsvapen eller kastvapen. Om gladiatorn inte lyckas med en attack inom 5 turer, eller 15 turer efter en dödad fiende, återställs kombinationen.\n\nNär kombinationen byggs upp kan gladiatorn använda flera förmågor som alltid träffar:\n2 kombinationer: knuffa tillbaka fienden, behåller kombinationen\n4 kombinationer: orsaka skada baserad på rustningen\n6 kombinationer: parera, behåller kombinationen\n8 kombinationer: skada målet och närliggande fiender\n10 kombinationer: attackera en gång för varje kombination
actors.hero.herosubclass.battlemage=stridsmagiker
actors.hero.herosubclass.battlemage_short_desc=_Stridsmagikern_ frammanar bonuseffekter vid närstrid med sin stav. Effekterna beror på vilken trollstav staven är försedd med.
actors.hero.herosubclass.battlemage_desc=Stridsmagikern får en bonuseffekt varje gång hen träffar i närstrid med staven, som om staven hade en extra förtrollning. Effekterna beror på trollstaven som staven är försedd med, eftersom varje trollstav har sin egen effekt. Utöver trollstavseffekterna får stridsmagikerns stav även 0,5 laddningar när hen träffar med den.
actors.hero.herosubclass.warlock=häxmästare
actors.hero.herosubclass.warlock_short_desc=_Häxmästaren_ har en chans att själmärka fiender med sina trollstavar. Han helas närhelst han gör fysisk skada till märkta fiender.
actors.hero.herosubclass.warlock_desc=Häxmästaren kan tillfoga karaktärer ett själsmärke när hen använder trollstavar på dem. Chansen att tillfoga ett själsmärke och märkets varaktighet ökar med trollstavens nivå.\n\nNär en fiende är själsmärkt läker häxmästaren 2 HP för varje 5 skada hen orsakar fienden, men bara med närstridsvapen eller kastvapen, inte trollstavar!
actors.hero.herosubclass.assassin=lönnmördare
actors.hero.herosubclass.assassin_short_desc=_Lönnmördaren_ kan förbereda ett dödligt slag medan hen är osynlig. Ju längre hen väntar, desto kraftfullare blir attacken.
actors.hero.herosubclass.assassin_desc=Lönnmördaren förbereder nästa slag när hen blir osynlig. Ju längre förberedelsen pågår, desto kraftfullare blir nästa attack. Förberedelsen kan pågå i upp till 9 turer.\n\nEfter förberedelsen orsakar lönnmördaren bonusskada med nästa attack, kan blinka till målet och kan även döda tillräckligt svaga fiender omedelbart.
actors.hero.herosubclass.freerunner=frilöpare
actors.hero.herosubclass.freerunner_short_desc=_Frilöparen_ bygger upp momentum genom att springa, vilket kan användas för att börja frilöpa. Det ger extra hastighet och undvikande under en kort stund.
actors.hero.herosubclass.freerunner_desc=När frilöparen rör sig bygger hen upp momentum. Hen kan få upp till 10 momentum efter att ha sprungit i 10 turer men förlorar det snabbt om hen slutar röra sig. Frilöparen kan förbruka momentum för att börja frilöpa i 2 turer per momentumpunkt.\n\nNär frilöparen frilöper rör hen sig med dubbla hastigheten och får extra undvikande i förhållande till sin nivå. När frilöpningen upphör finns en nedkylning innan momentum kan byggas upp igen.
actors.hero.herosubclass.sniper=skytt
actors.hero.herosubclass.sniper_short_desc=Skytten kan genomtränga rustning med sina avståndsattacker. Hon kan även följa upp med en speciell attack från sin pilbåge efter en träff med kastvapen.
actors.hero.herosubclass.sniper_desc=Skytten är en mästare på distansstrid vars distansattacker tränger igenom fienders rustning. När hon attackerar en fiende med ett kastvapen sätter hon ett prickskyttemärke på den, vilket låter henne följa upp med en särskild attack från bågen. Den särskilda attacken varierar beroende på hur bågen är förstärkt.\n\nEn oförstärkt båge avfyrar ett ögonblicksskott som orsakar mindre skada men avfyras omedelbart. En hastighetsbåge avfyrar en salva med tre pilar som orsakar mindre skada, fortfarande kan aktivera förtrollningar och tar en tur att avfyra. En skadebåge avfyrar ett prickskytteskott som alltid träffar, orsakar bonusskada baserat på avståndet och tar två turer att avfyra.
actors.hero.herosubclass.warden=väktare
actors.hero.herosubclass.warden_short_desc=_Väktaren_ kan se genom högt gräs och får bonuseffekter när hon planterar frön och trampar ner växter.
actors.hero.herosubclass.warden_desc=Väktaren har en stark koppling till naturen som ger flera bonuseffekter kopplade till gräs och växter. Hon kan se genom högt och fårat gräs som om det vore tomt utrymme.\n\nVäktaren får gräs att gro runt alla frön som hon kastar eller planterar och får särskilda effekter när hon trampar på växter. De särskilda effekterna ersätter växternas vanliga effekter, vilket innebär att ingen växt skadar henne när hon trampar på den.
actors.hero.herosubclass.champion=kämpe
actors.hero.herosubclass.champion_short_desc=_Kämpen_ kan använda två vapen och får fler vapenladdningar. De vanliga attackerna använder huvudvapnet, men hon kan byta vapen och använda båda vapenförmågorna.
actors.hero.herosubclass.champion_desc=Kämpen är en mästare på närstridsvapen och kan utrusta ett sekundärt vapen utöver huvudvapnet. De vanliga attackerna använder huvudvapnet, men hon kan byta huvudvapen omedelbart och använda båda vapenförmågorna.\n\nHon får dessutom två extra maximala laddningar för vapenförmågor och +50 % snabbare uppladdning av vapenförmågor.
actors.hero.herosubclass.monk=munk
actors.hero.herosubclass.monk_short_desc=_Munken_ samlar energi under strid. Denna energi kan användas till en rad olika unika förmågor.
actors.hero.herosubclass.monk_desc=Munken är en mästare på fysisk teknik. När hon besegrar fiender får hon energi som kan användas för flera defensiva förmågor och verktygsförmågor. Energin avtar inte med tiden, men har ett tak som beror på munkens nivå.\n\n1 energi: slå snabbt med nävarna\n2 energi: fokusera för att undvika nästa attack\n3 energi: rusa omedelbart till en närliggande ruta\n4 energi: sparka bort en fiende\n5 energi: meditera för att ta bort statuseffekter och återställa trollstavs- och artefaktladdningar
actors.hero.herosubclass.priest=präst
actors.hero.herosubclass.priest_short_desc=Prästen får nya långdistansbesvärjelser och en förstärkt version av vägledande ljus.
actors.hero.herosubclass.priest_desc=Prästen får flera nya och uppgraderade trollformler som betonar distansstrid och samverkan med magiska föremål.\n\nPrästen kan kasta _vägledande ljus_ utan kostnad en gång var 50:e tur, lysa upp fiender som är direkt mål för någon av trollformlerna och förbruka den negativa effekten upplysning med allierade, trollstavar och vissa artefakter för bonusskada motsvarande nivån + 5.\n\nPrästen får också besvärjelsen _strålglans_, som skingrar mörker och påverkar alla synliga fiender genom att utlösa och tillämpa upplysning samt kortvarigt bedöva dem till en kostnad av två laddningar.
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_short_desc=Paladinen får nya kortdistansbesvärjelser och förstärkta versioner av heliga vapen och skydd.
actors.hero.herosubclass.paladin_desc=Paladinen får flera nya och uppgraderade trollformler som betonar närstrid och samverkan med vapen och rustning.\n\nPaladinens besvärjelser _heligt vapen_ och _heligt beskydd_ ger större bonusar, åsidosätter inte längre befintliga förtrollningar och glyfer samt kan förlängas genom att kasta andra besvärjelser.\n\nPaladinen får också besvärjelsen _Smita_, som låter henne utföra en garanterad närstridsträff med bonusskada och förtrollningsstyrka.

##talents
actors.hero.talent$provokedangertracker.name=framkallat raseri
actors.hero.talent$provokedangertracker.desc=Krigaren har nyligen förlorat sitt skydd, hans nästa fysiska attack kommer att orsaka bonusskada.\n\nÅterstående turer: %s.
actors.hero.talent$lingeringmagictracker.name=kvarvarande magi
actors.hero.talent$lingeringmagictracker.desc=Magikern har nyligen använt en stav eller trollstav. Nästa fysiska attack orsakar bonusskada.\n\nÅterstående turer: %s.
actors.hero.talent$followupstriketracker.name=uppföljande slag
actors.hero.talent$followupstriketracker.desc=Jägaren har nyligen attackerat en fiende med ett kastvapen. Nästa närstridsattack mot samma mål orsakar ökad skada.\n\nÅterstående turer: %s.
actors.hero.talent$patientstriketracker.name=tålmodigt slag
actors.hero.talent$patientstriketracker.desc=Duellanten har just väntat en tur. Nästa närstridsattack orsakar bonusskada.
actors.hero.talent$improvisedprojectilecooldown.name=nedkylning för improviserade projektiler
actors.hero.talent$improvisedprojectilecooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=nedkylning för återhämtande steg
actors.hero.talent$rejuvenatingstepscooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$seershotcooldown.name=nedkylning för siarskott
actors.hero.talent$seershotcooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$aggressivebarriercooldown.name=nedkylning för aggressiv barriär
actors.hero.talent$aggressivebarriercooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$liquidagilacctracker.name=flytande smidighet
actors.hero.talent$liquidagilacctracker.desc=Duellantens nästa vanliga närstridsattack får bonus i träffsäkerhet.\n\nÅterstående turer: %s.
actors.hero.talent$lethalhastecooldown.name=nedkylning för dödlig hast
actors.hero.talent$lethalhastecooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$swiftequipcooldown.name=nedkylning för snabb utrustning
actors.hero.talent$swiftequipcooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.
actors.hero.talent$preciseassaulttracker.name=precis attack
actors.hero.talent$preciseassaulttracker.desc=Duellantens nästa vanliga närstridsattack får bonus i träffsäkerhet.\n\nÅterstående turer: %s.
actors.hero.talent$deadlyfollowuptracker.name=dödlig uppföljning
actors.hero.talent$deadlyfollowuptracker.desc=Duellanten har nyligen attackerat en fiende med ett kastvapen. Närstridsattacker mot samma mål orsakar ökad skada.\n\nÅterstående turer: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=avrättad
actors.hero.talent$satiatedspellstracker.name=Skyddande besvärjelse
actors.hero.talent$satiatedspellstracker.desc=Nästa besvärjelse som prästen kastar ger prästen en liten mängd skydd.
actors.hero.talent$searinglightcooldown.name=brännande ljus
actors.hero.talent$searinglightcooldown.desc=Du har nyligen använt denna talang och måste vänta innan du kan använda den igen.\n\nÅterstående turer: %s.

#warrior
actors.hero.talent.hearty_meal.title=mättande måltid
actors.hero.talent.hearty_meal.desc=_+1:_ Att äta mat läker krigaren med _4 HP_ när han har 33 % eller mindre HP kvar.\n\n_+2:_ Att äta mat läker krigaren med _6 HP_ när han har 33 % eller mindre HP kvar.
actors.hero.talent.veterans_intuition.title=veteranens intuition
actors.hero.talent.veterans_intuition.desc=_+1:_ Krigaren identifierar vapen _1,75 gånger snabbare_ och rustningar _2,5 gånger snabbare_.\n\n_+2:_ Krigaren identifierar vapen _2,5 gånger snabbare_ och rustningar _när han utrustar sig med dem_.
actors.hero.talent.provoked_anger.title=framkallat raseri
actors.hero.talent.provoked_anger.desc=_+1:_ När en sköldbuff som applicerats på krigaren bryts av skada, kommer hans nästa fysiska attack att göra _3 bonusskada_.\n\n_+2:_ När en sköldbuff som applicerats på krigaren bryts av skada, kommer hans nästa fysiska attack att göra _5 bonusskada_.
actors.hero.talent.iron_will.title=vilja av stål
actors.hero.talent.iron_will.desc=_+1:_ Skölden som krigarens sigill ger _ökas med 1_.\n\n_+2:_ Skölden som krigarens sigill ger _ökas med 2_.
actors.hero.talent.iron_will.meta_desc=_Om talangen fås av en annan hjälte_ ger den passivt en version av krigarens brutna sigills effekt med 1 eller 2 maximalt skydd.

actors.hero.talent.iron_stomach.title=järnmage
actors.hero.talent.iron_stomach.desc=_+1:_ Att äta tar en tur för krigaren och ger _75 % skaderesistens_ medan hen äter.\n\n_+2:_ Att äta tar en tur för krigaren och ger _100 % skaderesistens_ medan hen äter.
actors.hero.talent.liquid_willpower.title=flytande viljestyrka
actors.hero.talent.liquid_willpower.desc=_+1:_ Krigaren får _6,5 % av sin maximala HP som skydd_ när hen dricker eller kastar en dryck, brygd eller elixir.\n\n_+2:_ Krigaren får _10 % av sin maximala HP som skydd_ när hen dricker eller kastar en dryck, brygd eller elixir.\n\nSkyddsmängden fördubblas när styrke- eller erfarenhetsdrycker används, eller alkemiföremål som måste tillverkas med sådana drycker.\n\nFör alkemiföremål med större utmatningsmängder, till exempel vattenbrygd, har talangen en chans att utlösas beroende på hur många av föremålet som tillverkas.
actors.hero.talent.runic_transference.title=runöverföring
actors.hero.talent.runic_transference.desc=_+1:_ Krigarens brutna sigill kan överföra _vanliga glyfer_ på samma sätt som det överför en uppgradering.\n\n_+2:_ Krigarens brutna sigill kan överföra _vanliga, kraftfulla och förbannade glyfer_ på samma sätt som det överför en uppgradering.\n\nSigillet kan endast överföra glyfer om de var applicerade på rustningen när sigillet fästes.
actors.hero.talent.runic_transference.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att hjälpa glyfer på din rustning att motstå att tas bort av uppgraderingsrullar. Glyfer börjar gå förlorade när du uppgraderar från nivå 6 (upp från 4) vid +1 eller nivå 7 (upp från 4) vid +2. Nivån där glyfer garanterat går förlorade är oförändrad vid +8.
actors.hero.talent.lethal_momentum.title=dödlig drivkraft
actors.hero.talent.lethal_momentum.desc=_+1:_ När krigaren utdelar ett dödande slag med ett fysiskt vapen finns _67 % chans_ att det inte tar någon tur.\n\n_+2:_ När krigaren utdelar ett dödande slag med ett fysiskt vapen finns _100 % chans_ att det inte tar någon tur.
actors.hero.talent.improvised_projectiles.title=improviserade projektiler
actors.hero.talent.improvised_projectiles.desc=_+1:_ Krigaren kan blända en fiende i _2 turer_ genom att kasta ett föremål som inte är ett kastvapen på den. Nedkylningen är 50 turer.\n\n_+2:_ Krigaren kan blända en fiende i _3 turer_ genom att kasta ett föremål som inte är ett kastvapen på den. Nedkylningen är 50 turer.

actors.hero.talent.hold_fast.title=hållfast
actors.hero.talent.hold_fast.desc=_+1:_ När krigaren väntar med sitt sigill utrustat får hen _1-2 rustning_ och bromsar avtagandet av kombinations- och sköldförstärkningar med _50 %_ tills hen rör sig.\n\n_+2:_ När krigaren väntar med sitt sigill utrustat får hen _2-4 rustning_ och bromsar avtagandet av kombinations- och sköldförstärkningar med _75 %_ tills hen rör sig.\n\n_+3:_ När krigaren väntar med sitt sigill utrustat får hen _3-6 rustning_ och bromsar avtagandet av kombinations- och sköldförstärkningar med _100 %_ tills hen rör sig.
actors.hero.talent.hold_fast.meta_desc=_Om denna talang fås av en annan hjälte_ kräver den inte krigarens sigill, men kan inte ge mer rustning än nivån på din utrustade rustning plus dess nivå.
actors.hero.talent.strongman.title=starkman
actors.hero.talent.strongman.desc=_+1:_ Krigarens styrka _ökas med 8 %_, avrundat nedåt.\n\n_+2:_ Krigarens styrka _ökas med 13 %_, avrundat nedåt.\n\n_+3:_ Krigarens styrka _ökas med 18 %_, avrundat nedåt.

actors.hero.talent.endless_rage.title=oändligt raseri
actors.hero.talent.endless_rage.desc=_+1:_ Bärsärkaren kan nå högst _116 % raseri_.\n\n_+2:_ Bärsärkaren kan nå högst _133 % raseri_.\n\n_+3:_ Bärsärkaren kan nå högst _150 % raseri_.\n\nVarje raseripoäng över 100 % ökar skyddet vid bärsärk med 1 % och minskar nedkylningen med 1 %, men ökar inte skadebonusen över +50 %.
actors.hero.talent.deathless_fury.title=dödslöst ursinne
actors.hero.talent.deathless_fury.desc=_+1:_ Bärsärk aktiveras automatiskt om bärsärkaren håller på att dö och raseriet är minst 100 %, men har då en nedkylning på _3 hjältenivåer_.\n\n_+2:_ Bärsärk aktiveras automatiskt om bärsärkaren håller på att dö och raseriet är minst 100 %, men har då en nedkylning på _2 hjältenivåer_.\n\n_+3:_ Bärsärk aktiveras automatiskt om bärsärkaren håller på att dö och raseriet är minst 100 %, men har då en nedkylning på _1 hjältenivå_.\n\nBärsärkaren dör fortfarande om hen har 0 HP när bärsärk upphör.
actors.hero.talent.enraged_catalyst.title=rasande katalysator
actors.hero.talent.enraged_catalyst.desc=_+1:_ Förtrollningar och förbannelser på bärsärkarens vapen utlöses oftare ju mer raseri hen har, som mest _15 % oftare_ vid 100 % raseri.\n\n_+2:_ Förtrollningar och förbannelser på bärsärkarens vapen utlöses oftare ju mer raseri hen har, som mest _30 % oftare_ vid 100 % raseri.\n\n_+3:_ Förtrollningar och förbannelser på bärsärkarens vapen utlöses oftare ju mer raseri hen har, som mest _45 % oftare_ vid 100 % raseri.

actors.hero.talent.cleave.title=klyva
actors.hero.talent.cleave.desc=_+1:_ Den extra tid som Gladiator får vid en död ökas till _30 turer_, från 15.\n\n_+2:_ Den extra tid som Gladiator får vid en död ökas till _45 turer_, från 15.\n\n_+3:_ Den extra tid som Gladiator får vid en död ökas till _60 turer_, från 15.
actors.hero.talent.lethal_defense.title=dödligt försvar
actors.hero.talent.lethal_defense.desc=_+1:_ När Gladiator dödar en fiende med en kombination, minskas nedkylningstiden för hans brutna sigillskydd med 50 turer.\n\n_+2:_ När Gladiator dödar en fiende med en kombination, minskas nedkylningstiden för hans brutna sigillskydd med 100 turer.\n\n_+3:_ När Gladiatorn dödar en fiende med en kombination, minskas nedkylningstiden för hans brutna sigillskydd med 150 turer.\n\nNedkylningstiden för skölden kan minskas till så lågt som -150 turer med denna talang, vilket innebär att den omedelbart blir tillgänglig igen när den aktiveras.
actors.hero.talent.enhanced_combo.title=utökad kombination
actors.hero.talent.enhanced_combo.desc=_+1:_ När gladiatorns kombination är 7 eller högre ökar Clobbars knockback-räckvidd till 3, den orsakar yrsel och kan slå fiender i gropar.\n\n_+2:_ Utöver fördelarna med +1 fungerar Parry på flera attacker när Gladiatorns kombo är 9 eller högre.\n\n_+3:_ Utöver fördelarna med +1 och +2 kan Gladiator hoppa upp till kombo/3 rutor när han använder Slam, Crush eller Fury.

actors.hero.talent.body_slam.title=kroppstackling
actors.hero.talent.body_slam.desc=_+1:_ När krigaren landar efter ett hopp får alla fiender i närheten skada motsvarande _1-4 plus 25%_ av hans skadeblockeringskraft.\n\n_+2:_ När krigaren landar efter ett hopp får alla fiender i närheten skada motsvarande _2-8 plus 50%_ av hans skadeblockeringskraft.\n\n_+3:_ När krigaren landar efter ett hopp får alla fiender i närheten skada motsvarande _3-12 plus 75%_ av hans skadeblockeringskraft.\n\n_+4:_ När krigaren landar efter ett hopp får alla fiender i närheten skada motsvarande _4-16 plus 100%_ av hans skadeblockeringskraft.
actors.hero.talent.impact_wave.title=stötvåg
actors.hero.talent.impact_wave.desc=_+1:_ När Krigaren landar efter att ha hoppat knuffas alla angränsande fiender _2 rutor_ bakåt och har en _25% chans_ att bli sårbara i 5 turer.\n\n_+2:_ När Krigaren landar efter att ha hoppat knuffas alla angränsande fiender _3 rutor_ bakåt och har en _50% chans_ att bli sårbara i 5 turer.\n\n_+3:_ När krigaren landar efter att ha hoppat knuffas alla angränsande fiender _4 rutor_ bakåt och har en _75% chans_ att bli sårbara i 5 turer.\n\n_+4:_ När Krigaren landar efter att ha hoppat knuffas alla angränsande fiender _5 rutor_ bakåt och har en _100% chans_ att bli sårbara i 5 turer.
actors.hero.talent.double_jump.title=dubbelhopp
actors.hero.talent.double_jump.desc=_+1:_ Om krigaren utför ett andra hopp inom 3 turer har det hoppet _16 % lägre_ laddningskostnad.\n\n_+2:_ Om krigaren utför ett andra hopp inom 3 turer har det hoppet _30 % lägre_ laddningskostnad.\n\n_+3:_ Om krigaren utför ett andra hopp inom 3 turer har det hoppet _40 % lägre_ laddningskostnad.\n\n_+4:_ Om krigaren utför ett andra hopp inom 3 turer har det hoppet _50 % lägre_ laddningskostnad.

actors.hero.talent.expanding_wave.title=expanderande våg
actors.hero.talent.expanding_wave.desc=_+1:_ Chockvågens räckvidd ökar från 5 till _6 rutor_ och bredden från 60 till _75 grader_.\n\n_+2:_ Chockvågens räckvidd ökar från 5 till _7 rutor_ och bredden från 60 till _90 grader_.\n\n_+3:_ Chockvågens räckvidd ökar från 5 till _8 rutor_ och bredden från 60 till _105 grader_.\n\n_+4:_ Chockvågens räckvidd ökar från 5 till _9 rutor_ och bredden från 60 till _120 grader_.
actors.hero.talent.striking_wave.title=slagkraftig våg
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave har _30% chans_ att även använda träffeffekter som förtrollningar och kombinationer.\n\n_+2:_ Shockwave har _60% chans_ att även använda träffeffekter som förtrollningar och kombinationer.\n\n_+3:_ Chockvåg har _90% chans_ att även använda träffeffekter som förtrollningar och kombinationer.\n\n_+4:_ Chockvåg har _100% chans_ att även använda träffeffekter som förtrollningar och kombinationer, och ger förtrollningar _+20% kraft_.
actors.hero.talent.shock_force.title=chockkraft
actors.hero.talent.shock_force.desc=_+1:_ Chockvåg orsakar _20 % mer skada_ och har _25 % chans_ att bedöva i stället för att förlama.\n\n_+2:_ Chockvåg orsakar _40 % mer skada_ och har _50 % chans_ att bedöva i stället för att förlama.\n\n_+3:_ Chockvåg orsakar _60 % mer skada_ och har _75 % chans_ att bedöva i stället för att förlama.\n\n_+4:_ Chockvåg orsakar _80 % mer skada_ och har _100 % chans_ att bedöva i stället för att förlama.

actors.hero.talent.sustained_retribution.title=ihållande vedergällning
actors.hero.talent.sustained_retribution.desc=_+1:_ Krigaren orsakar _115 % bonusskada_ fördelat på _2 träffar_ i stället för 100 % bonusskada i en träff.\n\n_+2:_ Krigaren orsakar _130 % bonusskada_ fördelat på _3 träffar_ i stället för 100 % bonusskada i en träff.\n\n_+3:_ Krigaren orsakar _145 % bonusskada_ fördelat på _4 träffar_ i stället för 100 % bonusskada i en träff.\n\n_+4:_ Krigaren orsakar _160 % bonusskada_ fördelat på _5 träffar_ i stället för 100 % bonusskada i en träff.
actors.hero.talent.shrug_it_off.title=skaka av
actors.hero.talent.shrug_it_off.desc=_+1:_ Krigarens skadereduktion medan han uthärdar _ökar till 60 %_, från 50 %.\n\n_+2:_ Krigarens skadereduktion medan han uthärdar _ökar till 68 %_, från 50 %.\n\n_+3:_ Krigarens skadereduktion medan han uthärdar _ökar till 74 %_, från 50 %.\n\n_+4:_ Krigarens skadereduktion medan han uthärdar _ökar till 80 %_, från 50 %.
actors.hero.talent.even_the_odds.title=jämna ut oddsen
actors.hero.talent.even_the_odds.desc=_+1:_ Krigaren orsakar ytterligare _5 % bonusskada_ för varje fiende inom 2 rutor när uthålligheten upphör.\n\n_+2:_ Krigaren orsakar ytterligare _10 % bonusskada_ för varje fiende inom 2 rutor när uthålligheten upphör.\n\n_+3:_ Krigaren orsakar ytterligare _15 % bonusskada_ för varje fiende inom 2 rutor när uthålligheten upphör.\n\n_+4:_ Krigaren orsakar ytterligare _20 % bonusskada_ för varje fiende inom 2 rutor när uthålligheten upphör.

#mage
actors.hero.talent.empowering_meal.title=stärkande måltid
actors.hero.talent.empowering_meal.desc=_+1:_ När Magikern äter får han _2 bonusskada_ de följande tre gångerna han orsakar skada med en trollstav.\n\n_+2:_ När Magikern äter får han _3 bonusskada_ de följande tre gångerna han orsakar skada med en trollstav.
actors.hero.talent.scholars_intuition.title=den lärdes intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ Magikern identifierar trollstavar _tre gånger snabbare_.\n\n_+2:_ Magikern identifierar trollstavar _när han använder dem_.
actors.hero.talent.lingering_magic.title=kvarvarande magi
actors.hero.talent.lingering_magic.desc=_+1:_ När Magikern avfyrar en trollstav eller magistav orsakar hans nästa fysiska attack _1–2 bonusskada_.\n\n_+2:_ När Magikern avfyrar en trollstav eller magistav orsakar hans nästa fysiska attack _2 bonusskada_.
actors.hero.talent.backup_barrier.title=reservbarriär
actors.hero.talent.backup_barrier.desc=_+1:_ Magikern får _3 sköld_ varje gång han använder den sista laddningen i sin magistav.\n\n_+2:_ Magikern får _5 sköld_ varje gång han använder den sista laddningen i sin magistav.
actors.hero.talent.backup_barrier.meta_desc=_Om denna talang erhålls av en annan hjälte_ utlöses den i stället av hjältens trollstav med högst nivå.

actors.hero.talent.energizing_meal.title=energigivande måltid
actors.hero.talent.energizing_meal.desc=_+1:_ När Magikern äter tar det 1 tur och ger honom _5 turers omladdning av trollstavar_.\n\n_+2:_ När Magikern äter tar det 1 tur och ger honom _8 turers omladdning av trollstavar_.
actors.hero.talent.inscribed_power.title=inskriven kraft
actors.hero.talent.inscribed_power.desc=_+1:_ När Magikern läser en skriftrulle eller använder ett trollformelsföremål får hans _nästa två avfyrningar av trollstavar_ +2 nivåer.\n\n_+2:_ När Magikern läser en skriftrulle eller använder ett trollformelsföremål får hans _nästa tre avfyrningar av trollstavar_ +2 nivåer.\n\nAntalet förstärkta avfyrningar av trollstavar fördubblas när du använder en skriftrulle för uppgradering eller transmutation, eller alkemiföremål som tillverkats med sådana skriftrullar.\n\nFör alkemiföremål som ger flera resultat (t.ex. de flesta trollformler) kan talangen utlösas beroende på hur många av föremålet som tillverkas.
actors.hero.talent.wand_preservation.title=stavbevarande
actors.hero.talent.wand_preservation.desc=_+1:_ När Magikern införlivar en ny trollstav i sin magistav återfår han den gamla trollstaven på +0, _men det kan bara göras en gång._\n\n_+2:_ När Magikern införlivar en ny trollstav i sin magistav återfår han den gamla trollstaven på +0. _Det kan upprepas efter en hjältenivå._
actors.hero.talent.wand_preservation.meta_desc=_Om denna talang erhålls av en annan hjälte_ ökar den i stället mängden arkanharts som erhålls när en trollstav placeras i en alkemikruka med 1 på +1 eller med 2 på +2.
actors.hero.talent.arcane_vision.title=magisk syn
actors.hero.talent.arcane_vision.desc=_+1:_ När Magikern avfyrar en trollstav mot en fiende får han sinnessyn på fienden i _10 turer_.\n\n_+2:_ När Magikern avfyrar en trollstav mot en fiende får han sinnessyn på fienden i _15 turer_.
actors.hero.talent.shield_battery.title=sköldsbatteri
actors.hero.talent.shield_battery.desc=_+1:_ Magikern kan rikta en trollstav mot sig själv för att omvandla alla sina laddningar till sköldar med en hastighet av _4 % max HP per laddning_.\n\n_+2:_ Magikern kan rikta en trollstav mot sig själv för att omvandla alla sina laddningar till sköldar med en hastighet av _6 % max HP per laddning_.

actors.hero.talent.desperate_power.title=desperat kraft
actors.hero.talent.desperate_power.desc=_+1:_ Magikerns trollstavar och magistav får _+1 nivå_ vid sin sista avfyrning, när bara en laddning återstår.\n\n_+2:_ Magikerns trollstavar och magistav får _+2 nivåer_ vid sin sista avfyrning, när bara en laddning återstår.\n\n_+3:_ Magikerns trollstavar och magistav får _+3 nivåer_ vid sin sista avfyrning, när bara en laddning återstår.
actors.hero.talent.ally_warp.title=teleportera en allierad
actors.hero.talent.ally_warp.desc=_+1:_ Magikern kan välja en allierad och omedelbart byta plats med den inom en radie på _2 rutor_.\n\n_+2:_ Magikern kan välja en allierad och omedelbart byta plats med den inom en radie på _4 rutor_.\n\n_+3:_ Magikern kan välja en allierad och omedelbart byta plats med den inom en radie på _6 rutor_.\n\nMagikern kan inte byta plats med orörliga allierade.

actors.hero.talent.empowered_strike.title=förstärkt slag
actors.hero.talent.empowered_strike.desc=_+1:_ Stridsmagikerns första närstridsattack med magistaven efter att ha avfyrat den orsakar _+16 % skada_ och magistavens bonuseffekt får _+50 % kraft_.\n\n_+2:_ Stridsmagikerns första närstridsattack med magistaven efter att ha avfyrat den orsakar _+33 % skada_ och magistavens bonuseffekt får _+100 % kraft_.\n\n_+3:_ Stridsmagikerns första närstridsattack med magistaven efter att ha avfyrat den orsakar _+50 % skada_ och magistavens bonuseffekt får _+150 % kraft_.
actors.hero.talent.mystical_charge.title=mystisk laddning
actors.hero.talent.mystical_charge.desc=_+1:_ När Stridsmagikern slår med magistaven får han _0,5 turers_ omladdning av artefakter.\n\n_+2:_ När Stridsmagikern slår med magistaven får han _1 turs_ omladdning av artefakter.\n\n_+3:_ När Stridsmagikern slår med magistaven får han _1,5 turers_ omladdning av artefakter.
actors.hero.talent.excess_charge.title=överbliven laddning
actors.hero.talent.excess_charge.desc=_+1:_ När Stridsmagikerns magistav är fulladdad ger nästa avfyrning honom _0,67 sköld_ per nivå på magistaven.\n\n_+2:_ När Stridsmagikerns magistav är fulladdad ger nästa avfyrning honom _1,33 sköld_ per nivå på magistaven.\n\n_+3:_ När Stridsmagikerns magistav är fulladdad ger nästa avfyrning honom _2 sköld_ per nivå på magistaven.

actors.hero.talent.soul_siphon.title=själsutvinning
actors.hero.talent.soul_siphon.desc=_+1:_ Fysisk skada som andra karaktärer orsakar utlöser Häxmästarens själsmärke med _13 % effektivitet_.\n\n_+2:_ Fysisk skada som andra karaktärer orsakar utlöser Häxmästarens själsmärke med _27 % effektivitet_.\n\n_+3:_ Fysisk skada som andra karaktärer orsakar utlöser Häxmästarens själsmärke med _40 % effektivitet_.
actors.hero.talent.soul_eater.title=själsslukare
actors.hero.talent.soul_eater.desc=_+1:_ Själsmärket ger _0,33 turers_ mättnad för varje fysisk skada som orsakas. Fiender med själsmärke har _10 % chans_ att utlösa effekter vid förtäring när de dör.\n\n_+2:_ Själsmärket ger _0,67 turers_ mättnad för varje fysisk skada som orsakas. Fiender med själsmärke har _20 % chans_ att utlösa effekter vid förtäring när de dör.\n\n_+3:_ Själsmärket ger _1 turs_ mättnad för varje fysisk skada som orsakas. Fiender med själsmärke har _30 % chans_ att utlösa effekter vid förtäring när de dör.
actors.hero.talent.necromancers_minions.title=nekromantikerns undersåtar
actors.hero.talent.necromancers_minions.desc=_+1:_ När en fiende med själsmärke dör har Häxmästaren _13 % chans_ att återuppväcka den som en fördärvad vålnad.\n\n_+2:_ När en fiende med själsmärke dör har Häxmästaren _27 % chans_ att återuppväcka den som en fördärvad vålnad.\n\n_+3:_ När en fiende med själsmärke dör har Häxmästaren _40 % chans_ att återuppväcka den som en fördärvad vålnad.

actors.hero.talent.blast_radius.title=sprängradie
actors.hero.talent.blast_radius.desc=_+1:_ Den elementära explosionens radie ökar till _5 rutor_, från 4.\n\n_+2:_ Den elementära explosionens radie ökar till _6 rutor_, från 4.\n\n_+3:_ Den elementära explosionens radie ökar till _7 rutor_, från 4.\n\n_+4:_ Den elementära explosionens radie ökar till _8 rutor_, från 4.
actors.hero.talent.elemental_power.title=elementär kraft
actors.hero.talent.elemental_power.desc=_+1:_ Den elementära explosionens kraft ökar med _25 %_.\n\n_+2:_ Den elementära explosionens kraft ökar med _50 %_.\n\n_+3:_ Den elementära explosionens kraft ökar med _75 %_.\n\n_+4:_ Den elementära explosionens kraft ökar med _100 %_.
actors.hero.talent.reactive_barrier.title=reaktiv barriär
actors.hero.talent.reactive_barrier.desc=_+1:_ Magikern får _2,5 sköld_ för varje karaktär som påverkas av den elementära explosionen, upp till högst 5 karaktärer.\n\n_+2:_ Magikern får _5 sköld_ för varje karaktär som påverkas av den elementära explosionen, upp till högst 6 karaktärer.\n\n_+3:_ Magikern får _7,5 sköld_ för varje karaktär som påverkas av den elementära explosionen, upp till högst 7 karaktärer.\n\n_+4:_ Magikern får _10 sköld_ för varje karaktär som påverkas av den elementära explosionen, upp till högst 8 karaktärer.

actors.hero.talent.wild_power.title=vild kraft
actors.hero.talent.wild_power.desc=_+1:_ När vild magi används förstärks trollstavar med antingen _2 eller 3, upp till +4_.\n\n_+2:_ När vild magi används förstärks trollstavar med _3, upp till +5_.\n\n_+3:_ När vild magi används förstärks trollstavar med antingen _3 eller 4, upp till +6_.\n\n_+4:_ När vild magi används förstärks trollstavar med _4, upp till +7_.
actors.hero.talent.fire_everything.title=skjut allt
actors.hero.talent.fire_everything.desc=_+1:_ Vild magi avfyras nu _5 gånger_ i stället för 4 och varje trollstav har _25 % chans_ att kunna användas 3 gånger.\n\n_+2:_ Vild magi avfyras nu _6 gånger_ i stället för 4 och varje trollstav har _50 % chans_ att kunna användas 3 gånger.\n\n_+3:_ Vild magi avfyras nu _7 gånger_ i stället för 4 och varje trollstav har _75 % chans_ att kunna användas 3 gånger.\n\n_+4:_ Vild magi avfyras nu _8 gånger_ i stället för 4 och varje trollstav har _100 % chans_ att kunna användas 3 gånger.
actors.hero.talent.conserved_magic.title=konserverad magi
actors.hero.talent.conserved_magic.desc=_+1:_ Varje avfyrning med vild magi använder nu _0,33 laddningar_ i stället för 0,5 och vild magi har _25 % chans_ att inte använda en tur.\n\n_+2:_ Varje avfyrning med vild magi använder nu _0,225 laddningar_ i stället för 0,5 och vild magi har _50 % chans_ att inte använda en tur.\n\n_+3:_ Varje avfyrning med vild magi använder nu _0,15 laddningar_ i stället för 0,5 och vild magi har _75 % chans_ att inte använda en tur.\n\n_+4:_ Varje avfyrning med vild magi använder nu _0,1 laddningar_ i stället för 0,5 och vild magi har _100 % chans_ att inte använda en tur.

actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ Om Magikern teleporterar in i en annan karaktär orsakar han _10–15 skada_ på den men tar också _5 skada_.\n\n_+2:_ Om Magikern teleporterar in i en annan karaktär orsakar han _20–30 skada_ på den men tar också _10 skada_.\n\n_+3:_ Om Magikern teleporterar in i en annan karaktär orsakar han _30–45 skada_ på den men tar också _15 skada_.\n\n_+4:_ Om Magikern teleporterar in i en annan karaktär orsakar han _40–60 skada_ på den men tar också _20 skada_.\n\nTalangen kan inte döda hjälten. Självskadan kan minskas av effekter som ger magimotstånd.
actors.hero.talent.remote_beacon.title=Fjärrbeacon
actors.hero.talent.remote_beacon.desc=_+1:_ Magikern kan placera en fyr på valfri plats inom _4 rutor_.\n\n_+2:_ Magikern kan placera en fyr på valfri plats inom _8 rutor_.\n\n_+3:_ Magikern kan placera en fyr på valfri plats inom _12 rutor_.\n\n_+4:_ Magikern kan placera en fyr på valfri plats inom _16 rutor_.\n\nMagikern kan inte placera fyrar på platser som är otillgängliga.
actors.hero.talent.longrange_warp.title=Långdistansförflyttning
actors.hero.talent.longrange_warp.desc=_+1:_ Magikern kan nu förflytta sig mellan våningar till en laddningskostnad på _150 %_.\n\n_+2:_ Magikern kan nu förflytta sig mellan våningar till en laddningskostnad på _117 %_.\n\n_+3:_ Magikern kan nu förflytta sig mellan våningar till en laddningskostnad på _83 %_.\n\n_+4:_ Magikern kan nu förflytta sig mellan våningar till en laddningskostnad på _50 %_.\n\nMagikern kan inte använda långdistansförflyttning för att lämna en låst våning.

#rogue
actors.hero.talent.cached_rations.title=undangömda ransoner
actors.hero.talent.cached_rations.desc=_+1:_ Skurken kan hitta _2 proviantportioner_ i kistor medan han utforskar fängelsehålans närmaste våningar.\n\n_+2:_ Skurken kan hitta _3 proviantportioner_ i kistor medan han utforskar fängelsehålans närmaste våningar.\n\nProviantportioner äts snabbt, återställer måttligt med mättnad, läker 5 HP och återställer 1 laddning i skuggmanteln.
actors.hero.talent.thiefs_intuition.title=tjuvens intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ Skurken identifierar ringar _två gånger snabbare_ och identifierar en rings typ _när han utrustar den_.\n\n_+2:_ Skurken identifierar ringar _när han utrustar dem_ och identifierar en rings typ _när han plockar upp den_.
actors.hero.talent.sucker_punch.title=bakslugt slag
actors.hero.talent.sucker_punch.desc=_+1:_ Skurken orsakar _1–2 bonusskada_ första gången han överraskningsattackerar en fiende.\n\n_+2:_ Skurken orsakar _2 bonusskada_ första gången han överraskningsattackerar en fiende.
actors.hero.talent.protective_shadows.title=beskyddande skuggor
actors.hero.talent.protective_shadows.desc=_+1:_ Skurken får ett skydd _varannan tur_ han är osynlig, _upp till maximalt 3_.\n\n_+2:_ Skurken får ett skydd _varje tur_ han är osynlig, _upp till maximalt 5_.

actors.hero.talent.mystical_meal.title=mystisk måltid
actors.hero.talent.mystical_meal.desc=_+1:_ När Skurken äter tar det 1 tur (proviantportioner äts omedelbart) och ger honom _3 turers omladdning av artefakter_.\n\n_+2:_ När Skurken äter tar det 1 tur (proviantportioner äts omedelbart) och ger honom _5 turers omladdning av artefakter_.\n\nDenna talang kan inte användas för att låta överflödets horn ladda om sig självt.
actors.hero.talent.inscribed_stealth.title=inskrivet smygande
actors.hero.talent.inscribed_stealth.desc=_+1:_ Skurken får _3 turers_ osynlighet efter att ha läst en skriftrulle eller använt ett trollformelsföremål.\n\n_+2:_ Skurken får _5 turers_ osynlighet efter att ha läst en skriftrulle eller använt ett trollformelsföremål.\n\nOsynlighetens varaktighet fördubblas när du använder en skriftrulle för uppgradering eller transmutation, eller alkemiföremål som tillverkats med sådana skriftrullar.\n\nFör alkemiföremål som ger flera resultat (t.ex. de flesta trollformler) kan talangen utlösas beroende på hur många av föremålet som tillverkas.
actors.hero.talent.wide_search.title=utökad sökning
actors.hero.talent.wide_search.desc=_+1:_ Skurkens sökradie ökar från en 5 × 5-ruta till en _7 × 7-cirkel_.\n\n_+2:_ Skurkens sökradie ökar från en 5 × 5-ruta till en _7 × 7-ruta_.
actors.hero.talent.wide_search.meta_desc=_Om denna talang erhålls av en annan hjälte_ ökar den i stället hjältens sökradie från en 3 × 3-ruta till en 5 × 5-cirkel vid +1, eller till en 5 × 5-ruta vid +2.
actors.hero.talent.silent_steps.title=tysta fotsteg
actors.hero.talent.silent_steps.desc=_+1:_ Skurken väcker inte sovande fiender om han är _minst 3 rutor bort från dem_.\n\n_+2:_ Skurken väcker inte sovande fiender när han _inte står intill dem_.
actors.hero.talent.rogues_foresight.title=skurkens förutseende
actors.hero.talent.rogues_foresight.desc=_+1:_ När Skurken befinner sig på en våning med ett hemligt rum har han _75 % chans att märka_ att våningen innehåller en hemlighet.\n\n_+2:_ När Skurken befinner sig på en våning med ett hemligt rum har han _100 % chans att märka_ att våningen innehåller en hemlighet.

actors.hero.talent.light_cloak.title=lätt mantel
actors.hero.talent.light_cloak.desc=_+1:_ Skurken kan använda sin skuggmantel när den inte är utrustad, men den laddas om med _25 % hastighet_ när den inte är utrustad.\n\n_+2:_ Skurken kan använda sin skuggmantel när den inte är utrustad, men den laddas om med _50 % hastighet_ när den inte är utrustad.\n\n_+3:_ Skurken kan använda sin skuggmantel när den inte är utrustad, men den laddas om med _75 % hastighet_ när den inte är utrustad.
actors.hero.talent.light_cloak.meta_desc=_Om denna talang erhålls av en annan hjälte_ ökar den i stället alla artefakters laddningshastighet med 7/13/20 % vid +1/+2/+3.
actors.hero.talent.enhanced_rings.title=förstärkta ringar
actors.hero.talent.enhanced_rings.desc=_+1:_ När Skurken använder en artefakt får hans ringar +1 uppgradering i _3 turer_.\n\n_+2:_ När Skurken använder en artefakt får hans ringar +1 uppgradering i _6 turer_.\n\n_+3:_ När Skurken använder en artefakt får hans ringar +1 uppgradering i _9 turer_.

actors.hero.talent.enhanced_lethality.title=förstärkt dödlighet
actors.hero.talent.enhanced_lethality.desc=_+1:_ Lönnmördaren kan mörda fiender som har mindre än _4/13/27/67 % hälsa_ per förberedelsenivå, upp från 3/10/20/50 %.\n\n_+2:_ Lönnmördaren kan mörda fiender som har mindre än _5/17/33/83 % hälsa_ per förberedelsenivå, upp från 3/10/20/50 %.\n\n_+3:_ Lönnmördaren kan mörda fiender som har mindre än _6/20/40/100 % hälsa_ per förberedelsenivå, upp från 3/10/20/50 %.
actors.hero.talent.assassins_reach.title=lönnmördarens räckvidd
actors.hero.talent.assassins_reach.desc=_+1:_ Lönnmördarens förflyttningsräckvidd per förberedelsenivå ökar till _1/3/4/6 rutor_, från 1/2/3/4.\n\n_+2:_ Lönnmördarens förflyttningsräckvidd per förberedelsenivå ökar till _2/4/6/8 rutor_, från 1/2/3/4.\n\n_+3:_ Lönnmördarens förflyttningsräckvidd per förberedelsenivå ökar till _2/5/7/10 rutor_, från 1/2/3/4.\n\nFörflyttningen kan passera faror och fiender, men inte fast terräng som väggar.
actors.hero.talent.bounty_hunter.title=prisjägare
actors.hero.talent.bounty_hunter.desc=_+1:_ När Lönnmördaren dödar en fiende med ett förberett slag ökar fiendens chans att släppa föremål med _2/4/8/16 %_ per förberedelsenivå.\n\n_+2:_ När Lönnmördaren dödar en fiende med ett förberett slag ökar fiendens chans att släppa föremål med _4/8/16/32 %_ per förberedelsenivå.\n\n_+3:_ När Lönnmördaren dödar en fiende med ett förberett slag ökar fiendens chans att släppa föremål med _6/12/24/48 %_ per förberedelsenivå.

actors.hero.talent.evasive_armor.title=undvikande rustning
actors.hero.talent.evasive_armor.desc=_+1:_ Under frilöpning får Frilöparen ytterligare _+1 undvikande_ per överflödig styrkepunkt på rustningen.\n\n_+2:_ Under frilöpning får Frilöparen ytterligare _+2 undvikande_ per överflödig styrkepunkt på rustningen.\n\n_+3:_ Under frilöpning får Frilöparen ytterligare _+3 undvikande_ per överflödig styrkepunkt på rustningen.
actors.hero.talent.projectile_momentum.title=projektilmomentum
actors.hero.talent.projectile_momentum.desc=_+1:_ Under frilöpning får Frilöparen _+50 % träffsäkerhet och +15 % skada_ med kastvapen.\n\n_+2:_ Under frilöpning får Frilöparen _+100 % träffsäkerhet och +30 % skada_ med kastvapen.\n\n_+3:_ Under frilöpning får Frilöparen _+150 % träffsäkerhet och +45 % skada_ med kastvapen.
actors.hero.talent.speedy_stealth.title=snabbt smygande
actors.hero.talent.speedy_stealth.desc=_+1:_ Frilöparen får 2 staplar momentum per tur medan han är osynlig.\n\n_+2:_ Utöver fördelarna med +1 räknas frilöpningen inte längre ned medan Frilöparen är osynlig.\n\n_+3:_ Utöver fördelarna med +1 och +2 rör sig Frilöparen med dubbel hastighet när han är osynlig, oavsett om han frilöper eller inte.

actors.hero.talent.hasty_retreat.title=hastad reträtt
actors.hero.talent.hasty_retreat.desc=_+1:_ Efter att ha förflyttat sig får Skurken _1 tur_ av hastighet och osynlighet.\n\n_+2:_ Efter att ha förflyttat sig får Skurken _2 turer_ av hastighet och osynlighet.\n\n_+3:_ Efter att ha förflyttat sig får Skurken _3 turer_ av hastighet och osynlighet.\n\n_+4:_ Efter att ha förflyttat sig får Skurken _4 turer_ av hastighet och osynlighet.
actors.hero.talent.body_replacement.title=kroppsersättning
actors.hero.talent.body_replacement.desc=_+1:_ Efter att ha blinkat lämnar Skurken en träattrapp efter sig som har _20 hälsa och 1-3 rustning_.\n\n_+2:_ Efter att ha blinkat lämnar Skurken en träattrapp efter sig som har _40 hälsa och 2-6 rustning_.\n\n_+3:_ Efter att ha blinkat lämnar Skurken en träattrapp efter sig som har _60 hälsa och 3-9 rustning_.\n\n_+4:_ Efter att ha blinkat lämnar Skurken en träattrapp efter sig som har _80 hälsa och 4-12 rustning_.\n\nEndast en attrapp kan vara aktiv åt gången.
actors.hero.talent.shadow_step.title=skuggsteg
actors.hero.talent.shadow_step.desc=_+1:_ Om Skurken använder en rökbomb medan han är osynlig aktiveras den omedelbart och har en _16 % lägre_ laddningskostnad, men den varken bländar fiender eller utlöser andra talanger.\n\n_+2:_ Om Skurken använder en rökbomb medan han är osynlig aktiveras den omedelbart och har en _30 % lägre_ laddningskostnad, men den varken bländar fiender eller utlöser andra talanger.\n\n_+3:_ Om Skurken använder en rökbomb medan han är osynlig aktiveras den omedelbart och har en _41 % lägre_ laddningskostnad, men den varken bländar fiender eller utlöser andra talanger.\n\n_+4:_ Om Skurken använder en rökbomb medan han är osynlig aktiveras den omedelbart och har en _50 % lägre_ laddningskostnad, men den varken bländar fiender eller utlöser andra talanger.

actors.hero.talent.fear_the_reaper.title=frukta skördemannen
actors.hero.talent.fear_the_reaper.desc=_+1:_ När en fiende med dödsmärke når 0 HP blir den _förlamad_.\n\n_+2:_ När en fiende med dödsmärke når 0 HP blir den _skrämd och förlamad_.\n\n_+3:_ När en fiende med dödsmärke når 0 HP blir den _skrämd och förlamad_ och fiender inom 3 rutor blir _förlamade_.\n\n_+4:_ När en fiende med dödsmärke når 0 HP blir den _skrämd och förlamad_ och fiender inom 3 rutor blir _skrämda och förlamade_.
actors.hero.talent.deathly_durability.title=dödlig uthållighet
actors.hero.talent.deathly_durability.desc=_+1:_ Fiender som dödas av dödsmärket ger Skurken sköld motsvarande _13 %_ av deras HP när de märktes.\n\n_+2:_ Fiender som dödas av dödsmärket ger Skurken sköld motsvarande _25 %_ av deras HP när de märktes.\n\n_+3:_ Fiender som dödas av dödsmärket ger Skurken sköld motsvarande _38 %_ av deras HP när de märktes.\n\n_+4:_ Fiender som dödas av dödsmärket ger Skurken sköld motsvarande _50 %_ av deras HP när de märktes.
actors.hero.talent.double_mark.title=dubbelt märkt
actors.hero.talent.double_mark.desc=_+1:_ Att märka ett andra mål samtidigt som det första har en _30 % lägre_ laddningskostnad.\n\n_+2:_ Att märka ett andra mål samtidigt som det första har en _50 % lägre_ laddningskostnad.\n\n_+3:_ Att märka ett andra mål samtidigt som det första har en _65 % lägre_ laddningskostnad.\n\n_+4:_ Att märka ett andra mål samtidigt som det första har en _75 % lägre_ laddningskostnad.

actors.hero.talent.shadow_blade.title=skuggklinga
actors.hero.talent.shadow_blade.desc=_+1:_ Skuggklonen får _8 %_ av hjältens skada per tur och har _25 % chans_ att använda förtrollningen på hjältens vapen.\n\n_+2:_ Skuggklonen får _16 %_ av hjältens skada per tur och har _50 % chans_ att använda förtrollningen på hjältens vapen.\n\n_+3:_ Skuggklonen får _24 %_ av hjältens skada per tur och har _75 % chans_ att använda förtrollningen på hjältens vapen.\n\n_+4:_ Skuggklonen får _32 %_ av hjältens skada per tur och har _100 % chans_ att använda förtrollningen på hjältens vapen.
actors.hero.talent.cloned_armor.title=klonad rustning
actors.hero.talent.cloned_armor.desc=_+1:_ Skuggklonen får _12 %_ av hjältens rustningsvärde och har _25 % chans_ att använda glyfen på hjältens rustning.\n\n_+2:_ Skuggklonen får _24 %_ av hjältens rustningsvärde och har _50 % chans_ att använda glyfen på hjältens rustning.\n\n_+3:_ Skuggklonen får _36 %_ av hjältens rustningsvärde och har _75 % chans_ att använda glyfen på hjältens rustning.\n\n_+4:_ Skuggklonen får _48 %_ av hjältens rustningsvärde och har _100 % chans_ att använda glyfen på hjältens rustning.
actors.hero.talent.perfect_copy.title=perfekt kopia
actors.hero.talent.perfect_copy.desc=_+1:_ Skuggklonen får _10 %_ av hjältens maximala HP och kan omedelbart byta plats med hjälten på upp till _1 ruta_ avstånd.\n\n_+2:_ Skuggklonen får _20 %_ av hjältens maximala HP och kan omedelbart byta plats med hjälten på upp till _2 rutor_ avstånd.\n\n_+3:_ Skuggklonen får _30 %_ av hjältens maximala HP och kan omedelbart byta plats med hjälten på upp till _3 rutor_ avstånd.\n\n_+4:_ Skuggklonen får _40 %_ av hjältens maximala HP och kan omedelbart byta plats med hjälten på upp till _4 rutor_ avstånd.

#huntress
actors.hero.talent.natures_bounty.title=naturens gåvor
actors.hero.talent.natures_bounty.desc=_+1:_ Jägaren kan hitta _4 bär_ gömda i högt gräs medan hon utforskar fängelsehålans närmaste våningar.\n\n_+2:_ Jägaren kan hitta _6 bär_ gömda i högt gräs medan hon utforskar fängelsehålans närmaste våningar.\n\nBär äts snabbt, återställer lite mättnad och kan innehålla ett användbart frö.
actors.hero.talent.survivalists_intuition.title=överlevarens intuition
actors.hero.talent.survivalists_intuition.desc=_+1:_ Jägaren identifierar kastvapen _tre gånger snabbare_.\n\n_+2:_ Jägaren identifierar kastvapen _när hon träffar med dem_.
actors.hero.talent.followup_strike.title=uppföljande slag
actors.hero.talent.followup_strike.desc=_+1:_ När Jägaren träffar en fiende med sin båge eller ett kastvapen orsakar hennes nästa närstridsattack mot fienden _2 bonusskada_.\n\n_+2:_ När Jägaren träffar en fiende med sin båge eller ett kastvapen orsakar hennes nästa närstridsattack mot fienden _3 bonusskada_.
actors.hero.talent.natures_aid.title=naturens hjälp
actors.hero.talent.natures_aid.desc=_+1:_ Jägaren får 0–2 barkhudsrustning, som avtar var _3:e tur_, när en växts effekt aktiveras inom hennes synfält.\n\n_+2:_ Jägaren får 0–2 barkhudsrustning, som avtar var _5:e tur_, när en växts effekt aktiveras inom hennes synfält.

actors.hero.talent.invigorating_meal.title=uppfriskande måltid
actors.hero.talent.invigorating_meal.desc=_+1:_ När Jägaren äter tar det 1 tur (bär äts omedelbart) och ger henne _1 tur_ av hastighet.\n\n_+2:_ När Jägaren äter tar det 1 tur (bär äts omedelbart) och ger henne _2 turer_ av hastighet.
actors.hero.talent.liquid_nature.title=flytande natur
actors.hero.talent.liquid_nature.desc=_+1:_ När Jägaren dricker eller kastar en dryck, brygd eller elixir växer _upp till 4 gräsrutor_ i området omkring henne och närliggande fiender rotas i _1 tur_.\n\n_+2:_ När Jägaren dricker eller kastar en dryck, brygd eller elixir växer _upp till 6 gräsrutor_ i området omkring henne och närliggande fiender rotas i _2 turer_.\n\nMängden gräs och rotningens varaktighet fördubblas när du använder styrke- eller erfarenhetsdrycker, eller alkemiföremål som tillverkats med sådana drycker.\n\nFör alkemiföremål som ger flera resultat (t.ex. vattenbrygd) kan talangen utlösas beroende på hur många av föremålet som tillverkas.
actors.hero.talent.rejuvenating_steps.title=återhämtande fotsteg
actors.hero.talent.rejuvenating_steps.desc=_+1:_ När Jägaren kliver på kort gräs eller glöd reser det sig till högt gräs som hon genast plöjer upp. Detta har en nedkylning på _10 turer_.\n\n_+2:_ När Jägaren kliver på kort gräs eller glöd reser det sig till högt gräs som hon genast plöjer upp. Detta har en nedkylning på _5 turer_.\n\nDenna talang ger uppplöjt gräs om passiva regenereringseffekter är inaktiverade eller hjälten inte har fått erfarenhet på länge.
actors.hero.talent.heightened_senses.title=förhöjda sinnen
actors.hero.talent.heightened_senses.desc=_+1:_ Jägaren får sinnessyn på karaktärer inom _2 rutor från sin position_.\n\n_+2:_ Jägaren får sinnessyn på karaktärer inom _3 rutor från sin position_.
actors.hero.talent.durable_projectiles.title=slitstarka projektiler
actors.hero.talent.durable_projectiles.desc=_+1:_ Kastvapen har _+50 % hållbarhet_ när Jägaren använder dem.\n\n_+2:_ Kastvapen har _+75 % hållbarhet_ när Jägaren använder dem.

actors.hero.talent.point_blank.title=på nära håll
actors.hero.talent.point_blank.desc=_+1:_ När Jägaren använder sin båge eller ett kastvapen i närstrid har det _−25 % träffsäkerhet_ i stället för −50 %.\n\n_+2:_ När Jägaren använder sin båge eller ett kastvapen i närstrid har det _normal träffsäkerhet_ i stället för −50 %.\n\n_+3:_ När Jägaren använder sin båge eller ett kastvapen i närstrid har det _+25 % träffsäkerhet_ i stället för −50 %.\n\nObservera att kastvapen och andebågen alltid har +50 % träffsäkerhet när de används på avstånd.
actors.hero.talent.seer_shot.title=seende skott
actors.hero.talent.seer_shot.desc=_+1:_ När Jägaren skjuter en pil mot marken ger den syn i ett 3 × 3-område runt nedslagsplatsen i _5 turer_. Detta har en nedkylning på 20 turer.\n\n_+2:_ När Jägaren skjuter en pil mot marken ger den syn i ett 3 × 3-område runt nedslagsplatsen i _10 turer_. Detta har en nedkylning på 20 turer.\n\n_+3:_ När Jägaren skjuter en pil mot marken ger den syn i ett 3 × 3-område runt nedslagsplatsen i _15 turer_. Detta har en nedkylning på 20 turer.
actors.hero.talent.seer_shot.meta_desc=_Om denna talang erhålls av en annan hjälte_ aktiveras den av alla kastvapen.

actors.hero.talent.farsight.title=långsynthet
actors.hero.talent.farsight.desc=_+1:_ Prickskyttens synfält _ökar med 25 %_.\n\n_+2:_ Prickskyttens synfält _ökar med 50 %_.\n\n_+3:_ Prickskyttens synfält _ökar med 75 %_.
actors.hero.talent.shared_enchantment.title=delad förtrollning
actors.hero.talent.shared_enchantment.desc=_+1:_ Kastvapen har _33 % chans_ att använda förtrollningen på Prickskyttens båge.\n\n_+2:_ Kastvapen har _67 % chans_ att använda förtrollningen på Prickskyttens båge.\n\n_+3:_ Kastvapen har _100 % chans_ att använda förtrollningen på Prickskyttens båge.\n\nBågens förtrollning kan utlösas utöver den förtrollning som kastvapnet redan har.
actors.hero.talent.shared_upgrades.title=delade uppgraderingar
actors.hero.talent.shared_upgrades.desc=_+1:_ När Prickskytten attackerar med ett uppgraderat kastvapen ökar varje nivå varaktigheten för prickskyttens märke med 1 tur och skadan från hennes specialattack med 16 %, upp till maximalt _2 turer och +33 % skada vid +2_.\n\n_+2:_ När Prickskytten attackerar med ett uppgraderat kastvapen ökar varje nivå varaktigheten för prickskyttens märke med 1 tur och skadan från hennes specialattack med 16 %, upp till maximalt _4 turer och +67 % skada vid +4_.\n\n_+3:_ När Prickskytten attackerar med ett uppgraderat kastvapen ökar varje nivå varaktigheten för prickskyttens märke med 1 tur och skadan från hennes specialattack med 16 %, upp till maximalt _6 turer och +100 % skada vid +6_.

actors.hero.talent.durable_tips.title=slitstarka spetsar
actors.hero.talent.durable_tips.desc=_+1:_ Spetsade kastpilar har _dubbelt så hög hållbarhet_ när Väktaren använder dem.\n\n_+2:_ Spetsade kastpilar har _tre gånger så hög hållbarhet_ när Väktaren använder dem.\n\n_+3:_ Spetsade kastpilar har _fyra gånger så hög hållbarhet_ när Väktaren använder dem.
actors.hero.talent.barkskin.title=barkhud
actors.hero.talent.barkskin.desc=_+1:_ När väktaren kliver på obearbetat högt gräs eller växter får hon barkhudsrustning motsvarande _0–33 % av sin nivå_, som avtar varje tur.\n\n_+2:_ När väktaren kliver på obearbetat högt gräs eller växter får hon barkhudsrustning motsvarande _0–67 % av sin nivå_, som avtar varje tur.\n\n_+3:_ När väktaren kliver på obearbetat högt gräs eller växter får hon barkhudsrustning motsvarande _0–100 % av sin nivå_, som avtar varje tur.
actors.hero.talent.shielding_dew.title=beskyddande dagg
actors.hero.talent.shielding_dew.desc=_+1:_ Daggdroppar kan ge Väktaren sköld när hennes HP är full, upp till _20 % av hennes maximala HP_.\n\n_+2:_ Daggdroppar kan ge Väktaren sköld när hennes HP är full, upp till _40 % av hennes maximala HP_.\n\n_+3:_ Daggdroppar kan ge Väktaren sköld när hennes HP är full, upp till _60 % av hennes maximala HP_.

actors.hero.talent.fan_of_blades.title=fläkt av klingor
actors.hero.talent.fan_of_blades.desc=_+1:_ Spektrala blad kan träffa upp till _1 ytterligare mål_ med 50 % skada. Målet måste vara synligt och befinna sig inom en konformad AOE på _30 grader_.\n\n_+2:_ Spektrala blad kan träffa upp till _2 ytterligare mål_ med 50 % skada. Målen måste vara synliga och befinna sig inom en konformad AOE på _60 grader_.\n\n_+3:_ Spektrala blad kan träffa upp till _3 ytterligare mål_ med 50 % skada. Målen måste vara synliga och befinna sig inom en konformad AOE på _90 grader_.\n\n_+4:_ Spektrala blad kan träffa upp till _4 ytterligare mål_ med 50 % skada. Målen måste vara synliga och befinna sig inom en konformad AOE på _120 grader_.
actors.hero.talent.projecting_blades.title=genomträngande klingor
actors.hero.talent.projecting_blades.desc=_+1:_ Spektrala blad har _+25 % träffsäkerhet_ och kan tränga igenom upp till _2 solida rutor_.\n\n_+2:_ Spektrala blad har _+50 % träffsäkerhet_ och kan tränga igenom upp till _4 solida rutor_.\n\n_+3:_ Spektrala blad har _+75 % träffsäkerhet_ och kan tränga igenom upp till _6 solida rutor_.\n\n_+4:_ Spektrala blad har _+100 % träffsäkerhet_ och kan tränga igenom upp till _8 solida rutor_.
actors.hero.talent.spirit_blades.title=andeklingor
actors.hero.talent.spirit_blades.desc=_+1:_ Spektrala blad har _30 % chans_ att också använda förtrollningen på andebågen.\n\n_+2:_ Spektrala blad har _60 % chans_ att också använda förtrollningen på andebågen.\n\n_+3:_ Spektrala blad har _90 % chans_ att också använda förtrollningen på andebågen.\n\n_+4:_ Spektrala blad har _100 % chans_ att också använda förtrollningen på andebågen och ger varje förtrollning _+10 % kraft_.

actors.hero.talent.growing_power.title=växande kraft
actors.hero.talent.growing_power.desc=_+1:_ Attack- och rörelsehastighetsförstärkningarna från naturens kraft ökar till _38 % och 125 %_, från 33 % och 100 %.\n\n_+2:_ Attack- och rörelsehastighetsförstärkningarna från naturens kraft ökar till _42 % och 150 %_, från 33 % och 100 %.\n\n_+3:_ Attack- och rörelsehastighetsförstärkningarna från naturens kraft ökar till _46 % och 175 %_, från 33 % och 100 %.\n\n_+4:_ Attack- och rörelsehastighetsförstärkningarna från naturens kraft ökar till _50 % och 200 %_, från 33 % och 100 %.
actors.hero.talent.natures_wrath.title=naturens ilska
actors.hero.talent.natures_wrath.desc=_+1:_ När naturens kraft är aktiv har skott från andebågen _8 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\n_+2:_ När naturens kraft är aktiv har skott från andebågen _17 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\n_+3:_ När naturens kraft är aktiv har skott från andebågen _25 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\n_+4:_ När naturens kraft är aktiv har skott från andebågen _33 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\nVäxter som kan utlösas är: blindweed, firebloom, icecap, sorrowmoss och stormvine.
actors.hero.talent.wild_momentum.title=vild drivkraft
actors.hero.talent.wild_momentum.desc=_+1:_ Att döda en fiende med andebågen förlänger naturens kraft med _1 tur_. Varaktigheten kan förlängas med högst _2 turer_.\n\n_+2:_ Att döda en fiende med andebågen förlänger naturens kraft med _2 turer_. Varaktigheten kan förlängas med högst _4 turer_.\n\n_+3:_ Att döda en fiende med andebågen förlänger naturens kraft med _3 turer_. Varaktigheten kan förlängas med högst _6 turer_.\n\n_+4:_ Att döda en fiende med andebågen förlänger naturens kraft med _4 turer_. Varaktigheten kan förlängas med högst _8 turer_.

actors.hero.talent.eagle_eye.title=örnöga
actors.hero.talent.eagle_eye.desc=_+1:_ Andehökens synfält ökar från 6 till _7 rutor_.\n\n_+2:_ Andehökens synfält ökar från 6 till _8 rutor_.\n\n_+3:_ Andehökens synfält ökar från 6 till _9 rutor_ och den får sinnessyn på _2 rutor_.\n\n_+4:_ Andehökens synfält ökar från 6 till _10 rutor_ och den får sinnessyn på _3 rutor_.
actors.hero.talent.go_for_the_eyes.title=sikta på ögonen
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Andehökens attacker förblindar fiender i _2 turer_.\n\n_+2:_ Andehökens attacker förblindar fiender i _5 turer_.\n\n_+3:_ Andehökens attacker förblindar fiender i _5 turer_ och förlamar dem i _2 turer_.\n\n_+4:_ Andehökens attacker förblindar fiender i _5 turer_ och förlamar dem i _5 turer_.
actors.hero.talent.swift_spirit.title=snabb ande
actors.hero.talent.swift_spirit.desc=_+1:_ Andehökens rörelsehastighet ökar från 2 till _2,5 rutor_ och den undviker garanterat de första _2 attackerna_ som riktas mot den.\n\n_+2:_ Andehökens rörelsehastighet ökar från 2 till _3 rutor_ och den undviker garanterat de första _4 attackerna_ som riktas mot den.\n\n_+3:_ Andehökens rörelsehastighet ökar från 2 till _3,5 rutor_ och den undviker garanterat de första _6 attackerna_ som riktas mot den.\n\n_+4:_ Andehökens rörelsehastighet ökar från 2 till _4 rutor_ och den undviker garanterat de första _8 attackerna_ som riktas mot den.

#duelist
actors.hero.talent.strengthening_meal.title=stärkande måltid
actors.hero.talent.strengthening_meal.desc=_+1:_ När Duellanten äter får hon 3 bonusskada de följande _2 gångerna_ hon träffar en fiende med en fysisk attack.\n\n_+2:_ När Duellanten äter får hon 3 bonusskada de följande _3 gångerna_ hon träffar en fiende med en fysisk attack.
actors.hero.talent.adventurers_intuition.title=äventyrarens intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ Duellanten identifierar vapen _2,5 gånger snabbare_ och rustningar _1,75 gånger snabbare_. \n\n_+2:_ Duellanten identifierar vapen _när hon utrustar sig med dem_ och rustningar _2,5 gånger snabbare_.
actors.hero.talent.patient_strike.title=tålmodigt slag
actors.hero.talent.patient_strike.desc=_+1:_ Om Duellanten väntar innan hon utför en närstridsattack orsakar hon _1–2 bonusskada_.\n\n_+2:_ Om Duellanten väntar innan hon utför en närstridsattack orsakar hon _2 bonusskada_.
actors.hero.talent.aggressive_barrier.title=aggressiv barriär
actors.hero.talent.aggressive_barrier.desc=_+1:_ Duellanten får _3 sköld_ när hon använder en vapenförmåga och har högst 50 % hälsa.\n\n_+2:_ Duellanten får _5 sköld_ när hon använder en vapenförmåga och har högst 50 % hälsa.
actors.hero.talent.aggressive_barrier.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att ge sköld när en närstridsattack utförs vid låg hälsa, med en nedkylningstid på 50 turer.

actors.hero.talent.focused_meal.title=fokuserad måltid
actors.hero.talent.focused_meal.desc=_+1:_ När Duellanten äter tar det 1 tur och ger henne _0,67 laddningar_ till vapnen.\n\n_+2:_ När Duellanten äter tar det 1 tur och ger henne _1 laddning_ till vapnen.
actors.hero.talent.focused_meal.meta_desc=_Om denna talang erhålls av en annan hjälte_ ger den istället bonusskada till deras nästa träff motsvarande deras nivå/3 vid +1, eller nivå/2 vid +2.
actors.hero.talent.liquid_agility.title=flytande smidighet
actors.hero.talent.liquid_agility.desc=_+1:_ När Duellanten dricker eller kastar en dryck, brygd eller elixir får hon _tre gånger så hög undvikande_ och _tre gånger så hög träffsäkerhet_ på sin nästa närstridsattack inom 5 turer.\n\n_+2:_ När Duellanten dricker eller kastar en dryck, brygd eller elixir får hon _oändligt undvikande_ och _oändlig träffsäkerhet_ på sin nästa närstridsattack inom 5 turer.\n\nDenna bonus varar i ytterligare en tur och attack när du använder styrke- eller erfarenhetsdrycker, eller alkemiföremål som tillverkats med sådana drycker.\n\nFör alkemiföremål som ger flera resultat (t.ex. vattenbrygd) kan talangen utlösas beroende på hur många av föremålet som tillverkas.
actors.hero.talent.weapon_recharging.title=vapenuppladdning
actors.hero.talent.weapon_recharging.desc=_+1:_ Duellanten får en vapenladdning var 15:e tur när hon påverkas av förstärkningar som laddar om trollstavar eller artefakter.\n\n_+2:_ Duellanten får en vapenladdning var 10:e tur när hon påverkas av förstärkningar som laddar om trollstavar eller artefakter.
actors.hero.talent.weapon_recharging.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att orsaka +5 % närstridsskada vid +1, eller +7,5 % närstridsskada vid +2.
actors.hero.talent.lethal_haste.title=dödlig hast
actors.hero.talent.lethal_haste.desc=_+1:_ När Duellanten utdelar ett dödande slag mot en fiende med en vapenförmåga får hon _3 turers_ omedelbar rörelse.\n\n_+2:_ När Duellanten utdelar ett dödande slag mot en fiende med en vapenförmåga får hon _5 turers_ omedelbar rörelse.
actors.hero.talent.lethal_haste.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att aktiveras vid vanliga vapenattacker, med en nedkylningstid på 100 turer.
actors.hero.talent.swift_equip.title=kvick utrustning
actors.hero.talent.swift_equip.desc=_+1:_ Duellanten kan byta utrustat vapen omedelbart _en gång_ var 20:e tur.\n\n_+2:_ Duellanten kan byta utrustat vapen omedelbart _två gånger_ var 20:e tur.\n\nOm Duellanten har denna talang och den inte har någon nedkylning utrustas ett vapen som inte är utrustat när det snabbanvänds.

actors.hero.talent.precise_assault.title=precis attack
actors.hero.talent.precise_assault.desc=_+1:_ När Duellanten använder en vapenförmåga får hon _dubbelt så hög träffsäkerhet_ på sin nästa närstridsattack inom 5 turer.\n\n_+2:_ När Duellanten använder en vapenförmåga får hon _fem gånger så hög träffsäkerhet_ på sin nästa närstridsattack inom 5 turer.\n\n_+3:_ När Duellanten använder en vapenförmåga får hon _oändlig träffsäkerhet_ på sin nästa närstridsattack inom 5 turer.
actors.hero.talent.precise_assault.meta_desc=_Om denna talang erhålls av en annan hjälte_ ökar istället närstrids precisionen med 10% vid +1, 20% vid +2 eller 30% vid +3.
actors.hero.talent.deadly_followup.title=dödlig uppföljning
actors.hero.talent.deadly_followup.desc=_+1:_ När Duellanten träffar en fiende med ett kastvapen orsakar hon _10 % mer närstridsskada_ på den i 5 turer.\n\n_+2:_ När Duellanten träffar en fiende med ett kastvapen orsakar hon _20 % mer närstridsskada_ på den i 5 turer.\n\n_+3:_ När Duellanten träffar en fiende med ett kastvapen orsakar hon _30 % mer närstridsskada_ på den i 5 turer.

actors.hero.talent.varied_charge.title=varierad laddning
actors.hero.talent.varied_charge.desc=_+1:_ Kämpen återfår omedelbart _0,17 vapenladdningar_ när hon använder två olika vapenförmågor, utan tidsbegränsning.\n\n_+2:_ Kämpen återfår omedelbart _0,33 vapenladdningar_ när hon använder två olika vapenförmågor, utan tidsbegränsning.\n\n_+3:_ Kämpen återfår omedelbart _0,5 vapenladdningar_ när hon använder två olika vapenförmågor, utan tidsbegränsning.
actors.hero.talent.twin_upgrades.title=tvillinguppgraderingar
actors.hero.talent.twin_upgrades.desc=_+1:_ Om ett av Kämpens två utrustade vapen har lägre nivå och är _2 eller fler nivåer lägre_ än det andra vapnet förstärks det till det andra vapnets nivå.\n\n_+2:_ Om ett av Kämpens två utrustade vapen har lägre nivå och är _1 eller fler nivåer lägre_ än det andra vapnet förstärks det till det andra vapnets nivå.\n\n_+3:_ Om ett av Kämpens två utrustade vapen har lägre nivå och är _av samma nivå eller lägre_ än det andra vapnet förstärks det till det andra vapnets nivå.
actors.hero.talent.combined_lethality.title=kombinerad dödlighet
actors.hero.talent.combined_lethality.desc=_+1:_ Om Kämpen attackerar med ett närstridsvapen omedelbart efter att ha använt ett annat vapens förmåga avrättar attacken varje fiende som inte är en boss och har _mindre än 13 % HP_ kvar.\n\n_+2:_ Om Kämpen attackerar med ett närstridsvapen omedelbart efter att ha använt ett annat vapens förmåga avrättar attacken varje fiende som inte är en boss och har _mindre än 27 % HP_ kvar.\n\n_+3:_ Om Kämpen attackerar med ett närstridsvapen omedelbart efter att ha använt ett annat vapens förmåga avrättar attacken varje fiende som inte är en boss och har _mindre än 40 % HP_ kvar.\n\nAttacken kan vara en vanlig närstridsattack eller en del av en vapenförmåga.

actors.hero.talent.unencumbered_spirit.title=obehindrad ande
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Munken får _50 % mer energi_ för varje utrustningsdel av _nivå 3 eller lägre_ som hon använder.\n\n_+2:_ Munken får _75 % mer energi_ för varje utrustningsdel av _nivå 2 eller lägre_ som hon använder. Fördelen för nivå 3 är oförändrad.\n\n_+3:_ Munken får _100 % mer energi_ för varje utrustningsdel av _nivå 1 eller lägre_ som hon använder. Fördelarna för nivå 2 och 3 är oförändrade. Hon får också en gratis tygrustning och nitförsedda handskar.\n\nObservera att talangen inte ger någon fördel när hjälten är obeväpnad eller attackerar med en kraftens ring.
actors.hero.talent.monastic_vigor.title=munkens kraft
actors.hero.talent.monastic_vigor.desc=_+1:_ Om Munken har _100 % energi_ förstärks hennes förmågor.\n\n_+2:_ Om Munken har _minst 80 % energi_ förstärks hennes förmågor.\n\n_+3:_ Om Munken har _minst 60 % energi_ förstärks hennes förmågor.\n\nNär förmågorna är förstärkta:\n- Flurry använder vapnets förtrollning\n- Fokus aktiveras omedelbart\n- Dash får +4 räckvidd\n- Dragon Kick orsakar +50 % skada och tillämpar återstötning och bedövning på alla intilliggande fiender\n- Meditate läker långsamt 20 % av saknad HP och ger 80 % skaderesistens.
actors.hero.talent.combined_energy.title=kombinerad energi
actors.hero.talent.combined_energy.desc=_+1:_ Om Munken använder en vapenförmåga och en förmåga som kostar _minst 4 energi_ inom 5 turer från varandra återfår hon 1 förbrukad energi.\n\n_+2:_ Om Munken använder en vapenförmåga och en förmåga som kostar _minst 3 energi_ inom 5 turer från varandra återfår hon 1 förbrukad energi.\n\n_+3:_ Om Munken använder en vapenförmåga och en förmåga som kostar _minst 2 energi_ inom 5 turer från varandra återfår hon 1 förbrukad energi.

actors.hero.talent.close_the_gap.title=minska avståndet
actors.hero.talent.close_the_gap.desc=_+1:_ Duellanten förflyttar sig upp till _två rutor_ mot sitt mål när hon startar en duell.\n\n_+2:_ Duellanten förflyttar sig upp till _tre rutor_ mot sitt mål när hon startar en duell.\n\n_+3:_ Duellanten förflyttar sig upp till _fyra rutor_ mot sitt mål när hon startar en duell.\n\n_+4:_ Duellanten förflyttar sig upp till _fem rutor_ mot sitt mål när hon startar en duell.\n\nFörflyttningen kan passera faror och fiender, men inte fast terräng som väggar. Den räknas med när spelet avgör om en fiende är inom räckvidd för att utmanas.
actors.hero.talent.invigorating_victory.title=uppfriskande seger
actors.hero.talent.invigorating_victory.desc=_+1:_ Om Duellanten besegrar sitt mål innan duellen avslutas läker hon _5 HP plus 30 % av skadan_ hon tog under duellen.\n\n_+2:_ Om Duellanten besegrar sitt mål innan duellen avslutas läker hon _10 HP plus 50 % av skadan_ hon tog under duellen.\n\n_+3:_ Om Duellanten besegrar sitt mål innan duellen avslutas läker hon _15 HP plus 65 % av skadan_ hon tog under duellen.\n\n_+4:_ Om Duellanten besegrar sitt mål innan duellen avslutas läker hon _20 HP plus 75 % av skadan_ hon tog under duellen.
actors.hero.talent.elimination_match.title=eliminationsmatch
actors.hero.talent.elimination_match.desc=_+1:_ Om Duellanten utmanar igen inom 3 turer efter att en duell har avslutats har utmaningen en _16 % lägre_ laddningskostnad.\n\n_+2:_ Om Duellanten utmanar igen inom 3 turer efter att en duell har avslutats har utmaningen en _30 % lägre_ laddningskostnad.\n\n_+3:_ Om Duellanten utmanar igen inom 3 turer efter att en duell har avslutats har utmaningen en _40 % lägre_ laddningskostnad.\n\n_+4:_ Om Duellanten utmanar igen inom 3 turer efter att en duell har avslutats har utmaningen en _50 % lägre_ laddningskostnad.

actors.hero.talent.elemental_reach.title=elementär räckvidd
actors.hero.talent.elemental_reach.desc=_+1:_ Det elementära slagets räckvidd ökar från 4 till _5 rutor_ och bredden från 65 till _75 grader_.\n\n_+2:_ Det elementära slagets räckvidd ökar från 4 till _6 rutor_ och bredden från 65 till _85 grader_.\n\n_+3:_ Det elementära slagets räckvidd ökar från 4 till _7 rutor_ och bredden från 65 till _95 grader_.\n\n_+4:_ Det elementära slagets räckvidd ökar från 4 till _8 rutor_ och bredden från 65 till _105 grader_.
actors.hero.talent.striking_force.title=slagkraft
actors.hero.talent.striking_force.desc=_+1:_ Det elementära slagets effekt ökar med _30 %_.\n\n_+2:_ Det elementära slagets effekt ökar med _60 %_.\n\n_+3:_ Det elementära slagets effekt ökar med _90 %_.\n\n_+4:_ Det elementära slagets effekt ökar med _120 %_.
actors.hero.talent.directed_power.title=riktad kraft
actors.hero.talent.directed_power.desc=_+1:_ Det elementära slagets direkta attack får _+30 % förtrollningskraft_ för varje fiende inom effekträckvidden, inklusive attackmålet.\n\n_+2:_ Det elementära slagets direkta attack får _+60 % förtrollningskraft_ för varje fiende inom effekträckvidden, inklusive attackmålet.\n\n_+3:_ Det elementära slagets direkta attack får _+90 % förtrollningskraft_ för varje fiende inom effekträckvidden, inklusive attackmålet.\n\n_+4:_ Det elementära slagets direkta attack får _+120 % förtrollningskraft_ för varje fiende inom effekträckvidden, inklusive attackmålet.

actors.hero.talent.feigned_retreat.title=skenreträtt
actors.hero.talent.feigned_retreat.desc=_+1:_ Om en fiende attackerar Duellantens efterbild får hon _2 turer_ av hastighet.\n\n_+2:_ Om en fiende attackerar Duellantens efterbild får hon _4 turer_ av hastighet.\n\n_+3:_ Om en fiende attackerar Duellantens efterbild får hon _6 turer_ av hastighet.\n\n_+4:_ Om en fiende attackerar Duellantens efterbild får hon _8 turer_ av hastighet.
actors.hero.talent.expose_weakness.title=blotta svaghet
actors.hero.talent.expose_weakness.desc=_+1:_ Fiender som attackerar Duellantens efterbild blir svaga och sårbara i _2 turer_.\n\n_+2:_ Fiender som attackerar Duellantens efterbild blir svaga och sårbara i _4 turer_.\n\n_+3:_ Fiender som attackerar Duellantens efterbild blir svaga och sårbara i _6 turer_.\n\n_+4:_ Fiender som attackerar Duellantens efterbild blir svaga och sårbara i _8 turer_.
actors.hero.talent.counter_ability.title=motförmåga
actors.hero.talent.counter_ability.desc=_+1:_ Om Duellanten använder en vapenförmåga inom 3 turer efter att hennes efterbild har attackerats återfår hon omedelbart _0,38 laddningar_.\n\n_+2:_ Om Duellanten använder en vapenförmåga inom 3 turer efter att hennes efterbild har attackerats återfår hon omedelbart _0,77 laddningar_.\n\n_+3:_ Om Duellanten använder en vapenförmåga inom 3 turer efter att hennes efterbild har attackerats, återfår hon omedelbart _1,13 laddningar_.\n\n_+4:_ Om Duellanten använder en vapenförmåga inom 3 turer efter att hennes efterbild har attackerats, återfår hon omedelbart _1,5 laddningar_.

#cleric
actors.hero.talent.satiated_spells.title=Mättade trollformler
actors.hero.talent.satiated_spells.desc=_+1:_ När Prästen äter får hen _3 sköld_ nästa gång hen kastar en besvärjelse.\n\n_+2:_ När Prästen äter får hen _5 sköld_ nästa gång hen kastar en besvärjelse.
actors.hero.talent.satiated_spells.meta_desc=_Om denna talang erhålls av en annan hjälte_ ger den i stället sköld omedelbart, som sedan börjar avta normalt efter 10 turer.
actors.hero.talent.holy_intuition.title=helig intuition
actors.hero.talent.holy_intuition.desc=_+1:_ Prästen kan kasta _Helig intuition,_ en besvärjelse som avslöjar om ett föremål är förbannat till en kostnad av _3 laddningar._\n\n_+2:_ Prästen kan kasta _Helig intuition,_ en besvärjelse som avslöjar om ett föremål är förbannat till en kostnad av _2 laddningar._
actors.hero.talent.holy_intuition.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att låta hjälten identifiera förbannelsen på ett förbannat föremål precis innan det utrustas, 15 % av gångerna vid +1 eller 25 % av gångerna vid +2.
actors.hero.talent.searing_light.title=brännande ljus
actors.hero.talent.searing_light.desc=_+1:_ Prästens fysiska attacker mot fiender som är upplysta av _Vägledande ljus_ orsakar _+3 skada._\n\n_+2:_ Prästens fysiska attacker mot fiender som är upplysta av _Vägledande ljus_ orsakar _+5 skada._
actors.hero.talent.searing_light.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att ge sin bonusskada efter att en trollstav eller artefakt har använts på en fiende, med en nedkylningstid på 20 turer.
actors.hero.talent.shield_of_light.title=sköld av ljus
actors.hero.talent.shield_of_light.desc=_+1:_ Prästen kan kasta _Ljussköld,_ en besvärjelse som aktiveras omedelbart och ger hen _2–4 rustning_ mot ett mål i 5 turer till en kostnad av 1 laddning.\n\n_+2:_ Prästen kan kasta _Ljussköld,_ en besvärjelse som aktiveras omedelbart och ger hen _3–6 rustning_ mot ett mål i 5 turer till en kostnad av 1 laddning.
actors.hero.talent.shield_of_light.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att minska den fysiska skadan som din målfiende tar med 1, 33 % av tiden vid +1 eller 50% av tiden vid +2.

actors.hero.talent.enlightening_meal.title=Upplysande måltid
actors.hero.talent.enlightening_meal.desc=_+1:_ När Prästen äter tar det 1 tur och ger hen _0,67 laddningar_ till sin heliga bok.\n\n_+2:_ När Prästen äter tar det 1 tur och ger hen _1 laddning_ till sin heliga bok.
actors.hero.talent.enlightening_meal.meta_desc=_Om denna talang erhålls av en annan hjälte_ ger den istället 2 turer med +1 i laddning av trollstav och artefakt, eller 3 turer med +2. Detta kan inte användas för att låta hornet av överflöd ladda sig själv.
actors.hero.talent.recall_inscription.title=Återkalla inskription
actors.hero.talent.recall_inscription.refunded=Ditt föremål har återbetalats!
actors.hero.talent.recall_inscription.desc=_+1:_ Prästen kan kasta _Återkalla inskription,_ en besvärjelse som låter hen upprepa effekten av den senaste runstenen eller skriftrullen som använts inom _10 turer._\n\n_+2:_ Prästen kan kasta _Återkalla inskription,_ en besvärjelse som låter hen upprepa effekten av den senaste runstenen eller skriftrullen som använts inom _300 turer._\n\nÅterkalla inskription kan inte användas med uppgraderingsskriftrullar. Besvärjelsens laddningskostnad varierar beroende på vilket föremål som nyligen använts: 2 för en runsten, 3 för en skriftrulle och 4 för en exotisk skriftrulle. Laddningskostnaden fördubblas också med en transmutationsskriftrulle eller alkemiföremål som tillverkats genom transmutation eller uppgradering.
actors.hero.talent.recall_inscription.meta_desc=_Om denna talang erhålls av en annan hjälte_ återbetalas istället alla pergamentrullar eller runstenar 10% av tiden vid +1 eller 15% av tiden vid +2. Uppgraderingsskriftrullar är undantagna från denna effekt.
actors.hero.talent.sunray.title=Solstråle
actors.hero.talent.sunray.desc=_+1:_ Prästen kan kasta _Solstråle,_ en besvärjelse som orsakar _4–8 skada_ och förblindar målet i _4 turer,_ till en kostnad av 1 laddning.\n\n_+2:_ Prästen kan kasta _Solstråle,_ en besvärjelse som orsakar _6–12 skada_ och förblindar målet i _6 turer,_ till en kostnad av 1 laddning.\n\nSolstråle kan bara förblinda varje mål en gång, men om målet redan har förblindats av Solstråle förlamas det i stället. Solstråle orsakar alltid maximal skada på demoniska och odöda fiender.
actors.hero.talent.sunray.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att göra att trollstavar och artefakter förblindar fiender i 4 turer, 15 % av tiden vid +1 eller 25 % av tiden vid +2.
actors.hero.talent.divine_sense.title=Gudomlig känsla
actors.hero.talent.divine_sense.desc=_+1:_ Prästen kan kasta _Gudomlig känsla,_ en besvärjelse som ger hen _8 rutors_ sinnessyn i 50 turer och aktiveras utan tidsåtgång till en kostnad av 2 laddningar.\n\n_+2:_ Prästen kan kasta _Gudomlig känsla,_ en besvärjelse som ger hen _12 rutors_ sinnessyn i 50 turer och aktiveras utan tidsåtgång till en kostnad av 2 laddningar.
actors.hero.talent.divine_sense.meta_desc=_Om denna talang erhålls av en annan hjälte_ ger den istället mind vision under en kort stund efter att en trollstav eller artefakt med en räckvidd på 3 rutor vid +1 eller 5 rutor vid +2 har använts.
actors.hero.talent.bless.title=Välsigna
actors.hero.talent.bless.desc=_+1:_ Prästen kan kasta _Välsigna,_ en besvärjelse som ger _6 turers välsignelse och 10 sköld_ när den kastas på hen själv eller _10 turers välsignelse och 10 läkning_ när den kastas på en annan karaktär, till en kostnad av 1 laddning.\n\n_+2:_ Prästen kan kasta _Välsigna,_ en besvärjelse som ger _10 turers välsignelse och 15 sköld_ när den kastas på hen själv eller _15 turers välsignelse och 15 läkning_ när den kastas på en annan karaktär, till en kostnad av 1 laddning.\n\nÖverskottsläkning från besvärjelsen omvandlas till sköld.
actors.hero.talent.bless.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att öka träffsäkerheten och undvikandet för hjälten och alla allierade med 3 % vid +1 eller 5 % vid +2.

actors.hero.talent.cleanse.title=Rensa
actors.hero.talent.cleanse.desc=_+1:_ Prästen kan kasta _Rensa,_ en besvärjelse som _tar bort negativa statuseffekter_ från Prästen och närliggande allierade och ger dem _10 sköld,_ till en kostnad av 2 laddningar.\n\n_+2:_ Prästen kan kasta _Rensa,_ en besvärjelse som ger Prästen och närliggande allierade _3 turers immunitet mot negativa statuseffekter_ och ger dem _20 sköld,_ till en kostnad av 2 laddningar.\n\n_+3:_ Prästen kan kasta _Rensa,_ en besvärjelse som ger Prästen och närliggande allierade _5 turers immunitet mot negativa statuseffekter_ och ger dem _30 sköld,_ till en kostnad av 2 laddningar.
actors.hero.talent.cleanse.meta_desc=_Om denna talang erhålls av en annan hjälte_ rensar den i stället hjälten från negativa statuseffekter efter användning av en trollstav eller artefakt, 10/20/30 % av gångerna vid +1/+2/+3.
actors.hero.talent.light_reading.title=Lätt läsning
actors.hero.talent.light_reading.desc=_+1:_ Prästen kan använda sin heliga bok när den inte är utrustad, men den laddas om med _25 % hastighet_ när den inte är utrustad.\n\n_+2:_ Prästen kan använda sin heliga bok när den inte är utrustad, men den laddas om med _50 % hastighet_ när den inte är utrustad.\n\n_+3:_ Prästen kan använda sin heliga bok när den inte är utrustad, men den laddas om med _75 % hastighet_ när den inte är utrustad.
actors.hero.talent.light_reading.meta_desc=_Om denna talang erhålls av en annan hjälte_ ökar den i stället laddningshastigheten för alla trollstavar med 7/13/20 % vid +1/+2/+3.

actors.hero.talent.holy_lance.title=Heliga lans
actors.hero.talent.holy_lance.desc=_+1:_ Prästen kan kasta _Helig lans,_ en förödande besvärjelse som orsakar _30–55 skada_ till en kostnad av 4 laddningar.\n\n_+2:_ Prästen kan kasta _Helig lans,_ en förödande besvärjelse som orsakar _45–83 skada_ till en kostnad av 4 laddningar.\n\n_+3:_ Prästen kan kasta _Helig lans,_ en förödande besvärjelse som orsakar _60–110 skada_ till en kostnad av 4 laddningar.\n\nHelig lans orsakar alltid maximal skada på demoniska och odöda fiender. Helig lans har en nedkylning på 30 turer innan den kan kastas igen.
actors.hero.talent.hallowed_ground.title=helgad mark
actors.hero.talent.hallowed_ground.desc=_+1:_ Prästen kan kasta _Hallowed Ground,_ en besvärjelse som helgar terrängen i ett _3x3-område_ i 20 turer, till en kostnad av 2 laddningar.n\n\n_+2:_ Prästen kan kasta _Hallowed Ground,_ en besvärjelse som helgar marken i ett _5x5-område_ i 20 turer, till en kostnad av 2 laddningar.\n\n_+3:_ Prästen kan kasta _Hallowed Ground,_ en besvärjelse som helgar marken i ett _7x7-område_ i 20 turer, till en kostnad av 2 laddningar.\n\nNär den kastas läker Hallowed Ground allierade för 15 HP, rotar fiender tillfälligt och sprider kort gräs. Därefter läker den långsamt allierade, förlamar fiender och får högt gräs att växa slumpmässigt. Hallowed Ground ger prästen skydd istället för läkning och förstörs av eld.
actors.hero.talent.mnemonic_prayer.title=minnesbön
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Prästen kan kasta _Mnemonic Prayer_, en besvärjelse som förlänger buffs/debuffs på en allierad/fiende i _3 turer_ till en kostnad av 1 laddning.\n\n_+2:_ Prästen kan kasta _Mnemonic Prayer_, en besvärjelse som förlänger buffs/debuffs på en allierad/fiende i _4 turer_ till en kostnad av 1 laddning.\n\n_+3:_ Prästen kan kasta _Mnemonic Prayer_, en besvärjelse som förlänger buffs/debuffs på en allierad/fiende i _5 turer_ till en kostnad av 1 laddning.\n\nMnemonic Prayer tar ingen tid att kasta. Mnemonic Prayer kan bara förlänga en viss buff/debuff en gång och kan inte förlänga buffs från rustningsförmågor.

actors.hero.talent.lay_on_hands.title=handpåläggning
actors.hero.talent.lay_on_hands.desc=_+1:_ Paladinen kan kasta _Handpåläggning,_ en besvärjelse som omedelbart läker en närliggande karaktär med _15 HP,_ eller ger Paladinen _15 sköld,_ till en kostnad av 1 laddning.\n\n_+2:_ Paladinen kan kasta _Handpåläggning,_ en besvärjelse som omedelbart läker en närliggande karaktär med _20 HP,_ eller ger Paladinen _20 sköld,_ till en kostnad av 1 laddning.\n\n_+3:_ Paladinen kan kasta _Handpåläggning,_ en besvärjelse som omedelbart läker en närliggande karaktär med _25 HP,_ eller ger Paladinen _25 sköld,_ till en kostnad av 1 laddning.\n\nÖverskottsläkning från besvärjelsen omvandlas till sköld. Handpåläggning kan kastas upprepade gånger, men kan inte ge mer än sköld motsvarande tre kast samtidigt.
actors.hero.talent.aura_of_protection.title=skyddsaura
actors.hero.talent.aura_of_protection.desc=_+1:_ Paladinen kan kasta _Aura of Protection_, en besvärjelse som ger paladinen och alla allierade inom 2 rutor _20% skaderesistens_ och effekten av paladinens rustningsglyf med _+50% kraft_ i 20 turer, till en kostnad av 2 laddningar.n\n_+2:_ Paladinen kan kasta _Skyddsaura_, en besvärjelse som ger paladinen och alla allierade inom 2 rutor _30% skaderesistens_ och effekten av paladinens rustningsglyf med _+75% kraft_ i 20 turer, till en kostnad av 2 laddningar.\n\n_+3:_ Paladinen kan kasta _Skyddsaura_, en besvärjelse som ger paladinen och alla allierade inom 2 rutor _40% skaderesistens_ och effekten av paladinens rustningsglyf med _+100% kraft_ i 20 turer, till en kostnad av 2 laddningar.
actors.hero.talent.wall_of_light.title=ljusvägg
actors.hero.talent.wall_of_light.desc=_+1:_ Paladinen kan kasta _Ljusvägg,_ en besvärjelse som skapar en _3 rutor bred_ solid vägg framför Paladinen som stöter bort fiender och varar i 20 turer, till en kostnad av 3 laddningar.\n\n_+2:_ Paladinen kan kasta _Ljusvägg,_ en besvärjelse som skapar en _5 rutor bred_ solid vägg framför Paladinen som stöter bort fiender och varar i 20 turer, till en kostnad av 3 laddningar.\n\n_+3:_ Paladinen kan kasta _Ljusvägg,_ en besvärjelse som skapar en _7 rutor bred_ solid vägg framför Paladinen som stöter bort fiender och varar i 20 turer, till en kostnad av 3 laddningar.\n\nVäggen kan placeras i huvudriktningarna eller diagonalt. Endast en vägg kan finnas åt gången.

actors.hero.talent.divine_intervention.title=gudomligt ingripande
actors.hero.talent.divine_intervention.desc=_+1:_ Vid upphöjd form kan prästen kasta _Gudomlig ingripande_, som ger prästen och alla allierade upp till _150 sköld_ och förlänger upphöjd form med _3 turer._\n\n_+2:_ Vid upphöjd form kan prästen kasta _Gudomlig ingripande_, som ger prästen och alla allierade upp till _200 sköld_ och förlänger upphöjd form med _4 turer._\n\n_+3:_ I upphöjd form kan prästen kasta _Gudomlig ingripande_, som ger prästen och alla allierade upp till _250 sköld_ och förlänger upphöjd form med _5 turer._\n\n_+4:_ I upphöjd form kan prästen kasta _Gudomligt ingripande_, som ger prästen och alla allierade upp till _300 sköld_ och förlänger upphöjd form med _6 turer._\n\nGudomligt ingripande kostar hela 5 bokladdningar och kan bara kastas en gång i samma upphöjda form.
actors.hero.talent.judgement.title=dom
actors.hero.talent.judgement.desc=_+1:_ I upphöjd form kan prästen kasta _Domen,_ som gör _10-20 skada_ på alla synliga fiender.\n\n_+2:_ I upphöjd form kan prästen kasta _Domen,_ som gör _15-30 skada_ på alla synliga fiender.\n\n_+3:_ I upphöjd form kan prästen kasta _Domen,_ som gör _20-40 skada_ på alla synliga fiender.\n\n_+4:_ I upphöjd form kan prästen kasta _Domen,_ som gör _25-50 skada_ på alla synliga fiender.\n\nDomen kostar 3 bokladdningar. Domen orsakar +33 % skada för varje besvärjelse som prästen har kastat sedan han gick in i upphöjd form eller sedan den senaste kastningen av Domen.
actors.hero.talent.flash.title=blixt
actors.hero.talent.flash.desc=_+1:_ Vid upphöjd form kan prästen kasta _Blixt_ för att teleportera sig upp till _3 rutor_ bort.\n\n_+2:_ Vid upphöjd form kan prästen kasta _Blixt_ för att teleportera sig upp till _4 rutor_ bort.\n\n_+3:_ I upphöjd form kan prästen kasta _Blixt_ för att teleportera sig upp till _5 rutor_ bort.\n\n_+4:_ I upphöjd form kan prästen kasta _Blixt_ för att teleportera sig upp till _6 rutor_ bort.\n\nFlash kostar initialt 2 bokladdningar och 1 laddning för varje användning i samma upphöjda form.

actors.hero.talent.body_form.title=kroppsform
actors.hero.talent.body_form.desc=Prästen kan kasta _Kroppsform_, som ger treenigheten kraften från en förtrollning eller glyf som prästen har identifierat under denna omgång, till en kostnad av 2 laddningar.\n\n_+1:_ När treenigheten används får prästen den valda effekten i _20 turer._\n\n_+2:_ När treenigheten används får prästen den valda effekten i _27 turer._\n\n_+3:_ När treenigheten används får prästen den valda effekten i _33 turer._\n\n_+4:_ När treenigheten används får prästen den valda effekten i _40 turer._\n\nTreenigheten kan bara förses med en kroppseffekt åt gången. Treenighetens rustningskostnad är högre om den valda glyfen är sällsynt och kraftfull.
actors.hero.talent.mind_form.title=sinnesform
actors.hero.talent.mind_form.desc=Prästen kan kasta _Sinnesform_, som ger treenigheten kraften från en trollstav eller ett kastvapen som prästen har använt under denna omgång, till en kostnad av 3 laddningar.\n\n_+1:_ När treenigheten används använder prästen den valda föremålets zap- eller kasta-effekt, som om den vore _+3._\n\n_+2:_ När treenigheten används använder prästen den valda föremålets zap- eller kasta-effekt, som om den vore _+4._\n\n_+3:_ När treenigheten används använder prästen den valda föremålets zap- eller kasta-effekt som om den vore _+5._\n\n_+4:_ När treenigheten används använder prästen den valda föremålets zap- eller kasta-effekt som om den vore _+6._\n\nTreenigheten kan endast förses med en sinneseffekt åt gången.
actors.hero.talent.spirit_form.title=andeform
actors.hero.talent.spirit_form.desc=Prästen kan kasta _Andeform_, som förser treenigheten med kraften från en ring eller artefakt som prästen har identifierat under denna omgång (förutom den heliga boken), till en kostnad av 4 laddningar.\n\n_+1:_ När treenigheten används får prästen en rings effekt på _+1_ i 20 turer, eller utlöser en artefakts effekt på _+4._\n\n_+2:_ När treenigheten används får prästen en rings effekt på _+2_ i 20 turer, eller utlöser en artefakts effekt på _+6._\n\n_+3:_ När treenigheten används får prästen en ringeffekt på _+3_ i 20 turer, eller utlöser en artefakts effekt vid _+8._\n\n_+4:_ När treenigheten används får prästen en ringeffekt på _+4_ i 20 turer, eller utlöser en artefakts effekt vid _+10.n\n\nTreenigheten kan endast förses med en andeeffekt åt gången. Artefakter har olika effekter och rustningsladdningskostnader när de utlöses av treenigheten.

actors.hero.talent.beaming_ray.title=strålande stråle
actors.hero.talent.beaming_ray.desc=Prästen kan kasta _Strålande stråle_ från en förstärkt allierad till en kostnad av 1 laddning. Denna stråle kan gå igenom väggar och teleporterar allierade till en vald plats. Om en fiende befinner sig på den platsen, dyker allierade upp bredvid fienden och riktar in sig på denne. Strålande stråle kan även teleportera allierade som normalt är orörliga, men har då halva räckvidden.n\n_+1:_ Strålande stråle har en maximal räckvidd på _4 rutor_ och ökar bonusen från Många makter till _+35% skada_ mot närmaste fiende i 10 turer.\n\n_+2:_ Strålande stråle har en maximal räckvidd på _8 rutor_ och ökar bonusen från Mångas kraft till _+40% skada_ mot närmaste fiende i 10 turer.\n\n_+3:_ Strålande stråle har en maximal räckvidd på _12 rutor_ och ökar Mångas kraft-bonusen till _+45% skada_ mot närmaste fiende i 10 turer.\n\n_+4:_ Strålande stråle har en maximal räckvidd på _16 rutor_ och ökar Mångas kraft-bonusen till _+50% skada_ mot närmaste fiende i 10 turer.
actors.hero.talent.life_link.title=livslänk
actors.hero.talent.life_link.desc=Prästen kan kasta Livslänk mellan sig själv och en förstärkt allierad till en kostnad av 2 laddningar. Denna besvärjelse gör att skada delas mellan prästen och deras allierade, och gör att fördelaktiga prästbesvärjelser av nivå 3 eller lägre gäller för båda om någon av dem påverkas.n\n_+1:_ Livslänk varar i _10 turer_ och ökar bonusen från Många makt till _-35% skada som tas._\n\n_+2:_ Livslänk varar i _13 turer_ och ökar bonusen från Många makt till _-40% skada som tas._\n\n_+3:_ Livslänk varar i _17 turer_ och ökar bonusen från Många makter till _-45% skada som tas._\n\n_+4:_ Livslänk varar i _20 turer_ och ökar bonusen från Många makter till _-50% skada som tas._
actors.hero.talent.stasis.title=Stasis
actors.hero.talent.stasis.desc=Prästen kan kasta _Stasis_ på en förstärkt allierad till en kostnad av 2 laddningar. Stasis tar tillfälligt bort allierade från fängelsehålan och bevarar den återstående tiden på alla buffar, inklusive Power of Many. Allierade återkommer bredvid dig när effekten upphör. Stasis kan kastas omedelbart och utan kostnad för att avsluta effekten i förtid. Stasis fungerar på orörliga allierade, men kan inte flytta dem mellan fängelsehålor. \n\n_+1:_ Stasis varar i max _60 turer. \n\n_+2:_ Stasis varar i max _90 turer. \n\n_+3:_ Stasis varar i max _120 turer. \n\n_+4:_ Stasis varar i max _150 turer. \n\nn\nPrästen kan också kasta Beaming Ray när en allierad är i stasis för att återkalla dem, eller kasta Life Link för att förebyggande tillämpa dess effekt. Allierade drar dock inte nytta av Life Link vid stasis.


#universal
actors.hero.talent.heroic_energy.title=heroisk energi
actors.hero.talent.heroic_energy.rat_title=råtteroisk energi
actors.hero.talent.heroic_energy.desc=_+1:_ Hjältens rustningsförmåga har en _12 % lägre_ laddningskostnad.\n\n_+2:_ Hjältens rustningsförmåga har en _23 % lägre_ laddningskostnad.\n\n_+3:_ Hjältens rustningsförmåga har en _32 % lägre_ laddningskostnad.\n\n_+4:_ Hjältens rustningsförmåga har en _40 % lägre_ laddningskostnad.

actors.hero.talent.ratsistance.title=råttsistans
actors.hero.talent.ratsistance.desc=_+1:_ Fientliga fiender som har förvandlats till råttor orsakar _−10 % skada_.\n\n_+2:_ Fientliga fiender som har förvandlats till råttor orsakar _−19 % skada_.\n\n_+3:_ Fientliga fiender som har förvandlats till råttor orsakar _−27 % skada_.\n\n_+4:_ Fientliga fiender som har förvandlats till råttor orsakar _−35 % skada_.
actors.hero.talent.ratlomacy.title=Råttomani
actors.hero.talent.ratlomacy.desc=_+1:_ Att använda ratmogrify på en ratmogrifierad fiende gör den vänlig och förvandlingen permanent.\n\n_+2:_ Att använda ratmogrify på en ratmogrifierad fiende gör den vänlig, gör förvandlingen permanent och ger den _2 turers_ adrenalin.\n\n_+3:_ Att använda ratmogrify på en ratmogrifierad fiende gör den vänlig, gör förvandlingen permanent och ger den _4 turers_ adrenalin.\n\n_+4:_ Att använda ratmogrify på en ratmogrifierad fiende gör den vänlig, gör förvandlingen permanent och ger den _6 turers_ adrenalin.
actors.hero.talent.ratforcements.title=Råttstärkningar
actors.hero.talent.ratforcements.desc=_+1:_ Att använda ratmogrify på dig själv _frammanar 1_ allierad pungdjursråtta bredvid dig.\n\n_+2:_ Att använda ratmogrify på dig själv _frammanar 2_ allierade pungdjursråttor bredvid dig.\n\n_+3:_ Att använda ratmogrify på dig själv _frammanar 3_ allierade pungdjursråttor bredvid dig.\n\n_+4:_ Att använda ratmogrify på dig själv _frammanar 4_ allierade pungdjursråttor bredvid dig.



###npcs
actors.mobs.npcs.blacksmith.name=trollsmed
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hej människa! Du ser tuff ut.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hej människa! Du ser smart ut.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hej människa! Du ser lömsk ut.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hej människa! Du ser snabb ut.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hej människa! Du ser modig ut.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hej människa! Du ser viktig ut.
actors.mobs.npcs.blacksmith.intro_quest_start=Vill du vara till nytta, va? Jo, jag har något du kan göra. Jag byggde den här verkstaden ovanpå en gammal gruva, precis nedanför stegen. Ta den här hackan och bryt _40 stycken mörkguldmalm_ åt mig. Berget där nere är lagom mjukt, så _du kan bryta dig genom väggarna med lite ansträngning._\n\nVad menar du, hur jag ska betala? Din giriga …\n\nOkej, okej, jag kan smida åt dig. Se dig lycklig, jag är den enda smeden häromkring.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Var försiktig, gruvan är farlig för en liten människa som du. Den har varit övergiven ett tag och en massa kristaller har börjat växa där. De glänser, men är för ömtåliga för att vara värda något, och några magiska saker skyddar dem. De är rätt starka, så _var försiktig var du bryter_ annars drar du till dig deras uppmärksamhet.\n\nDet finns också en _jättekristall_ någonstans. Den är mycket tåligare, så var beredd på en strid om du börjar bryta sönder den. Jag slår vad om att det bromsar all kristalltillväxt, så jag betalar extra om du klarar det.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Var försiktig, gruvan är farlig för en liten människa som du. Några gnoller vill också ha guldet och förstör nu stället. De är dumma varelser, så deras gruvdrift har orsakat allehanda ras och grottinras. Du måste bryta dig igenom dem, så _leta efter nyligen rubbat berg._\n\nJag tror att en av gnollerna orsakar de flesta problemen, antagligen en _geomantisk schaman_ eller nåt. Jag betalar extra om du kan hitta och döda den, men den lär slå tillbaka.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Var försiktig, gruvan är farlig för en liten människa som du. Det finns någon sorts svampmonster som har vuxit där nere. Det har svampvakter som är dödliga om de ser dig, men de kan åtminstone inte resa sig och jaga dig. Håll dig utom synhåll om du vill överleva. Jag betalar extra om du lyckas döda den största svampen, men det kommer att kräva en hel del ansträngning. Den är kopplad till en massa mycelknutor som är gömda i väggarna. Du måste förstöra de flesta av dem innan du kan skada den ordentligt.
actors.mobs.npcs.blacksmith.reminder=Är du klar med att slösa min tid? Gruvingången är där borta.
actors.mobs.npcs.blacksmith.reminder_crystal=Ta med så mycket guld du kan och försök också att krossa den stora kristallen.
actors.mobs.npcs.blacksmith.reminder_gnoll=Ta med så mycket guld du kan och försök döda den geomantiska gnollschamanen också.
actors.mobs.npcs.blacksmith.reminder_fungi=Hämta så mycket guld du kan och försök också döda den gigantiska svampen.
actors.mobs.npcs.blacksmith.lost_pick=Skojar'u? Var är min hacka?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Är du redo att gå ner? Se till att du har lite ledigt utrymme för guldet.\n\n_Jag släpper ner dig bara en gång!_
actors.mobs.npcs.blacksmith.enter_yes=Jag är redo
actors.mobs.npcs.blacksmith.enter_no=Inte än
actors.mobs.npcs.blacksmith.exit_warn_none=Är du redan klar? Du har knappt något guld alls! Du borde kunna få _40 stycken._\n\n_Kom ihåg, jag släpper inte in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_low=Är du redan klar? Det ser inte ut som om du har mycket guld. Du borde kunna få _40 stycken._\n\n_Kom ihåg att jag inte släpper in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_med=Är du klar? Du har åtminstone lite guld, men det finns definitivt mer i gruvan. Du borde kunna få _40 stycken._\n\n_Kom ihåg att jag inte släpper in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_high=Är du klar? Det ser ut som om du har fått en hel del guld, men jag skulle behöva lite mer. Du borde kunna få _40 stycken._\n\n_Kom ihåg att jag inte släpper in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_full=Är du klar? Du har mycket guld, men se till att du inte har glömt något av din utrustning.\n\n_Kom ihåg att jag inte släpper in dig igen när du kommer upp._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Den där gigantiska kristallen är fortfarande där nere. Jag betalar extra om du förstör den.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Den geomantiska gnollschamanen är också kvar där nere. Jag betalar extra om du dödar den.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Den där gigantiska svampen är också kvar där nere. Jag betalar extra om du dödar den.
actors.mobs.npcs.blacksmith.exit_yes=Jag är klar
actors.mobs.npcs.blacksmith.exit_no=Inte än
actors.mobs.npcs.blacksmith.get_lost=Jag är upptagen! Stick och brinn!
actors.mobs.npcs.blacksmith.entrance_blocked=Vägen ner är blockerad.
actors.mobs.npcs.blacksmith.cant_enter_old=Det området är inte tillgängligt i det här spelet. Spela ett nytt spel för att prova det nya uppdraget!
actors.mobs.npcs.blacksmith.def_verb=blockerat
actors.mobs.npcs.blacksmith.desc=Den här trollsmeden ser ut som alla troll: lång och smal, med hud som liknar sten i både färg och struktur. Trollsmeden arbetar med oproportionerligt små verktyg.

actors.mobs.npcs.ghost.name=sorgset spöke
actors.mobs.npcs.ghost.rat_1=Hej %s... En gång var jag som du – stark och självsäker... Men jag blev dödad av ett vidrigt odjur... Jag kan inte lämna denna plats... Inte förrän jag har hämnats... Döda den _stinkande råttan_ som tog mitt liv...\n\nDen smyger omkring på golvet... Sprider smuts överallt... _Akta dig för dess stinkande moln och frätande bett, syran löses upp i vatten..._
actors.mobs.npcs.ghost.rat_2=Snälla... Hjälp mig... Döda den avskyvärda varelsen...\n\n_Bekämpa den nära vatten... Undvik stanken..._
actors.mobs.npcs.ghost.gnoll_1=Hej %s... En gång var jag som du – stark och självsäker... Men jag dödades av en lömsk fiende... Jag kan inte lämna denna plats... Inte förrän jag har fått min hämnd... Döda _gnollbedragaren_ som tog mitt liv...\n\nDen är inte som de andra gnollerna... Den gömmer sig och använder kastvapen... _Akta dig för dess giftiga och brandfarliga pilar; attackera inte på avstånd..._
actors.mobs.npcs.ghost.gnoll_2=Snälla... Hjälp mig... Döda trickstern...\n\n_Låt den inte träffa dig... Gå nära den..._
actors.mobs.npcs.ghost.crab_1=Hej %s... En gång var jag som du – stark och självsäker... Men jag dödades av en uråldrig varelse... Jag kan inte lämna denna plats... Inte förrän jag har fått min hämnd... Döda den _stora krabban_ som tog mitt liv...\n\nDen är onaturligt gammal... Med en enorm klo och ett tjockt skal... _Akta dig för dess klo, du måste överraska krabban annars blockerar den med den..._
actors.mobs.npcs.ghost.crab_2=Snälla... Hjälp mig... Döda kräftdjuret...\n\n_Den kommer alltid att blockera... När den ser dig komma..._
actors.mobs.npcs.ghost.find_me=Tack... kom och hitta mig...
actors.mobs.npcs.ghost.desc=Spöket är knappt synligt. Det ser ut som en formlös fläck av svagt ljus med ett sorgset ansikte.

actors.mobs.npcs.imp.name=ambitiös djävel
actors.mobs.npcs.imp.old_intro=Är du en äventyrare? Jag älskar äventyrare! Man kan alltid lita på dem om något behöver dödas, eller hur? Mot en belöning förstås ;)
actors.mobs.npcs.imp.old_golems_1=I mitt fall är det _golemer_ som måste dödas. Du förstår, jag ska starta en liten verksamhet här, men de där dumma golemarna är dåliga för affärerna! Det är väldigt svårt att förhandla med vandrande granitklumpar, förbaskade varelser! Så snälla, döda … låt oss säga _4 av dem_ så får du en belöning.
actors.mobs.npcs.imp.old_monks_1=I mitt fall är det _munkar_ som måste dödas. Du förstår, jag ska starta en liten verksamhet här, men de där galningarna köper ingenting själva och skrämmer bort andra kunder. Så snälla, döda … låt oss säga _5 av dem_ så får du en belöning.
actors.mobs.npcs.imp.old_golems_2=Hur går din golemsafari? Glöm bara inte att ta med dig polletterna.
actors.mobs.npcs.imp.old_monks_2=Åh, du lever fortfarande! Jag visste att din kung fu skulle vara starkare ;) Glöm bara inte att ta med polletterna.
actors.mobs.npcs.imp.cya=Vi ses, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.quest_intro_1=Åh hej, är du en äventyrare? Jag älskar äventyrare! Man kan alltid lita på dem när man behöver hjälp. Med rätt belöning, förstås ;).\n\nFramför mig finns ett stort dvärgvalv med en mängd sällsynta artefakter. Jag är lite av en samlare, och det finns en statyett i valvet som jag väldigt gärna vill ha.\n\nValvet är dock fullt av väktare och fällor, så jag skulle behöva lite hjälp!
actors.mobs.npcs.imp.quest_intro_2=Valvet är magiskt förseglat. Jag kan teleportera in dig med en besvärjelse som jag har förberett, men _jag kan inte teleportera din utrustning med dig._ Det bör finnas gott om byte i valvet som hjälper dig på vägen! _Du vill nog börja med att undvika fiender och leta efter föremål som inte är lika väl skyddade._\n\nJag kan kalla tillbaka dig med två föremål från valvet. Det ena blir min statyett, och det andra kan vara _vad som helst från valvet som du vill ha!_\n\nJag har samlat en mängd värdesaker som du kanske också är intresserad av! Om du hjälper mig här _öppnar jag en butik lite längre ner_ så kan vi handla.
actors.mobs.npcs.imp.quest_in_progress=Kliv bara in i mitten av valvingången när du är redo att åka, så teleporterar jag dig in.
actors.mobs.npcs.imp.enter_text=Är du redo? Jag håller dina föremål säkra här uppe, _du får tillbaka allt när du återvänder._\n\nTa däremot med dig den här _tygrustningen_ och _teleportationskristallen_. Använd kristallen när du har min statyett. ...Jag antar att _du kan använda den tidigare om du hamnar i knipa_, men förvänta dig inte hela belöningen!\n\nValvet har inte störts på länge, så fienderna där inne bör vara långsammare än vanligt. Det borde vara enklare än normalt att undvika upptäckt, särskilt om _du håller dig bakom den riktning som fienderna vandrar i._ Om någon fiende ser dig _bör den inte jaga dig om den bara ser dig ett ögonblick._ Du kan förmodligen också _känna av fotsteg i närheten_ om du är uppmärksam.
actors.mobs.npcs.imp.quest_completed_bad=Tja, tack för att du försökte.\n\nBesvärjelsen jag använde för att komma åt valvet tar väldigt lång tid att förbereda igen, så du bör nog ge dig av.
actors.mobs.npcs.imp.quest_completed_good=Tack för hjälpen!\n\nDet tar lite tid att göra min teleportationsbesvärjelse klar, och jag behöver också planera utifrån informationen du har gett mig.\n\nJag packar ihop och träffar dig lite längre ner i fängelsehålan. Jag behöver fortfarande guld, så mina varor blir tyvärr inte gratis ;).
actors.mobs.npcs.imp.quest_completed_great=Bra jobbat där nere, tack så mycket!\n\nJag har allt jag behöver här, så jag packar ihop och träffar dig lite längre ner i fängelsehålan. Jag behöver fortfarande guld, så mina varor blir tyvärr inte gratis ;).\n\nVad var så viktigt med statyn? Inte något du kanske tror, den är egentligen ett ganska vardagligt föremål. Den kommer från ett avlägset land som inte längre finns. Den kan vara den sista av sitt slag. Om det inte vore för de giriga dvärgarna hade den förmodligen förstörts tillsammans med allt annat...
actors.mobs.npcs.imp.enter_yes=Stig ner i valvet
actors.mobs.npcs.imp.enter_no=Stanna här
actors.mobs.npcs.imp.desc=Den här lilla röda gestalten ser ut som en imp. Impar är mindre demoner, kända för sin intelligens snarare än sin styrka.\n\nDu har bara hört om demoner i gamla folksagor, där de vanligen beskrivs som resenärer från en annan värld. Du har aldrig sett några bevis för att demoner verkligen finns, men den här impens existens är obestridlig och den verkar mycket glad att se dig.

actors.mobs.npcs.impshopkeeper.name=ambitiös imp
actors.mobs.npcs.impshopkeeper.greetings=Hej, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Vad har du gjort, %s? Handla snabbt, jag måste härifrån!
actors.mobs.npcs.impshopkeeper.thief=Jag trodde jag kunde lita på dig!
actors.mobs.npcs.impshopkeeper.buyback=Impen lämnar glatt tillbaka ditt föremål.
actors.mobs.npcs.impshopkeeper.desc=Impen har öppnat en liten butik vid gränsen till de inre salarna. Det är trevligt att se ett vänligt ansikte, men hans priser verkar inte särskilt vänliga.

actors.mobs.npcs.mirrorimage.name=spegelbild
actors.mobs.npcs.mirrorimage.desc=Denna illusion liknar dig mycket och verkar till och med använda ditt nuvarande vapen och din rustning.\n\nSpegelbilder söker upp och attackerar fiender med sitt imiterade vapen, som fungerar på samma sätt som ditt men orsakar mindre skada. De är nästan osynliga i början, men måste anta en synligare form för att kunna attackera.\n\nÄven om deras offensiva kraft kan vara betydande har spegelbilder ingen hållbarhet och försvinner så fort de tar skada.
actors.mobs.npcs.mirrorimage.discover_hint=Du kan hitta den här karaktären med en specifik skriftrulle.

actors.mobs.npcs.npc.discover_hint=Du kan hitta denna karaktär i en specifik region i fängelsehålan.

actors.mobs.npcs.prismaticimage.name=prismatisk bild
actors.mobs.npcs.prismaticimage.desc=Denna skimrande illusion liknar dig mycket och verkar till och med använda ditt nuvarande vapen och din rustning.\n\nPrismatiska bilder försöker söka upp fiender och dra till sig deras uppmärksamhet. De använder sitt förbättrade försvar och sin hälsa för att skydda dig. De har inte spegelbildernas offensiva kraft, men högre hållbarhet och får även fördelar från din rustning.\n\nNär de når 0 HP bleknar prismatiska bilder under flera turer och kan fortfarande läkas under tiden. När inga fiender finns närvarande bleknar de och återvänder till sin mästare.
actors.mobs.npcs.prismaticimage.discover_hint=Du kan hitta denna karaktär med en specifik skriftrulle.

actors.mobs.npcs.ratking.name=råttkungen
actors.mobs.npcs.ratking.not_sleeping=Jag sov inte alls!
actors.mobs.npcs.ratking.what_is_it=Vad är det? Jag har inte tid med sådant nonsens. Mitt rike styr inte sig självt!
actors.mobs.npcs.ratking.confused=Va... Var är jag? Mitt kungarike behöver mig!
actors.mobs.npcs.ratking.crown_clothes=Ta på dig några kläder! Du är inte i stånd att tala med kungligheter!
actors.mobs.npcs.ratking.crown_desc=Oooh, är den kronan till mig!? Den ser mycket blankare ut än min, så jag tar den tacksamt emot!\n\nJag tror faktiskt att jag kan erbjuda dig något i utbyte mot kronan. En enorm kraft som passar en hjälte som du! Vill du ha den?
actors.mobs.npcs.ratking.crown_yes=Självklart!
actors.mobs.npcs.ratking.crown_info=Berätta mer först.
actors.mobs.npcs.ratking.crown_no=Jag vill helst inte...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, tack! Gå nu och gör din kung stolt!
actors.mobs.npcs.ratking.crown_fine=Okej! Jag ville ändå inte ha den...
actors.mobs.npcs.ratking.crown_after=Gillar du din nya rustning? Inga byten!
actors.mobs.npcs.ratking.desc_crown=Den här råttan är lite större än en vanlig pungdjursråtta. Den bär dvärgkungens krona på huvudet.
actors.mobs.npcs.ratking.desc_birthday=Den här råttan är lite större än en vanlig pungdjursråtta. Den har en liten grön festhatt i stället för sin vanliga krona. Grattis på födelsedagen, Råttkungen!
actors.mobs.npcs.ratking.desc_winter=Den här råttan är lite större än en vanlig pungdjursråtta. Den bär en liten festlig hatt i stället för sin vanliga krona. God helg!
actors.mobs.npcs.ratking.desc=Den här råttan är lite större än en vanlig pungdjursråtta. Den har en liten krona på huvudet.
actors.mobs.npcs.ratking.discover_hint=Du hittar den här karaktären i slutet av en specifik region i fängelsehålan.

actors.mobs.npcs.sheep.name=får
actors.mobs.npcs.sheep.baa!=Bä!
actors.mobs.npcs.sheep.baa?=Bä?
actors.mobs.npcs.sheep.baa.=Bä.
actors.mobs.npcs.sheep.baa...=Bä…
actors.mobs.npcs.sheep.def_verb=blockerat
actors.mobs.npcs.sheep.desc=Detta är ett magiskt får. Vad är det som är så magiskt med det? Du kan inte döda det. Det kommer att stå där tills det magiskt försvinner, medan det idisslar med en tom blick.
actors.mobs.npcs.sheep.discover_hint=Du kan hitta den här karaktären med ett specifikt föremål eller en fälla.

actors.mobs.npcs.shopkeeper.name=köpman
actors.mobs.npcs.shopkeeper.thief=Tjuv, tjuv!
actors.mobs.npcs.shopkeeper.warn=Se upp! Jag varnar dig inte igen.
actors.mobs.npcs.shopkeeper.flee=Butiksinnehavaren flyr!
actors.mobs.npcs.shopkeeper.sell=Sälj ett föremål
actors.mobs.npcs.shopkeeper.talk=Prata
actors.mobs.npcs.shopkeeper.buyback=Butiksinnehavaren lämnar motvilligt tillbaka ditt föremål.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Jag har allt du behöver för ett lyckat äventyr!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Det är ett intressant sigill du har där, de brukar vara i ett stycke. Är du en vanärad hjälte eller något? Nåväl, vad du än har gjort angår det inte mig, dina mynt duger fortfarande.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, jag tror jag har sett en efterlysningsaffisch med ditt namn på någonstans i staden. Är du på flykt? Åh, du är oskyldig, eller hur? Självklart, självklart... Oroa dig inte, jag har bättre saker att göra än att ange dig, men du kanske borde köpa något för att vara på den säkra sidan?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Kommer du från tjuvgillet för att rensa området? Nej, bara för att handla? Döda då några monster medan du är här. Förvänta dig ingen rabatt heller, jag betalar bra skyddspengar till er och ni håller mig knappt säker här nere.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Du verkar vara på fel plats, fröken. Trånga fängelsekorridorer är inte lika rymliga som stora salar eller skogarna som omger staden, eller hur? Hehe, bry dig inte om mitt babbel, varför köper du inte något?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Jaha, är det inte den resande hjälten! Om du försöker rädda en annan stad så lycka till, farorna här är mycket värre än små banditgäng. Jag är säker på att du klarar det bättre än någon annan, försök bara att inte dö precis utanför min butik.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Hej där, Ers Höghet, eller är det Ers Helighet nu? Hehe, hur som helst är det här ingen plats för dig, många skulle bli ganska upprörda om du dog. Du har väl några mynt, varför inte köpa något för att förhindra det?
actors.mobs.npcs.shopkeeper.talk_caves=Spendera pengar, lev längre.\n\nÅh, hälsa den där trollsmeden från mig om du ser honom. Påminn den klumpen om att han fortfarande är skyldig mig pengar för hammaren jag sålde till honom förra veckan!
actors.mobs.npcs.shopkeeper.talk_city=Mina varor kan hålla dig säker här nere. \n\n...Och snälla, häng inte här. Det tog evigheter att få lokalbefolkningen att lämna mig ifred, jag vill inte att du drar till dig problem!
actors.mobs.npcs.shopkeeper.talk_halls=Hej där, jag har specialpriser för demonjägare!\n\nÅh, och var försiktig där nere! Demonerna längre ner är ännu värre än de du såg i valvet, och det finns ingen flyktkristall som kan rädda dig. Du kan inte komma tillbaka upp och spendera mer pengar om du är död! ;)\n\nÄr demonerna som jag? Hehe, inte alls. Jag är bara en liten figur, inte mycket till kämpe, och jag har lyckats behålla förståndet. Demonerna längre ner är mycket starkare varelser, och de har alla förslavats av ... tja ... var bara försiktig där nere.
actors.mobs.npcs.shopkeeper.talk_ascent=Jag vet inte vad du tänker göra med den amuletten, men jag vill inte ha något med det att göra. Köp något och gå vidare, vi måste båda lämna det här stället!
actors.mobs.npcs.shopkeeper.desc=Denna kraftiga man passar bättre i ett handelsdistrikt i en storstad än i en fängelsehåla. Hans priser förklarar varför han föredrar att göra affärer här.

actors.mobs.npcs.wandmaker.name=gammal trollstavsmakare
actors.mobs.npcs.wandmaker.intro_warrior=Åh, hej där! Vilken trevlig överraskning att träffa en krigare från norr på en så deprimerande plats! Du måste ha rest långt för att komma hit. Om du är ute efter äventyr kanske jag har ett uppdrag åt dig.
actors.mobs.npcs.wandmaker.intro_rogue=Åh, du skrämde mig! Jag har inte träffat någon bandit från denna plats som fortfarande är vid sina sinnens fulla bruk, så du måste vara från ytan! Om du är villig att hjälpa en främling, kanske jag har ett uppdrag åt dig.
actors.mobs.npcs.wandmaker.intro_mage=Åh, hej %s! Jag hörde att det var bråk mellan dig och trollkarlarnas institut? Åh, strunt samma, jag har aldrig gillat de där trångsynta typerna ändå. Om du vill, kanske jag har ett uppdrag åt dig.
actors.mobs.npcs.wandmaker.intro_huntress=Åh, hej fröken! Ett vänligt ansikte är en trevlig överraskning här nere, eller hur? Jag är faktiskt säker på att jag har sett dig förut, men jag kommer inte på var... Åh, strunt samma, om du är här för äventyr har jag kanske en uppgift åt dig.
actors.mobs.npcs.wandmaker.intro_duelist=Åh, hej fröken! Vilken trevlig överraskning att träffa en hjälte på en så deprimerande plats! Om du vill hjälpa en gammal man har jag kanske en uppgift åt dig.
actors.mobs.npcs.wandmaker.intro_cleric=Åh, hej Ers Höghet! Vilken trevlig överraskning att träffa er på en så deprimerande plats! Jag vill inte besvära er, men jag har kanske en uppgift åt er.
actors.mobs.npcs.wandmaker.intro_1=\n\nJag kom hit för att hitta en sällsynt ingrediens till en trollstav, men jag har gått vilse och min magiska sköld försvagas. Jag måste snart ge mig av, men jag kan inte åka utan att få det jag kom för.
actors.mobs.npcs.wandmaker.intro_dust=Jag letar efter _likstoft._ Det är en särskild sorts förbannat benmjöl som brukar finnas på platser som denna. Det borde finnas ett barrikaderat rum här i närheten, jag är säker på att du hittar lite stoft där. Var dock försiktig, förbannelsen i stoftet är mycket kraftfull. _Kom tillbaka till mig så fort du kan_ så renar jag det åt dig.
actors.mobs.npcs.wandmaker.intro_ember=Jag letar efter lite _färsk glöd_ från en nyfödd eldvarelse. Varelser dyker oftast upp när en besvärjelse inte kontrolleras, så leta bara efter några ljus och en ritualplats så är jag säker på att du kan få en att dyka upp. Du bör dock _undvika att stänga in dig själv_ vid striden, eller ha _någon sorts frysande föremål till hands._ Nyfödda elementärer är ganska kraftfulla och kaotiska, men de tål inte kyla.
actors.mobs.npcs.wandmaker.intro_berry=Den gamla fängelsevakten hade en _rotbärsplanta_ och jag är ute efter ett av dess frön. Växten har nog vildvuxit vid det här laget, så det kan bli svårt att få tag på ett frö. Trädgården borde ligga någonstans här i närheten. Försök att hålla dig borta från dess slingrande rankor om du vill hålla dig hel. Det kan vara frestande att använda eld, men gör det inte, för då dödar du växten och förstör fröna.
actors.mobs.npcs.wandmaker.intro_2=\n\nOm du kan skaffa det åt mig betalar jag gärna med en av mina fint tillverkade trollstavar! Jag har två med mig, så du kan välja vilken du vill ha.
actors.mobs.npcs.wandmaker.reminder_dust=Har du haft tur med likstoft, %s? Leta efter några barrikader.
actors.mobs.npcs.wandmaker.reminder_ember=Har du haft någon tur med glöden, %s? Du måste hitta fyra ljus och ritualplatsen.
actors.mobs.npcs.wandmaker.reminder_berry=Har du haft någon tur med ett rotbärsfrö, %s? Leta efter ett rum fyllt med växtlighet.
actors.mobs.npcs.wandmaker.def_verb=blockerat
actors.mobs.npcs.wandmaker.desc=Denna gamla men pigga herre ser lite förvirrad ut. Han skyddas av en magisk sköld.



##vault quest
actors.mobs.quest.vault.vaultbosselemental.name=större elemental
actors.mobs.quest.vault.vaultbosselemental.rankings_desc=Överväldigad av den större elementalen
actors.mobs.quest.vault.vaultbosselemental.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.
actors.mobs.quest.vault.vaultbosselemental.desc=Den här massiva elementalens instabila kraft verkar, som höjdpunkten i dvärgarnas åkallningsmagi, regleras av den lika imponerande cirkel som frammanade den. Det ger den förmågan att _byta form!_ Varje form har unika attacker, motstånd och svagheter.
actors.mobs.quest.vault.vaultbosselemental.desc_fire=Elementalen antar just nu en glödande het _eldform_. I denna form kan den skjuta eldklot och kalla fram eldsvågor som sveper över arenan. Den försöker sikta eldklot i den riktning du rör dig, och eldsvågorna har alltid en lucka. Om du träffas av någon av dem _antänds_ du.\n\nI denna form är den _motståndskraftig mot magi_, som bara ger näring åt lågorna. Den sårbara glödande kärnan kan dock troligen enkelt träffas med _distansvapen_.
actors.mobs.quest.vault.vaultbosselemental.fire_resist=Lågorna växer när elementalen absorberar det mesta av din magiska attack!
actors.mobs.quest.vault.vaultbosselemental.fire_weak=Ditt kastvapen träffar elementalens kärna och ger extra skada!
actors.mobs.quest.vault.vaultbosselemental.desc_frost=Elementalen antar just nu en iskall _frostform_. I denna form kan den skjuta en svepande köldkon och kalla fram en virvel av rörlig iskall luft. Båda attackerna kan undvikas genom att kliva undan med god tajming, men konen är särskilt dödlig på avstånd. Om du träffas av någon av dem _fryser du till is_.\n\nI denna form är den också _motståndskraftig mot kastvapen_, som bara fastnar i dess isskal. Skalet ser dock inte särskilt hållbart ut, så en träff med ett _närstridsvapen_ bör ge extra mycket skada.
actors.mobs.quest.vault.vaultbosselemental.frost_resist=Kastvapnet fastnar i elementalens frostskal!
actors.mobs.quest.vault.vaultbosselemental.frost_weak=Din närstridsattack splittrar delar av frostskalet och ger extra skada!
actors.mobs.quest.vault.vaultbosselemental.desc_shock=Elementalen antar just nu en elektrisk _chockform_. I denna form kan den skjuta en blixt mot din position eller kalla fram gnistlinjer från arenans sidor. De här attackerna är lite enklare att undvika, men den kan utföra dem oftare. Om du träffas av någon av dem blir du _tillfälligt bedövad_.\n\nI denna form är den också _motståndskraftig mot närstridsattacker_, som orsakar en smärtsam stöt. Energin runt den destabiliseras däremot av _magi_, vilket ger ytterligare skada.
actors.mobs.quest.vault.vaultbosselemental.shock_resist=När du försöker attackera får du en smärtsam stöt!
actors.mobs.quest.vault.vaultbosselemental.shock_weak=Magin stör elementalens elektriska fält och ger extra skada!

actors.mobs.quest.vault.vaultdm100.name=modifierad DM-100
actors.mobs.quest.vault.vaultdm100.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.
actors.mobs.quest.vault.vaultdm100.desc=De här DM-100-enheterna ser nästan identiska ut med dem i fängelset, men från deras ögon kommer ett starkt blågrönt sken. De har troligen byggts om för att använda en modernare dvärgisk kraftkälla.\n\nDe fungerar precis som vanliga DM-100-enheter. Förmågan att skjuta blixtar på avstånd finns kvar trots den nya kraftkällan och deras renare skick gör dem lite mer hållbara.

actors.mobs.quest.vault.vaultdm200.name=modifierad DM-200
actors.mobs.quest.vault.vaultdm200.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.
actors.mobs.quest.vault.vaultdm200.desc=De här DM-200:orna ser ut precis som sina motsvarigheter från grottorna, men med lysande turkosa ögon. De har troligen byggts om med en modernare dvärgkraftkälla.\n\nPrecis som sina motsvarigheter i grottorna är de här DM-200:orna för stora för att rymmas i trånga utrymmen och kan fortfarande spruta gas.

actors.mobs.quest.vault.vaultrat.desc=Denna råtta har några beteendeförändringar för att testa ny AI för fiender i valvet:\n_-_ Dess rörelser kan ”höras” genom väggar\n_-_ Den vandrar längs en förinställd patrullrutt\n_-_ När den vandrar har den kraftigt reducerad detektionsräckvidd bakom den riktning den rör sig i.\n_-_ När den sover minskar dess upptäcktsräckvidd också\n_-_ När den upptäcker dig kommer den att ”undersöka” innan den övergår till jakt. Undersökande fiender rör sig mot dig men attackerar inte och är lättare att skaka av sig bakom dörrar och hörn.

actors.mobs.quest.vault.vaultskeleton.name=dvärgskelett
actors.mobs.quest.vault.vaultskeleton.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.
actors.mobs.quest.vault.vaultskeleton.desc=De här skulle se ut som vanliga skelett från fängelset, om det inte vore för deras häpnadsväckande mängd ansiktshår. Det verkar som att vissa dvärgar inte drog sig för nekromanti redan innan deras nya kung tog över.\n\nDe fungerar precis som vanliga skelett, även genom att explodera i benbitar när de dör. Paradoxalt nog verkar deras skägg också ge dem lite mer skydd.

actors.mobs.quest.vault.vaultshaman.name=tillfångatagen schaman
actors.mobs.quest.vault.vaultshaman.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.
actors.mobs.quest.vault.vaultshaman.desc=De här gnollschamanerna kommer tydligt från grottorna, men har en märklig metallmask som ser dvärgsmidd ut. Masken sitter extremt hårt, och schamanerna rör sig stelt och tafatt. Är masken gjord för att styra dem?
actors.mobs.quest.vault.vaultshaman.spell_desc=De här gnollerna kan säkert fortfarande träffa dig med magi, men utan maskens färg går det inte att säga vilken sorts magi de använder. Metallmasken verkar också skydda dem lite bättre än en trämask, och deras attacker har betydligt mer kraft än en vanlig gnollschamans.



###mobs
actors.mobs.acidic.name=syra skorpion
actors.mobs.acidic.desc=Dessa enorma spindelliknande demoniska varelser undviker närstrid och föredrar att avfyra förlamande taggiga spikar från långa avstånd. Den här verkar droppa av frätande slem.

actors.mobs.albino.name=albinoråtta
actors.mobs.albino.desc=Den här kloakråttan tillhör en sällsynt ras med helvit päls och extra vassa tänder.
actors.mobs.albino.discover_hint=Du kan sällan hitta denna fiende i en specifik region i fängelsehålan.

actors.mobs.armoredstatue.name=pansarstaty
actors.mobs.armoredstatue.desc=Man skulle kunna tro att det bara är ännu en av fängelsehålans livlösa statyer, men de röda, glödande ögonen avslöjar den.\n\nDen verkar vara i mycket gott skick tack vare rustningen den bär, så den kan vara mycket svår att döda.
actors.mobs.armoredstatue.desc_arm_wep=Även om statyn själv är av sten ser _%1$s_ och _%2$s_ som den bär ut att vara äkta.

actors.mobs.bandit.name=galen bandit
actors.mobs.bandit.desc=En elitstjuv som kännetecknas av sin påkostade lila mantel. Trots sin större skicklighet har den blivit lika tanklös som vanliga tjuvar.\n\nUtöver att stjäla från dig förblindar, förlamar och förgiftar galna banditer dig kortvarigt! De är dock betydligt mer benägna att bära på extra byte än vanliga tjuvar.

actors.mobs.bat.name=vampyrfladdermus
actors.mobs.bat.desc=Dessa snabba och ihärdiga grottinvånare är mycket farligare än de ser ut. De återfår sin hälsa efter varje lyckad attack, vilket gör att de kan besegra mycket större motståndare.

actors.mobs.bee.name=golden bee
actors.mobs.bee.desc_honey=Trots sin ringa storlek tenderar guldbin att skydda sitt hem med näbb och klor. Den här har lugnats och verkar vilja följa efter dig.
actors.mobs.bee.desc=Trots sin ringa storlek tenderar guldbin att försvara sitt hem med näbbar och klor. Den här är mycket arg, så håll dig på avstånd.
actors.mobs.bee.discover_hint=Du kan hitta den här karaktären med ett specifikt föremål.

actors.mobs.brute.name=gnollbrute
actors.mobs.brute.enraged=rasande
actors.mobs.brute.def_verb=blockerat
actors.mobs.brute.desc=Bruter är de största, starkaste och tåligaste av alla gnoller. När de såras dödligt blir de berserker och får tillfällig sköld samt kraftigt ökad skada.
actors.mobs.brute$bruterage.name=bruteraseri
actors.mobs.brute$bruterage.desc=Denna gnollbrute är döende, men vill ta dig med sig!\n\nBruten dör när dess skydd upphör, antingen på grund av tid eller om den skadas. Under tiden kommer den att orsaka enormt ökad skada, så se upp!\n\nÅterstående skydd: %d.

actors.mobs.causticslime.name=frätande slem
actors.mobs.causticslime.desc=Det här slemmet verkar ha förvanskats av den mörka magi som strömmar upp från djupet. Det har förlorat sin vanliga gröna färg och droppar frätande slem.
actors.mobs.causticslime.discover_hint=Du kan sällan hitta denna fiende i en specifik region i fängelsehålan.

actors.mobs.crab.name=kloakkrabba
actors.mobs.crab.desc=Dessa enorma krabbor står högst upp i näringskedjan i kloakerna. De är extremt snabba och deras tjocka skal tål kraftiga slag.

actors.mobs.crystalguardian.name=kristallväktare
actors.mobs.crystalguardian.def_verb=blockerat
actors.mobs.crystalguardian.desc=Dessa stora kristallväktare ser nästan ut som statyer, om det inte vore för deras starkt lysande ögon. Den härdade kristallen de är gjorda av gör dem tröga men mycket tåliga, så _det är bäst att låta dem sova i sina kristallbon så länge som möjligt._\n\nPå grund av sin storlek rör sig kristallväktare mycket långsammare i trånga utrymmen. De är också så tåliga att det är omöjligt att döda dem direkt. De kan slås ned och tillfälligt inaktiveras, men reser sig igen efter en stund.
actors.mobs.crystalguardian.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.crystalmimic.name=kristallmimik
actors.mobs.crystalmimic.ate=Mimiken åt din %s!
actors.mobs.crystalmimic.escaped=Kristallmimiken har rymt!
actors.mobs.crystalmimic.desc=Mimics är magiska varelser som kan ta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att lura intet ont anande äventyrare. Kristallmimiker är listigare än sina vanliga kusiner och föredrar att undvika konflikter vid stöld. De försöker springa iväg när de upptäcks och har förmågan att flytta fiender när de attackerar.

actors.mobs.crystalspire.name=kristallspira
actors.mobs.crystalspire.warning=Kristallen vibrerar när du slår på den. Om du fortsätter kommer du att bli observerad...
actors.mobs.crystalspire.alert=Vibrationerna blir starkare och hörs i hela grottan!
actors.mobs.crystalspire.rankings_desc=Genomborrad av kristallspiran
actors.mobs.crystalspire.desc=Denna gigantiska spira av ultrahård kristall är troligen källan till alla märkliga kristallvarelser i grottan. Dina vanliga vapen är verkningslösa mot den, så du måste använda hackan om du vill förstöra den.\n\n_Se till att du är förberedd innan du börjar bryta den._ Det tar troligen en stund att bryta en så stor kristall och du kommer förmodligen inte att kunna göra det ostört. Spiran kan till och med ha något sätt att försvara sig på. _Kanske kan spirans egna attacker användas mot dess underhuggare._
actors.mobs.crystalspire.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.crystalwisp.name=kristallvätte
actors.mobs.crystalwisp.beam_kill=Ljusstrålen dödade dig...
actors.mobs.crystalwisp.desc=En liten, arg, svävande bit härdad kristall som avger ett starkt sken. Kristallvättar är inte särskilt starka, men skjuter en skadlig ljusstråle mot dig om de har fri sikt.\n\nVättarna är små nog att lätt röra sig genom kristallformationerna, men kan inte skjuta genom dem.
actors.mobs.crystalwisp.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.demonspawner.name=demonframkallare
actors.mobs.demonspawner.on_death=Den demoniska energin här verkar avta när frammanaren dör.
actors.mobs.demonspawner.desc=Denna förvridna sammansmältning av dvärgkött skapar slaktardemoner av dvärgar som har dött i området. Demonerna ser uppenbarligen inga problem med att använda alla resurser de kan mot sina fiender.\n\nDemonframmanare är visuellt skrämmande, men kan varken röra sig eller försvara sig direkt. Deras betydande massa gör dem dock svåra att döda snabbt, och de frammanar slaktardemoner snabbare när de hotas.\n\n_Demonframmanare verkar vara kopplade till en central källa till demonisk kraft. Att döda dem kan försvaga den._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Blixten dödade dig...
actors.mobs.dm100.desc=DM-100 är en tidig modell av en dvärgsk "försvarsmaskin" som var avsedd att skydda dvärgarnas gruvarbetare i grottorna under detta fängelse. Deras elektriska stötar visade sig dock vara för svaga, så de skänktes till människornas stad ovanför. De stod oanvända i åratal och hamnade så småningom i fängelset, där fängelsedirektören först ansåg dem för grymma att använda. Men när fångarna blev mer och mer oroliga blev de en nödvändighet.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 avfyrar en stråle av giftiga avgaser!
actors.mobs.dm200.desc=DM-200 är den andra generationen av dvärgarnas "försvarsmaskin", som konstruerades för att skydda dvärgarnas gruvarbetare i grottorna och staden nedanför. De är mycket större och mer klumpiga än sina föregångare och attackerar med förödande hydrauliska nävar. \n\nDeras ökade storlek är också deras största svaghet, eftersom de inte får plats i de smala tunnlarna och dörröppningarna i fängelsehålorna. Dvärgarna kunde kompensera för DM-200:s bristande rörlighet genom att låta dem släppa ut sina giftiga avgaser mot fiender på avstånd eller fiender som de inte kan nå.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 kastar en frätande granat!
actors.mobs.dm201.desc=Dvärgarna experimenterade kort med att ytterligare betona DM-200:s brist på rörlighet och skapade några DM-modeller som är helt stationära. DM-201 är en ombyggd DM-200 som fungerar som en vaktpost utan rörelseförmåga. I utbyte mot bristen på rörlighet har DM-201 betydligt högre hållbarhet och attackkraft. Eftersom DM-201 inte har någon motor att släppa ut avgaser från, har dvärgarna istället utrustat dem med frätande gasgranater! DM-201 är dock försiktiga med dessa granater och kastar dem endast när de attackeras på avstånd.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=OBEHÖRIG PERSONAL UPPTÄCKT!
actors.mobs.dm300.shield=DM-300 drar ström från de exponerade kablarna och skyddar sig själv!
actors.mobs.dm300.charging=FÅR SKADA! AKTIVERAR STRÖMSTOLPE!
actors.mobs.dm300.charging_hint=DM-300 är osårbar vid laddning från en pylon!
actors.mobs.dm300.supercharged=FÖRSTÖR! FÖRSTÖR! FÖRSTÖR!
actors.mobs.dm300.charge_lost=PYLON FÖRSTÖRD! ÅTERGÅR TILL LOKAL STRÖM!
actors.mobs.dm300.pylons_destroyed=VARNING! INSTABILITET UPPTÄCKT I ELNÄTET!
actors.mobs.dm300.rankings_desc=Kördes över av DM-300
actors.mobs.dm300.def_verb=blockerat
actors.mobs.dm300.defeated=KRITISK SKADA! FÖRSÖKER STÄNGA AV-
actors.mobs.dm300.desc=DM-300 är den största och kraftfullaste försvarsmaskin som dvärgarna någonsin byggt. En sådan imponerande maskin är svår att tillverka, så dvärgarna byggde bara ett fåtal för att bevaka ingångarna till sin underjordiska metropol.\n\nDen är utrustad med ventiler som sprutar ut giftiga avgaser och en kraftfull borr som kan användas både för att attackera och röra upp marken. DM-300 kan också ansluta sig till ett energinät, vilket ytterligare ökar dess kraft.
actors.mobs.dm300.desc_supercharged=DM-300 är för närvarande fulladdad med elektrisk energi. I detta tillstånd kan DM-300 inte skadas och rör sig dubbelt så fort! Dessutom snurrar borren nu tillräckligt snabbt för att den ska kunna _tunnla genom fast berg,_ även om den rör sig mycket långsammare när den gör detta.\n\nDet är meningslöst att attackera DM-300 direkt när den är superladdad, men _något i området måste förse den med denna energi,_ och att förstöra det kan försvaga den.

actors.mobs.dwarfking.name=Dvärgakungen
actors.mobs.dwarfking.notice=Hur vågar du! Du har ingen aning om vad du lägger dig i!
actors.mobs.dwarfking.lifelink_1=Jag behöver din essens, slav!
actors.mobs.dwarfking.lifelink_2=Blöd för mig, slav!
actors.mobs.dwarfking.teleport_1=Ta hand om dem, slav!
actors.mobs.dwarfking.teleport_2=Håll dem sysselsatta, slav!
actors.mobs.dwarfking.wave_1=Nu räcker det! Res er, mina slavar!
actors.mobs.dwarfking.wave_2=Fler! Blöd för er kung!
actors.mobs.dwarfking.wave_3=Värdelösa! DÖDA DEM NU!
actors.mobs.dwarfking.enraged=Du kan inte döda mig, %s. Jag. ÄR. ODÖDLIG!
actors.mobs.dwarfking.losing=Nej! Du kan inte göra det... du har ingen aning om vad som finns där nere...
actors.mobs.dwarfking.defeated=Du har... Dömt oss alla...
actors.mobs.dwarfking.rankings_desc=Föll inför dvärgarnas kung
actors.mobs.dwarfking.desc=För många år sedan upptäckte en av de högsta trollkarlarna i dvärgarnas hov hemligheter som gav honom enorm makt över liv och död. Han använde snart denna makt för att underkuva och korrumpera sina jämlikar, sin kung och så småningom alla dvärgarnas medborgare. Nu är han kung och härskar över en legion av odöda undersåtar. \n\nDvärgkungen är en aggressiv fiende som försöker omringa och överväldiga sina fiender med sin hord av odöda underhuggare.
actors.mobs.dwarfking$dkghoul.rankings_desc=Föll inför dvärgkungen
actors.mobs.dwarfking$dkmonk.rankings_desc=Föll inför dvärgkungen
actors.mobs.dwarfking$dkwarlock.rankings_desc=Föll inför dvärgkungen
actors.mobs.dwarfking$dkgolem.rankings_desc=Stupade i dvärgakungens sal

actors.mobs.ebonymimic.name=ebenholtsmimik
actors.mobs.ebonymimic.reveal=Det fanns en mimik där!
actors.mobs.ebonymimic.hidden_name=misstänkt kontur
actors.mobs.ebonymimic.hidden_desc=Det verkar finnas något här, men det är nästan helt genomskinligt.
actors.mobs.ebonymimic.desc=Mimiker är magiska varelser som kan anta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att lura intet ont anande äventyrare.\n\nEbenholtsmimiker är smygande mimiker som kan göra sig nästan osynliga. De lurar bland saker som äventyrare sannolikt interagerar med, men innehåller också eget byte. De är inte tåligare än vanliga mimiker när de väl upptäcks, men deras överraskningsbett är förödande.
actors.mobs.ebonymimic.discover_hint=Du kan hitta denna fiende med hjälp av en specifik prydnadssak.

actors.mobs.elemental$fireelemental.name=eldelementar
actors.mobs.elemental$fireelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi.\n\nEldelementaler är en vanlig typ av elementaler som orsakar skada med eldig magi. De sätter eld på sitt mål med närstridsattacker och kan ibland även skjuta eldbollar.
actors.mobs.elemental$newbornfireelemental.name=nyfödd eldelementar
actors.mobs.elemental$newbornfireelemental.charging=Elementalen laddar!
actors.mobs.elemental$newbornfireelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. De har begränsad intelligens och är vanligen knutna till en viss sorts magi.\n\nDen här eldelementalen är nyframmanad, men fortfarande ganska farlig!
actors.mobs.elemental$newbornfireelemental.rankings_desc=Förkolnad av en nyfödd eldelemental
actors.mobs.elemental$newbornfireelemental.desc_boss=På grund av den kaotiska naturen hos dess frammaning kan denna elementar bara sprida eld i oriktiga explosioner efter att ha laddat upp under en tur.
actors.mobs.elemental$newbornfireelemental.desc_ally=Eftersom denna elementar har frammanats med en besvärjelse har den lite bättre kontroll över sin eld. Den kan inte attackera på avstånd, men tänder eld på fiender som den attackerar i närstrid.
actors.mobs.elemental$newbornfireelemental.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.
actors.mobs.elemental$frostelemental.name=frostelemental
actors.mobs.elemental$frostelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi.\n\nFrostelementaler är en vanlig typ av elementaler som försvagar fiender med kylig magi. De kyler ner sitt mål med närstrid och ibland med distansattacker. Deras magi är mycket effektivare i vatten.
actors.mobs.elemental$shockelemental.name=chockelemental
actors.mobs.elemental$shockelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. De har begränsad intelligens och är vanligen knutna till en viss sorts magi.\n\nChockelementaler är en mindre vanlig sorts elemental som stör sina fiender med elektricitet och ljusblixtar. I närstrid kastar de elektricitet mot närliggande fiender och orsakar bonusskada på sitt primära mål om det står i vatten. Ibland riktar de också en ljusstråle på avstånd mot sitt mål som tillfälligt förblindar det.
actors.mobs.elemental$chaoselemental.name=kaoselementar
actors.mobs.elemental$chaoselemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi. \n\nKaoselementaler är sällsynta och farliga elementaler som inte har stabiliserats till ett visst element. De släpper lös vild och oförutsägbar magi när de attackerar.

actors.mobs.eye.name=ont öga
actors.mobs.eye.deathgaze_kill=Dödsblicken dödade dig...
actors.mobs.eye.desc=Onda ögon är svävande klot av uppdämd demonisk energi. De kan slåss i närstrid, men deras verkliga styrka kommer från magin.\n\nEfter en kort stunds energisamlande släpper ett ont öga lös en förödande energistråle som kallas _dödsblicken._ Allt inom det onda ögats synfält tar enorm skada, så kloka äventyrare bör söka skydd.

actors.mobs.fetidrat.name=stinkande råtta
actors.mobs.fetidrat.rankings_desc=Upplöst av den stinkande råttan
actors.mobs.fetidrat.desc=Något är uppenbart fel med den här råttan. Dess feta svarta päls och ruttnande hud skiljer sig markant från de friska råttor du tidigare sett. De blekgröna ögonen gör den särskilt hotfull.\n\nRåttan bär med sig ett moln av fasansfull stank som är överväldigande på nära håll.\n\nMörkt slem rinner från råttans mun. Det fräter sig genom golvet men verkar lösas upp i vatten.
actors.mobs.fetidrat.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.fungalcore.name=svampkärna
actors.mobs.fungalcore.desc=Denna gigantiska svamp måste vara källan till all svampaktivitet i denna grotta.

actors.mobs.fungalsentry.name=svampvakt
actors.mobs.fungalsentry.desc=Denna särskilt höga svamp fungerar som en försvarsposition för det större svampnätverket som lever i denna grotta. Den är orörlig, men skjuter precisa giftstrålar mot allt som kommer inom dess synfält. Vid träff är strålarna relativt svaga, men de kan snabbt ackumulera dödliga mängder gift. Den kan dödas, men det är nog bäst att undvika den.

actors.mobs.fungalspinner.name=svampspinnare
actors.mobs.fungalspinner.desc=Denna grottspinner verkar styras av en parasitsvamp. Svampen har också förändrat dess förmågor och ersatt dess nät och giftsäckar med svampväxt. Svampspinnaren spottar växtdelar på dig istället för nät, vilket sprider svampväxt och kan göra att du rotar fast. Svampspinnaren kan inte förgifta, men får betydande skaderesistens om den befinner sig intill svampar.

actors.mobs.ghoul.name=dvärgghoul
actors.mobs.ghoul.desc=När dvärgsamhället långsamt började kollapsa och den nuvarande kungen av dvärgarna tog absolut makt, behandlades de som var svaga eller som motsatte sig honom illa. När kungen blev skickligare på att utöva mörk magi böjde han dessa dvärgar efter sin vilja, och nu utgör de fotfolket i hans armé. Ghouls är inte särskilt starka på egen hand, men de rör sig alltid i grupper och är mycket svårare att döda i stort antal. När en ghoul besegras reser den sig igen efter några turer så länge det finns en annan ghoul i närheten.

actors.mobs.gnoll.name=gnollscout
actors.mobs.gnoll.desc=Gnoller är hyenaliknande humanoider. De bor i kloaker och fängelsehålor och vågar sig upp till ytan för att plundra då och då. Gnollscouter är vanliga medlemmar i sin flock, de är inte lika starka som bruter och inte lika intelligenta som shamaner.

actors.mobs.gnollexile.name=förvisad gnoll
actors.mobs.gnollexile.desc=Denna gråhåriga gnoll har ett stort märke på axeln som visar att den är en exil. Gnoller blir vanligtvis förvisade från sitt samhälle för att ha ignorerat order eller brutit mot lagar. Exiler måste vara starka och sluga för att överleva, och den här ser ut att kunna hantera spjutet den håller i.
actors.mobs.gnollexile.desc_passive=_Den gnolliska exilen rör sig inte för att attackera._ Den verkar inte lika aggressiv som de andra gnollerna här och tycker nog inte att det är värt att slåss mot dig. Du kan låta den passera, men den har en ryggsäck som kan vara full av användbara föremål...
actors.mobs.gnollexile.desc_aggro=_Den gnolliska flyktingen ser sig ilsket omkring. Det verkar som om något har fått den att bestämma sig för att slåss trots allt. Se upp för spjutet!
actors.mobs.gnollexile.seen_passive=Den spjutbärande gnollen tittar misstänksamt på dig, men gör inga rörelser för att attackera.
actors.mobs.gnollexile.seen_aggro=Den spjutbärande gnollen går till attack!

actors.mobs.gnollgeomancer.name=gnollgeomantiker
actors.mobs.gnollgeomancer.warning=Geomantikern börjar röra på sig. Se till att du är redo innan du fortsätter!
actors.mobs.gnollgeomancer.alert=Geomantikern vaknar! Hela grottan verkar förskjutas när den hoppar iväg och skrattar vansinnigt!
actors.mobs.gnollgeomancer.rock_kill=Den flygande stenbumlingen dödade dig...
actors.mobs.gnollgeomancer.rockfall_kill=De fallande stenarna dödade dig...
actors.mobs.gnollgeomancer.rankings_desc=Begravd av gnollgeomantern
actors.mobs.gnollgeomancer.desc=Denna imponerande höga äldre gnoll måste vara källan till den jordförflyttande magin här omkring och organisatören av all gnollaktivitet. Till skillnad från gnollgrävarna i området är geomantikern skicklig med sin magi och kan inte skadas av kastade eller fallande stenar. Den kan dock inte slåss i närstrid.
actors.mobs.gnollgeomancer.desc_armor=Geomancer är för närvarande innesluten i ett lager av stenrustning. _Du måste komma nära och bryta bort den med din hacka innan du kan skada geomancer._
actors.mobs.gnollgeomancer.desc_armor_sapper=_En närliggande gnoll-sappare håller i en apparat som ger geomancerens stenrustning kraft. Du kan inte skada den alls just nu!_
actors.mobs.gnollgeomancer.desc_sleeping=Denna imponerande höga gnollshaman är omgiven av ett lager av sten och ser nästan ut som en staty. Om du tittar noga kan du se att stenen rör sig magiskt i takt med den äldre gnollens andning. Den kan inte skadas vid denna stenbeläggning och verkar njuta av en bokstavlig jordvila.n\nDu kan antagligen bryta igenom stenlagren med din hacka, men _se till att du är redo för strid när du gör det._ Geomancer måste vara källan till den olika jordförflyttande magin här omkring och organisatören av all gnollaktivitet. _Det kan vara en bra idé att besegra de gnoller som är utspridda här innan du bekämpar den._
actors.mobs.gnollgeomancer.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.gnollguard.name=gnollvakt
actors.mobs.gnollguard.def_verb=blockerat
actors.mobs.gnollguard.spear_warn=Gnollen landar ett brutalt slag med spjutspetsen!
actors.mobs.gnollguard.desc=En stor och tålig gnoll med spjut och sköld, men utan hjälm. Vakterna är troligen bruter under utbildning, inkallade för att skydda gruvan mot inträngande djurliv.\n\nGnollvakten är stark nog att bära spjutet med en hand, men hanterar det inte särskilt väl. _Den behöver ganska öppet utrymme för att attackera på avstånd och orsakar märkbart mindre skada om du går nära._
actors.mobs.gnollguard.desc_armor=_En gnoll-sapör i närheten håller i en apparat som ger denna vakt en jordrustning som kraftigt minskar skadan den tar.
actors.mobs.gnollguard.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.gnollsapper.name=gnoll-sapör
actors.mobs.gnollsapper.desc=En liten, svag men intelligent gnoll med blek päls och en väska full av olika prylar. De är troligen här för att hjälpa till med prospektering och brytning av mörkguld och har en vakt i närheten som skydd. De kan slåss, men deras attacker är ynkligt svaga, inte starkare än en gnollscouts.\n\nI stället för att slåss direkt använder gnollgrävarna sina prylar för att få den steniga miljön att attackera åt dem. De behärskar dock inte själva jordförflyttande magi, och använder därför sannolikt sina prylar vårdslöst. _Det bör finnas många sätt att vända deras attacker mot dem eller deras vakt._
actors.mobs.gnollsapper.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.gnolltrickster.name=gnollbedragare
actors.mobs.gnolltrickster.rankings_desc=Överlistad av gnollbedragaren
actors.mobs.gnolltrickster.desc=En märklig varelse, även med gnoll-mått mätt. Den sitter framåtböjd med ett ondskefullt leende och håller nästan om väskan som hänger över axeln. Ögonen är vidöppna och uttrycker en märklig blandning av rädsla och spänning. \n\nI väskan finns en stor samling dåligt tillverkade pilar som alla verkar vara försedda med olika farliga ämnen.
actors.mobs.gnolltrickster.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.goldenmimic.name=guldmimik
actors.mobs.goldenmimic.desc=Mimiker är magiska varelser som kan anta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att lura intet ont anande äventyrare.\n\nGuldmimiker är tåligare mimiker som försöker locka till sig de starkaste äventyrarna. De har bättre byte, men är också mycket starkare än vanliga mimiker.

actors.mobs.golem.name=golem
actors.mobs.golem.def_verb=blockerat
actors.mobs.golem.desc=Golems är ett försök att korrigera tidigare brister i dvärgarnas maskiner genom deras nyfunna användning av magi. De är mycket mer kompakta och effektiva jämfört med DM-300, men fortfarande mycket dödliga.\n\nEftersom golems fortfarande är för stora för att passa in i gångar har dvärgarna gett dem nya magiska förmågor som kompensation. Golems kan teleportera sig mellan rum och teleportera fiender till sig när de är utom räckhåll.

actors.mobs.goo.name=Klegget
actors.mobs.goo.notice=BLUBB BLUBB!
actors.mobs.goo.defeated=Blubb… blubb…
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Goo pumpar upp sig själv!
actors.mobs.goo.enraged=rasande
actors.mobs.goo.gluuurp=BLUUUUBB!
actors.mobs.goo.rankings_desc=Sögs upp av klegget
actors.mobs.goo.desc=Lite är känt om Goo. Det är mycket möjligt att det inte ens är en varelse, utan snarare en sammansättning av vidriga ämnen från kloakerna som på något sätt fått grundläggande intelligens. Oavsett vilket är det mörk magi som har gjort det möjligt för Goo att existera. Dess gelatinösa konsistens gör att den kan absorbera stora mängder mörk energi, och man känner en kyla bara av att vara i närheten. Om Goo kan attackera med denna energi kommer du inte att överleva länge.

actors.mobs.greatcrab.name=jättekrabba
actors.mobs.greatcrab.noticed=Krabban blockerar med sin massiva klo.
actors.mobs.greatcrab.def_verb=blockerat
actors.mobs.greatcrab.rankings_desc=Klippt av den stora krabban
actors.mobs.greatcrab.desc=Denna krabba är gigantisk, även jämfört med andra avloppskrabbor. Dess blå skal är täckt av sprickor och havstulpaner, vilket visar på hög ålder. Den rör sig långsamt och har svårt att hålla balansen med sin massiva klo. Krabban håller klon framför sig vid hot och skyddar sig bakom en ogenomtränglig vägg av skal. Krabban kan dock inte blockera attacker som den inte ser komma eller attacker från flera fiender samtidigt.
actors.mobs.greatcrab.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.guard.name=fängelsevakt
actors.mobs.guard.scorpion=Kom hit med dig!
actors.mobs.guard.def_verb=blockerat
actors.mobs.guard.desc=Dessa vakter var en gång fängelsevakter, men har sedan länge blivit precis som fångarna. De hasar omkring som zombier och vandrar tanklöst genom korridorerna på jakt efter något som inte är på sin plats, som dig! \n\nDe bär kedjor runt höfterna, som de troligen använder för att dra in fiender på nära håll.

actors.mobs.hermitcrab.name=eremitkrabba
actors.mobs.hermitcrab.def_verb=blockerat
actors.mobs.hermitcrab.desc=Av någon anledning har den här kloakkrabban bestämt sig för att bära den trasiga övre delen av en tunna på huvudet! Den extra vikten har saktat ned den till normal hastighet, men också gett den betydligt bättre försvar. Du tycker dock att du hör något studsa runt inuti tunnan …

actors.mobs.mimic.name=mimare
actors.mobs.mimic.reveal=Den kistan är en mimare!
actors.mobs.mimic.hidden_hint=Något med den här kistan känns fel... Att gå fram och försöka öppna den är kanske ingen bra idé.
actors.mobs.mimic.desc=Mimiker är magiska varelser som kan anta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att lura intet ont anande äventyrare.\n\nMimiker har ett otäckt bett, men innehåller ofta mer skatter än en vanlig kista.
actors.mobs.mimic.discover_hint=Du kan hitta denna fiende överallt i fängelsehålan.

actors.mobs.necromancer.name=nekromantiker
actors.mobs.necromancer.desc=Dessa lärlingar till mörka magiker har flockats till fängelset, som är den perfekta platsen att öva sin onda konst.\n\nNekromantiker frammanar och förstärker skelett som strider för dem. När du dödar nekromantikern dör också skelettet den frammanat.
actors.mobs.necromancer$necroskeleton.name=andebesvärjares skelett
actors.mobs.necromancer$necroskeleton.desc=Detta skelett har frammanats av en nekromantiker. Det beter sig precis som ett vanligt skelett och dör när nekromantikern som frammanade det dödas.

actors.mobs.mob.died=Du hör något dö i fjärran.
actors.mobs.mob.rage=$%^
actors.mobs.mob.rankings_desc=Dödades av: %s
actors.mobs.mob.discover_hint=Du kan hitta denna fiende i en specifik region i fängelsehålan.

actors.mobs.monk.name=dvärgmunk
actors.mobs.monk.def_verb=blockerat
actors.mobs.monk.parried=parerat
actors.mobs.monk.desc=Dessa munkar är fanatiker som har ägnat sig åt att skydda sin kung med fysisk styrka. Deras hängivenhet är så stor att de helt har överlämnat sina sinnen till sin kung och nu vandrar omkring i dvärgstaden som tanklösa zombier. \n\nMunkar förlitar sig enbart på närstridskonst och kan använda sina obeväpnade nävar både för attack och försvar. När de blir fokuserade kommer munkar att parera nästa fysiska attack mot dem, även om den annars skulle ha träffat. Munkar bygger upp fokus snabbare vid rörelse och långsammare i direkt strid.
actors.mobs.monk$focus.name=fokuserad
actors.mobs.monk$focus.desc=Denna munk är helt fokuserad på sitt mål och verkar förutse deras rörelser innan de gör dem. \n\nNär de är fokuserade kommer nästa fysiska attack mot denna karaktär garanterat att missa, oavsett omständigheterna. Att parera denna attack kommer att förbruka munkens fokus, och de måste bygga upp det igen för att parera en annan attack. Munkar bygger upp fokus snabbare när de rör sig.

actors.mobs.phantompiranha.name=fantompiraja
actors.mobs.phantompiranha.teleport_away=Den fantomliknande pirayan teleporterar bort...
actors.mobs.phantompiranha.desc=Fantompirajor är en sällsynt pirajasort med magiska förmågor och kusliga genomskinliga kroppar. De kan teleportera sig medan de attackeras, antingen för att fly eller för att snabbt komma nära sin fiende!\n\nDe är irriterande att slåss mot, men deras kött är uppskattat för sina magiska egenskaper.

actors.mobs.piranha.name=jättepiraja
actors.mobs.piranha.desc=Dessa köttätande fiskar odlas specifikt för att skydda översvämmade områden. Deras bett är dödligt, så det är bäst att undvika att konfrontera dem direkt.
actors.mobs.piranha.discover_hint=Du kan hitta denna fiende överallt i fängelsehålan.

actors.mobs.pylon.name=kraftpylon
actors.mobs.pylon.desc_inactive=En kraftpylon som reglerar elektriciteten som driver maskinerna i området.\n\nPylonen är för närvarande inaktiv och immun mot skada.
actors.mobs.pylon.desc_active=En kraftpylon som är avsedd att reglera elen som driver maskinerna i detta område. Pylon är för närvarande överladdad med elektrisk energi, det måste vara detta som överladdar DM-300!\n\nI detta tillstånd är pyloner sårbara, men kommer att leda elektricitet till närliggande celler i ett mönster medurs. På grund av sin tunga metallkonstruktion är pyloner motståndskraftiga mot stora skador.

actors.mobs.rat.name=kloakråtta
actors.mobs.rat.desc=Kloakråttor är aggressiva men ganska svaga invånare i kloakerna. De har ett otäckt bett, men är bara livsfarliga i stora antal.

actors.mobs.ripperdemon.name=slaktardemon
actors.mobs.ripperdemon.leap=Ripper-demonen förbereder sig för att hoppa!
actors.mobs.ripperdemon.desc=Dessa fasansfulla varelser är resultatet av att demoniska krafter har tagit de många dvärgliken i området i bruk. Slaktare är utmärglade, ghoul-liknande varelser som liknar dvärgar, men har sönderslitna kroppar och långa vassa klor av ben.\n\nSlaktardemoner är inte särskilt tåliga, men smidiga och farliga. De kan hoppa långa sträckor för att snabbt nå sina mål innan de spetsar dem med klorna.

actors.mobs.rotheart.name=röthjärta
actors.mobs.rotheart.desc=En rotbärsfrukt är mycket unik. Istället för att ruttna och ge näring växer frukten, hårdnar och omsluter fröet. Den skyddar de inre organen som växer inuti frukten. Denna gigantiska kula kallas hjärtat av en vuxen rotbärsplanta.
actors.mobs.rotheart.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.rotlasher.name=rötpryglare
actors.mobs.rotlasher.rankings_desc=Piskad av en rötpiska
actors.mobs.rotlasher.desc=Rötpryglare är en del av en mogen rötbärsplants rotstruktur och även deras främsta försvarsmedel. Pryglare är blinda och fastsittande i marken, men attackerar våldsamt alla hot i närheten efter att ha upptäckt dem. När det inte finns några fiender i närheten står de stilla och försöker smälta in i omgivande vegetation.
actors.mobs.rotlasher.discover_hint=Du kan hitta denna fiende under ett specifikt uppdrag.

actors.mobs.scorpio.name=skorpion
actors.mobs.scorpio.desc=Dessa enorma spindelliknande demoniska varelser undviker närstrid och föredrar att avfyra förlamande taggiga spikar från långa avstånd.

actors.mobs.senior.name=äldre munk
actors.mobs.senior.desc=Dessa munkar är fanatiker som har ägnat sig åt att skydda sin kung med fysisk styrka. Deras hängivenhet är så stor att de helt har överlämnat sina sinnen till sin kung och nu vandrar omkring i dvärgstaden som tanklösa zombier. Denna munk har bemästrat konsten att slåss man mot man och kan fokusera vid rörelse mycket snabbare än vanliga munkar. När de blir fokuserade kommer munkarna att parera nästa fysiska attack mot dem, även om den annars garanterat skulle träffa. Munkar bygger upp fokus snabbare när de är i rörelse och långsammare när de är i direkt strid.

actors.mobs.shaman.name=gnollschaman
actors.mobs.shaman.bolt_kill=Det magiska skottet dödade dig...
actors.mobs.shaman.desc=Gnollshamaner är intelligenta gnoller som använder stridsbesvärjelser för att kompensera för sin brist på styrka. De har en mycket respekterad ställning i gnollsamhället, trots sin svagare styrka.
actors.mobs.shaman$redshaman.spell_desc=Denna schaman bär en röd mask och använder magi som tillfälligt _försvagar din attackkraft._
actors.mobs.shaman$blueshaman.spell_desc=Denna schaman bär en blå mask och använder magi som tillfälligt _ökar skadan du tar._
actors.mobs.shaman$purpleshaman.spell_desc=Denna schaman bär en lila mask och använder magi som tillfälligt _minskar din träffsäkerhet och undvikandeförmåga._

actors.mobs.armoredbrute.name=pansarbrute
actors.mobs.armoredbrute.desc=De mest erfarna gnollbrutarna bär ofta kraftfull rustning för att visa sin status. Rustningen gör dessa brutare mycket mer motståndskraftiga mot fysisk skada, och deras större disciplin innebär att de kan rasa mycket längre innan de dukar under för sina skador.

actors.mobs.skeleton.name=skelett
actors.mobs.skeleton.explo_kill=Du dog av explosionen av ben...
actors.mobs.skeleton.def_verb=blockerat
actors.mobs.skeleton.desc=Skelett består av ben från olyckliga äventyrare och invånare i fängelset, som väcks till liv av ond magi från djupet under jorden. När de har skadats tillräckligt går skelett sönder i en explosion av ben. Splitter från explosionen är skadliga för allt i närheten, men rustningar är mycket effektiva för att mildra skadorna.

actors.mobs.slime.name=slem
actors.mobs.slime.def_verb=blockerat
actors.mobs.slime.desc=Slem är märkliga, något magiska varelser med ett gummiartat yttre och en flytande kärna. Stadens kloaker förser dem med rikligt med vatten och näring.\n\nPå grund av sitt elastiska yttre membran är det svårt att orsaka mer än _6 skada_ på slem med en enskild attack.

actors.mobs.snake.name=kloakorm
actors.mobs.snake.hint=Försök använda undersöka-knappen på en orm för att lära dig hur du kan bekämpa dem.
actors.mobs.snake.desc=Dessa överdimensionerade ormar kan snabbt slingra sig undan slag, vilket gör dem svåra att träffa. Magiska attacker eller överraskningsattacker kan dock få dem på fel fot.\n\nDu kan utföra en överraskningsattack genom att attackera medan du befinner dig utanför ormens synfält. Ett sätt är att låta ormen jaga dig genom en dörröppning och sedan _slå till precis när den rör sig in genom dörren._

actors.mobs.spectralnecromancer.name=spektral nekromantiker
actors.mobs.spectralnecromancer.desc=Skelett är en nekromantikers bröd och smör, men vissa föredrar mer okroppsliga underhuggare. Spektrala nekromantiker har valt vålnader som sina förstahandsunderhuggare!\n\nEnskilda vålnader är inte lika starka som skelett, men dessa nekromantiker tvekar inte att framkalla en hel mängd av dem!

actors.mobs.spinner.name=grottspinnare
actors.mobs.spinner.desc=Dessa grönaktiga, håriga grottspindlar försöker undvika direkt strid. Istället föredrar de att vänta på avstånd medan deras offer kämpar i deras utsöndrade spindelnät och långsamt dör av deras giftiga bett. De kan skjuta sina nät långa sträckor och försöker blockera alla vägar som deras byte tar.

actors.mobs.statue.name=animerad staty
actors.mobs.statue.def_verb=blockerat
actors.mobs.statue.desc=Man skulle kunna tro att det bara är ännu en livlös staty i denna fängelsehåla, men dess glödande röda ögon avslöjar den.
actors.mobs.statue.desc_weapon=Även om statyn själv är av sten ser _%s_ som den bär ut att vara äkta.
actors.mobs.statue.discover_hint=Du kan hitta denna fiende överallt i fängelsehålan.

actors.mobs.succubus.name=succubus
actors.mobs.succubus.desc=Succubi är formskiftande demoner som manipulerar sina bytens sinnen. Den här har tagit formen av en blek gotisk humanoid, kanske för att locka dvärgiska häxmästare?\n\nSuccubi kan tillfälligt förtrolla sina fiender när de attackerar, vilket gör att fienderna inte kan attackera dem direkt. När succubi attackerar en förtrollad fiende stjäl de en del av deras livskraft.

actors.mobs.swarm.name=svärm av flugor
actors.mobs.swarm.desc=Den dödliga flugsvärmen surrar ilsket. Varje icke-magisk attack delar den i två mindre men lika farliga svärmar.

actors.mobs.tengu.name=Tengun
actors.mobs.tengu.notice_gotcha=Fick dig, %s!
actors.mobs.tengu.interesting=Låt oss göra detta mer intressant...
actors.mobs.tengu.notice_have=Nu har jag dig, %s!
actors.mobs.tengu.defeated=Äntligen fri...
actors.mobs.tengu.rankings_desc=Mördad av tengun
actors.mobs.tengu.desc=En berömd och gåtfull lönnmördare, uppkallad efter masken som är fastsatt på hans ansikte.\n\nTengu hålls fast med stora klämmor på handlederna och knäna, men han verkar ha gjort sig av med kedjorna för länge sedan.\n\nHan kommer att försöka använda fällor, bedräglig magi och precisa attacker för att eliminera det enda som hindrar honom från att fly: dig.

actors.mobs.tengu$bombability$bombblob.desc=Ett moln av överhettad rök böljar här. Se upp, det kommer att explodera!
actors.mobs.tengu$bombability$bombitem.name=Rökbomb
actors.mobs.tengu$bombability$bombitem.cant_pickup=Den är fast på marken. Du kan inte flytta den!
actors.mobs.tengu$bombability$bombitem.desc=Tengu har kastat en konstig rökbomb här, som sprider en tjock, het rök. Den avger ett högt tickande ljud, som om den räknar ner till en explosion!\n\nBomben har fastnat i marken, så du kan inte plocka upp den.

actors.mobs.tengu$fireability$fireblob.desc=Tengu har kastat ett fint pulver som verkar fatta eld här. Det är på väg att antändas!

actors.mobs.tengu$shockerability$shockerblob.desc=Elektrisk energi byggs upp här, allt som står på denna ruta kommer att få en stöt nästa tur!
actors.mobs.tengu$shockerability$shockeritem.name=Shockare
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Den pumpar ut för mycket elektricitet! Du kan inte ta tag i den!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu har kastat en märklig maskin här, som verkar vara gjord av DM-100-delar. Maskinen avger ständigt elektriska gnistor, men det verkar följa ett förutsägbart mönster.\n\nMed all elektricitet som avges runt den är det omöjligt att plocka upp den.

actors.mobs.thief.name=galen tjuv
actors.mobs.thief.stole=Tjuven stal %s från dig!
actors.mobs.thief.carries=\n\nTjuven bär en _%s._ Självklart stulen.
actors.mobs.thief.escapes=Tjuven kommer undan med din %s!
actors.mobs.thief.desc=Även om dessa fångar rör sig fritt utanför sina celler är platsen fortfarande deras fängelse. Med tiden har den tagit både deras sinnen och frihet. För länge sedan glömde de galna tjuvarna och banditerna vilka de är och varför de stjäl.\n\nDessa fiender är mer benägna att stjäla och fly än att slåss. Se till att hålla dem i sikte, annars kanske du aldrig ser ditt stulna föremål igen.

actors.mobs.tormentedspirit.name=plågad ande
actors.mobs.tormentedspirit.desc=Plågade andar är annars godmodiga andar som har drabbats av en förbannelse. Så länge de är förbannade kommer de att attackera precis som vålnader, och de är dessutom starkare! \n\nDet kan vara möjligt att rena förbannelsen genom att använda rätt föremål vid andens sida. Om förbannelsen hävs kommer anden säkert att vara tacksam...
actors.mobs.tormentedspirit.thank_you=Tack...

actors.mobs.npcs.vaultlaser.name=disintegrationsväktare
actors.mobs.npcs.vaultlaser.ondeath=Du dödades av disintegrationsstrålen...
actors.mobs.npcs.vaultlaser.desc=De här väktarna avfyrar strålar av disintegrationsmagi med jämna eller halvslumpmässiga mellanrum. Strålarna ser mycket farliga ut, men de verkar åtminstone alltid gå till samma plats. Det verkar inte finnas något sätt att stå emot disintegrationsstrålarna, så _du måste undvika dem på något sätt_.

actors.mobs.npcs.vaultsentry.name=skanningsväktare
actors.mobs.npcs.vaultsentry.ondeath=Blixten dödade dig...
actors.mobs.npcs.vaultsentry.desc=De här väktarna skannar området i ett förinställt mönster. De ser mycket farliga ut; du blir säkert träffad av en stöt om skanningen upptäcker dig. Mönstret kan ofta undvikas, men väktarna måste också se dig visuellt för att upptäcka dig, så _allt som skymmer sikten fungerar mot dem_.

actors.mobs.npcs.vaulttokendoor.name=märklig dörr
actors.mobs.npcs.vaulttokendoor.def_verb=blockerat
actors.mobs.npcs.vaulttokendoor.desc=Den här till synes olåsta dörren rör sig inte och har en ovanlig mekanism på sin yta. Det finns tio fördjupningar som ser ut att rymma någon sorts platt, diamantformat föremål.
actors.mobs.npcs.vaulttokendoor.no_tokens=_Kanske passar något du kan hitta i valvet här?_
actors.mobs.npcs.vaulttokendoor.too_few_tokens=_Dina dvärgpolletter passar perfekt i fördjupningarna_, men du har inte tillräckligt många.
actors.mobs.npcs.vaulttokendoor.enough_tokens=_Du har tillräckligt många dvärgpolletter för att fylla alla fördjupningar_. Vill du placera dem i dörren?
actors.mobs.npcs.vaulttokendoor.open=Öppna dörren
actors.mobs.npcs.vaulttokendoor.not_yet=Inte än
actors.mobs.npcs.vaulttokendoor.unlocked=Polletterna verkar smälta samman med dörren och du hör det tydliga klicket från ett lås som öppnas.

actors.mobs.npcs.vaultmirror.name=Märklig spegel
actors.mobs.npcs.vaultmirror.def_verb=blockerat
actors.mobs.npcs.vaultmirror.desc=Den här stora spegeln är täckt av olika lysande dvärgrunor. Den surrar svagt men verkar inte faktiskt reflektera något.
actors.mobs.npcs.vaultmirror.approach=Framför dig står en stor spegel med tunna lysande runor inristade i den praktfulla gyllene ramen. Spegelns yta är kolsvart tills du kommer nära. När du lutar dig mot spegeln blinkar runorna starkt och en chockerande välbekant scen syns bakom glaset.
actors.mobs.npcs.vaultmirror.scene_warrior=Du ser ditt röda _vaxsigill_, kluvet mitt itu och delvis begravt i snön. Scenen liknar nästan ett minne, men detaljerna är annorlunda. Du kunde aldrig förmå dig att kasta bort sigillet; att behålla det kändes som en del av ditt straff. Du har också tittat länge på det, och brottet har en något annan vinkel.
actors.mobs.npcs.vaultmirror.scene_mage=Du ser din _magiska stav_ vila på ett bord i ett arbetsrum. Scenen liknar nästan ett minne, men detaljerna är annorlunda. Det här var ditt offentliga kontor vid det södra magiinstitutet; en alltför synlig plats för att förvara staven. Kontoret ser dessutom mer bebott ut än det borde; du brydde dig aldrig om att utföra riktigt arbete där.
actors.mobs.npcs.vaultmirror.scene_rogue=Du ser _Skuggornas kappa_ vila varsamt på ett ställ i den kungliga vapenarsenalen. Scenen liknar nästan ett minne, men detaljerna är annorlunda. Vapenarsenalen är stilla och tyst, och vakten i tjänst granskar lugnt rummet med vänlig blick. En välbekant skuldhugning känns när du ser honom stå där, fridfull och oskadd.
actors.mobs.npcs.vaultmirror.scene_huntress=Du ser din _andebåge_ placerad på en stor, platt, rund sten omgiven av tät skog. Scenen liknar nästan ett minne, men detaljerna är annorlunda. Den lilla gläntan runt stenen är tyst och tom, helt olik firandet när du fick din båge. Faktum är att du inte känner någonting alls från naturen runt omkring.
actors.mobs.npcs.vaultmirror.scene_duelist=Du ser en lång gestalt i den kungliga vaktens rustning framför dig: din avlidne far. Scenen liknar nästan ett minne, men detaljerna är annorlunda. Den vänliga blicken i hans ögon är precis som du minns den, men ansiktet är märkt av år han aldrig fick leva. Han räcker fram sitt _förtrollade tvåhandssvärd_ åt dig.
actors.mobs.npcs.vaultmirror.scene_cleric=Du ser en öppnad relikskrinskista i ett starkt upplyst kapell, med den _heliga boken_ i sig. Scenen liknar nästan ett minne, men detaljerna är annorlunda. Du tog aldrig ut relikskrinet ur förvaringen, bara själva boken. De gudomliga energier som strålar från boken känns också ovanliga, som om den kanaliserar energi från en annan källa.
actors.mobs.npcs.vaultmirror.scene_final=Du märker att spegelns glasyta är helt borta; ingenting hindrar dig från att sträcka in handen och ta föremålet.
actors.mobs.npcs.vaultmirror.take=Ta föremålet
actors.mobs.npcs.vaultmirror.scene_take=När du sträcker in handen och tar föremålet är scenen oförändrad, som om föremålet finns på två platser samtidigt.\n\nBilden i spegeln bleknar, och föremålet i din hand verkar pulsera svagt i samma rytm som runorna runt spegeln.\n\nDu är inte riktigt säker på vad som just hände, men föremålets existens verkar vara knuten till spegeln. Du kommer förmodligen inte kunna ta ut det ur valvet.
actors.mobs.npcs.vaultmirror.scene_nothing=Du närmar dig spegeln igen, men ingenting händer. Dess yta är slät och fast; du kan knappt se reflektionen av dina fingertoppar när du rör vid glaset.

actors.mobs.warlock.name=dvärghäxmästare
actors.mobs.warlock.bolt_kill=Skuggskottet dödade dig...
actors.mobs.warlock.desc=När dvärgarnas intressen skiftade från teknik till arkan konst tog häxmästarna makten i staden. De började med elementarmagi, men övergick snart till demonologi och nekromanti. Den starkaste av dem tog dvärgstadens tron, och hans anhängare fick fortsätta utöva mörk magi så länge de överlämnade sin fria vilja till honom.\n\nDessa häxmästare besitter kraftfull störande magi och kan tillfälligt hindra uppgraderingsmagi som lagts på din utrustning. Ju mer uppgraderat ett föremål är, desto starkare påverkas det.

actors.mobs.wraith.name=vålnad
actors.mobs.wraith.desc=En vålnad är en hämndlysten ande av en syndare vars grav eller gravplats har störts. Eftersom den är en eterisk varelse är den mycket svår att träffa med vanliga vapen.
actors.mobs.wraith.discover_hint=Du kan hitta denna fiende överallt i fängelsehålan.

actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=JAG. SER. DIG.
actors.mobs.yogdzewa.darkness=Mörkret drar sig närmare...
actors.mobs.yogdzewa.hope=DITT. HOPP. ÄR. EN. ILLUSION!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogdzewa.desc=Yog-Dzewa är en gammal gud, en enorm styggelse som sträcker sig in i dödliga världar och slukar dem för att driva sin oändliga tillväxt. Dvärgarna måste ha väckt denna kosmiska skräcks uppmärksamhet när de lekte med mörk magi och har sedan dess försökt hålla den instängd.\n\nYog-Dzewa kommer från en dimension av ren magisk oordning och kan inte föra in sin sanna form i denna värld. I stället har den skapat avatarer och frammanat demoniska underhuggare som utför dess vilja här.\n\nDetta gigantiska öga är centrum för Yog-Dzewas makt i världen. Ögat är orörligt, men kan skjuta kraftfulla strålar av demonisk magi och framkalla en mängd olika underhuggare som hjälper det.
actors.mobs.yogdzewa.desc_spawners=Du kan känna vågor av demonisk energi stråla mot ögat från våningarna ovanför. Något du lämnade vid liv där uppe måste leda tillbaka kraften till Yog-Dzewa. _Yog kommer att använda denna energi för att kalla fram ännu mäktigare tjänare!_
actors.mobs.yogdzewa$larva.name=guds larv
actors.mobs.yogdzewa$larva.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogdzewa$larva.desc=Dessa små avkommor till Yog-Dzewa är enkla underhuggare som är lätta att skapa. Var för sig är de svaga, men de framkallas snabbt och kan bli överväldigande i stort antal.
actors.mobs.yogdzewa$yogripper.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Slukades av Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Slukades av Yog-Dzewa

actors.mobs.yogfist.invuln_warn=Knytnäven är osårbar vid ögat!
actors.mobs.yogfist.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogfist.desc=Denna näve är en aspekt av Yog-Dzewas makt. Nävarna är kopplade till Yog-Dzewas makt och skyddas från all skada när de är nära ögat.
actors.mobs.yogfist$burningfist.name=brinnande näve
actors.mobs.yogfist$burningfist.desc=Denna näve är formad av kaotisk eldsmagi. När den rör sig sätter den ständigt terrängen omkring sig i brand. Den kan också skjuta ut eldstrålar som sprider lågor där de träffar.\n\nNävens förmåga att sprida lågor hämmas nära vatten, men hettan är så stor att allt vatten omkring den förångas efter en kort stund!
actors.mobs.yogfist$soiledfist.name=smutsad näve
actors.mobs.yogfist$soiledfist.desc=Denna näve är formad av kaotisk jordmagi. När den rör sig får den ständigt vegetation att spira omkring sig. Den kan också skjuta koncentrerade jordskurar som snärjer sitt mål i snabbt växande rankor och rötter!\n\nNäven hämtar kraft från växtligheten och motstår skada beroende på mängden högt eller uppplöjt gräs i närheten!
actors.mobs.yogfist$rottingfist.name=ruttnande näve
actors.mobs.yogfist$rottingfist.desc=Denna näve är formad av levande förruttnelse. Den är en tornande massa av ruttnande kött som kan sprida frätande slem i närstrid och giftig gas på avstånd. Än värre är att nävens stora massa gör att den blöder i stället för att ta skada direkt.\n\nVatten kan användas för att tvätta bort slemmet, men näven kan också absorbera vatten för att läka sig själv! Att skada näven medan den blöder återställer blödningen, men staplar den inte!
actors.mobs.yogfist$rustedfist.name=rostande näve
actors.mobs.yogfist$rustedfist.desc=Denna näve är formad av levande metall. Den är en tornande massa av föränderlig metall som har kraftfulla närstridsattacker och kan förlama sina mål på avstånd. På grund av sin enorma massa tar näven skada över tid i stället för omedelbart.\n\nNäven är dock oflexibel och kan inte röra sig i trånga passager. Även om den tar skada långsamt fortsätter den uppskjutna skadan att öka om näven träffas flera gånger.
actors.mobs.yogfist$brightfist.name=lysande näve
actors.mobs.yogfist$brightfist.teleport=Näven teleporteras iväg i en blixt av ljus som bländar dig rejält!
actors.mobs.yogfist$brightfist.desc=Denna näve är formad av ren ljusenergi. Den kan skjuta kraftfulla strålar av brännande ljus varje tur! Strålarna förblindar dig tillfälligt och orsakar dessutom stor skada. Näven kan också kortvarigt omsluta arenan i bländande ljus för att fly!\n\nNäven har dock inga specialförmågor som den kan använda på nära håll.
actors.mobs.yogfist$darkfist.name=mörk näve
actors.mobs.yogfist$darkfist.teleport=Näven teleporterar iväg i en våg av mörker som släcker din ljuskälla!
actors.mobs.yogfist$darkfist.desc=Denna näve är formad av ren mörk energi. Den kan skjuta kraftfulla skurar av mörk magi varje tur! Skurarna försvagar din ljuskälla och orsakar dessutom stor skada. Näven kan också kortvarigt omsluta arenan i mörker för att fly!\n\nNäven har dock inga specialförmågor som den kan använda på nära håll.


actors.char.kill=%s dödade dig…
actors.char.defeat=Du besegrade %s.
actors.char.def_verb=undvek
actors.char.invulnerable=osårbar
actors.char.immune=immun
