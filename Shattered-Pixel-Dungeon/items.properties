###armor curses
items.armor.curses.antientropy.name=%s av anti-entropi
items.armor.curses.antientropy.desc=Antientropiförbannelsen motverkar universums krafter och drar energi till bäraren och bort från omgivningen. Den sätter kortvarigt bäraren i brand, men fryser allt omkring hen!

items.armor.curses.bulk.name=%s av bulk
items.armor.curses.bulk.desc=Bulkrustning ser större och mer imponerande ut, men har faktiskt inget bättre försvar. Än värre är att den ökade storleken gör det mycket svårt att ta sig genom dörröppningar.

items.armor.curses.corrosion.name=%s av korrosion
items.armor.curses.corrosion.desc=Korrosionsrustning kan spricka och spruta ut frätande vätska som täcker allt i området med klibbig, sur sörja.

items.armor.curses.displacement.name=%s av förflyttning
items.armor.curses.displacement.desc=Förflyttningsförbannelsen försöker flytta bäraren till säkerhet när denne attackeras. Den är dock lite för effektiv och teleporterar användaren slumpmässigt runt i nivån.

items.armor.curses.metabolism.name=%s av metabolism
items.armor.curses.metabolism.desc=Metabolismförbannelsen omvandlar direkt mättnad till hälsa när bäraren skadas, vilket ger bättre läkning men snabbt leder till svält.

items.armor.curses.multiplicity.name=%s av multiplicitet
items.armor.curses.multiplicity.desc=Rustning som är förhäxad med mångfald innehåller farlig dupliceringsmagi. Den skapar ibland en spegelbild av bäraren, men duplicerar lika gärna angriparen!

items.armor.curses.overgrowth.name=%s av överväxt
items.armor.curses.overgrowth.desc=Överväxtrustning är täckt med olika blommande växter. Effekten ser förvisso intressant ut, men ger inget försvar och växterna aktiveras slumpmässigt i strid!

items.armor.curses.stench.name=%s av stank
items.armor.curses.stench.desc=Rustning som är förbannad med stank släpper ut moln av giftig gas som är farlig för allt som fångas i molnet.


###glyphs
items.armor.glyphs.affection.name=%s av tillgivenhet
items.armor.glyphs.affection.desc=Denna kraftfulla glyf manipulerar angriparnas sinnen och förtrollar dem tillfälligt.

items.armor.glyphs.antimagic.name=%s av anti-magi
items.armor.glyphs.antimagic.desc=Den här kraftfulla glyfen gör att rustningen kan försvara sin bärare mot magiska attacker såväl som fysiska. Detta magiska försvar påverkas inte av rustningens nivå.

items.armor.glyphs.brimstone.name=%s av svavel
items.armor.glyphs.brimstone.desc=Denna glyf skyddar bäraren och hens ägodelar från eld, och upphäver helt eldskada och negativa effekter.

items.armor.glyphs.camouflage.name=%s av kamouflage
items.armor.glyphs.camouflage.desc=Denna glyf låter bäraren smälta in i högt gräs, vilket ger dem tillfällig osynlighet.

items.armor.glyphs.entanglement.name=%s av intrassling
items.armor.glyphs.entanglement.desc=Denna glyf bildar en jordrustning runt bäraren för att absorbera skador, men rustningen går sönder om bäraren rör sig.

items.armor.glyphs.flow.name=%s av flöde
items.armor.glyphs.flow.desc=Denna glyf manipulerar vattnets flöde runt bäraren och gör hen mycket snabbare när hen rör sig genom det.

items.armor.glyphs.obfuscation.name=%s av förvillelse
items.armor.glyphs.obfuscation.desc=Denna glyf döljer bäraren och gör hen svårare att upptäcka.

items.armor.glyphs.potential.name=%s av potential
items.armor.glyphs.potential.desc=Denna glyf bygger upp energi när bäraren träffas och ger laddning till bärarens trollstav när den aktiveras.

items.armor.glyphs.repulsion.name=%s av bortstötning
items.armor.glyphs.repulsion.desc=Denna glyf studsar tillbaka kraft mot angripare och skickar dem flygande bakåt.

items.armor.glyphs.stone.name=%s av sten
items.armor.glyphs.stone.desc=Denna glyf omringar rustningen med tung magisk sten som gör det omöjligt att undvika attacker, men som blockerar skada i proportion med ens undvikandeförmåga.

items.armor.glyphs.swiftness.name=%s av kvickhet
items.armor.glyphs.swiftness.desc=Denna glyf ökar bärarens hastighet när hen inte är nära en fiende.

items.armor.glyphs.thorns.name=%s av törne
items.armor.glyphs.thorns.desc=Denna kraftfulla glyf skadar angripare och får dem att blöda långsamt när de attackerar bäraren.

items.armor.glyphs.viscosity.name=%s av viskositet
items.armor.glyphs.viscosity.deferred=uppskjutet %d
items.armor.glyphs.viscosity$defereddamage.name=uppskjuten skada
items.armor.glyphs.viscosity$defereddamage.ondeath=Den uppskjutna skadan dödade dig...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Dödad av uppskjuten skada
items.armor.glyphs.viscosity$defereddamage.desc=Skada tillfogas långsamt över tid i stället för omedelbart.\n\nÅterstående uppskjuten skada: %d.
items.armor.glyphs.viscosity.desc=Denna glyf kan lagra skada som tillfogas bäraren och tillfoga den långsamt i stället för allt på en gång.



###armor
items.armor.armor.ac_detach=TA LOSS
items.armor.armor.detach_seal=Du tar loss sigillet från din rustning.
items.armor.armor.equip_cursed=Rustningen drar smärtsamt ihop sig runt dig.
items.armor.armor.identify=Du är nu bekant nog med din rustning för att identifiera den.
items.armor.armor.hardening_gone=Härdningen på denna rustning har försvunnit!
items.armor.armor.incompatible=Olika magityper har samverkat och raderat glyfen på den här rustningen!
items.armor.armor.curr_absorb=Den här rustningen av _nivå %1$d_ blockerar _%2$d–%3$d skada_ och kräver _%4$d styrka_ för att användas effektivt.
items.armor.armor.avg_absorb=Vanligtvis blockerar den här rustningen av _nivå %1$d_ _%2$d–%3$d skada_ och kräver _%4$d styrka_ för att användas effektivt.
items.armor.armor.too_heavy=På grund av din otillräckliga styrka kommer den här rustningen att minska din förmåga att röra dig, undvika och försvara dig.
items.armor.armor.probably_too_heavy=Den här rustningen är nog för tung för dig.
items.armor.armor.excess_str=På grund av din överskjutande styrka _undviker du bättre_ när du bär den här rustningen.
items.armor.armor.evasion=Den är förstärkt för att förbättra _undvikande_.
items.armor.armor.defense=Den är förstärkt för att förbättra _försvar._
items.armor.armor.inscribed=Den är inskriven med en _%s._
items.armor.armor.glyph_hardened=Den har blivit _härdad._
items.armor.armor.hardened_no_glyph=Den här rustningen har blivit _härdad,_ men är för närvarande inte inskriven med en glyf.
items.armor.armor.cursed_worn=Den här rustningen är förbannad och du kan inte ta bort den.
items.armor.armor.cursed=Du kan känna en illvillig magi som lurar i denna rustning.
items.armor.armor.weak_cursed=Trots förbannelsen kan du ta av dig den här rustningen.
items.armor.armor.not_cursed=Den här rustningen är fri från illvillig magi.
items.armor.armor.seal_attached=Krigarens brutna sigill är fäst vid den här rustningen. När Krigaren snart skadas och hamnar under halva sin hälsa får han _%d sköld_.
items.armor.armor.seal_transfer=Krigarens brutna sigill måste vara fäst vid rustningen han bär för att vara till nytta. Vill du automatiskt ta loss sigillet från rustningen du tar av och fästa det vid rustningen du tar på?
items.armor.armor.seal_transfer_yes=ja
items.armor.armor.seal_transfer_no=nej
items.armor.armor$glyph.glyph=glyf
items.armor.armor$glyph.killed=Du dödades av %s…
items.armor.armor$glyph.rankings_desc=Dödad av en glyf
items.armor.armor$glyph.discover_hint=Du kan hitta ett föremål med den här effekten slumpmässigt i fängelsehålan, eller försöka använda den på ett föremål själv.

items.armor.classarmor.ac_ability=Välj förmåga
items.armor.classarmor.ac_transfer=ÖVERFÖR
items.armor.classarmor.no_ability=Din rustning har för närvarande ingen förmåga. Du bör välja en!
items.armor.classarmor.not_equipped=Du måste bära den här rustningen för att kunna använda dess speciella kraft!
items.armor.classarmor.low_charge=Rustningen har inte tillräckligt med laddning för att använda sin speciella kraft!
items.armor.classarmor.charge_use=Att använda förmågan just nu kommer att förbruka _%s_ laddning.
items.armor.classarmor.transfer_title=Överför rustning
items.armor.classarmor.transfer_desc=Magin i dvärgkungens krona kan överföras till en annan rustning. Observera att den ursprungliga rustningen kommer att förstöras i processen.
items.armor.classarmor.transfer_prompt=Välj en rustning
items.armor.classarmor.transfer_cancel=Avbryt
items.armor.classarmor.transfer_complete=Din heroiska rustnings egenskaper har överförts!
items.armor.classarmor.discover_hint=Du kan hitta det här föremålet efter att ha besegrat bossen på våning 20 med en specifik hjälte.

items.armor.clericarmor.name=hjältens klädedräkt
items.armor.clericarmor.desc=När prästen bär denna blandning av tyg och metallplattor kan hen använda en speciell förmåga.

items.armor.clotharmor.name=tygrustning
items.armor.clotharmor.desc=Den här lätta rustningen ger ett grundläggande skydd.
items.armor.clotharmor.discover_hint=En av hjältarna börjar med detta föremål.

items.armor.duelistarmor.name=hjältens bröstplåt
items.armor.duelistarmor.desc=När duellanten bär denna plåtrustning och mantel kan hon använda en speciell förmåga.

items.armor.huntressarmor.name=hjältinnans mantel
items.armor.huntressarmor.no_enemies=Inga fiender i sikte
items.armor.huntressarmor.desc=När jägarinnan bär denna mantel kan hon använda en speciell förmåga.

items.armor.leatherarmor.name=läderrustning
items.armor.leatherarmor.desc=Rustning av garvat monsterskinn. Den är inte lika lätt som en tygrustning, men ger bättre skydd.

items.armor.magearmor.name=hjältens mantel
items.armor.magearmor.desc=När Magikern bär denna vackra mantel kan han använda en speciell förmåga.

items.armor.mailarmor.name=ringbrynja
items.armor.mailarmor.desc=Sammanlänkade metallringar bildar en tålig men flexibel rustning.

items.armor.platearmor.name=plåtrustning
items.armor.platearmor.desc=Enorma metallplattor sammanfogas till en dräkt som ger oöverträffat skydd åt alla äventyrare som är starka nog att bära dess svindlande vikt.

items.armor.roguearmor.name=hjältens dräkt
items.armor.roguearmor.desc=När Tjuven bär denna mörka dräkt kan han använda en speciell förmåga.

items.armor.scalearmor.name=fjällpansar
items.armor.scalearmor.desc=Skalorna av metall som är fastsydda på en läderväst skapar en flexibel men skyddande rustning.

items.armor.warriorarmor.name=hjältens riddarrustning
items.armor.warriorarmor.desc=När Krigaren bär denna tunga plåtrustning kan han använda en speciell förmåga.



###artifacts
items.artifacts.alchemiststoolkit.name=alkemistens verktygslåda
items.artifacts.alchemiststoolkit.ac_brew=BRYGG
items.artifacts.alchemiststoolkit.ac_energize=LADDA
items.artifacts.alchemiststoolkit.not_ready=Din verktygslåda har inte värmts upp färdigt.
items.artifacts.alchemiststoolkit.cursed=Din förbannade verktygslåda hindrar dig från att använda alkemi!
items.artifacts.alchemiststoolkit.need_energy=Du behöver minst 6 energi för det.
items.artifacts.alchemiststoolkit.energize_desc=Var sjätte energikristall ger verktygslådan tillräckligt med energi för att gå upp en nivå, vilket både ökar takten som den genererar energi i och hur snabbt den värms upp.\n\nHur mycket energi vill du använda?
items.artifacts.alchemiststoolkit.energize_1=6 energi: +1 nivå
items.artifacts.alchemiststoolkit.energize_all=%1$d energi: +%2$d nivåer
items.artifacts.alchemiststoolkit.desc=Den här verktygslådan innehåller ett antal reagenser och örter tillsammans med en liten blandningsflaska, vilket möjliggör alkemi på språng. Flaskan innehåller vad som ser ut som alkemiska energikristaller i flytande form.
items.artifacts.alchemiststoolkit.desc_cursed=Den förbannade verktygslådan har bundit sig till din sida och vägrar låta dig använda alkemi.
items.artifacts.alchemiststoolkit.desc_warming=Verktygslådan håller på att värmas upp och kommer att vara redo att användas vid ett senare tillfälle.
items.artifacts.alchemiststoolkit.desc_hint=Den utrustade verktygslådan genererar långsamt alkemisk energi i takt med att du får mer erfarenhet. Det ser ut som om blandningen i flaskan kan förbättras genom att lägga till energikristaller i den.

items.artifacts.artifact.cannot_wear_two=Du kan inte bära två av samma artefakt.
items.artifacts.artifact.equip_cursed=Artefakten binder sig smärtsamt till dig.
items.artifacts.artifact.curse_known=Du kan känna en illvillig magi som lurar i artefakten.
items.artifacts.artifact.not_cursed=Den här artefakten är fri från illvillig magi.
items.artifacts.artifact.need_to_equip=Du måste utrusta din artefakt för att göra det.

items.artifacts.capeofthorns.name=törnekåpa
items.artifacts.capeofthorns.desc=De hoptryckta metallplåtarna från DM-300 har förenats till en styv mantel. Den verkar lagra en djup energi; kanske har den en del av DM-300:s kraft?
items.artifacts.capeofthorns.desc_inactive=Manteln känns betryggande tung på dina axlar, den verkar få energi från skadorna du tar.
items.artifacts.capeofthorns.desc_active=Manteln verkar släppa lagrad energi, den utstrålar en skyddande kraft.
items.artifacts.capeofthorns$thorns.inert=Din törnekåpa blir overksam igen.
items.artifacts.capeofthorns$thorns.radiating=Din törnekåpa börjar stråla energi; du känner dig skyddad!
items.artifacts.capeofthorns$thorns.levelup=Din törnekåpa blir starkare!
items.artifacts.capeofthorns$thorns.name=törnar
items.artifacts.capeofthorns$thorns.desc=Din törnekåpa strålar energi och omger dig med ett fält av avledande kraft!\n\nAll skada du tar minskar medan törneffekten är aktiv. Om angriparen står bredvid dig avleds den minskade mängden tillbaka mot angriparen.\n\nÅterstående turer med törnen: %s.

items.artifacts.chaliceofblood.name=blodskalk
items.artifacts.chaliceofblood.ac_prick=STICK DIG
items.artifacts.chaliceofblood.yes=Ja, jag vet vad jag gör
items.artifacts.chaliceofblood.no=Nej, jag ändrade mig
items.artifacts.chaliceofblood.prick_warn=Varje gång du använder kalken kommer den att tömma mer av din livsenergi, men i gengäld kommer den att ytterligare förbättra din naturliga hälsogenerering.\n\nFör närvarande kommer du att åsamkas _%1$d-%2$d skada_ när du sticker dig själv, men denna skada kan minskas genom _både fysisk och magisk blockering eller skadereduktion._ Utan att ta hänsyn till skadereduktionseffekter har du för närvarande _%3$s%% chans_ att tömma din livskraft helt när du sticker dig själv.\n\nÄr du säker på att du vill ge kalken mer livsenergi?
items.artifacts.chaliceofblood.onprick=Du sticker dig själv och din livsessens rinner ner i kalken.
items.artifacts.chaliceofblood.ondeath=Kalken suger ut din livsenergi...
items.artifacts.chaliceofblood.desc=Den här silverglänsande kalken är märkligt nog utsmyckad med vassa ädelstenar på kanten.
items.artifacts.chaliceofblood.desc_cursed=Den förbannade kalken har bundit sig till din hand och hämmar din förmåga att återskapa hälsa.
items.artifacts.chaliceofblood.desc_1=När du håller i kalken känner du dig märkligt tvingad att sticka dig på de vassa ädelstenarna.
items.artifacts.chaliceofblood.desc_2=En del av ditt blod samlas i kalken och du kan svagt känna hur den förser dig med livsenergi, vilket ökar din naturliga hälsoregenerering. Du vill fortfarande skära dig på kalken, trots att du vet att det kommer att göra ont.
items.artifacts.chaliceofblood.desc_3=Kalken är fylld till brädden med din livsessens. Du kan känna hur kalken häller tillbaka livsenergi i dig.

items.artifacts.cloakofshadows.name=skuggornas mantel
items.artifacts.cloakofshadows.ac_stealth=SMYG
items.artifacts.cloakofshadows.cooldown=Din mantel behöver %d fler turer för att återfå energi.
items.artifacts.cloakofshadows.cursed=Du kan inte använda en förbannad mantel.
items.artifacts.cloakofshadows.no_charge=Din mantel har inte laddats tillräckligt för att vara användbar än.
items.artifacts.cloakofshadows.desc=En ovärderlig magisk mantel som Tjuven stal från den kungliga vapenarsenalen för många år sedan. När den bärs kan den göra bäraren helt osynlig en kort stund.\n\nJu mer manteln används, desto starkare blir den, så att Tjuven kan bli osynlig oftare och under längre tid.
items.artifacts.cloakofshadows.discover_hint=En av hjältarna börjar med det här föremålet.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Din mantel har slut på energi.
items.artifacts.cloakofshadows$cloakstealth.levelup=Din mantel blir starkare!
items.artifacts.cloakofshadows$cloakstealth.name=dold
items.artifacts.cloakofshadows$cloakstealth.desc=Din skuggmantel gör dig osynlig medan du är höljd i den. Du förblir dold tills effekten avbryts eller mantelns laddning tar slut.\n\nNär du är osynlig kan fiender varken attackera eller följa dig. Fysiska attacker och magiska effekter, som skriftrullar och trollstavar, avbryter genast osynligheten.\n\nTurer tills laddning används: %d.

items.artifacts.driedrose.name=torkad ros
items.artifacts.driedrose.ac_summon=FRAMKALLA
items.artifacts.driedrose.ac_direct=DIREKT
items.artifacts.driedrose.ac_outfit=KLÄDSEL
items.artifacts.driedrose.spawned=Du har redan kallat på spöket.
items.artifacts.driedrose.no_charge=Din ros är inte fulladdad än.
items.artifacts.driedrose.cursed=Du kan inte använda en fördömd ros.
items.artifacts.driedrose.no_space=Det finns ingen ledig plats nära dig.
items.artifacts.driedrose.charged=Din ros är fulladdad!
items.artifacts.driedrose.desc=Är det här rosen som spöket nämnde innan han försvann? Den verkar ha en viss andlig kraft, kanske kan den användas för att kanalisera energin från den förlorade krigaren.
items.artifacts.driedrose.desc_no_quest=En torkad gammal ros som på något sätt fortfarande håller ihop trots sin ålder.\n\nDen verkar ha en viss andlig kraft, men du har ingen aning om hur du ska använda den just nu.
items.artifacts.driedrose.desc_hint=Det verkar saknas några kronblad. Kanske kan du stärka rosen genom att fästa dem igen.
items.artifacts.driedrose.desc_cursed=Den förbannade rosen är bunden till din hand, den känns kusligt kall.
items.artifacts.driedrose.desc_weapon=Spökets vapen: %s
items.artifacts.driedrose.desc_armor=Spökets rustning: %s
items.artifacts.driedrose.desc_strength=Spökets styrka: %s
items.artifacts.driedrose$petal.name=torkat kronblad
items.artifacts.driedrose$petal.no_rose=Du har ingen ros att lägga detta kronblad till.
items.artifacts.driedrose$petal.no_room=Det finns ingen plats kvar för det här kronbladet, så du kastar bort det.
items.artifacts.driedrose$petal.maxlevel=Rosen är färdig!
items.artifacts.driedrose$petal.levelup=Du lägger kronbladet till rosen.
items.artifacts.driedrose$petal.desc=Ett bräckligt, torkat kronblad som på något sätt har överlevt så här långt in i fängelsehålan.
items.artifacts.driedrose$wndghosthero.title=Spökets utrustning
items.artifacts.driedrose$wndghosthero.desc=Spöket är svagt på egen hand, men dess form är tillräckligt stabil för att kunna utrustas med ett vapen och en rustning. Det kan använda dessa föremål precis som du.\n\nSpöket kan för närvarande utrusta föremål som kräver högst _%d styrka._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Välj ett vapen
items.artifacts.driedrose$wndghosthero.armor_prompt=Välj en rustning
items.artifacts.driedrose$wndghosthero.cant_unique=Spöket kan inte använda unika föremål.
items.artifacts.driedrose$wndghosthero.cant_cursed=Spöket kan bara använda utrustning som du vet inte är förbannad.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Spöket kanske inte är tillräckligt starkt för att använda det.
items.artifacts.driedrose$wndghosthero.cant_strength=Spöket är inte tillräckligt starkt för att använda det.

##ghost hero
items.artifacts.driedrose$ghosthero.name=sorgset spöke
items.artifacts.driedrose$ghosthero.def_verb=undvek
items.artifacts.driedrose$ghosthero.discover_hint=Du kan hitta den här karaktären med en specifik artefakt.

items.artifacts.driedrose$ghosthero.hello=Hej igen %s.
items.artifacts.driedrose$ghosthero.introduce=Min ande är bunden till den här rosen. Den var mycket värdefull för mig, en gåva från min älskade som jag lämnade på ytan.\n\nJag kan inte återvända till honom, men tack vare dig har jag en andra chans att slutföra min resa. När jag kan kommer jag att svara på din kallelse och kämpa vid din sida.\n\nSå länge du har rosen kan jag höra din röst, så du kan använda den för att leda mig på avstånd.\n\nFörhoppningsvis lyckas du där jag misslyckades…

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=De här kloakerna brukade vara säkra, folk bodde till och med här på vintern.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Jag undrar vad som hände med vaktpatrullerna, gav de upp?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Jag hade familj på ytan, jag hoppas att de är i säkerhet.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Vakterna kunde inte besegra de här monstren, men det kanske vi kan.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Om till och med kloakerna är så här farliga undrar jag vad som finns där nere…
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Vad kan ha fått dessa råttor och krabbor att växa sig så stora?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Jag har hört historier om det här stället. Inget bra.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Det här stället har alltid varit mer av en fängelsehåla än ett fängelse.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Jag kan inte föreställa mig vad som hände när det här stället övergavs.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Det verkar som om både fångarna och vakterna har förvandlats till monster.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Vad kan vara orsaken till alla dessa skelett?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=De här människorna hade inte behövt sluta så här…
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Ingen människa eller dvärg har varit här på mycket länge.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Vad skulle få dvärgarna att överge en guldgruva?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Det är synd att allt guld här är värdelöst på ytan.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Varelserna här är förvridna, precis som i kloakerna.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Även fladdermössen är blodtörstiga här.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Det syns ingen gruvutrustning. Har dvärgarna tagit med sig allt?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Dvärgarna var flitiga men giriga.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Så dvärgarnas metropol har verkligen fallit.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Jag hoppas att ytan aldrig blir som den här platsen.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Det är inte meningen att dvärgar ska se så bleka ut.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Jag vet inte vad som är värst: dvärgarna eller deras skapelser.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Det verkar som om dvärgarna är tanklösa monster nu också.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Vad är det här för ställe?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Den här platsen är skräckinjagande…
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Vad tänkte dvärgarna på när de lekte med makt på det här viset?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Monstren här är utomjordiska. Var kommer de ifrån?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Känner du det? Det är som om något iakttar oss.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Tack och lov att det finns facklor. Det är så mörkt här!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Varför händer det här? Jag trodde att vi lyckades.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Hur kan den där saken fortfarande påverka den här världen?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Jag hoppas att du vet vad du gör med den där amuletten.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Jag antar att vi inte är klara än.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Vi har redan kommit så långt. Vi kan avsluta det här!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Bara en liten bit till, så kan vi ta oss ut härifrån!

items.artifacts.driedrose$ghosthero.seen_goo_1=Akta dig för Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Många av mina vänner dog av den här saken, dags för hämnd!
items.artifacts.driedrose$ghosthero.seen_goo_3=En sådan styggelse kan inte tillåtas leva!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Den enda fången som återstår är en dödlig lönnmördare. Så klart…
items.artifacts.driedrose$ghosthero.seen_tengu_2=Han har fångat oss i en fälla!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Jag har hört skräckhistorier om den där masken...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Det är bara dvärgar som skulle bygga en gruvmaskin som dödar inkräktare.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Den där saken är enorm...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Hur har den här saken hållit sig aktiv så länge?
items.artifacts.driedrose$ghosthero.seen_king_1=När folk säger att makt korrumperar är det här vad de menar.
items.artifacts.driedrose$ghosthero.seen_king_2=Han är mer av en lich än en kung nu.
items.artifacts.driedrose$ghosthero.seen_king_3=Även i döden lyder dvärgarna sin herre.
items.artifacts.driedrose$ghosthero.seen_yog_1=Åh, det här ser inte bra ut.
items.artifacts.driedrose$ghosthero.seen_yog_2=Så det är så en gud ser ut?
items.artifacts.driedrose$ghosthero.seen_yog_3=Det här kommer att göra ont...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Lycka till…
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Trött… för tillfället…
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Jag kommer tillbaka…
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Jag är ledsen… Lycka till…
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Avsluta det… utan mig…
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nej… Jag kan inte…
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Hur överlevde du det där?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Jag önskar att jag hade en sådan…
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Oj då! Du lever fortfarande!
items.artifacts.driedrose$ghosthero.player_killed_1=Nej!…
items.artifacts.driedrose$ghosthero.player_killed_2=Jag kunde inte hjälpa dem…
items.artifacts.driedrose$ghosthero.player_killed_3=Inte så här…

items.artifacts.driedrose$ghosthero.direct_prompt=Vad ska jag göra?
items.artifacts.driedrose$ghosthero.directed_follow_1=Okej, jag följer efter dig.
items.artifacts.driedrose$ghosthero.directed_follow_2=Jag går strax bakom dig.
items.artifacts.driedrose$ghosthero.directed_follow_3=Följer dig…
items.artifacts.driedrose$ghosthero.directed_follow_4=Okej, nu kör vi!
items.artifacts.driedrose$ghosthero.directed_follow_5=Jag täcker upp för dig.
items.artifacts.driedrose$ghosthero.directed_attack_1=Okej, jag attackerar den där.
items.artifacts.driedrose$ghosthero.directed_attack_2=Jag tar den där.
items.artifacts.driedrose$ghosthero.directed_attack_3=Går till anfall…
items.artifacts.driedrose$ghosthero.directed_attack_4=Låt oss ta dem!
items.artifacts.driedrose$ghosthero.directed_attack_5=Jag tar den.
items.artifacts.driedrose$ghosthero.directed_position_1=Okej, jag håller den positionen.
items.artifacts.driedrose$ghosthero.directed_position_2=Jag går dit och försvarar.
items.artifacts.driedrose$ghosthero.directed_position_3=Byter position…
items.artifacts.driedrose$ghosthero.directed_position_4=På väg!
items.artifacts.driedrose$ghosthero.directed_position_5=Jag går dit bort.

items.artifacts.driedrose$ghosthero.desc=En skör eterisk gestalt i människoskepnad. Dess kraft verkar vara knuten till rosen du har.\n\nDet här spöket är kanske inte mycket till hjälp, men det verkar vara din enda sanna vän här nere.

##back to artifacts
items.artifacts.etherealchains.name=etereala kedjor
items.artifacts.etherealchains.ac_cast=KASTA
items.artifacts.etherealchains.rooted=Dina kedjor kan inte dra dig när du är fastrotad.
items.artifacts.etherealchains.no_charge=Dina kedjor har inte tillräckligt med laddning.
items.artifacts.etherealchains.cursed=Du kan inte använda förbannade kedjor.
items.artifacts.etherealchains.does_nothing=Det kommer inte att göra någonting.
items.artifacts.etherealchains.cant_pull=Dina kedjor kan inte dra det målet.
items.artifacts.etherealchains.cant_reach=Dina kedjor kan inte nå dit.
items.artifacts.etherealchains.inside_wall=Dina kedjor kan bara dra dig genom väggar, inte in i dem.
items.artifacts.etherealchains.nothing_to_grab=Det finns inget att ta tag i där.
items.artifacts.etherealchains.prompt=Välj en plats att sikta på.
items.artifacts.etherealchains.desc=De här stora men lätta kedjorna glöder av andlig energi. De kan dra dig till terräng eller dra fiender mot dig. Kedjornas eteriska natur gör till och med att de kan sträcka sig genom väggar!
items.artifacts.etherealchains.desc_cursed=De förbannade kedjorna är låsta vid din sida, svänger ständigt runt och försöker få dig att snubbla eller binda dig.
items.artifacts.etherealchains.desc_equipped=Kedjorna vilar vid din sida och suger långsamt upp den andliga energin från dem du besegrar. Varje laddning är en länk i kedjan, som förlängs med exakt en ruta.
items.artifacts.etherealchains$chainsrecharge.levelup=Dina kedjor blir starkare!

items.artifacts.holytome.name=helig bok
items.artifacts.holytome.ac_cast=KASTA
items.artifacts.holytome.no_spell=Du kan inte lägga den besvärjelsen just nu.
items.artifacts.holytome.cursed=Du kan inte använda en förbannad helig bok.
items.artifacts.holytome.levelup=Din heliga bok blir starkare!
items.artifacts.holytome.desc=En helig bok som fungerar som fokus för Prästens gudomliga magi. Med boken kan Prästen kasta en rad olika magiska besvärjelser.\n\nBoken blir gradvis kraftfullare när Prästen använder den. Den ger Prästen fler maximala laddningar och ökar laddningshastigheten något.
items.artifacts.holytome.discover_hint=En av hjältarna börjar med det här föremålet.

items.artifacts.hornofplenty.name=ymnighetshorn
items.artifacts.hornofplenty.ac_snack=MELLANMÅL
items.artifacts.hornofplenty.ac_eat=ÄT
items.artifacts.hornofplenty.ac_store=LAGRA
items.artifacts.hornofplenty.eat=Du äter från hornet.
items.artifacts.hornofplenty.prompt=Välj lite mat
items.artifacts.hornofplenty.no_food=Ditt horn innehåller ingen mat som du kan äta!
items.artifacts.hornofplenty.full=Ditt horn är fullt av mat!
items.artifacts.hornofplenty.reject=Ditt horn avvisar den okokta blandfrukten.
items.artifacts.hornofplenty.maxlevel=Ditt horn kan inte äta mer mat!
items.artifacts.hornofplenty.levelup=Hornet konsumerar ditt matoffer och växer i styrka!
items.artifacts.hornofplenty.feed=Hornet konsumerar ditt matoffer.
items.artifacts.hornofplenty.desc=Du kan inte blåsa i det här hornet; i stället fylls det med mat medan du äventyrar och får erfarenhet. Du kan förbruka varje laddning som ett mellanmål eller äta tills du blir mätt.
items.artifacts.hornofplenty.desc_hint=Det kanske finns ett sätt att öka hornets kraft genom att ge det matenergi.
items.artifacts.hornofplenty.desc_cursed=Det förbannade hornet har bundit sig vid din sida. Det verkar ivrigt att ta mat i stället för att frambringa den.

items.artifacts.lloydsbeacon.name=lloyds fyr
items.artifacts.lloydsbeacon.ac_zap=AKTIVERA
items.artifacts.lloydsbeacon.ac_set=ANGE
items.artifacts.lloydsbeacon.ac_return=ÅTERVÄND
items.artifacts.lloydsbeacon.no_charge=Din fyr har inte tillräckligt med energi just nu.
items.artifacts.lloydsbeacon.tele_fail=Teleporteringsmagin misslyckas.
items.artifacts.lloydsbeacon.prompt=Välj en plats att rikta den mot.
items.artifacts.lloydsbeacon.levelup=Din fyr blir starkare!
items.artifacts.lloydsbeacon.preventing=Den starka magiska auran på denna plats hindrar dig från att använda Lloyds fyr!
items.artifacts.lloydsbeacon.creatures=Den psykiska auran från närliggande varelser hindrar dig från att använda Lloyds fyr just nu.
items.artifacts.lloydsbeacon.return=Lloyds fyr har placerats på din nuvarande plats. Nu kan du återvända hit när som helst.
items.artifacts.lloydsbeacon.desc=Lloyds fyr är en avancerad magisk anordning som ger användaren kontroll över teleporteringsmagi. Fyren kan användas för att återvända till en angiven plats, men kan också avge slumpmässiga vågor av teleporteringsmagi när den har laddats medan den varit utrustad. Denna magi kan riktas mot ett mål eller användaren själv.
items.artifacts.lloydsbeacon.desc_set=Den här fyren sattes ut någonstans på nivån %d i Pixel Dungeon.

items.artifacts.masterthievesarmband.name=mästertjuvars armband
items.artifacts.masterthievesarmband.ac_steal=STJÄL
items.artifacts.masterthievesarmband.no_charge=Ditt armband har inte tillräckligt med laddning.
items.artifacts.masterthievesarmband.cursed=Du kan inte använda ett förbannat armband.
items.artifacts.masterthievesarmband.full=Ditt armband är fulladdat!
items.artifacts.masterthievesarmband.prompt=Välj en fiende att rikta in dig på
items.artifacts.masterthievesarmband.no_target=Du måste sikta på en fiende som befinner sig bredvid dig.
items.artifacts.masterthievesarmband.steal_shopkeeper=Du kan inte stjäla från butiksinnehavare direkt.
items.artifacts.masterthievesarmband.no_steal=Den fienden har inget att stjäla.
items.artifacts.masterthievesarmband.stole_item=Du stal ett föremål: %s.
items.artifacts.masterthievesarmband.failed_steal=Du lyckades inte stjäla något.
items.artifacts.masterthievesarmband.level_up=Ditt armband blir starkare!
items.artifacts.masterthievesarmband.desc=Det här armbandet av lila sammet bär märket av en mästertjuv. Det tillhör inte dig, men förmodligen tillhörde det inte heller den förra användaren.
items.artifacts.masterthievesarmband.desc_cursed=Det förbannade armbandet är bundet vid din handled. På något sätt verkar din guldpåse långsamt bli lättare…
items.artifacts.masterthievesarmband.desc_worn=Du känner hur kraft byggs upp i armbandet på din handled medan du får erfarenhet. Du kan använda den här kraften för att stjäla från butiker eller råna fiender!\n\nAtt råna fiender sker genast, gör dem kortvarigt desorienterade och ger dig en chans att få tag på deras byte. Kraften är effektivare mot ouppmärksamma fiender. Att råna samma fiende flera gånger ger inte fler chanser till byte.

items.artifacts.sandalsofnature.name=naturens sandaler
items.artifacts.sandalsofnature.name_1=naturens skor
items.artifacts.sandalsofnature.name_2=naturens stövlar
items.artifacts.sandalsofnature.name_3=naturens benskenor
items.artifacts.sandalsofnature.ac_feed=MATA
items.artifacts.sandalsofnature.ac_root=ROTA
items.artifacts.sandalsofnature.prompt=Välj ett frö
items.artifacts.sandalsofnature.levelup=Dina skor ökar i storlek!
items.artifacts.sandalsofnature.absorb_seed=Skorna absorberar fröet, de verkar friskare.
items.artifacts.sandalsofnature.no_effect=Du måste mata dina skor med ett frö först.
items.artifacts.sandalsofnature.low_charge=Dina skor har inte tillräckligt med energi för det.
items.artifacts.sandalsofnature.prompt_target=Välj en plats
items.artifacts.sandalsofnature.out_of_range=Den här platsen är utom räckhåll.
items.artifacts.sandalsofnature.desc_1=Det som först ser ut som sandaler gjorda av garn är i själva verket två växter! De verkar väldigt svaga och bleka, kanske behöver de få i sig näring?
items.artifacts.sandalsofnature.desc_2=Skorna har vuxit och liknar nu mer två skräddarsydda skor. De har fått tillbaka lite färg, men kanske kan de växa ytterligare?
items.artifacts.sandalsofnature.desc_3=Växterna har vuxit igen och liknar nu ett par rejäla stövlar gjorda av bark. Växterna verkar ha återfått sin styrka, men kanske kan de fortfarande växa vidare?
items.artifacts.sandalsofnature.desc_4=Växterna verkar ha nått sin maximala storlek och liknar ett par bepansrade benskenor. Benskenorna är mörkbruna och liknar ett mycket robust träd.
items.artifacts.sandalsofnature.desc_hint=Du känner dig mer i samklang med naturen när du bär den här artefakten.
items.artifacts.sandalsofnature.desc_cursed=De förbannade sandalerna blockerar all samklang med naturen.
items.artifacts.sandalsofnature.desc_ability=Skorna skimrar i färgen på det senaste fröet du matade dem med. De kan kortvarigt slå rot i marken och skapa den växtens effekt var som helst inom en radie av tre rutor.\nFrö: _%s_\nLaddning som behövs: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Du har matat skorna med %d frön.

items.artifacts.skeletonkey.name=skelettnyckel
items.artifacts.skeletonkey.ac_insert=SÄTT IN
items.artifacts.skeletonkey.cursed=Du kan inte använda en förbannad skelettnyckel.
items.artifacts.skeletonkey.prompt=Välj ett mål
items.artifacts.skeletonkey.invalid_target=Det finns varken något att låsa eller låsa upp där.
items.artifacts.skeletonkey.lock_no_space=Du kan inte låsa in en karaktär bakom en dörr!
items.artifacts.skeletonkey.iron_charges=För att öppna ett vanligt lås krävs 1 laddning.
items.artifacts.skeletonkey.gold_charges=För att öppna ett gyllene lås krävs 2 laddningar.
items.artifacts.skeletonkey.lock_charges=För att låsa en dörr krävs 2 laddningar.
items.artifacts.skeletonkey.wall_charges=För att skapa en tillfällig vägg krävs 2 laddningar.
items.artifacts.skeletonkey.crystal_charges=För att öppna ett kristallås krävs 5 laddningar.
items.artifacts.skeletonkey.wont_open=Nyckeln passar av någon anledning inte i detta lås.
items.artifacts.skeletonkey.locked_with_key=Den dörren var låst med din skelettnyckel.
items.artifacts.skeletonkey.force_lock=Låset har försvagats utan din skelettnyckel. Du lyckas tvinga upp det.
items.artifacts.skeletonkey.discard=Du kastar bort dina överflödiga nycklar.
items.artifacts.skeletonkey.levelup=Din skelettnyckel växer sig starkare!
items.artifacts.skeletonkey.desc=En viktig nyckel med ett huvud i form av en dödskalle. Tänderna verkar vara annorlunda varje gång du tittar på dem.
items.artifacts.skeletonkey.desc_worn=Den här magiska nyckeln verkar få mer kraft ju mer du använder den i stället för fängelsehålans vanliga nycklar. Den kan sättas in i nästan alla fängelsehålans lås för att öppna eller stänga dem, även dörrar som aldrig tidigare har varit låsta.\n\nNyckeln kan till och med användas på en tom plats i rak eller diagonal riktning för att ”låsa” luften framför dig och skapa en tre rutor bred fast vägg som består i 10 turer. Låsningen stöter bort fiender om det finns utrymme för det.
items.artifacts.skeletonkey.desc_cursed=Den förbannade nyckeln verkar aktivt undvika att passa i något lås och gör det till och med svårt, men inte omöjligt, för dig att använda dina andra nycklar.
items.artifacts.skeletonkey$keywall.desc=En tillfällig magisk vägg har placerats här av skelettnyckeln.

items.artifacts.talismanofforesight.name=förutseendets talisman
items.artifacts.talismanofforesight.ac_scry=SKÅDA
items.artifacts.talismanofforesight.low_charge=Talismanen kräver minst 5 %% laddning för att skåda.
items.artifacts.talismanofforesight.prompt=Välj en plats att skanna.
items.artifacts.talismanofforesight.levelup=Din talisman blir starkare!
items.artifacts.talismanofforesight.full_charge=Din Talisman är fulladdad!
items.artifacts.talismanofforesight.desc=En slät sten med märkliga inristningar på. Det känns som om den bevakar allt omkring dig och håller utkik efter något dolt.
items.artifacts.talismanofforesight.desc_worn=När du håller talismanen känns det som om dina sinnen skärps. Talismanen bygger långsamt upp laddning medan tiden går och när du upptäcker dolda dörrar eller fällor.\n\nTalismanen kan förbruka sin laddning för att skåda i en kon. Det avslöjar alla rutor och hemligheter i det undersökta området och ger dig syn på fiender och föremål en kort stund.
items.artifacts.talismanofforesight.desc_cursed=Den förbannade talismanen stirrar intensivt in i dig och dämpar dina sinnen.
items.artifacts.talismanofforesight$foresight.name=förutseende
items.artifacts.talismanofforesight$foresight.uneasy=Du känner dig obehaglig till mods.
items.artifacts.talismanofforesight$foresight.desc=Du känner dig mycket nervös, som om det finns en osynlig fara i närheten.

items.artifacts.timekeepershourglass.name=tidtagarens timglas
items.artifacts.timekeepershourglass.ac_activate=AKTIVERA
items.artifacts.timekeepershourglass.deactivate=Du avaktiverar tidsstoppet.
items.artifacts.timekeepershourglass.no_charge=Ditt timglas har inte laddats upp tillräckligt för att vara användbart ännu.
items.artifacts.timekeepershourglass.cursed=Du kan inte använda ett fördömt timglas.
items.artifacts.timekeepershourglass.onstasis=Världen verkar skifta runt dig på ett ögonblick.
items.artifacts.timekeepershourglass.onfreeze=Allt omkring dig fryser plötsligt.
items.artifacts.timekeepershourglass.stasis=SÄTT MIG I STASIS
items.artifacts.timekeepershourglass.freeze=FRYS TIDEN RUNT MIG
items.artifacts.timekeepershourglass.prompt=Hur vill du använda timglasets magi?\n\nI stasis rör sig tiden normalt medan du är frusen och helt osårbar. Det förbrukar upp till två laddningar åt gången.\n\nNär tiden är fryst kan du röra dig som om dina handlingar inte tog någon tid. Du kan avaktivera detta när som helst genom att använda timglaset eller attackera.
items.artifacts.timekeepershourglass.desc=Det här stora, utsmyckade timglaset ser ganska anspråkslöst ut, men du känner en stor kraft i dess fint snidade ram. När du vänder timglaset och ser sanden rinna känner du hur dess magi drar i dig. Att använda den skulle säkert ge dig viss kontroll över tiden.
items.artifacts.timekeepershourglass.desc_hint=Timglaset verkar ha förlorat lite sand. Om du bara kunde hitta lite…
items.artifacts.timekeepershourglass.desc_cursed=Det förbannade timglaset är låst vid din sida. Du känner att det försöker manipulera ditt tidsflöde.
items.artifacts.timekeepershourglass$timefreeze.name=Tidsfrysning
items.artifacts.timekeepershourglass$timefreeze.desc=Tiden är fryst runt dig, vilket gör att du kan utföra handlingar direkt. Effekten varar tills den avbryts eller ditt timglas får slut på laddning. Att attackera eller använda magi kommer också att bryta denna effekt.\n\nTur tills laddningen är slut: %s.
items.artifacts.timekeepershourglass$sandbag.name=påse med magisk sand
items.artifacts.timekeepershourglass$sandbag.levelup=Du lägger till sanden i ditt timglas.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Ditt timglas är fyllt med magisk sand!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Du har inget timglas att lägga sanden i.
items.artifacts.timekeepershourglass$sandbag.desc=Den här lilla påsen med fin sand borde fungera perfekt med ditt timglas.\n\nDet verkar märkligt att butiksinnehavaren har just det här föremålet när du behöver det…

items.artifacts.unstablespellbook.name=instabil trollformelbok
items.artifacts.unstablespellbook.ac_read=LÄS
items.artifacts.unstablespellbook.ac_add=LÄGG TILL
items.artifacts.unstablespellbook.blinded=Du kan inte läsa ur boken när du är blind.
items.artifacts.unstablespellbook.no_charge=Din trollformelbok har slut på energi för tillfället.
items.artifacts.unstablespellbook.cursed=Du kan inte läsa från en förbannad trollformelbok.
items.artifacts.unstablespellbook.prompt=Välj en skriftrulle
items.artifacts.unstablespellbook.infuse_scroll=Du tillför skriftrullens energi till boken.
items.artifacts.unstablespellbook.unable_scroll=Du kan inte lägga till denna skriftrulle i boken.
items.artifacts.unstablespellbook.unknown_scroll=Du är inte säker på vilken typ av skriftrulle det här är ännu.
items.artifacts.unstablespellbook.desc=Den här boken är i förvånansvärt gott skick med tanke på sin ålder. Den fräser och sprakar när du vänder sidorna och svämmar över av instabil energi. Om du läser ur den vet du aldrig vilken besvärjelse du kan kasta.
items.artifacts.unstablespellbook.desc_cursed=Den förbannade boken har bundit sig vid dig. Den hämmar din förmåga att använda de flesta skriftrullar.
items.artifacts.unstablespellbook.desc_index=Boken är ofullständig. Dess index pekar för närvarande på följande tomma sidor:
items.artifacts.unstablespellbook.desc_empowered=Skriftrullarna du har lagt till i boken lyser av kraft. Du kan välja den exotiska versionen av skriftrullarnas effekter, men det kostar en extra laddning.
items.artifacts.unstablespellbook.read_empowered=Skriftrullen du lade till i trollformelboken svämmar över av energi. Du kan kanalisera antingen den vanliga eller den exotiska versionen av skriftrullens effekt.\n\nDen exotiska varianten kostar 2 laddningar i stället för 1.



###bags
items.bags.bag.name=ryggsäck
items.bags.bag.discover_hint=Du kan köpa det här föremålet i en butik.

items.bags.potionbandolier.name=dryckesbandoljer
items.bags.potionbandolier.desc=Den här tjocka bandoljären sitter runt bröstet som ett skärp och har många isolerade remmar för dryckesflaskor, ditt vattenskinn och flaskor med flytande metall.\n\nI bandoljären skyddas dina drycker från kylan.

items.bags.scrollholder.name=skriftrullebehållare
items.bags.scrollholder.desc=Den här rörformade behållaren ser ut att rymma en astronoms instrument och kartor, men dina skriftrullar passar lika bra. Den har till och med några sidofack som passar för trollformelkristaller, arkana stift och arkanskt harts.\n\nBehållaren verkar inte särskilt brandfarlig, så dina skriftrullar bör vara säkra från eld i den.

items.bags.velvetpouch.name=sammetspåse
items.bags.velvetpouch.desc=Den här lilla sammetspåsen kan förvara många små föremål i sig, till exempel frön, runstenar och några alkemiingredienser.
items.bags.velvetpouch.discover_hint=En av hjältarna börjar med det här föremålet.

items.bags.magicalholster.name=magiskt hölster
items.bags.magicalholster.desc=Det här smala hölstret är tillverkat av skinn från något exotiskt djur och har kraftfull magi som gör att det kan lagra en enorm mängd fjärrvapen.\n\nDu kan helt enkelt sträcka dig in i väskan och får alltid tag i föremålet du letar efter.\n\nHölstrets magi gör att trollstavar laddas något snabbare och kastvapen håller något längre i det.



###bombs
items.bombs.arcanebomb.name=arcanebomb
items.bombs.arcanebomb.desc=Den här bomben har försetts med arkana egenskaper. Den exploderar i en kraftfull stötvåg som liknar Goos upppumpade attack och orsakar _%1$d-%2$d magisk skada_ på allt inom två rutor.
items.bombs.arcanebomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.bomb.name=bomb
items.bombs.bomb.ac_lightthrow=TÄND OCH KASTA
items.bombs.bomb.snuff_fuse=Du släcker snabbt bombens stubin.
items.bombs.bomb.ondeath=Explosionen dödade dig…
items.bombs.bomb.rankings_desc=Dödad av en explosion
items.bombs.bomb.desc=En ganska rejäl svartkrutsbomb. Explosionen orsakar _%1$d-%2$d skada_ på allt intill och förstör viss terräng eller vissa föremål i närheten.
items.bombs.bomb.desc_fuse=Det ser ut som att stubinen kommer att ta ett par turer att brinna ner när den väl är tänd.
items.bombs.bomb.desc_burning=Bombens stubin brinner bort, håll avstånd eller släck den!
items.bombs.bomb$doublebomb.name=två bomber
items.bombs.bomb$doublebomb.desc=En hög med två rejäla svartkrutsbomber. Det ser ut som om du får en på köpet!

items.bombs.firebomb.name=brandbomb
items.bombs.firebomb.desc=Den här bomben har modifierats för att explodera i ett större område, vilket ger _%1$d-%2$d skada_ och sprider ihållande lågor inom 2 rutor.
items.bombs.firebomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.flashbangbomb.name=chockgranat
items.bombs.flashbangbomb.desc=Den här specialanpassade bomben exploderar i en blixt av ljus, ljud och elektricitet. Allt inom två rutor tar _%1$d-%2$d skada_ av explosionen, ytterligare 25 %% skada av elektriciteten och blir bedövat i 10 turer.
items.bombs.flashbangbomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.frostbomb.name=frostbomb
items.bombs.frostbomb.desc=Den här bomben har modifierats för att explodera i ett större område, orsaka _%1$d-%2$d skada_ och sprida en ihållande vindpust av iskall luft inom två rutor.
items.bombs.frostbomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.holybomb.name=helig bomb
items.bombs.holybomb.desc=Den här bomben har modifierats för att avge heligt ljus i ett större område när den exploderar. Allt inom två rutor tar _%1$d-%2$d skada_ av explosionen. Odöda eller demoniska fiender tar ytterligare 50 %% skada av det heliga ljuset.
items.bombs.holybomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.noisemaker.name=bullerbomb
items.bombs.noisemaker.desc=Den här specialanpassade bomben avger upprepade ljud när stubinen har brunnit ned. När något rör vid bomben exploderar den och orsakar _%1$d-%2$d skada_ på allt inom två rutor!
items.bombs.noisemaker.desc_burning=Bullerbomben tickar. Den exploderar när något kommer nära!
items.bombs.noisemaker.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.smokebomb.name=rökbomb
items.bombs.smokebomb.desc=Den här bomben har modifierats för att släppa ut ett tjockt gasmoln samtidigt som den exploderar. Den orsakar _%1$d-%2$d skada_ och sprider en höljande dimma inom två rutor.
items.bombs.smokebomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.regrowthbomb.name=återväxtbomb
items.bombs.regrowthbomb.desc=Den här specialanpassade bomben sprutar livgivande vätska överallt inom tre rutor i stället för att explodera. Området som träffas får snabbt gräs och växter att gro. Du och alla allierade i området läks som om ni hade druckit en hälsodryck.
items.bombs.regrowthbomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.shrapnelbomb.name=splitterbomb
items.bombs.shrapnelbomb.desc=Den här bomben har modifierats med metallbitar från DM-300 som splittras och flyger åt alla håll när den exploderar. Den orsakar _%1$d-%2$d skada_ i ett stort område runt bomben. Du bör gömma dig bakom något när du använder den…
items.bombs.shrapnelbomb.discover_hint=Du kan tillverka detta föremål via alkemi.

items.bombs.woollybomb.name=ullbomb
items.bombs.woollybomb.desc=Den här specialanpassade bomben skapar ett stort fält av magiska får när den exploderar. Explosionen orsakar _%1$d-%2$d skada_ på allt inom två rutor. Fåren blockerar rörelse och stannar mycket länge! De försvinner dock snabbare i närheten av mäktiga fiender och kan skingras tidigare genom att du interagerar med dem.
items.bombs.woollybomb.discover_hint=Du kan tillverka detta föremål via alkemi.

###food
items.food.berry.name=fängelsehålebär
items.food.berry.eat_msg=Det där bäret var gott!
items.food.berry.desc=Det här lilla bäret hittades av Jägarinnan bland fängelsehålans växtlighet. Det kan ätas snabbt, återställer lite mättnad och kan innehålla ett användbart frö!
items.food.berry.discover_hint=Du kan hitta det här föremålet med hjälp av en specifik hjältetalang.

items.food.blandfruit.name=faddfrukt
items.food.blandfruit.cooked=kokt faddfrukt
items.food.blandfruit.sunfruit=solfrukt
items.food.blandfruit.rotfruit=rotfrukt
items.food.blandfruit.earthfruit=jordfrukt
items.food.blandfruit.blindfruit=blindfrukt
items.food.blandfruit.firefruit=eldfrukt
items.food.blandfruit.icefruit=isfrukt
items.food.blandfruit.fadefruit=blekningsfrukt
items.food.blandfruit.sorrowfruit=sörjefrukt
items.food.blandfruit.stormfruit=stormfrukt
items.food.blandfruit.dreamfruit=drömfrukt
items.food.blandfruit.starfruit=stjärnfrukt
items.food.blandfruit.swiftfruit=snabbfrukt
items.food.blandfruit.raw=Du står inte ut med att äta den rå.
items.food.blandfruit.desc=Så torr och oansenlig, kanske skulle den bli bättre om man stuvade den med någon annan ingrediens.
items.food.blandfruit.desc_cooked=Frukten har blivit tjockare av att ligga i blöt i grytan och har till och med absorberat egenskaperna hos fröet som den kokades med. Den kommer att ha effekten av den dryck som fröet motsvarade.
items.food.blandfruit.desc_eat=Den ser ut att vara redo att ätas!
items.food.blandfruit.desc_throw=Den verkar ganska flyktig, det kanske är bäst att kasta den.
items.food.blandfruit$chunks.name=blandfruktsbitar
items.food.blandfruit$chunks.desc=Blandfrukten har exploderat vid nedslaget och lämnat kvar inerta bitar.\n\nTrots lite smuts verkar dessa stora bitar av tillagad blandfrukt helt ätbara.

items.food.chargrilledmeat.name=kolgrillat kött
items.food.chargrilledmeat.desc=Det ser ut som en hyfsad biff.
items.food.chargrilledmeat.discover_hint=Du kan skapa detta med hjälp av ett annat livsmedel.

items.food.food.name=matransion
items.food.food.ac_eat=ÄT
items.food.food.eat_msg=Den där maten smakade jättegott!
items.food.food.desc=Inget märkvärdigt: torkat kött, några kex och liknande.

items.food.frozencarpaccio.name=fryst carpaccio
items.food.frozencarpaccio.invis=Du ser dina händer bli osynliga!
items.food.frozencarpaccio.hard=Du känner hur din hud hårdnar!
items.food.frozencarpaccio.refresh=Uppfriskande!
items.food.frozencarpaccio.better=Du känner dig bättre!
items.food.frozencarpaccio.desc=Det är en bit fryst rått kött. Det enda sättet att äta det är genom att skära tunna skivor av det. Och på det här sättet är det förvånansvärt gott.
items.food.frozencarpaccio.discover_hint=Du kan skapa den här med hjälp av en annan matvara.

items.food.meatpie.name=köttpaj
items.food.meatpie.eat_msg=Den där maten var otrolig!
items.food.meatpie.desc=En utsökt paj fylld med smakrikt kött. Den mättar dig betydligt mer än någon annan måltid.
items.food.meatpie.discover_hint=Du kan tillverka detta föremål via alkemi.

items.food.mysterymeat.name=mysteriekött
items.food.mysterymeat.eat_msg=Den där maten smakade… märkligt.
items.food.mysterymeat.hot=Åh, den är varm!
items.food.mysterymeat.legs=Du kan inte känna dina ben!
items.food.mysterymeat.not_well=Du mår inte bra.
items.food.mysterymeat.stuffed=Du är proppmätt.
items.food.mysterymeat.desc=Ät på egen risk!
items.food.mysterymeat.discover_hint=Du kan få det här föremålet som byte från vissa fiender.
items.food.mysterymeat$placeholder.name=kött

items.food.phantommeat.name=fantomkött
items.food.phantommeat.desc=En stor, glittrande, genomskinlig biff skuren från en fantompiranha. Det här magiska köttet behöver inte tillagas och ger flera defensiva fördelar utöver att göra dig helt mätt. När du äter det får du osynlighet, barkskinn, viss läkning och bot mot många skadliga effekter.
items.food.phantommeat.discover_hint=Du kan få det här föremålet som byte från vissa fiender.

items.food.pasty.name=paj
items.food.pasty.fish_name=ångad fisk
items.food.pasty.amulet_name=Yendors amulett?
items.food.pasty.egg_name=påskägg
items.food.pasty.rainbow_name=regnbågsdryck
items.food.pasty.shattered_name=grön tårta
items.food.pasty.pie_name=pumpapaj
items.food.pasty.vanilla_name=blå tårta
items.food.pasty.cane_name=polkagris
items.food.pasty.sparkling_name=gnistrande dryck
items.food.pasty.desc=En äkta cornisk paj med traditionell fyllning av nötkött och potatis. Utsökt!
items.food.pasty.fish_desc=En hel ångkokt fisk, magiskt bevarad på en bädd av grönsaker. Det är tradition att spara lite fisk till senare vid den här tiden på året, så du får rester i stället för att äta allt på en gång.\n\nGott månnyår!
items.food.pasty.amulet_desc=Du har äntligen hittat den magiska Yendors amulett – vänta lite, det här är bara en folieinslagen chokladbit som ska föreställa amuletten! Den ger dig inte obegränsad kraft, men den mättar dig åtminstone och ger dina artefakter en liten laddning.\n\nApril, april!
items.food.pasty.egg_desc=Ett stort chokladägg inslaget i färgglad gul folie. Här finns lätt tillräckligt med choklad för att du ska bli mätt, och sockret kan ge dina artefakter en liten extra laddning.\n\nGod påsk!
items.food.pasty.rainbow_desc=Den här färgglada drycken är ett slags flytande föda. Förutom att stilla din hunger innehåller den lite magi som lugnar en närliggande fiende som inte är en boss, så att den tillfälligt tvekar att slåss mot dig.\n\nGlad Pride!
items.food.pasty.shattered_desc=Den här stora skivan vaniljtårta har färgglatt strössel och grön glasyr. Tårtan gjordes för att fira många års erfarenhet och ger dig lite av den erfarenheten när du äter den.\n\nShattered Pixel Dungeon släpptes första gången den 5 augusti 2014. Grattis på födelsedagen, Shattered Pixel Dungeon!
items.food.pasty.pie_desc=En stor bit pumpapaj. Den söta och kryddiga smaken mättar dig och ger lite hälsa.\n\nGlad halloween!
items.food.pasty.vanilla_desc=Den här stora skivan vaniljtårta har färgglatt strössel och blå glasyr. Tårtan gjordes för att fira många års erfarenhet och ger dig lite av den erfarenheten när du äter den.\n\nDet ursprungliga Pixel Dungeon släpptes första gången den 4 december 2012. Grattis på födelsedagen, Pixel Dungeon!
items.food.pasty.cane_desc=En enorm, sockersöt polkagris. Den är stor nog att mätta dig och sockret kan också ge dina trollstavar lite extra laddning.\n\nGod helg!
items.food.pasty.sparkling_desc=Den här glittrande drycken är ett slags flytande föda. Den stillar hunger och efterliknar mousserande vin, men är inte alkoholhaltig. Den varma känslan i magen ger dig lite sköld.\n\nGott nytt år!
items.food.pasty$fishleftover.name=fiskrester
items.food.pasty$fishleftover.eat_msg=Den där maten smakade okej.
items.food.pasty$fishleftover.desc=Lite fisk som blev över från din förra måltid. Du kan äta den när du vill för att återfå lite mättnad.

items.food.smallration.name=liten matranson
items.food.smallration.eat_msg=Den där maten smakade bra.
items.food.smallration.desc=Det ser ut precis som en vanlig matranson men är mindre.
items.food.smallration.discover_hint=Du kan köpa det här föremålet i en butik.

items.food.stewedmeat.name=stuvat kött
items.food.stewedmeat.eat_msg=Den här maten smakade bra.
items.food.stewedmeat.desc=Stuvningen har befriat köttet från sjukdomar och parasiter. Det bör vara säkert att äta.
items.food.stewedmeat.discover_hint=Du kan tillverka detta föremål med alkemi.

items.food.supplyration.name=försörjningsration
items.food.supplyration.desc=Den här ransonen lämnades i fängelsehålan av och för medlemmar i tjuvarnas gille. Den är särskilt utformad för att ätas när man är på språng och hjälpa till med allehanda lurendrejeri.\n\nÄven om den inte mättar lika mycket som en vanlig ranson kan den ätas snabbt, ger lite direkt läkning och återställer en laddning till Tjuvens skuggmantel.
items.food.supplyration.discover_hint=Du kan hitta det här föremålet med hjälp av en specifik hjältetalang.



##journal items
items.journal.documentpage.name=riven sida
items.journal.documentpage.desc=En ensam sida, troligen utriven ur en bok av något slag. Du måste plocka upp den för att läsa den.

items.journal.alchemypage.name=riven sida ur alkemibok
items.journal.alchemypage.desc=En sönderriven sida från en guidebok om alkemi.\n\nDet mesta av texten är för liten för att kunna läsas på avstånd, men du kan urskilja sidans titel:\n\n_"%s"_

items.journal.guidebook.name=fängelsehålans handbok
items.journal.guidebook.hint_mobile=Din guidebok har råd till dig! Tryck på den blinkande dagboksknappen längst upp till höger för att läsa den.
items.journal.guidebook.hint_desktop=Din guidebok har råd till dig! Välj den blinkande dagboksikonen (%s) uppe till höger för att läsa den.
items.journal.guidebook.hint_status=Guidebok
items.journal.guidebook.desc=En äventyrares handbok, lämnad här av någon som bestämde sig för att äventyr inte var något för hen! Just den här boken är magisk och kan uppmana äventyrare att läsa en sida vid rätt tillfälle.\n\nTrots det är boken mest populär på grund av de stora orden ”FÅ INTE PANIK!” som står med stora, vänliga bokstäver på omslaget.

items.journal.guidepage.name=riven sida ur handbok
items.journal.guidepage.desc=En sönderriven sida från en äventyrsguide.\n\nDet mesta av texten är för liten för att kunna läsas på avstånd, men du kan urskilja sidans titel:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=slitet brev
items.journal.regionlorepage$sewers.desc=Vad som ser ut att vara ett brev, skrivet på ett smutsfläckigt papper. Du måste plocka upp det för att kunna se vad som står på det.

items.journal.regionlorepage$prison.name=sliten dagbokspost
items.journal.regionlorepage$prison.desc=En dagboksanteckning, eller någon annan typ av anteckning, skriven på ett gammalt papper. Det verkar ha klarat sig bättre än de brev du hittade i kloakerna, men du måste ändå plocka upp det för att läsa det.

items.journal.regionlorepage$caves.name=gammal loggpost
items.journal.regionlorepage$caves.desc=Vad som ser ut att vara en post i en utforskares loggbok, bevarad förvånansvärt väl trots hur gammal den måste vara. Plocka upp den för att läsa den.

items.journal.regionlorepage$city.name=rostig tavla
items.journal.regionlorepage$city.desc=En liten rostig metalltavla med ett meddelande som magiskt har etsats in i den. Bokstäverna är fortfarande tydliga trots tavlans ålder, men du måste plocka upp den för att läsa det.

items.journal.regionlorepage$halls.name=glödande tavla
items.journal.regionlorepage$halls.desc=En liten svart tavla med glödande gröna bokstäver etsade i den. Bokstäverna flyter ihop till en dimma på avstånd, så du måste plocka upp den för att läsa den.


###keys
items.keys.goldenkey.name=gyllene nyckel
items.keys.goldenkey.desc=Skårorna på den här gyllene nyckeln är små och invecklade. Kanske kan den öppna en låst kista?

items.keys.crystalkey.name=kristallnyckel
items.keys.crystalkey.desc=De slipade ytorna på den här kristallnyckeln skimrar i mörkret. Kanske kan den öppna något som är gjort av kristall?

items.keys.ironkey.name=järnnyckel
items.keys.ironkey.desc=Skårorna på den här urgamla järnnyckeln är väl slitna, och dess läderband är nött av ålder. Vilken dörr kan den öppna?

items.keys.wornkey.name=sliten nyckel
items.keys.wornkey.desc=Den här nyckeln är sliten och missfärgad, men ser viktig ut. Den kan nog öppna någon viktig dörr i närheten.



###potions
items.potions.potion.ac_drink=DRICK
items.potions.potion.turquoise=turkos dryck
items.potions.potion.crimson=karmosinröd dryck
items.potions.potion.azure=azurblå dryck
items.potions.potion.jade=jadegrön dryck
items.potions.potion.golden=gyllene dryck
items.potions.potion.magenta=magentafärgad dryck
items.potions.potion.charcoal=träkolsfärgad dryck
items.potions.potion.ivory=elfenbensfärgad dryck
items.potions.potion.amber=bärnstensfärgad dryck
items.potions.potion.bistre=brungrå dryck
items.potions.potion.indigo=indigofärgad dryck
items.potions.potion.silver=silverfärgad dryck
items.potions.potion.unknown_desc=Den här flaskan innehåller en virvlande, färgstark vätska. Vem vet vad som händer när du dricker eller kastar den?
items.potions.potion.harmful=Skadlig dryck!
items.potions.potion.beneficial=Fördelaktig dryck
items.potions.potion.yes=Ja, jag vet vad jag gör
items.potions.potion.no=Nej, jag ändrade mig
items.potions.potion.sure_drink=Är du säker på att du vill dricka den? I de flesta fall bör du kasta sådana drycker på dina fiender.
items.potions.potion.sure_throw=Är du säker på att du vill kasta den? I de flesta fall är det vettigt att dricka den.
items.potions.potion.shatter=Kolven splittras och vätskan stänker ofarligt.
items.potions.potion.discover_hint=Du kan hitta det här föremålet slumpmässigt i fängelsehålan eller tillverka det via alkemi.
items.potions.potion$placeholder.name=dryck
items.potions.potion$seedtopotion.name=Slumpmässig dryck

items.potions.potionofexperience.name=erfarenhetsdryck
items.potions.potionofexperience.desc=De mytomspunna erfarenheterna från otaliga strider har reducerats till flytande form. Den här drycken höjer genast din erfarenhetsnivå.

items.potions.potionoffrost.name=frostbrygd
items.potions.potionoffrost.desc=Kemikalien i den här drycken avdunstar till ett iskallt moln när den utsätts för fri luft.

items.potions.potionofhaste.name=hastighetsdryck
items.potions.potionofhaste.energetic=Du känner dig energisk!
items.potions.potionofhaste.desc=När du dricker den här märkligt söta vätskan får du enorm energi en kort stund, så att du kan springa i hög hastighet.

items.potions.potionofhealing.name=läkedryck
items.potions.potionofhealing.heal=Dina sår börjar läka.
items.potions.potionofhealing.desc=Detta elixir återställer snabbt din hälsa och botar omedelbart många åkommor.

items.potions.potionofinvisibility.name=osynlighetsdryck
items.potions.potionofinvisibility.invisible=Du ser dina händer bli osynliga!
items.potions.potionofinvisibility.desc=När du dricker den här drycken blir du tillfälligt osynlig. När du är osynlig kan fiender inte se dig. Fysiska attacker och magiska effekter, som skriftrullar och trollstavar, avbryter genast osynligheten.

items.potions.potionoflevitation.name=levitationsdryck
items.potions.potionoflevitation.float=Du svävar upp i luften!
items.potions.potionoflevitation.desc=När du dricker den här märkliga vätskan börjar du sväva i luften och kan obehindrat glida över fällor och gropar. Om du kastar drycken skapas ett moln av oförädlad gas som gör alla i det desorienterade.

items.potions.potionofliquidflame.name=dryck med flytande flamma
items.potions.potionofliquidflame.desc=Den här flaskan innehåller en instabil förening som flammar upp häftigt när den utsätts för fri luft.

items.potions.potionofmindvision.name=tankesynsdryck
items.potions.potionofmindvision.see_mobs=Du kan på något sätt känna närvaron av andra varelsers sinnen!
items.potions.potionofmindvision.see_none=Du kan på något sätt se att du är ensam på den här nivån just nu.
items.potions.potionofmindvision.desc=När du dricker den här drycken stäms ditt sinne in på avlägsna varelsers psykiska signaturer, så att du kan känna biologiska närvaror genom väggar. Den låter dig också se genom väggar och dörrar i närheten.

items.potions.potionofparalyticgas.name=dryck med förlamande gas
items.potions.potionofparalyticgas.desc=När vätskan i den här flaskan utsätts för fri luft förångas den till en bedövande gul dimma. Den som andas in molnet blir genast förlamad och kan inte röra sig en tid efter att molnet har skingrats. Du kan kasta föremålet mot avlägsna fiender för att fånga dem i gasens verkan.

items.potions.potionofpurity.name=renhetsdryck
items.potions.potionofpurity.freshness=Du känner en ovanlig friskhet i luften.
items.potions.potionofpurity.protected=En skyddande film omsluter dig!
items.potions.potionofpurity.desc=Det här magiska reagenset neutraliserar snabbt alla skadliga områdesbundna effekter i ett stort område. När du dricker det får du tillfällig immunitet mot sådana effekter.

items.potions.potionofstrength.name=styrkedryck
items.potions.potionofstrength.msg=Nyvunnen styrka strömmar genom din kropp, du har nu %d styrka!
items.potions.potionofstrength.desc=Den här kraftfulla vätskan rinner genom dina muskler och ökar din styrka permanent med en poäng.

items.potions.potionoftoxicgas.name=giftgasdryck
items.potions.potionoftoxicgas.desc=Om du öppnar eller krossar den här tryckbehållaren exploderar innehållet i ett dödligt moln av giftig grön gas. Du kan välja att kasta drycken mot avlägsna fiender i stället för att öppna den för hand.



###brews
items.potions.brews.brew.discover_hint=Du kan tillverka detta föremål via alkemi.

items.potions.brews.aquabrew.name=vattenbrygd
items.potions.brews.aquabrew.desc=När den här brygden krossas avger den en stöt av trycksatt vatten där den landar. Stöten är bara stark nog att skada brinnande fiender, men den sprider också vatten till terräng i närheten, inaktiverar fällor, släcker bränder och knuffar bort karaktärer nära utbrottet.

items.potions.brews.blizzardbrew.name=blizzardbrygd
items.potions.brews.blizzardbrew.desc=När den här brygden splittras släpper den lös en virvlande snöstorm som snabbt sprider sig som en gas.

items.potions.brews.causticbrew.name=kaustisk brygd
items.potions.brews.causticbrew.desc=Den här brygden sprider frätande slem i ett brett område runt platsen där den splittras. Allt som fångas av slemmet smälter långsamt om det inte kan tvättas bort med vatten.

items.potions.brews.infernalbrew.name=infernalbrygd
items.potions.brews.infernalbrew.desc=När den här brygden krossas släpper den lös ett rasande inferno som snabbt sprider sig som en gas.

items.potions.brews.shockingbrew.name=elchocksbrygd
items.potions.brews.shockingbrew.desc=När den här brygden krossas släpper den lös en elektrisk storm i ett stort område runt platsen där den går sönder.

items.potions.brews.unstablebrew.name=instabil brygd
items.potions.brews.unstablebrew.desc=Den här magiska brygden lyser i regnbågens skiftande färger.\n\nNär den dricks eller kastas utlöser den effekten av en slumpmässig dryck. Dryckens effekt kommer alltid att vara fördelaktig om den dricks och alltid skadlig om den kastas.

###elixirs
items.potions.elixirs.elixir.discover_hint=Du kan tillverka detta föremål via alkemi.

items.potions.elixirs.elixirofarcanearmor.name=elixir med arkan rustning
items.potions.elixirs.elixirofarcanearmor.desc=Det här elixiret ger den som dricker ett långvarigt motstånd mot magisk skada.

items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir för vattenläkning
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Det här elixiret innehåller rester av Goo som förstärkts med en läkande dryck. Det ger ingen omedelbar läkning, men återställer stadigt en större mängd hälsa medan du står i vatten.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=vattenläkning
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Du har tillfälligt fått återställande egenskaper som liknar Goos.\n\nNär du står i vatten återfår du lite hälsa per tur. Effekten pausas när du har full hälsa eller lämnar vattnet.\n\nÅterstående läkning: %d.

items.potions.elixirs.elixirofdragonsblood.name=elixir av drakens blod
items.potions.elixirs.elixirofdragonsblood.desc=När du dricker det här elixiret strömmar eldig kraft genom dina ådror. Effekten gör dig immun mot eld och låter dig sätta fiender i brand med fysiska attacker.

items.potions.elixirs.elixiroffeatherfall.name=elixir för fjäderfall
items.potions.elixirs.elixiroffeatherfall.light=Du känner dig lätt som en fjäder!
items.potions.elixirs.elixiroffeatherfall.desc=Det här elixiret ger en svagare men mer kontrollerad levitationseffekt, så att du kan falla långa sträckor utan att skadas en kort stund.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=fjäderfall
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Du påverkas av ett elixir för fjäderfall, så att du kan falla ned i avgrunder utan att skadas!\n\nÅterstående turer: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=elixir av honungsläkning
items.potions.elixirs.elixirofhoneyedhealing.desc=Detta elixir kombinerar läkning med honungens sötma. När det dricks har det samma effekt som en läkande dryck och stillar en liten del av hungern, men det kan också kastas för att läka en allierad.\n\nVarelser som är förtjusta i honung kan bli lugnade om det här föremålet används på dem.

items.potions.elixirs.elixiroficytouch.name=elixir av isig beröring
items.potions.elixirs.elixiroficytouch.desc=När du dricker det här elixiret kan du suga värme ur fiender du attackerar. Effekten gör dig immun mot kyla och låter dig kyla fiender med fysiska attacker.

items.potions.elixirs.elixirofmight.name=elixir av makt
items.potions.elixirs.elixirofmight.msg=Nyvunnen styrka strömmar genom din kropp, du har nu %d styrka!
items.potions.elixirs.elixirofmight.desc=Den här kraftfulla vätskan rinner genom dina muskler, ökar din styrka permanent med en poäng och ökar din maximala hälsa tillfälligt med %d poäng. Hälsoökningen skalas med din maximala hälsa, men kommer långsamt att avta när du går upp i nivå.
items.potions.elixirs.elixirofmight$htboost.name=ökning av maxhälsa
items.potions.elixirs.elixirofmight$htboost.desc=Din kropp känns onaturligt stark och frisk.\n\nDin maxhälsa är höjd under en längre tid. När du går upp i nivå avtar ökningen stadigt.\n\nNuvarande ökning: %d.\nÅterstående nivåer: %d.

items.potions.elixirs.elixiroftoxicessence.name=elixir av giftig essens
items.potions.elixirs.elixiroftoxicessence.desc=När du dricker det här elixiret fylls du av giftig energi. Du sprider kontinuerligt giftig gas när du rör dig och är immun mot giftig gas och gift lite längre än effekten varar.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=exotisk turkos dryck
items.potions.exotic.exoticpotion.crimson=exotisk karmosinröd dryck
items.potions.exotic.exoticpotion.azure=exotisk azurblå dryck
items.potions.exotic.exoticpotion.jade=exotisk jadegrön dryck
items.potions.exotic.exoticpotion.golden=exotisk gyllene dryck
items.potions.exotic.exoticpotion.magenta=exotisk magentafärgad dryck
items.potions.exotic.exoticpotion.charcoal=exotisk träkolsfärgad dryck
items.potions.exotic.exoticpotion.ivory=exotisk elfenbensfärgad dryck
items.potions.exotic.exoticpotion.amber=exotisk bärnstensfärgad dryck
items.potions.exotic.exoticpotion.bistre=exotisk brungrå dryck
items.potions.exotic.exoticpotion.indigo=exotisk indigofärgad dryck
items.potions.exotic.exoticpotion.silver=exotisk silverfärgad dryck
items.potions.exotic.exoticpotion.unknown_desc=Den här runda flaskan innehåller en kornig, färgstark vätska. Den verkar främmande för det här landet. Vem vet vad som händer när du dricker eller kastar den?
items.potions.exotic.exoticpotion.warning=Vill du verkligen avbryta användningen av den här drycken? Den kommer att förbrukas i alla fall.
items.potions.exotic.exoticpotion.yes=Ja, jag är positiv
items.potions.exotic.exoticpotion.no=Nej, jag ändrade mig
items.potions.exotic.exoticpotion.discover_hint=Du kan tillverka detta föremål via alkemi.

items.potions.exotic.potionofcleansing.name=reningsdryck
items.potions.exotic.potionofcleansing.desc=Det här kraftfulla reagenset gör den som dricker det immun mot alla skadliga statuseffekter under några turer. Du kan också kasta det på ett mål för att rena det.
items.potions.exotic.potionofcleansing$cleanse.name=renad
items.potions.exotic.potionofcleansing$cleanse.desc=Den här karaktären är tillfälligt immun mot alla skadliga statuseffekter!\n\nÅterstående turer: %s.

items.potions.exotic.potionofcorrosivegas.name=frätgasdryck
items.potions.exotic.potionofcorrosivegas.desc=Om du öppnar eller krossar den här tryckbehållaren exploderar innehållet i ett dödligt moln av frätande, rostfärgad gas. Gasen sprider sig snabbare än giftgas och är dödligare, men varar inte lika länge.

items.potions.exotic.potionofdragonsbreath.name=drakandedräktsdryck
items.potions.exotic.potionofdragonsbreath.prompt=Välj en plats att sätta i brand
items.potions.exotic.potionofdragonsbreath.desc=Den här flaskan innehåller en ovanlig förening som fattar eld strax efter att den blandats med saliv. Genom att snabbt spotta ut vätskan kan användaren spy ut lågor från munnen!

items.potions.exotic.potionofearthenarmor.name=jordrustningsdryck
items.potions.exotic.potionofearthenarmor.desc=Istället för att förlama har denna vätska en härdande effekt på huden som gör den till en tillfällig naturlig rustning.

items.potions.exotic.potionofdivineinspiration.name=gudomlig inspirationsdryck
items.potions.exotic.potionofdivineinspiration.no_more_points=Du kan inte få fler bonustalangpoäng.
items.potions.exotic.potionofdivineinspiration.select_tier=Välj en talangnivå för att få två bonuspoäng i. Du måste ha låst upp nivån för att kunna spendera poängen.
items.potions.exotic.potionofdivineinspiration.bonus=+2 talangpoäng!
items.potions.exotic.potionofdivineinspiration.desc=Helig energis kraft har reducerats till flytande form. Den här drycken fyller den som dricker den med gudomlig kraft och ger två bonustalangpoäng i en valfri talangnivå.\n\nDrycken kan bara användas en gång för varje talangnivå.

items.potions.exotic.potionofmagicalsight.name=magisynsdryck
items.potions.exotic.potionofmagicalsight.desc=När du dricker den här drycken skärps dina sinnen kortvarigt till otroliga nivåer, så att du kan se genom väggar inom en radie av 12 rutor!

items.potions.exotic.potionofmastery.name=mästerskapsdryck
items.potions.exotic.potionofmastery.prompt=Mästra ett föremål
items.potions.exotic.potionofmastery.weapon_easier=Ditt vapen blir lättare att hantera!
items.potions.exotic.potionofmastery.armor_easier=Din rustning blir lättare att bära!
items.potions.exotic.potionofmastery.desc=I stället för att ge råstyrka anpassar den här drycken användarens muskler till ett särskilt föremål. Det gör föremålet lättare att använda, som om den som druckit drycken hade övat med det och byggt upp muskelminne.\n\nDet valda vapnet eller rustningen kräver 2 mindre styrka. Drycken kan bara användas en gång på varje föremål.

items.potions.exotic.potionofshielding.name=skölddryck
items.potions.exotic.potionofshielding.desc=I stället för att läka skapar den här drycken en varaktig sköld runt användarens kropp som blockerar en betydande mängd skada.

items.potions.exotic.potionofshroudingfog.name=höljedimmedryck
items.potions.exotic.potionofshroudingfog.desc=När vätskan i den här flaskan utsätts för luft bildar den en tjock, rökig dimma som snabbt sprider sig och skymmer dina fienders sikt.

items.potions.exotic.potionofsnapfreeze.name=snabbfrysdryck
items.potions.exotic.potionofsnapfreeze.desc=Kemikalien i den här drycken reagerar snabbt med luften och fryser och rotfäster omedelbart alla inom dess effekt.

items.potions.exotic.potionofstamina.name=uthållighetsdryck
items.potions.exotic.potionofstamina.desc=När du dricker den här märkligt söta vätskan får du en långvarig energikick, så att du kan springa i snabbare takt under längre tid.

items.potions.exotic.potionofstormclouds.name=stormmolnsdryck
items.potions.exotic.potionofstormclouds.desc=När du kastar den här drycken skapas ett snabbt spridande moln av koncentrerad ånga som kondenserar och vräker ned över omgivningen. Merparten av terrängen omvandlas till vatten, brinnande fiender skadas, eld släcks och fällor överbelastas och går sönder.



###quest items
items.quest.ceremonialcandle.name=ceremoniljus
items.quest.ceremonialcandle.desc=En uppsättning ljus som smälts ner och smälts samman genom användning.\n\nEnskilt är de värdelösa, men tillsammans med andra ljus i ett mönster kan de fokusera energin för en åkallningsritual.
items.quest.ceremonialcandle.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.corpsedust.name=likstoft
items.quest.corpsedust.chill=En rysning går längs ryggraden.
items.quest.corpsedust.desc=Bollen av likstoft skiljer sig inte utåt från en vanlig stoftboll. Men du kan känna en illvillig energi som lurar inom den.\n\nAtt bli av med den så snart som möjligt vore en bra idé.
items.quest.corpsedust.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.
items.quest.corpsedust&dustwraith.rankings_desc=Förbannad av likstoft

items.quest.darkgold.name=mörkguldsmalm
items.quest.darkgold.you_now_have=Du har nu %d mörkguldsmalmer.
items.quest.darkgold.desc=Den här metallen kallas mörk, inte på grund av dess färg (den skiljer sig inte från vanligt guld), utan för att den smälter i dagsljus och blir oanvändbar på ytan.
items.quest.darkgold.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.dwarftoken.name=dvärgpollett
items.quest.dwarftoken.discard=Du kastar bort den överflödiga polletten.
items.quest.dwarftoken.desc=En egendomligt formad metallbit som hölls av en invånare i dvärgvalvet. Kanske är den en del av magin som band den till valvet? Bäst att behålla den, den kan komma till användning.
items.quest.dwarftoken.desc_old=Många dvärgar och några av deras större skapelser bär de här små metallbitarna med okänt syfte. Kanske är de smycken eller någon sorts identitetsmärke. Dvärgar är ett märkligt folk.
items.quest.dwarftoken.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.embers.name=elementglöd
items.quest.embers.desc=Särskild glöd som bara kan skördas från unga eldelementaler. De utstrålar värmeenergi.
items.quest.embers.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.escapecrystal.name=flyktkristall
items.quest.escapecrystal.ac_use=ANVÄND
items.quest.escapecrystal.prompt=Välj ett föremål
items.quest.escapecrystal.desc=En tunn magisk besvärjelsekristall som verkar innehålla teleportationsmagi. Du kan använda kristallen när som helst för att lämna dvärgvalvet, men om du lämnar tidigt får du inte hela belöningen!
items.quest.escapecrystal.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.
items.quest.escapecrystal.injure_warning_1=Tiden verkar sakta ner när du hör Imps röst:\n\n”Hej, du verkar vara ganska skadad. Går allt bra där nere? Jag vill ha min staty, men inte så gärna att du ska dö när du försöker få tag på den!”
items.quest.escapecrystal.injure_warning_2=”Om du sitter fast i en otäck situation kan du använda ett av de där _teleportationsföremålen från startrummet_ för att fly tillbaka dit och försöka igen.”
items.quest.escapecrystal.injure_warning_3=”Om läget ser riktigt dystert ut kan du _fly med kristallen jag gav dig._ Du får inte hela belöningen, men det är verkligen bättre än att dö!”
items.quest.escapecrystal.leaving_start=Tiden verkar sakta ner när du hör Imps röst:\n\n”Hör här, jag förstår om du är nervös, men lämna åtminstone det första rummet!”\n\n”Du behöver inte oroa dig för din utrustning, jag är en Imp som håller mitt ord. Jag lovar att allt väntar på dig när du kommer tillbaka. Jag lovar också att du får använda kristallen för att fly om du verkligen är i fara.”
items.quest.escapecrystal.leaving_early=Tiden verkar sakta ner när du hör Imps röst:\n\n”Verkligen, flyr du redan!? Du vet väl att du kan springa ifrån de flesta fienderna på den platsen?”\n\n”Hör här, om ditt liv är i fara kan jag dra ut dig, men jag låter dig inte ta med dig något tillbaka. Jag förväntade mig mycket mer av dig =(”
items.quest.escapecrystal.leaving_partly_explored=Tiden verkar sakta ner och du hör Imps röst:\n\n”Åh, lämnar du redan? Tja, jag antar att du har hjälpt till att kartlägga platsen. Det är bättre än ingenting.”\n\n”Jag förväntade mig ändå mer av dig =(. Naturligtvis drar jag ut dig om du behöver det. Jag låter dig ta med dig något, som en dryck eller skriftrulle, antar jag.”
items.quest.escapecrystal.leaving_fully_explored=Tiden verkar sakta ner och du hör Imps röst:\n\n”Måste du lämna? Du har åtminstone utforskat valvet en hel del. Jag hoppades att du skulle klara att plundra det bättre, men nu har jag en mycket bättre bild av hur platsen fungerar.”\n\n”Jag låter dig ta med dig något ut, men inget som är magiskt uppgraderat!”
items.quest.escapecrystal.leaving_partial_victory=Tiden verkar sakta ner och du hör Imps röst:\n\n”Jag hoppades att du skulle få min statyett, men du har gjort ett fantastiskt jobb med att utforska och rensa större delen av valvet!”\n\n”Säg så här: du får behålla ett föremål så länge det inte är förbättrat över +1, och jag öppnar fortfarande en butik längre ner i fängelsehålan. Jag behöver ändå lite tid för att planera nästa steg.”
items.quest.escapecrystal.leaving_victory=Tiden verkar sakta ner och du hör Imps röst:\n\n”Utmärkt arbete! Är du redo att lämna? Jag tar statyn av dig när du återvänder.”\n\n”Som utlovat öppnar jag en butik längre ner och låter dig ta med dig vad du vill tillbaka ut! Ta god tid på dig att välja. Allt annat stannar i valvet.”
items.quest.escapecrystal.leaving_item=Är du säker på att det här är föremålet du vill ta med dig?
items.quest.escapecrystal.leaving_seal=_Det brutna sigillet på den här rustningen är bundet till spegeln och kan inte tas med._ Sigillet tas automatiskt bort från rustningen. Det minskar rustningens nivå med 1, men tar inte bort någon glyf den har.
items.quest.escapecrystal.leaving_staff=_Magikerns stav är bunden till spegeln och kan inte tas med, men trollstaven som den har förtrollats med kan det._ Trollstaven tas automatiskt bort från Magikerns stav och ges till dig på en nivå under Magikerns stav.
items.quest.escapecrystal.leaving_yes=Lämna valvet
items.quest.escapecrystal.leaving_no=Stanna här
items.quest.escapecrystal.error_start=Det verkar som att du inte befinner dig på valvnivån! Det kan ha berott på ett fel eller en krasch.
items.quest.escapecrystal.error_no_items=Inga av dina föremål lagras, så kristallen har tagits bort från din packning.
items.quest.escapecrystal.error_with_items=Dina föremål lagras just nu, så du bör försöka gå ner i valvet igen för att börja uppdraget. Dina lagrade föremål lämnas tillbaka när uppdraget är slut.

items.quest.gooblob.name=geléklump
items.quest.gooblob.desc=En dallrande klump gegga som delades av från Goo när den dog. Den är nästan som en stor geléboll, men du skulle inte våga äta den.\n\nDen gör ingenting på egen hand, men kan vara användbar i kombination med vissa drycker eller en bomb. Åtminstone bör den kunna omvandlas till en ganska stor mängd energi.
items.quest.gooblob.discover_hint=Du kan få det här föremålet som byte från vissa fiender.

items.quest.impstatue.name=obsidianstatyett
items.quest.impstatue.desc=En liten kolsvart staty som har snidats av obsidian. Den liknar Impen som skickade ner dig hit, den har till och med hens lysande gröna ögon. På statyns fot finns en inskrift på ett språk som du aldrig har sett tidigare.
items.quest.impstatue.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.vaultbeacon.name=valvfyr
items.quest.vaultbeacon.desc=Den här återvändandefyren verkar redan ha en plats angiven, troligen entrérummet där du hittade den.\n\nDu kan använda den för att spara tid när du utforskar eller för att fly om du är i fara.
items.quest.vaultbeacon.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.

items.quest.metalshard.name=förbannad metallskärva
items.quest.metalshard.desc=En skärva av rostig, förbannad metall som bröts av från DM-300 när den förstördes. Du kan känna en inaktiv illvillig magi i den.\n\nDen gör ingenting på egen hand, men kan vara användbar i kombination med vissa skriftrullar eller en bomb. Åtminstone bör den kunna omvandlas till en ganska stor mängd energi.
items.quest.metalshard.discover_hint=Du kan få det här föremålet som byte från vissa fiender.

items.quest.pickaxe.name=pickaxe
items.quest.pickaxe.ability_name=genomborra
items.quest.pickaxe.ability_desc=Duellanten kan _genomborra_ en fiende med en hacka. Attacken träffar garanterat, gör fienden sårbar i 3 turer och orsakar _%1$d-%2$d skada_ på fiender med hård hud.
items.quest.pickaxe.upgrade_ability_stat_name=Förmågans skada
items.quest.pickaxe.desc=Det här är ett stadigt och tungt verktyg för att bryta sten. Du behöver inte utrusta hackan för att bryta sten med den, men den kan nog användas som vapen i nödfall.
items.quest.pickaxe.discover_hint=Du kan hitta detta föremål under ett specifikt uppdrag.



###remains
items.remains.remainsitem.ac_use=ANVÄND
items.remains.remainsitem.discover_hint=Du kan hitta det här föremålet i kvarlevorna efter en viss hjälte från en tidigare förlorad omgång.

items.remains.bowfragment.name=bågfragment
items.remains.bowfragment.desc=Det här trasiga träfragmentet var en gång en del av en fallen jägarinnas andebåge. Du kan fortfarande känna lite naturenergi kvar i fragmentet och kan använda det för att få högt gräs att växa runt dig. Då förstörs dock fragmentet.

items.remains.brokenhilt.name=brutet fäste
items.remains.brokenhilt.desc=Det här brutna fästet ser ut att komma från en besegrad duellants vapen. Du kan fortfarande känna lite stridskraft kvar i fästet och kan använda det för att få lite bonusskada på dina nästa två närstridsträffar. Då förstörs dock fästet.

items.remains.brokenstaff.name=bruten stav
items.remains.brokenstaff.desc=Den här Magikerstaven bröts mitt itu när ägaren dog. Du kan fortfarande känna lite magisk energi kvar i staven och kan använda den för att ge dina trollstavar en liten laddningsökning. Då förstörs dock staven.

items.remains.cloakscrap.name=tygbit
items.remains.cloakscrap.desc=Den här biten genomskinligt tyg ser ut att komma från en fallen Tjuvs skuggmantel. Du kan fortfarande känna lite mystisk energi kvar i den och kan använda den för att ge dina artefakter en liten laddningsökning. Då förstörs dock tyget.

items.remains.sealshard.name=förseglingsskärvor
items.remains.sealshard.desc=De här små skärvorna av rött vax ser ut att komma från en fallen Krigares sigill. Du kan fortfarande känna lite viljestyrka klamra sig fast vid sigillet och kan använda dem för att ge dig själv lite sköld. Då förstörs dock sigillskärvorna.

items.remains.tornpage.name=riven sida
items.remains.tornpage.desc=Den här sidan ser ut att ha rivits ur en avliden Prästs heliga bok. Det finns fortfarande lite gudomlig energi kvar i den och du kan använda den för att återfå lite hälsa. Då förstörs dock den rivna sidan.



###rings
items.rings.ring.diamond=diamantring
items.rings.ring.opal=opalring
items.rings.ring.garnet=granatring
items.rings.ring.ruby=rubinring
items.rings.ring.amethyst=ametistring
items.rings.ring.topaz=topasring
items.rings.ring.onyx=onyxring
items.rings.ring.tourmaline=turmalinring
items.rings.ring.emerald=smaragdring
items.rings.ring.sapphire=safirring
items.rings.ring.quartz=kvartsring
items.rings.ring.agate=agatring
items.rings.ring.equip_cursed=Ringen stramar åt runt ditt finger smärtsamt!
items.rings.ring.unknown_desc=Det här metallbandet är prytt med en stor ädelsten som glittrar i mörkret. Vem vet vilken effekt den har när den bärs?
items.rings.ring.known=Det här är en %s
items.rings.ring.identify=Du är nu tillräckligt bekant med din ring för att identifiera den.
items.rings.ring.cursed_worn=Den här ringen är förbannad och du kan inte ta bort den.
items.rings.ring.curse_known=Du kan känna en illvillig magi som lurar i den här ringen.
items.rings.ring.not_cursed=Den här ringen är fri från illvillig magi.

items.rings.ringofaccuracy.name=ring av noggrannhet
items.rings.ringofaccuracy.stats=När du bär den här ringen ökar din träffsäkerhet med _%s%%._
items.rings.ringofaccuracy.typical_stats=När du bär den här ringen ökar den vanligtvis din träffsäkerhet med _%s%%._
items.rings.ringofaccuracy.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din träffsäkerhet med _%s%%_ totalt.
items.rings.ringofaccuracy.upgrade_stat_name_1=Ökning av träffsäkerhet
items.rings.ringofaccuracy.desc=Den här ringen ökar ditt fokus, vilket gör det lättare för dina attacker att hitta sitt mål. En förbannad ring kommer istället att göra det svårare för dina attacker att träffa.

items.rings.ringofarcana.name=arkanaring
items.rings.ringofarcana.stats=När den bärs ökar den här ringen kraften i förtrollningar och glyfer med _%s%%._
items.rings.ringofarcana.typical_stats=När den bärs ökar den här ringen vanligtvis kraften hos förtrollningar och glyfer med _%s%%._
items.rings.ringofarcana.combined_stats=Dina utrustade ringar kombinerar sin kraft, vilket ökar kraften hos förtrollningar och glyfer med _%s%%_ totalt.
items.rings.ringofarcana.upgrade_stat_name_1=Ökning av arkana
items.rings.ringofarcana.desc=Den här ringen förstärker magiska förtrollningar på vapen och glyfer på rustningar, inklusive förbannelser! Den ökar först aktiveringschansen och ökar sedan styrkan i effekten när aktiveringschansen är 100%. En förbannad ring kommer istället att försvaga förtrollningar, glyfer och förbannelser.

items.rings.ringofelements.name=elementring
items.rings.ringofelements.stats=När du bär den här ringen ger den _%s%%_ elementmotstånd.
items.rings.ringofelements.typical_stats=När du bär den här ringen ger den vanligtvis _%s%%_ elementmotstånd.
items.rings.ringofelements.combined_stats=Dina utrustade ringar kombinerar sin kraft och ger totalt _%s%%_ elementmotstånd.
items.rings.ringofelements.upgrade_stat_name_1=Motstånd
items.rings.ringofelements.desc=Den här ringen ger motstånd mot de flesta elementära och magiska effekter, vilket minskar skada och försvagningars varaktighet. En förbannad ring förvärrar i stället dessa effekter.

items.rings.ringofenergy.name=energiring
items.rings.ringofenergy.stats=När du bär den här ringen ökar laddningshastigheten för trollstavar, artefakter och heroisk rustning med _%s%%._
items.rings.ringofenergy.typical_stats=När den här ringen bärs ökar den vanligtvis laddningshastigheten för trollstavar, artefakter och heroiska rustningar med _%s%%._
items.rings.ringofenergy.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar laddningshastigheten med _%s%%_ totalt.
items.rings.ringofenergy.upgrade_stat_name_1=Laddningsökning
items.rings.ringofenergy.desc=Din magiska utrustning laddas snabbare i det arkana fält som strålar ut från den här ringen. En förbannad ring saktar i stället ned laddningen.

items.rings.ringofevasion.name=undvikarring
items.rings.ringofevasion.stats=När du bär den här ringen ökar den din undvikandeförmåga med _%s%%._
items.rings.ringofevasion.typical_stats=När du bär den här ringen ökar den vanligtvis din undvikandeförmåga med _%s%%._
items.rings.ringofevasion.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din undvikandeförmåga med _%s%%_ totalt.
items.rings.ringofevasion.upgrade_stat_name_1=Ökning av undvikandeförmåga
items.rings.ringofevasion.desc=Den här ringen snabbar upp bärarens reaktioner, så att det blir svårare att träffa hen. En förbannad ring gör i stället användaren lättare att träffa.

items.rings.ringofforce.name=kraftring
items.rings.ringofforce.stats=När du är obeväpnad, med din nuvarande styrka, kommer denna ring att ge _%1$d-%2$d skada._ Med ett vapen utrustat kommer denna ring att öka skadan med _%3$d._
items.rings.ringofforce.typical_stats=När du är obeväpnad, med din nuvarande styrka, kommer den här ringen vanligtvis att ge _%1$d-%2$d skada._ Med ett vapen utrustat kommer den här ringen vanligtvis att öka skadan med _%3$d._
items.rings.ringofforce.combined_stats=Dina utrustade ringar kombinerar sin kraft, vilket ger totalt _%1$d-%2$d skada_ utan vapen, eller ökar skadan med _%3$d_ med ett vapen.
items.rings.ringofforce.upgrade_stat_name_1=Obeväpnad skada
items.rings.ringofforce.upgrade_stat_name_2=Ökning av beväpnad skada
items.rings.ringofforce.upgrade_stat_name_3=Förmågeskada
items.rings.ringofforce.ability_name=slagsmålsställning
items.rings.ringofforce.typical_ability_desc=Duellanten kan anta en _slagsmålsställning_ med den här ringen, så att hennes vanliga attacker alltid använder ringen även när hon har ett vapen utrustat. Attackerna orsakar vanligtvis _%1$d-%2$d skada_ och får dessutom vapnets förtrollning och förstärkning. Ställningen saktar ned vapnets laddningshastighet med 50 %.
items.rings.ringofforce.ability_desc=Duellanten kan anta en _slagsmålsställning_ med den här ringen, så att hennes vanliga attacker alltid använder ringen även när hon har ett vapen utrustat. Attackerna orsakar _%1$d-%2$d skada_ och får dessutom vapnets förtrollning och förstärkning. Ställningen saktar ned vapnets laddningshastighet med 50 %.
items.rings.ringofforce.desc=Den här ringen förstärker kraften i bärarens närstridsslag. Denna extra kraft är ganska svag när man använder vapen, men en obeväpnad attack blir mycket starkare. En förbannad ring kommer istället att försvaga bärarens slag.
items.rings.ringofforce$brawlersstance.name=slagsmålsställning
items.rings.ringofforce$brawlersstance.desc=I den här ställningen använder Duellantens vanliga attacker en utrustad kraftring även när hon har ett vapen utrustat. Attackerna får bonusskada och använder fortfarande vapnets förstärkning och förtrollning.\n\nAtt upprätthålla ställningen kräver fokus och minskar vapenförmågans laddningshastighet med 50 %.\n\nDu kan slå på eller av ställningen med en kraftring, men minskningen av laddningshastigheten består en kort stund om ställningen snabbt aktiveras och avaktiveras.

items.rings.ringoffuror.name=raseriring
items.rings.ringoffuror.stats=När den bärs ökar den här ringen hastigheten på dina attacker med _%s%%._
items.rings.ringoffuror.typical_stats=När den här ringen bärs ökar den vanligtvis hastigheten på dina attacker med _%s%%._
items.rings.ringoffuror.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar hastigheten på dina attacker med _%s%%_ totalt.
items.rings.ringoffuror.upgrade_stat_name_1=Attackhastighetsökning
items.rings.ringoffuror.desc=Den här ringen ger bäraren ett inre raseri, vilket gör att de kan attackera snabbare. En förbannad ring kommer istället att sakta ner bärarens attackhastighet.

items.rings.ringofhaste.name=hastighetsring
items.rings.ringofhaste.stats=När den bärs ökar denna ring din rörelsehastighet med _%s%%._
items.rings.ringofhaste.typical_stats=När den här ringen bärs ökar den vanligtvis din rörelsehastighet med _%s%%._
items.rings.ringofhaste.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din rörelsehastighet med _%s%%_ totalt.
items.rings.ringofhaste.upgrade_stat_name_1=Ökning av rörelsehastigheten
items.rings.ringofhaste.desc=Den här ringen minskar den stress som rörelse innebär för bäraren, vilket gör att de kan springa i övermänskliga hastigheter. En förbannad ring kommer istället att tynga ner bäraren.

items.rings.ringofmight.name=maktring
items.rings.ringofmight.stats=När du bär den här ringen ökar din styrka med _%1$d_ och din maxhälsa med _%2$s%%._
items.rings.ringofmight.typical_stats=När du bär den här ringen ökar den vanligtvis din styrka med _%1$d_ och din maxhälsa med _%2$s%%._
items.rings.ringofmight.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din styrka med _%1$d_ och maxhälsa med _%2$s%%_ totalt.
items.rings.ringofmight.upgrade_stat_name_1=Styrkeökning
items.rings.ringofmight.upgrade_stat_name_2=Ökning av maxhälsa
items.rings.ringofmight.desc=Den här ringen förstärker bärarens fysiska egenskaper, vilket ger dem större fysisk styrka och konstitution. En förbannad ring kommer att försvaga bäraren.

items.rings.ringofsharpshooting.name=skarpskyttering
items.rings.ringofsharpshooting.stats=När du bär den här ringen ökar den skadan från dina kastvapen som om deras nivå hade höjts med _%1$d_ och deras hållbarhet med _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=När du bär den här ringen ökar den vanligtvis skadan från dina kastvapen som om deras nivå hade höjts med _%1$d_ och deras hållbarhet med _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Dina utrustade ringar kombinerar sin kraft, så att dina kastvapen får _%1$d_ högre effektiv nivå och _%2$s%%_ bättre hållbarhet totalt.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Ökning av nivåskada
items.rings.ringofsharpshooting.upgrade_stat_name_2=Ökning av hållbarhet
items.rings.ringofsharpshooting.desc=Den här ringen förbättrar bärarens precision och sikte, vilket gör att alla projektilvapen blir mer skadliga och hållbara. En förbannad ring kommer att ha motsatt effekt.

items.rings.ringoftenacity.name=tålighetsring
items.rings.ringoftenacity.stats=När den här ringen bärs kommer den att minska skadan du tar med upp till _%s%%._
items.rings.ringoftenacity.typical_stats=När den här ringen bärs kommer den vanligtvis att minska skadan du tar med upp till _%s%%._
items.rings.ringoftenacity.combined_stats=Dina utrustade ringar kombinerar sin kraft och minskar den skada du tar med upp till _%s%%_ totalt.
items.rings.ringoftenacity.upgrade_stat_name_1=Maximalt skademotstånd
items.rings.ringoftenacity.desc=När du bär den här ringen kan du stå emot slag som normalt vore dödliga. Ju mer skadad du är, desto mer motståndskraftig blir du mot skada. En förbannad ring gör i stället det lättare för fiender att avrätta bäraren.

items.rings.ringofwealth.name=rikedomsring
items.rings.ringofwealth.stats=När den bärs ökar denna ring din tur med _%s%%._
items.rings.ringofwealth.typical_stats=När du bär den här ringen kommer den vanligtvis att öka din tur med _%s%%._
items.rings.ringofwealth.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din tur med _%s%%_ totalt.
items.rings.ringofwealth.upgrade_stat_name_1=Turökning
items.rings.ringofwealth.desc=Den här ringen fungerar som en magnet för skatter, vilket ökar sannolikheten för att fiender och behållare bär på värdefulla föremål. En förbannad ring kommer istället att minska din chans att få byte.



###scrolls
items.scrolls.scroll.ac_read=LÄS
items.scrolls.scroll.kaunan=skriftrulle med KAUNAN
items.scrolls.scroll.sowilo=skriftrulle med SOWILO
items.scrolls.scroll.laguz=skriftrulle med LAGUZ
items.scrolls.scroll.yngvi=skriftrulle med YNGVI
items.scrolls.scroll.gyfu=skriftrulle med GYFU
items.scrolls.scroll.raido=skriftrulle med RAIDO
items.scrolls.scroll.isaz=skriftrulle med ISAZ
items.scrolls.scroll.mannaz=skriftrulle med MANNAZ
items.scrolls.scroll.naudiz=skriftrulle med NAUDIZ
items.scrolls.scroll.berkanan=skriftrulle med BERKANAN
items.scrolls.scroll.odal=skriftrulle med ODAL
items.scrolls.scroll.tiwaz=skriftrulle med TIWAZ
items.scrolls.scroll.unknown_desc=En oläslig magisk runa är skriven på det här pergamentet. Vem vet vad som händer när den läses högt?
items.scrolls.scroll.blinded=Du kan inte läsa en skriftrulle när du är blind.
items.scrolls.scroll.no_magic=Du kan inte läsa en skriftrulle när du är immun mot magi.
items.scrolls.scroll.cursed=Din förbannade trollformelbok hindrar dig från att använda den här skriftrullens magi! En skriftrulle för att ta bort förbannelsen kan dock vara tillräckligt stark för att fungera…
items.scrolls.scroll$placeholder.name=skriftrulle

items.scrolls.inventoryscroll.warning=Vill du verkligen avbryta användningen av den här skriftrullen? Skriftrullen var inte identifierad tidigare, så den kommer att användas ändå.
items.scrolls.inventoryscroll.yes=Ja, jag är positiv
items.scrolls.inventoryscroll.no=Nej, jag ändrade mig

items.scrolls.scrollofidentify.name=skriftrulle för identifiering
items.scrolls.scrollofidentify.inv_title=Identifiera ett föremål
items.scrolls.scrollofidentify.it_is=Ditt föremål har identifierats: %s.
items.scrolls.scrollofidentify.desc=Den här skriftrullen avslöjar permanent alla hemligheter för ett enda föremål.

items.scrolls.scrolloflullaby.name=skriftrulle med vaggvisa
items.scrolls.scrolloflullaby.sooth=Skriftrullen framför en lugnande melodi. Du känner dig väldigt sömnig.
items.scrolls.scrolloflullaby.desc=När du läser den här skriftrullen hörs en lugnande melodi som vaggar alla som hör den in i en djup magisk sömn. För läsaren och dennes allierade är sömnen återställande.

items.scrolls.scrollofmagicmapping.name=skriftrulle med magisk kartläggning
items.scrolls.scrollofmagicmapping.layout=Du är nu medveten om nivåns layout.
items.scrolls.scrollofmagicmapping.desc=När du läser den här skriftrullen etsas en kristallklar bild in i ditt minne. Den visar nivåns exakta utformning och avslöjar alla dolda hemligheter. Föremålens och varelsernas platser förblir okända.

items.scrolls.scrollofmirrorimage.name=skriftrulle med spegelbilder
items.scrolls.scrollofmirrorimage.copies=Skriftrullen skapar spegelbilder av dig.
items.scrolls.scrollofmirrorimage.no_copies=Skriftrullen försöker skapa spegelbilder av dig, men de har ingenstans att ta vägen.
items.scrolls.scrollofmirrorimage.desc=Besvärjelsen på den här skriftrullen skapar två illusoriska tvillingar av läsaren. Spegelbilderna fungerar som svagare kloner av läsaren och jagar sina fiender. De saknar dock uthållighet och bleknar när de tar skada.

items.scrolls.scrollofretribution.name=skriftrulle med vedergällning
items.scrolls.scrollofretribution.blast=Kraftfull magisk energi bryter ut från skriftrullen!
items.scrolls.scrollofretribution.desc=Den här skriftrullen innehåller destruktiv energi som kanaliserar läsarens lidande utåt i en kraftig explosion. Ju svagare läsaren är, desto mer skada orsakar hen. Vid mycket låg hälsa kan skriftrullen döda de flesta fiender genast.\n\nAtt använda skriftrullen tar dock ut sin rätt på användaren genom att förblinda och försvaga hen.

items.scrolls.scrollofrage.name=skriftrulle med raseri
items.scrolls.scrollofrage.roar=Skriftrullen avger ett rasande vrål som ekar genom hela fängelsehålan!
items.scrolls.scrollofrage.desc=När den här skriftrullen läses högt avger den ett stort vrål som drar alla fiender till läsaren och gör dem i närheten rasande.

items.scrolls.scrollofrecharging.name=skriftrulle med uppladdning
items.scrolls.scrollofrecharging.surge=En våg av energi strömmar genom din kropp och stärker dina trollstavar!
items.scrolls.scrollofrecharging.desc=Den råa magiska kraft som är bunden i det här pergamentet laddar gradvis användarens alla trollstavar när den frigörs.

items.scrolls.scrollofremovecurse.name=skriftrulle för att häva förbannelse
items.scrolls.scrollofremovecurse.inv_title=Rena ett föremål
items.scrolls.scrollofremovecurse.cleansed=Ditt föremål lyser med ett renande ljus och en illvillig energi försvinner!
items.scrolls.scrollofremovecurse.not_cleansed=Ditt föremål lyser med ett renande ljus, men ingenting händer.
items.scrolls.scrollofremovecurse.spirit=Din skriftrulle befriar den plågade anden!
items.scrolls.scrollofremovecurse.desc=Besvärjelsen på denna skriftrulle tar omedelbart bort alla förbannelser från ett vapen, en ring, en trollstav, en rustning eller en artefakt.

items.scrolls.scrollofteleportation.name=teleporteringsskriftrulle
items.scrolls.scrollofteleportation.tele=På ett ögonblick teleporterades du till en annan plats på nivån.
items.scrolls.scrollofteleportation.no_tele=Teleporteringsmagin misslyckades.
items.scrolls.scrollofteleportation.cant_reach=Du kan inte teleportera dig dit.
items.scrolls.scrollofteleportation.prompt=Välj en plats att teleportera till
items.scrolls.scrollofteleportation.desc=Besvärjelsen på det här pergamentet förflyttar genast läsaren till en annan plats på fängelsehålans nivå. Skriftrullen prioriterar områden som läsaren inte har besökt tidigare, men kan inte teleportera förbi låsta dörrar eller barrikader. Den kan dock avslöja dolda dörrar som leder till nya områden.

items.scrolls.scrollofterror.name=skriftrulle med skräck
items.scrolls.scrollofterror.none=Skriftrullen avger en lysande blixt av rött ljus.
items.scrolls.scrollofterror.one=Skriftrullen avger en lysande blixt av rött ljus och %s flyr!
items.scrolls.scrollofterror.many=Skriftrullen avger en lysande blixt av rött ljus och monstren flyr!
items.scrolls.scrollofterror.desc=När du läser den här skriftrullen avges en röd ljusblixt som överväldigar alla fiender i ditt synfält med skräck. De vänder sig om och flyr. Att attackera en flyende fiende förkortar effekten.

items.scrolls.scrolloftransmutation.name=transmuteringsskriftrulle
items.scrolls.scrolloftransmutation.inv_title=Transmutera ett föremål
items.scrolls.scrolloftransmutation.nothing=Inget intressant händer.
items.scrolls.scrolloftransmutation.morph=Ditt föremål förvandlas till något annat!
items.scrolls.scrolloftransmutation.desc=Den här skriftrullen innehåller kraftfull transmutationsmagi. När den används på ett lämpligt föremål förvandlas det till ett annat föremål av samma typ. Magin bevarar till och med uppgraderingar, förtrollningar och glyfer. Skriftrullar och drycker transmuteras till sina exotiska motsvarigheter och vice versa.

items.scrolls.scrollofupgrade.name=uppgraderingsskriftrulle
items.scrolls.scrollofupgrade.inv_title=Uppgradera ett föremål
items.scrolls.scrollofupgrade.weaken_curse=Uppgraderingsskriftrullen försvagar förbannelsen på ditt föremål.
items.scrolls.scrollofupgrade.remove_curse=Uppgraderingsskriftrullen häver förbannelsen på ditt föremål!
items.scrolls.scrollofupgrade.desc=Denna skriftrulle uppgraderar ett enskilt föremål eller en uppsättning kastvapen. Trollstavar får ökad kraft och fler laddningar, vapen och rustningar orsakar och blockerar mer skada, kastvapenset repareras helt och blir mer hållbara, och ringarnas effekter förstärks.\n\nDen kan till och med försvaga eller ibland helt upphäva förbannelser, även om den inte är lika kraftfull som en skriftrulle för att ta bort förbannelser. Tyvärr kan uppgraderingsmagin också radera förtrollningar eller glyfer på utrustning av högre nivå.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=exotisk skriftrulle med KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=exotisk skriftrulle med SOWILO
items.scrolls.exotic.exoticscroll.laguz=exotisk skriftrulle med LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=exotisk skriftrulle med YNGVI
items.scrolls.exotic.exoticscroll.gyfu=exotisk skriftrulle med GYFU
items.scrolls.exotic.exoticscroll.raido=exotisk skriftrulle med RAIDO
items.scrolls.exotic.exoticscroll.isaz=exotisk skriftrulle med ISAZ
items.scrolls.exotic.exoticscroll.mannaz=exotisk skriftrulle med MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotisk skriftrulle med NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=exotisk skriftrulle med BERKANAN
items.scrolls.exotic.exoticscroll.odal=exotisk skriftrulle med ODAL
items.scrolls.exotic.exoticscroll.tiwaz=exotisk skriftrulle med TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=En glödande, oläslig magisk runa är skriven på det här svarta pergamentet. Den verkar främmande för det här landet. Vem vet vad som händer när den läses högt?
items.scrolls.exotic.exoticscroll.discover_hint=Du kan tillverka detta föremål med alkemi.

items.scrolls.exotic.scrollofsirenssong.name=skriftrulle med sirensång
items.scrolls.exotic.scrollofsirenssong.prompt=Välj ett mål
items.scrolls.exotic.scrollofsirenssong.no_target=Skriftrullen aktiveras utan mål.
items.scrolls.exotic.scrollofsirenssong.cancel=Du måste välja ett mål.
items.scrolls.exotic.scrollofsirenssong.desc=När du läser den här skriftrullen hörs en lockande melodi som förhäxar en utvald fiende och permanent förvandlar den till en allierad! Andra fiender som hör melodin blir tillfälligt charmade.\n\nSärskilt starka fiender kan stå emot förhäxningen och blir i stället charmade.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=förhäxad
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Den här varelsen har blivit förtrollad av magin i en skriftrulle med sirensång.\n\nEn förtrollad karaktär är permanent din allierade och kommer att slåss mot alla fiender de möter.

items.scrolls.exotic.scrollofantimagic.name=skriftrulle med antimagi
items.scrolls.exotic.scrollofantimagic.desc=Besvärjelsen på denna skriftrulle kommer att omge dig med en magisk aura som tillfälligt blockerar alla magiska effekter, skadliga eller hjälpsamma. Detta inkluderar de flesta magiska föremålseffekter som trollstavar, skriftrullar, ringar, artefakter, förtrollningar och förbannelser. Heroiska rustningsförmågor är dock tillräckligt starka för att fungera oavsett.

items.scrolls.exotic.scrollofchallenge.name=utmaningsskriftrulle
items.scrolls.exotic.scrollofchallenge.desc=När du läser den här skriftrullen avges ett stort vrål som drar fiender till användaren och samtidigt skapar en liten arena runt hen.\n\nSå länge läsaren stannar i arenan tar hen 33 % mindre skada från alla källor, innan andra former av skadereduktion tillämpas, och förlorar inte mättnad.\n\nArenans storlek anpassas efter området läsaren befinner sig i. I vissa bossområden blir den särskilt liten.
items.scrolls.exotic.scrollofchallenge$challengearena.name=utmaningsarena
items.scrolls.exotic.scrollofchallenge$challengearena.desc=En magisk arena har uppenbarat sig runt dig, markerad av en böljande röd dimma.\n\nNär du står i dimman ökar inte din hunger och du tar 33 %% mindre skada från alla källor. Andra former av skadereduktion, som rustning, tillämpas efter minskningen på 33 %%.\n\nÅterstående turer: %d.

items.scrolls.exotic.scrollofdivination.name=spådomsskriftrulle
items.scrolls.exotic.scrollofdivination.nothing_left=Det finns inget kvar att identifiera!
items.scrolls.exotic.scrollofdivination.desc=Den här skriftrullen identifierar slumpmässigt fyra typer av föremål som du ännu inte känner till. Typerna kan vara en drycks färg, en skriftrulles runa eller en rings ädelsten. Föremålen behöver inte finnas i din packning.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Din spådomsskriftrulle har identifierat följande föremål:

items.scrolls.exotic.scrollofdread.name=skräckens skriftrulle
items.scrolls.exotic.scrollofdread.desc=När du läser den här skriftrullen avges en röd ljusblixt som injagar oerhörd skräck i alla fiender i ditt synfält. Effekten är så stark att de snabbt försöker fly från hela fängelsehålan och aldrig återvända!\n\nPrecis som vanlig skräck kan effekten upphöra med tiden eller om fienden attackeras.\n\nViljestarka fiender, som bossar, drabbas i stället av vanlig skräck.

items.scrolls.exotic.scrollofenchantment.name=förtrollningsskriftrulle
items.scrolls.exotic.scrollofenchantment.inv_title=Förtrolla ett föremål
items.scrolls.exotic.scrollofenchantment.weapon=Välj en förtrollning att använda på ditt vapen.
items.scrolls.exotic.scrollofenchantment.armor=Välj en glyf att använda på din rustning.
items.scrolls.exotic.scrollofenchantment.cancel=avbryt
items.scrolls.exotic.scrollofenchantment.cancel_warn=Om du avbryter förbrukas ändå din förtrollningsskriftrulle. Är du säker?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ja, jag är säker
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nej, jag ändrade mig
items.scrolls.exotic.scrollofenchantment.desc=Den här skriftrullen ger ett vapen eller en rustning kraftfull magisk energi. Läsaren har till och med viss kontroll över vilken magi som tillförs.

items.scrolls.exotic.scrollofforesight.name=skriftrulle med förutseende
items.scrolls.exotic.scrollofforesight.desc=När du har läst den här skriftrullen matas detaljer om terrängen i närheten ständigt in i läsarens sinne med kristallklar tydlighet. Effekten varar länge och avslöjar alla dolda dörrar och fällor, så att du inte behöver söka.

items.scrolls.exotic.scrollofmetamorphosis.name=metamorfosskriftrulle
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Välj en talang att omvandla.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Välj en ny talang att ersätta din metamorfoserade talang med.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Om du avbryter förbrukas ändå din metamorfosskriftrulle. Är du säker?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=omvandla talang
items.scrolls.exotic.scrollofmetamorphosis.desc=Den här rullen innehåller kraftfull transmutationsmagi som gäller besvärjaren i stället för ett föremål. Magin i skriftrullen låter dig välja en talang och ersätta den med en av fem talanger på samma nivå från olika hjälteklasser!\n\nEffekten kan bara tillämpas på klasstalanger, inte talanger från underklasser eller rustningsförmågor. Talanger som du inte kan använda erbjuds inte som alternativ.

items.scrolls.exotic.scrollofmysticalenergy.name=skriftrulle med mystisk energi
items.scrolls.exotic.scrollofmysticalenergy.desc=Den råa magiska kraften som är bunden i detta pergament kommer, när den utgår, att ladda användarens utrustade artefakter över tid.

items.scrolls.exotic.scrollofpassage.name=passageskriftrulle
items.scrolls.exotic.scrollofpassage.desc=Besvärjelsen på det här pergamentet förflyttar genast läsaren till första våningen i närmaste region ovanför hen. Mycket praktiskt för att snabbt komma till en butik.

items.scrolls.exotic.scrollofprismaticimage.name=skriftrulle med prismatisk bild
items.scrolls.exotic.scrollofprismaticimage.desc=Besvärjelsen på den här skriftrullen skapar en färgstark illusorisk tvilling av läsaren. Den prismatiska bilden fungerar som en svagare klon av läsaren med liknande försvar, men lägre hälsa och skada.\n\nDen prismatiska bilden visar sig när fiender är närvarande och försöker försvara läsaren.\n\nOm en prismatisk bild redan finns läker den här skriftrullen den helt.

items.scrolls.exotic.scrollofpsionicblast.name=skriftrulle med psionisk sprängning
items.scrolls.exotic.scrollofpsionicblast.ondeath=Den psioniska sprängningen sliter sönder ditt sinne…
items.scrolls.exotic.scrollofpsionicblast.desc=Den här rullen innehåller otrolig destruktiv energi som kan kanaliseras för att förstöra sinnet hos alla synliga varelser.\n\nDet finns dock en betydande återkoppling och läsaren kommer också att skadas, förblindas och försvagas. Ju fler mål skriftrullen träffar, desto mindre självskada kommer att tas.



###spells
items.spells.alchemize.name=alchemize
items.spells.alchemize.prompt=Alkemisera ett föremål
items.spells.alchemize.desc=Den här besvärjelsen innehåller transmuterande krafter som liknar dem i en alkemikruka. Varje kast låter användaren förvandla ett föremål, eller en hög föremål, till guld eller alkemisk energi. När du förvandlar drycker eller skriftrullar till energi identifieras de till och med!\n\nNågra användningar av Alkemisera säljs i butiker, men många fler kan tillverkas med alkemi genom att kombinera ett frö, en runsten och lite alkemisk energi.
items.spells.alchemize$wndalchemizeitem.sell=Förvandla till %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Förvandla 1 till %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Förvandla alla till %dg
items.spells.alchemize$wndalchemizeitem.energize=Förvandla till %d energi
items.spells.alchemize$wndalchemizeitem.energize_1=Förvandla 1 till %d energi
items.spells.alchemize$wndalchemizeitem.energize_all=Förvandla alla till %d energi

items.spells.beaconofreturning.name=fyr för återkomst
items.spells.beaconofreturning.preventing=Den här platsens starka magiska aura hindrar dig från att använda besvärjelsen!
items.spells.beaconofreturning.creatures=Den psykiska auran från närliggande varelser hindrar dig från att teleportera just nu.
items.spells.beaconofreturning.set=Fyren har angetts på din nuvarande plats.
items.spells.beaconofreturning.wnd_body=När du anger en plats ersätts den plats som fyren tidigare var inställd på.\n\nNär du återvänder förflyttas du till den senast angivna platsen och en användning av besvärjelsen förbrukas.
items.spells.beaconofreturning.wnd_set=Ställ in
items.spells.beaconofreturning.wnd_return=Återvänd
items.spells.beaconofreturning.desc_set=Den här fyren sattes någonstans på våning %d.
items.spells.beaconofreturning.desc=Den här avancerade besvärjelsen låter användaren återvända till en angiven plats, oavsett avstånd. Den förbrukas bara när du återvänder och kan anges hur många gånger som helst, men minns bara den senaste platsen.

items.spells.curseinfusion.name=förbannelseinfusion
items.spells.curseinfusion.inv_title=Förbanna ett föremål
items.spells.curseinfusion.desc=Den här besvärjelsen fyller ett utrustningsföremål med samma kraftfulla illvilliga magi som finns i DM-300. Föremålet blir genast förbannat och eventuella förtrollningar eller glyfer åsidosätts.\n\nVapen, rustningar och trollstavar får uppgraderingar utöver förbannelsen. Uppgraderingar från förbannelseinfusion staplas inte och försvinner om föremålet blir av med förbannelsen.\n\nFlera förbannelseinfusioner kan också användas för att ändra förbannelsen på ett vapen eller en rustning.

items.spells.spell.ac_cast=KASTA
items.spells.spell.no_magic=Du kan inte kasta besvärjelser när du är immun mot magi.
items.spells.spell.discover_hint=Du kan tillverka detta föremål via alkemi.

items.spells.magicalinfusion.name=magisk infusion
items.spells.magicalinfusion.inv_title=Infusera ett föremål
items.spells.magicalinfusion.infuse=Ditt föremål har fyllts med arkansk energi!
items.spells.magicalinfusion.desc=Den här besvärjelsen har samma magiska kraft som en uppgraderingsrulle, men i en mer stabil form.\n\nUtöver att uppgradera ett föremål som normalt kommer den aldrig att radera en förtrollning, glyf eller förbannelse.

items.spells.magicalporter.name=magisk förflyttare
items.spells.magicalporter.inv_title=Förflytta ett föremål
items.spells.magicalporter.nowhere=Det finns ingen plats att förflytta ett föremål till.
items.spells.magicalporter.desc=Den här besvärjelsen transporterar magiskt alla föremål som den kastas på. Till skillnad från en köpmans fyr kommer dock föremålen att transporteras till ingången till nästa bossvåning.

items.spells.phaseshift.name=fasförskjutning
items.spells.phaseshift.no_target=Det finns inget att teleportera dit.
items.spells.phaseshift.desc=Den här kaotiska besvärjelsen teleporterar alla karaktärer som den är riktad mot till en slumpmässig plats på den aktuella våningen och bedövar dem under en längre tid. Kraftiga fiender kommer att kunna motstå den bedövande effekten. Denna trollformel kan riktas mot ett mål eller mot användaren själv.

items.spells.reclaimtrap.name=återta fälla
items.spells.reclaimtrap.no_trap=Det finns ingen fälla där.
items.spells.reclaimtrap.desc_trap=Besvärjelsen är för närvarande redo att utlösa en _%s._
items.spells.reclaimtrap.desc=Den här besvärjelsen innehåller rester av den mekaniska energin från DM-300. När du kastar den på en aktiv fälla fästs fällans kraft vid dig, så att du kan kasta besvärjelsen igen för att släppa lös kraften och utlösa fällans effekt på valfri plats.\n\nVissa fällor fungerar dock inte överallt, och bara en fälla kan lagras åt gången.

items.spells.recycle.name=återvinning
items.spells.recycle.inv_title=Återvinn ett föremål
items.spells.recycle.recycled=Ditt föremål återvanns till: %s.
items.spells.recycle.desc=Den här besvärjelsen innehåller en svagare form av transmutationsmagi. Den fungerar inte på utrustning, men förvandlar en skriftrulle, dryck, ett frö, en runsten eller en spetsad pil till ett slumpmässigt föremål av samma typ.

items.spells.summonelemental.name=åkalla elemental
items.spells.summonelemental.ac_imbue=INGJUT
items.spells.summonelemental.imbue_prompt=Förse ett föremål med kraft
items.spells.summonelemental.desc=Den här besvärjelsen kanaliserar energin i den elementglöd som användes för att skapa den och låter dig åkalla en vänligt sinnad elemental som strider vid din sida! Bara en elemental kan vara framkallad åt gången, men du kan kasta besvärjelsen igen för att återkalla elementalen utan kostnad.
items.spells.summonelemental.desc_newborn=Besvärjelsen saknar för närvarande ingjuten kraft och åkallar en _nyfödd elemental_ utan distansattack. Du kan gjuta in kraft från en identifierad dryck med flytande flamma, frostbrygd, skriftrulle med uppladdning eller transmuteringsskriftrulle för att förstärka besvärjelsen. Framtida åkallelser blir då elementalvarelser med full kraft!
items.spells.summonelemental.desc_fire=Besvärjelsen är för närvarande varm att ta på och åkallar en _eldelemental_. Du kan gjuta in kraft från ett annat föremål, men besvärjelsen förlorar då sin nuvarande ingjutning.
items.spells.summonelemental.desc_frost=Besvärjelsen är för närvarande kall att ta på och åkallar en _frostelemental_. Du kan gjuta in kraft från ett annat föremål, men besvärjelsen förlorar då sin nuvarande ingjutning.
items.spells.summonelemental.desc_shock=Besvärjelsen utstrålar för närvarande statisk energi och åkallar en _elektrisk elemental_. Du kan gjuta in kraft från ett annat föremål, men besvärjelsen förlorar då sin nuvarande ingjutning.
items.spells.summonelemental.desc_chaos=Besvärjelsen utstrålar för närvarande kaotisk energi och åkallar en _kaoselemental_. Du kan gjuta in kraft från ett annat föremål, men besvärjelsen förlorar då sin nuvarande ingjutning.

items.spells.targetedspell.prompt=Välj ett mål
items.spells.targetedspell.inv_title=Förse ett föremål med kraft

items.spells.telekineticgrab.name=telekinetiskt grepp
items.spells.telekineticgrab.cant_grab=Du kan inte ta tag i det där.
items.spells.telekineticgrab.no_target=Det finns inget att ta tag i där.
items.spells.telekineticgrab.desc=Den här besvärjelsen låter kastaren hämta alla föremål på en plats på avstånd, eller alla kastvapen som sitter fast i en fiende!\n\nDu kan inte använda den för att hämta föremål som ägs av någon annan eller behållare som kistor.

items.spells.unstablespell.name=instabil besvärjelse
items.spells.unstablespell.desc=Den här lilla svarta fyrkantiga kristallen har skiftande runsymboler på var och en av sina ytor.\n\nNär den aktiveras utlöser den effekten av en slumpmässig skriftrulle. Effekten är alltid stridsinriktad om det finns fiender i ditt synfält och annars alltid inriktad på annat än strid.

items.spells.wildenergy.name=vild energi
items.spells.wildenergy.desc=Den här besvärjelsen innehåller en del av den förbannade energi som drev DM-300. När du kastar den laddas dina trollstavar och burna artefakter, samtidigt som en slumpmässig förbannad trollstavseffekt utlöses. Du kan dock välja i vilken riktning den förbannade magin ska skjutas.


###runestones
items.stones.inventorystone.ac_use=ANVÄND

items.stones.runestone$placeholder.name=runsten
items.stones.runestone.discover_hint=Du kan hitta det här föremålet slumpmässigt i fängelsehålan, eller tillverka det via alkemi.

items.stones.stoneofaggression.name=aggressionssten
items.stones.stoneofaggression.desc=När den här stenen kastas på en allierad eller fiende föredrar alla närliggande fiender att attackera den karaktären en kort stund.\n\nBossfiender kan inte påverkas direkt av denna effekt, men den fungerar på deras undersåtar.
items.stones.stoneofaggression$aggression.name=utpekad
items.stones.stoneofaggression$aggression.desc=Manipulerande magi gör att alla fiender i närheten föredrar att attackera den här karaktären.\n\nÅterstående turer: %s.

items.stones.stoneofaugmentation.name=sten för förstärkning
items.stones.stoneofaugmentation.inv_title=Förstärk ett föremål
items.stones.stoneofaugmentation.desc=Denna runsten besitter kraftfull magi som kan förstärka utrustning för att förbättra en egenskap på bekostnad av en annan.\n\nOm du använder den på ett vapen kan du förbättra antingen hastigheten eller skadan. Kastvapen får också ökad eller minskad hållbarhet i proportion till deras hastighet.\n\nOm du använder den på rustning kan du förbättra antingen försvaret eller undvikandet.
items.stones.stoneofaugmentation.discover_hint=Du kan köpa det här föremålet i en butik eller tillverka det via alkemi.
items.stones.stoneofaugmentation$wndaugment.choice=Att förstärka en egenskap minskar den andra. Vilken egenskap vill du förstärka?
items.stones.stoneofaugmentation$wndaugment.already=Det här föremålet är redan förstärkt. Du kan byta förstärkning eller ta bort den.
items.stones.stoneofaugmentation$wndaugment.speed=+Hastighet -Skada
items.stones.stoneofaugmentation$wndaugment.damage=+Skada -Hastighet
items.stones.stoneofaugmentation$wndaugment.evasion=+Undvikande -Försvar
items.stones.stoneofaugmentation$wndaugment.defense=+Försvar -Undvikande
items.stones.stoneofaugmentation$wndaugment.none=Ta bort förstärkning
items.stones.stoneofaugmentation$wndaugment.cancel=Glöm det

items.stones.stoneofblast.name=sprängsten
items.stones.stoneofblast.desc=Den här runstenen kommer omedelbart att explodera på den plats den kastas till. Precis som en bomb kommer explosionen att skada allt i närheten.

items.stones.stoneofblink.name=blinksten
items.stones.stoneofblink.desc=Den här runstenen teleporterar användaren till den plats den kastas till.

items.stones.stoneofclairvoyance.name=klarsynssten
items.stones.stoneofclairvoyance.desc=Den här stenen avslöjar genast alla rutor i ett mycket brett område runt platsen där den kastas. Effekten når till och med genom väggar.

items.stones.stoneofdeepsleep.name=sten för djup sömn
items.stones.stoneofdeepsleep.desc=När du kastar den här stenen på en fiende försätts den i djup magisk sömn. Magiskt sovande fiender sover för evigt tills de störs.

items.stones.stoneofdetectmagic.name=magiupptäckarsten
items.stones.stoneofdetectmagic.inv_title=Upptäck magi i ett föremål
items.stones.stoneofdetectmagic.detected_none=Du upptäcker ingen magi som påverkar det här föremålet.
items.stones.stoneofdetectmagic.detected_both=Du upptäcker både positiv och illvillig magi som påverkar det här föremålet!
items.stones.stoneofdetectmagic.detected_good=Du upptäcker positiv magi som påverkar det här föremålet!
items.stones.stoneofdetectmagic.detected_bad=Du upptäcker att illvillig magi påverkar det här föremålet!
items.stones.stoneofdetectmagic.desc=Den här runstenen kan upptäcka magi som påverkar ett föremål. Om du använder den på ett oidentifierat föremål får du veta om det påverkas av en illvillig förbannelse och av positiv magi, som förtrollning eller uppgraderingar.

items.stones.stoneofdisarming.name=sten för avväpning
items.stones.stoneofdisarming.desc=Den här runstenen innehåller magi som kan inaktivera illvilliga fällor som finns gömda i fängelsehålan. Den desarmerar upp till 9 fällor runt det område den kastas på.

items.stones.stoneofenchantment.name=förtrollningssten
items.stones.stoneofenchantment.inv_title=Förtrolla ett föremål
items.stones.stoneofenchantment.weapon=Ditt vapen lyser i mörkret!
items.stones.stoneofenchantment.armor=Din rustning lyser i mörkret!
items.stones.stoneofenchantment.desc=Den här runstenen har kraftfull förtrollningsmagi. Till skillnad från en uppgraderingsskriftrulle ökar den inte ett föremåls direkta kraft, utan förser i stället ett vapen eller en rustning med en förtrollning som ger det en ny kraft.

items.stones.stoneoffear.name=skräcksten
items.stones.stoneoffear.desc=När du kastar den här stenen på en karaktär överväldigas den av skräck och flyr. Att attackera en flyende karaktär förkortar effekten.

items.stones.stoneofflock.name=fårsten
items.stones.stoneofflock.desc=Den här runstenen kallar på magiska får under en kort tid runt den plats den kastas till.

items.stones.stoneofintuition.name=intuitionssten
items.stones.stoneofintuition.inv_title=Välj ett föremål
items.stones.stoneofintuition.desc=Den här runstenen innehåller en svagare form av magin i identifieringsskriftrullar. I stället för att identifiera ett föremål direkt påverkar den din intuition, så att du kan försöka gissa typen av dryck, skriftrulle eller ring.
items.stones.stoneofintuition.break_info=Du kan använda stenar av intuition två gånger innan en går sönder, _din nästa användning kommer inte att förbruka en sten_.
items.stones.stoneofintuition.break_warn=Du har använt en sten av intuition tidigare, så _din nästa användning kommer att förbruka en sten_.
items.stones.stoneofintuition$wndguess.text=Gissa vad det oidentifierade föremålet är för typ. Om du gissar rätt kommer typen att identifieras!
items.stones.stoneofintuition$wndguess.correct=Rätt. Föremålets typ har identifierats!
items.stones.stoneofintuition$wndguess.incorrect=Din gissning var felaktig.
items.stones.stoneofintuition$wndguess.break=Din intuitionssten smulas sönder till damm…

items.stones.stoneofshock.name=chocksten
items.stones.stoneofshock.desc=Den här runstenen släpper lös en explosion av elektrisk energi som kortvarigt bedövar alla mål i närheten och ger kastaren stavladdning för varje mål som träffas.


###trinkets
items.trinkets.chaoticcenser.name=kaotisk rökelsebrännare
items.trinkets.chaoticcenser.spew=Din rökelsebrännare kommer snart att spruta: %s.
items.trinkets.chaoticcenser.desc=Efter en tid i alkemigrytan verkar det här rökelsekaret producera rök helt på egen hand! Gaserna byggs upp och väller ut ur karet mot fiender med halvslumpmässiga intervall. Det verkar kunna producera alla slags gaser, men du får en kort varning strax innan karet aktiveras.
items.trinkets.chaoticcenser.typical_stats_desc=Vanligtvis skapar den här prydnadssaken en skadlig gas nära en fiende ungefär var _%d_ tur. Gaser uppstår bara när fiender är närvarande. På högre nivåer är det mer sannolikt att gaserna är exotiska och kraftfulla.
items.trinkets.chaoticcenser.stats_desc=På sin nuvarande nivå skapar den här prydnadssaken en skadlig gas nära en fiende ungefär var _%d_ tur. Gaser uppstår bara när fiender är närvarande. På högre nivåer är det mer sannolikt att gaserna är exotiska och kraftfulla.

items.trinkets.crackedspyglass.name=spräckt kikare
items.trinkets.crackedspyglass.desc=Den här handhållna kikaren vore ett exempel på fantastiskt, precist hantverk om det inte vore för sprickan i frontlinsen. Kikaren verkar hjälpa dig genom att avslöja nya föremål i fängelsehålan, men sprickan gör dem ganska svåra att se!
items.trinkets.crackedspyglass.typical_stats_desc=Vanligtvis har denna prydnadssak en _%1$s%% chans_ att skapa ett extra dolt föremål på varje våning som inte är en bossvåning.
items.trinkets.crackedspyglass.stats_desc=På sin nuvarande nivå har denna prydnadssak en _%1$s%% chans_ att skapa ett extra gömt föremål på varje våning som inte är en bossvåning.
items.trinkets.crackedspyglass.stats_desc_upgraded=På sin nuvarande nivå har denna prydnadssak en _100%% chans_ att skapa ett extra gömt föremål på varje våning som inte är en bossvåning, och en _%1$s%% chans_ att skapa ett andra extra gömt föremål.

items.trinkets.dimensionalsundial.name=dimensionellt solur
items.trinkets.dimensionalsundial.warning=Ditt solur kastar ingen skugga, du känner dig illa till mods.
items.trinkets.dimensionalsundial.desc=Det här lilla handhållna soluret kan på något sätt kasta en skugga i fängelsehålans djup, även om du inte håller det upprätt. Ännu märkligare är att skuggans position inte verkar ha någon relation till solen i den här världen. När ingen skugga kastas verkar soluret locka till sig faror.
items.trinkets.dimensionalsundial.typical_stats_desc=Vanligtvis minskar den här prydnadssaken hur ofta fiender uppstår med _%1$d%%_ dagtid i verkligheten (08.00–20.00) och ökar det med _%2$d%%_ nattetid (20.00–08.00).
items.trinkets.dimensionalsundial.stats_desc=På sin nuvarande nivå minskar den här prydnadssaken hur ofta fiender uppstår med _%1$d%%_ dagtid i verkligheten (08.00–20.00) och ökar det med _%2$d%%_ nattetid (20.00–08.00).

items.trinkets.exoticcrystals.name=exotiska kristaller
items.trinkets.exoticcrystals.desc=De här små rosa kristallerna har samma form som kristaller av alkemisk energi. De kan inte användas direkt som energi, men verkar på något sätt påverka de drycker och skriftrullar du hittar.
items.trinkets.exoticcrystals.typical_stats_desc=Typiskt kommer denna prydnadssak att ersätta _%s%%_ av dryckes- eller skriftrullsdropparna med deras exotiska motsvarigheter. Detta påverkar inte styrkedrycker, uppgraderingsrullar eller föremål som genereras för att hjälpa till att lösa farorum.
items.trinkets.exoticcrystals.stats_desc=På sin nuvarande nivå ersätter den här prydnadssaken _%s%%_ av dryckes- eller skriftrullsbytena med sina exotiska motsvarigheter. Det påverkar inte styrkedrycker, uppgraderingsskriftrullar eller föremål som skapas för att lösa farliga rum.

items.trinkets.eyeofnewt.name=vattensalamanderöga
items.trinkets.eyeofnewt.desc=Det här gyllene och svarta vattensalamanderögat är en vanlig ingrediens som nu har förädlats till en prydnadssak. Ögat verkar minska din syn i utbyte mot att låta dig se saker på andra sätt.
items.trinkets.eyeofnewt.typical_stats_desc=Vanligtvis minskar den här prydnadssaken ditt synfält med _%1$s%%_, men ger dig också tankesyn på fiender inom _%2$d_ rutor.
items.trinkets.eyeofnewt.stats_desc=På sin nuvarande nivå minskar den här prydnadssaken ditt synfält med _%1$s%%_, men ger dig också tankesyn på fiender inom _%2$d_ rutor.

items.trinkets.ferrettuft.name=illertofs
items.trinkets.ferrettuft.desc=En tofs av silkeslen vit illerpäls som hålls ihop av ett limegrönt band knutet till en rosett. Illrar är kända för sin smidighet, busighet och brist på hederlighet. En del av den kraften verkar stråla ut från prydnadssaken och förstärker undvikandeförmågan hos allt i närheten.
items.trinkets.ferrettuft.typical_stats_desc=Typiskt kommer denna prydnadssak att öka undvikandet av alla karaktärer med _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka undvikandet av alla karaktärer med _%1$s%%_.

items.trinkets.mimictooth.name=tandimitation
items.trinkets.mimictooth.desc=Den här stora vassa tanden måste ha dragits ut från en mycket olycklig mimiker. Den verkar påverka mimikerna i fängelsehålan och göra dem mer frekventa och farliga.
items.trinkets.mimictooth.typical_stats_desc=Typiskt sett kommer denna prydnadssak att göra alla typer av mimiker _%1$sx_ vanligare och mycket svårare att upptäcka, men det kommer också att öka mängden byte de släpper. Varje fängelsehålans golv kommer också att ha en _%2$s%%_ chans att innehålla en extra smygande ebenholtsmimik.
items.trinkets.mimictooth.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra alla typer av mimic _%1$sx_ vanligare och mycket svårare att upptäcka, men kommer också att öka mängden byte de släpper. Varje fängelsehålans golv kommer också att ha en _%2$s%%_ chans att innehålla en extra smygande ebenholtsmimik.

items.trinkets.mossyclump.name=mossig klump
items.trinkets.mossyclump.desc=Den här klumpen av våt mossa verkar behålla sin fuktighet oavsett hur hårt du klämmer på den. Den verkar vara magiskt knuten till själva fängelsehålan, vilket gör det mer troligt att gräs och vatten dyker upp.
items.trinkets.mossyclump.typical_stats_desc=Vanligtvis gör den här prydnadssaken att _%d%%_ av otematiska våningar i stället fylls med vatten eller gräs.\n\nDet kostar mer energi än vanligt att uppgradera prydnadssaken.
items.trinkets.mossyclump.stats_desc=På sin nuvarande nivå gör den här prydnadssaken att _%d%%_ av otematiska våningar i stället fylls med vatten eller gräs.\n\nDet kostar mer energi än vanligt att uppgradera prydnadssaken.

items.trinkets.parchmentscrap.name=pergamentbit
items.trinkets.parchmentscrap.desc=Den här lilla pergamentbiten ser ut att komma från en skriftrulle. Den har behållit en del av sin magi och verkar påverka vapen och rustningar i fängelsehålan.
items.trinkets.parchmentscrap.typical_stats_desc=Typiskt sett kommer denna prydnadssak att göra förtrollningar och glyfer _%dx_ lika vanliga, och förbannelser på vapen och rustningar _%sx_ lika vanliga. Förbannelser på trollstavar, ringar eller artefakter påverkas inte.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.trinkets.parchmentscrap.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra förtrollningar och glyfer _%dx_ lika vanliga, och förbannelser på vapen och rustningar _%sx_ lika vanliga. Förbannelser på trollstavar, ringar eller artefakter påverkas inte.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.

items.trinkets.petrifiedseed.name=petrifierat frö
items.trinkets.petrifiedseed.desc=Det här fröet har fossiliserats, antingen genom långsamma geologiska processer eller genom magi. Fröet verkar på ett magiskt sätt påverka floran i fängelsehålan och ersätter ibland växtfrön med runstenar.
items.trinkets.petrifiedseed.typical_stats_desc=Vanligtvis gör den här prydnadssaken att trampat gräs lämnar runstenar i stället för frön _%1$s%%_ av gångerna och att högt gräs lämnar föremål _%2$s%%_ oftare.
items.trinkets.petrifiedseed.stats_desc=På sin nuvarande nivå gör den här prydnadssaken att trampat gräs lämnar runstenar i stället för frön _%1$s%%_ av gångerna och att högt gräs lämnar föremål _%2$s%%_ oftare.

items.trinkets.ratskull.name=råttskalle
items.trinkets.ratskull.desc=Den här makabra prydnadssaken är inte mycket större än skallen från en vanlig råtta, som på något sätt är en sällsynthet nere i den här fängelsehålan. Skallens magiska inflytande verkar locka till sig de mer sällsynta invånarna i fängelsehålan, vilket gör att de dyker upp mycket oftare.
items.trinkets.ratskull.typical_stats_desc=Typiskt kommer denna prydnadssak att göra sällsynta exotiska fiender _%dx_ lika benägna att dyka upp. Skallen är dock bara hälften så effektiv när det gäller att locka till sig kristallmimik och bepansrade statyer.
items.trinkets.ratskull.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra sällsynta exotiska fiender _%dx_ lika troliga att dyka upp. Skallen är dock bara hälften så effektiv när det gäller att locka till sig kristallmimik och bepansrade statyer.

items.trinkets.saltcube.name=saltkub
items.trinkets.saltcube.desc=Den här stora saltkristallen har skurits till en nästan perfekt kub och lyckades på något sätt suga upp hälften av vattnet från alkemigrytan i stället för att lösas upp. Den verkar magiskt torka och konservera maten du äter, vilket förlänger mättnaden men minskar hur mycket hälsa du återfår när du inte svälter.
items.trinkets.saltcube.typical_stats_desc=Typiskt kommer denna prydnadssak att öka tiden innan du blir hungrig med _%1$s%%_, men kommer också att minska din hälsoregenerering med _%2$s%%_ om inte golvet är låst.
items.trinkets.saltcube.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka tiden innan du blir hungrig med _%1$s%%_, men kommer också att minska din hälsoregenerering med _%2$s%%_ om inte golvet är låst.

items.trinkets.shardofoblivion.name=glömskeskärva
items.trinkets.shardofoblivion.desc=Efter att ha puttrat i alkemigrytan har den här lilla skärvan av förbannad metall blivit gjord av … ingenting? Ljuset verkar böjas runt den och den svävar på plats när du inte håller den. Skärvan verkar dra magisk kraft ur din okunskap, så det är nog bäst att inte tänka för mycket på den.
items.trinkets.shardofoblivion.typical_stats_desc=Vanligtvis ökar den här prydnadssaken chansen att fiender lämnar byte med 20 %% för varje oidentifierat utrustningsföremål du bär eller nyligen har använt, upp till _%d föremål_. Skärvan hindrar dig också från att identifiera utrustning, men kan användas för att manuellt identifiera föremål som är redo för det.
items.trinkets.shardofoblivion.stats_desc=På sin nuvarande nivå ökar den här prydnadssaken chansen att fiender lämnar byte med 20 %% för varje oidentifierat utrustningsföremål du bär eller nyligen har använt, upp till _%d föremål_. Skärvan hindrar dig också från att identifiera utrustning, men kan användas för att manuellt identifiera föremål som är redo för det.
items.trinkets.shardofoblivion.ac_identify=IDENTIFIERA
items.trinkets.shardofoblivion.identify_prompt=Identifiera ett föremål
items.trinkets.shardofoblivion.identify_ready=Ett föremål är redo att identifieras: %s. Använd din glömskeskärva på det för att identifiera det.
items.trinkets.shardofoblivion.identify_ready_worn=Alla dina burna föremål är nu redo att identifieras. Använd glömskeskärvan på föremålen för att identifiera dem.
items.trinkets.shardofoblivion.identify_not_yet=Detta föremål är inte redo att identifieras ännu.
items.trinkets.shardofoblivion.identify=Du identifierar föremålet!
items.trinkets.shardofoblivion$wandusetracker.name=Oidentifierad trollstav som använts
items.trinkets.shardofoblivion$wandusetracker.desc=Du har nyligen använt en oidentifierad trollstav, som räknas som en använd oidentifierad utrustning för glömskans skärva under en kort tid.\n\nÅterstående turer: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Oidentifierat kastvapen använt
items.trinkets.shardofoblivion$thrownusetracker.desc=Du har nyligen använt ett oidentifierat kastvapen, vilket räknas som ett stycke oidentifierad utrustning som använts för glömskans skärva under en kort tid.\n\nÅterstående turer: %s.

items.trinkets.thirteenleafclover.name=trettonklöver
items.trinkets.thirteenleafclover.desc=På något sätt har den här klövern fått en massa extra blad av att puttra i alkemigrytan! Det är oklart om prydnadssaken ger tur eller otur. Kanske gör den din tur mer kaotisk?
items.trinkets.thirteenleafclover.typical_stats_desc=Vanligtvis gör den här prydnadssaken att du orsakar maximal skada _%1$d%%_ av gångerna och minimal skada _%2$d%%_ av gångerna.
items.trinkets.thirteenleafclover.stats_desc=På sin nuvarande nivå gör den här prydnadssaken att du orsakar maximal skada _%1$d%%_ av gångerna och minimal skada _%2$d%%_ av gångerna.

items.trinkets.trapmechanism.name=fällmekanism
items.trinkets.trapmechanism.desc=Kärnan i en av fängelsehålans fallgropsfällor, omsorgsfullt uthuggen ur golvet så att den kan bäras. Den verkar vara magiskt knuten till själva fängelsehålan, vilket gör farlig terräng vanligare men också ökar din affinitet mot den.
items.trinkets.trapmechanism.typical_stats_desc=Typiskt för denna prydnadssak är att _%1$d%%_ av otematiserade golv fylls med antingen fällor eller avgrunder istället. Dessutom kommer _%2$d%%_ av fängelsehålans dolda fällor istället att vara synliga.
items.trinkets.trapmechanism.stats_desc=På sin nuvarande nivå gör den här prydnadssaken att _%1$d%%_ av otematiska våningar i stället fylls med fällor eller avgrunder. Dessutom blir _%2$d%%_ av fängelsehålans dolda fällor synliga.

items.trinkets.vialofblood.name=blodflaska
items.trinkets.vialofblood.desc=Den här tunna flaskan innehåller blod från någon av fängelsehålans invånare, och blodet rör sig långsamt när du vänder flaskan. Det verkar magiskt förstärka kraftigare läkande effekter, men fördröjer dem också.
items.trinkets.vialofblood.typical_stats_desc=Typiskt kommer denna prydnadssak att öka den totala hälsan du får från att dricka läkande drycker, vattenskinn eller hälsobrunnar med _%1$s%%_. Men dessa läkande effekter kommer också att ske långsammare och återskapa maximalt _%2$s_ HP per tur (detta skalas med hjältenivå).
items.trinkets.vialofblood.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka den totala hälsan du får från att dricka läkande drycker, vattenskinn eller hälsobrunnar med _%1$s%%_. Dessa läkande effekter kommer dock också att ske långsammare och återskapa maximalt _%2$s_ HP per tur (detta skalas med hjältenivå).

items.trinkets.wondrousresin.name=märkligt harts
items.trinkets.wondrousresin.desc=Det här blåskimrande hartset verkar innehålla den destillerade essensen av magin från en förbannad trollstav. Magin från alkemigrytan verkar ha stabiliserat det något, och det påverkar nu dina trollstavar.
items.trinkets.wondrousresin.typical_stats_desc=Typiskt kommer denna prydnadssak att tvinga förbannade trollstavseffekter att bli neutrala eller positiva _%1$s%%_ av tiden, och kommer att få oförbannade trollstavar att avfyra ytterligare en neutral eller positiv förbannad zap _%2$s%%_ av tiden.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.trinkets.wondrousresin.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att tvinga förbannade trollstavseffekter att bli neutrala eller positiva _%1$s%%_ av tiden, och kommer att få oförbannade trollstavar att avfyra ytterligare en neutral eller positiv förbannad zap _%2$s%%_ av tiden.\n\nDenna prydnadssak kostar en större mängd energi att uppgradera.

items.trinkets.trinketcatalyst.name=magisk katalysator
items.trinkets.trinketcatalyst.window_title=skapa en prydnadssak
items.trinkets.trinketcatalyst.window_text=Vattnet börjar glöda när du tillsätter katalysatorn. Det finns några föremål i närheten som du kan fylla med energi för att göra en magisk prydnadssak av.
items.trinkets.trinketcatalyst.desc=Den här kulan av magiskt gyllene stoft glimmar i fängelsehålans mörker. Den här katalysatorn kan användas i en alkemikruka med lite alkemisk energi för att producera en unik prydnadssak.\n\nPrydnadssaker ger olika effekter som förändrar fängelsehålan eller dess invånare en aning. Prydnadssaker kan uppgraderas med mer energi för att göra deras effekt kraftfullare, eller släppas för att avstå från effekten helt och hållet.
items.trinkets.trinketcatalyst$randomtrinket.name=slumpmässig prydnadssak
items.trinkets.trinketcatalyst$randomtrinket.desc=Ett föremål i närheten sitter fast i en påse som du inte kan få upp.\n\nAlkemiprocessen kommer att lösa upp påsen, men du vet inte vilken prydnadssak du får förrän du gör det!

items.trinkets.trinket.discover_hint=Det här föremålet har en chans att vara ett alternativ när du tillverkar en prydnadssak via alkemi.
items.trinkets.trinket$placeholder.name=prydnadssak

###wands
items.wands.cursedwand.ondeath=Du dödades av din egen %s.
items.wands.cursedwand.nothing=Inget händer.
items.wands.cursedwand.mass_invuln=Briljant ljus bryter ut från din trollstav!
items.wands.cursedwand.petrify=Du fryser plötsligt på plats!
items.wands.cursedwand.grass=Gräs skjuter upp runt dig!
items.wands.cursedwand.fire=Du känner lukten av bränt…
items.wands.cursedwand.transmogrify_wand=Din trollstav förvandlas till ett annat föremål!
items.wands.cursedwand.transmogrify_other=Ditt föremål förvandlas till något annat!
items.wands.cursedwand.disguise=Ditt utseende förändras framför dina ögon!
items.wands.cursedwand.supernova=En blossande boll av energi börjar växa. Du kanske vill springa!
items.wands.cursedwand.supernova_positive=Ett blossande energiklot börjar växa, men det känns tryggt på något sätt.
items.wands.cursedwand.sinkhole=Marken börjar ge vika runt dig!
items.wands.cursedwand.sinkhole_positive=Marken börjar ge vika, men känns tillräckligt solid under dig.
items.wands.cursedwand.gravity=Gravitation börjar plötsligt dra i slumpmässiga riktningar!
items.wands.cursedwand.gravity_positive=Gravitation börjar plötsligt dra i slumpmässiga riktningar, men det verkar inte påverka dig.
items.wands.cursedwand.gravity_end=Gravitationskaoset tar slut.

items.wands.damagewand.upgrade_stat_name_1=Magisk skada

items.wands.wand.ac_zap=AVFYRA
items.wands.wand.fizzles=Din trollstav fräser till. Den har inte tillräckligt med laddning.
items.wands.wand.no_magic=Din trollstav fräser till. Du kan inte använda trollstavar när du är immun mot magi.
items.wands.wand.self_target=Du kan inte sikta på dig själv!
items.wands.wand.identify=Du är nu tillräckligt bekant med din trollstav för att kunna identifiera den.
items.wands.wand.resin_one=Den här trollstaven har fått _1 nivå_ från arkanskt harts.
items.wands.wand.resin_many=Den här trollstaven har fått _%d nivåer_ från arkanskt harts.
items.wands.wand.cursed=Den här trollstaven är förbannad, vilket gör dess magi kaotisk och slumpmässig.
items.wands.wand.not_cursed=Den här trollstaven är fri från illvillig magi.
items.wands.wand.curse_discover=Den här %s är förbannad!
items.wands.wand.prompt=Välj en plats att avfyra mot
items.wands.wand$placeholder.name=trollstav

items.wands.wandofblastwave.name=tryckvågstav
items.wands.wandofblastwave.staff_name=tryckvågsstav
items.wands.wandofblastwave.ondeath=Du dödade dig själv med din egen tryckvågstav…
items.wands.wandofblastwave.knockback_ondeath=Kollisionen dödade dig…
items.wands.wandofblastwave.desc=Den här trollstaven är gjord av en slags marmorerad sten, med guldkant och en rund svart ädelsten i spetsen. Den känns väldigt tung i handen.
items.wands.wandofblastwave.typical_stats_desc=Den här trollstaven skjuter en projektil som detonerar våldsamt på en utvald plats. Kraften i explosionen orsakar vanligtvis _%1$d-%2$d skada_ och är tillräckligt stark för att kasta omkull de flesta fiender.
items.wands.wandofblastwave.stats_desc=Den här trollstaven skjuter en projektil som detonerar våldsamt på en utvald plats. Kraften i explosionen orsakar _%1$d-%2$d skada_ och är tillräckligt stark för att kasta omkull de flesta fiender.
items.wands.wandofblastwave.upgrade_stat_name_2=Bortknuffning
items.wands.wandofblastwave.bmage_desc=När _Stridsmagikern_ träffar en förlamad fiende med en tryckvågsstav förbrukas förlamningen och orsakar en explosion av bonusmagisk skada. Detta har en kort nedkylningstid för varje fiende.
items.wands.wandofblastwave.eleblast_desc=En elementalexplosion med en tryckvågsstav orsakar 67 % skada och knuffar alla fiender ut ur explosionsområdet.

items.wands.wandofcorrosion.name=korrosionstav
items.wands.wandofcorrosion.staff_name=korrosionstav
items.wands.wandofcorrosion.desc=Den här trollstaven har en askgrå kropp som avslutas med en lysande orange ädelsten.
items.wands.wandofcorrosion.stats_desc=Den här trollstaven skjuter en projektil som exploderar i ett moln av starkt frätande gas på en utvald plats. Allt som fångas i molnet tar allt större skada över tid, med början på _%d skada._
items.wands.wandofcorrosion.upgrade_stat_name_1=Korrosionsskada
items.wands.wandofcorrosion.upgrade_stat_name_2=Gasvolym
items.wands.wandofcorrosion.bmage_desc=När _Stridsmagikern_ träffar en fiende med en korrosionstav kan fienden bli översköljd av slem.
items.wands.wandofcorrosion.eleblast_desc=En elementalexplosion med en korrosionstav ger fiender 4 turer av korrosion, med början på 6 skada.

items.wands.wandofcorruption.name=korruptionsstav
items.wands.wandofcorruption.staff_name=korruptionsstav
items.wands.wandofcorruption.already_corrupted=Den karaktären kan inte påverkas ytterligare.
items.wands.wandofcorruption.desc=Den här trollstaven utstrålar kaotisk mörk energi, vilket knappast är förvånande med tanke på den lilla dekorativa dödskallen i spetsen.
items.wands.wandofcorruption.stats_desc=Den här trollstaven avger en stråle av fördärvande energi som försvagar fiender och till slut böjer dem till din vilja. Fiender kan stå emot korruptionen, men försvagade fiender är mycket lättare att korrumpera än friska.
items.wands.wandofcorruption.upgrade_stat_name_1=Korrumperande kraft
items.wands.wandofcorruption.upgrade_stat_name_2=Varaktighet för försvagning
items.wands.wandofcorruption.bmage_desc=När _Stridsmagikern_ träffar en fiende med en korruptionsstav kan fienden gå amok.
items.wands.wandofcorruption.eleblast_desc=En elementalexplosion med en korruptionsstav får fiender att gå amok i 5 turer.

items.wands.wandofdisintegration.name=sönderdelningsstav
items.wands.wandofdisintegration.staff_name=sönderdelningsstav
items.wands.wandofdisintegration.desc=Den här trollstaven är gjord av ett solitt, slätt stycke obsidian. Ett djuplila ljus löper längs sidan och slutar vid spetsen. Den glöder av destruktiv energi och väntar på att skjuta framåt.
items.wands.wandofdisintegration.stats_desc=Den här trollstaven skjuter en stråle som tränger igenom alla hinder och når längre ju mer den uppgraderas. Strålen orsakar _%1$d-%2$d skada_ och får dessutom bonusskada för varje fiende och vägg den tränger igenom.
items.wands.wandofdisintegration.upgrade_stat_name_2=Max räckvidd
items.wands.wandofdisintegration.bmage_desc=När den används av _Stridsmagikern_ har en stav av sönderdelning ökad attackräckvidd, som om den hade en projicerande förtrollning.
items.wands.wandofdisintegration.eleblast_desc=En elementalexplosion med en sönderdelningsstav orsakar 100 % skada och tränger igenom väggar.

items.wands.wandoffireblast.name=eldsprängstav
items.wands.wandoffireblast.staff_name=eldsprängstav
items.wands.wandoffireblast.desc=Den här trollstaven är gjord av rödlackerat trä med gyllene blad som används flitigt för att få den att se ganska kunglig ut. Det sprakar och väser i spetsen, ivrig att släppa lös sin kraftfulla magi.
items.wands.wandoffireblast.stats_desc=Den här trollstaven sprutar ut en kon av eld när den används. Dess nästa attack kommer att förbruka _%1$d laddningar_ och ge _%2$d-%3$d skada._ Ju fler laddningar trollstaven förbrukar, desto större och starkare blir effekten.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Laddningsskada
items.wands.wandoffireblast.upgrade_stat_name_2=2 Laddningsskada
items.wands.wandoffireblast.upgrade_stat_name_3=3 Laddningsskada
items.wands.wandoffireblast.bmage_desc=När _Stridsmagikern_ träffar en fiende med en eldsprängstav kan en explosion uppstå som skadar fiender och förbrukar all eld i närheten! Chansen ökar ju mer eld som finns nära fienden.
items.wands.wandoffireblast.eleblast_desc=En elementalexplosion med en eldsprängstav orsakar 100 % skada, spränger upp dörrar och sätter eld på fiender och terräng.

items.wands.wandoffrost.name=froststav
items.wands.wandoffrost.staff_name=froststav
items.wands.wandoffrost.desc=Den här trollstaven verkar vara gjord av någon sorts magisk is. Den blir ljusare mot sin rundade spets. Den känns mycket kall när du håller i den, men på något sätt förblir handen varm.
items.wands.wandoffrost.stats_desc=Den här trollstaven skjuter isiga energistrålar mot dina fiender, orsakar _%1$d-%2$d skada_ och kyler dem. Effekten verkar starkare i vatten. Fiender som redan är nedkylda eller frysta tar mindre skada av den här trollstaven.
items.wands.wandoffrost.upgrade_stat_name_2=Nedkylningstid
items.wands.wandoffrost.bmage_desc=När _Stridsmagikern_ träffar en nedkyld fiende med en froststav kan den genast frysa. Chansen ökar ju mer nedkyld fienden är.
items.wands.wandoffrost.eleblast_desc=En elementalexplosion med en froststav orsakar 100 % skada, fryser fiender och släcker bränder.

items.wands.wandoflightning.name=blixtstav
items.wands.wandoflightning.staff_name=blixtstav
items.wands.wandoflightning.ondeath=Du dödade dig själv med din egen blixtstav…
items.wands.wandoflightning.desc=Den här trollstaven är tillverkad av solid metall, vilket gör den förvånansvärt tung. Två tänder böjs ihop i spetsen och elektricitet bildas mellan dem.
items.wands.wandoflightning.stats_desc=Den här trollstaven skickar kraftfulla blixtar genom det som den skjuts mot och ger _%1$d-%2$d skada._ Elektriciteten går i bågar till karaktärer i närheten och sprider sig lättare i vatten. Bågarna från denna trollstav kan skada dig, men skadar inte dina allierade.
items.wands.wandoflightning.bmage_desc=När Stridsmagikern slår en fiende med en blixtstav har han en chans att ladda sig själv med elektricitet i 10 turer. Medan han är laddad är Stridsmagikern immun mot blixtskador och kan slunga blixtar längre.
items.wands.wandoflightning.eleblast_desc=En elementalexplosion med en blixtstav orsakar 100 % skada, bedövar fiender i 5 turer och elektrifierar vatten.
items.wands.wandoflightning$lightningcharge.name=Elektriskt laddad
items.wands.wandoflightning$lightningcharge.desc=Stridsmagikern är för närvarande laddad med energi, vilket ger honom immunitet mot sin blixtstav och ökar räckvidden för blixtarna som slår ner från den.\n\nÅterstående turer: %s.

items.wands.wandoflivingearth.name=levande jordstav
items.wands.wandoflivingearth.staff_name=levande jordstav
items.wands.wandoflivingearth.desc=Den här trollstaven är gjord av en märklig sten med band av glödande gul energi. Stenen verkar röra sig en aning när du greppar trollstaven, som om den kan känna din hand.
items.wands.wandoflivingearth.stats_desc=Den här trollstaven avfyrar magiska stenprojektiler mot fiender och orsakar _%1$d-%2$d skada._ Stenarna formas sedan om runt användaren och ger rustning i proportion till skadan. Om tillräckligt mycket rustning byggs upp skapas en stenväktare nästa gång trollstaven avfyras.
items.wands.wandoflivingearth.upgrade_stat_name_2=Väktarens maxhälsa
items.wands.wandoflivingearth.upgrade_stat_name_3=Väktarens blockering
items.wands.wandoflivingearth.bmage_desc=När _Stridsmagikern_ träffar en fiende med en levande jordstav omvandlas en del av skadan till stenrustning.
items.wands.wandoflivingearth.eleblast_desc=En elementalexplosion med en levande jordstav orsakar 50 % skada och läker en aktiv jordväktare för varje träffad fiende.
items.wands.wandoflivingearth$rockarmor.name=stenrustning
items.wands.wandoflivingearth$rockarmor.desc=Magiska stenar omger din kropp. När du attackeras försöker de blockera åt dig och minskar skadan du tar med 50 %%. Varje blockerad skada nöter dock bort en del av stenen.\n\nÅterstående rustning: %1$d.\n\nOm tillräckligt med sten byggs upp runt dig får nästa avfyrning från din levande jordstav stenarna att bilda en väktare som strider vid din sida.\n\nRustning som behövs för väktaren: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Den här jordväktaren drar också nytta av Mångas kraft. Återstående turer: %d.
items.wands.wandoflivingearth$earthguardian.name=jordväktare
items.wands.wandoflivingearth$earthguardian.desc=Stenarna från din trollstav av levande jord har formats till en skyddande jordväktare! Detta steniga skydd kommer att attackera fiender i närheten, vilket tvingar dem att attackera skyddet istället för dig. När alla hot i närheten är borta återbildas skyddet runt dig och kommer tillbaka när du använder din trollstav nästa gång.
items.wands.wandoflivingearth$earthguardian.wand_info=Väktarens defensiva kraft är knuten till nivån på din trollstav. Den blockerar för närvarande _%1$d-%2$d skada._
items.wands.wandoflivingearth$earthguardian.discover_hint=Du kan hitta den här karaktären med en specifik trollstav.

items.wands.wandofmagicmissile.name=magisk missilstav
items.wands.wandofmagicmissile.staff_name=magisk missilstav
items.wands.wandofmagicmissile.desc=Den här ganska enkla trollstaven skjuter missiler av ren magisk energi. Trollstaven saknar egna specialeffekter, men har fler tillgängliga laddningar och kan kortvarigt förstärka andra trollstavar när den uppgraderas.
items.wands.wandofmagicmissile.stats_desc=Varje projektil från den här trollstaven orsakar _%1$d-%2$d skada_ och förstärker kortvarigt andra trollstavar om den uppgraderas.
items.wands.wandofmagicmissile.bmage_desc=När _Stridsmagikern_ träffar en fiende med en magisk missilstav får alla hans trollstavar laddning, utöver staven.
items.wands.wandofmagicmissile.eleblast_desc=En elementalexplosion med en magisk missilstav orsakar 50 % skada och ger Magikern 15 turer av uppladdning.
items.wands.wandofmagicmissile.discover_hint=En av hjältarna börjar med det här föremålet.
items.wands.wandofmagicmissile$magiccharge.name=magisk laddning
items.wands.wandofmagicmissile$magiccharge.desc=Din magiska missilstav har matat tillbaka kraft till dina trollstavar och ökat den effektiva nivån för nästa avfyrning.\n\nDina trollstavar är förstärkta till: +%d.\n\nÅterstående turer med magisk laddning: %s.

items.wands.wandofprismaticlight.name=prismatisk ljusstav
items.wands.wandofprismaticlight.staff_name=prismatisk ljusstav
items.wands.wandofprismaticlight.desc=Den här trollstaven är gjord av ett solitt stycke genomskinlig kristall, som ett långt stycke slätt glas. Små färgglada ljus dansar runt spetsen, ivriga att bryta fram.
items.wands.wandofprismaticlight.stats_desc=Den här trollstaven skjuter ut ljusstrålar som skär genom mörkret i fängelsehålan och avslöjar dolda områden och fällor. Strålen kan göra fiender blinda och ger _%1$d-%2$d skada._ Demoniska och odöda fiender brinner i det starka ljuset från trollstaven och får bonusskada.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Sannolikhet för blindhet
items.wands.wandofprismaticlight.upgrade_stat_name_3=Ljusets varaktighet
items.wands.wandofprismaticlight.bmage_desc=När _Stridsmagikern_ träffar en fiende med en prismatisk ljusstav blir fienden förlamad under en tid som beror på stavens nivå.
items.wands.wandofprismaticlight.eleblast_desc=En elementalexplosion med en prismatisk ljusstav orsakar 67 % skada, avslöjar all terräng i explosionsområdet och förblindar fiender i 5 turer.

items.wands.wandofregrowth.name=återväxtstav
items.wands.wandofregrowth.staff_name=återväxtstav
items.wands.wandofregrowth.desc=Den här trollstaven är gjord av ett tunt skaft av skickligt utskuret trä. På något sätt är det fortfarande levande och vibrerande, ljusgrönt som kärnan i ett ungt träd. "När livet upphör börjar alltid nytt liv växa... Den eviga cykeln består alltid!"
items.wands.wandofregrowth.stats_desc=När du använder den här trollstaven sprider den magisk återväxtenergi i en kon, så att gräs, rötter och sällsynta växter får liv. Nästa avfyrning förbrukar _%1$d laddningar_. Ju fler laddningar trollstaven förbrukar, desto större och starkare blir effekten.
items.wands.wandofregrowth.degradation=Efter ytterligare _%d laddningar_ börjar den här trollstaven misslyckas med att skapa växter och färskt gräs. Gränsen höjs när du går upp i nivå eller uppgraderar trollstaven.
items.wands.wandofregrowth.upgrade_stat_name_1=Gräs per laddning
items.wands.wandofregrowth.upgrade_stat_name_2=Total gräsgräns
items.wands.wandofregrowth.bmage_desc=När _Stridsmagikern_ träffar en fiende med en återväxtstav medan båda står på gräs får han örtläkning i proportion till skadan.
items.wands.wandofregrowth.eleblast_desc=En elementalexplosion med en återväxtstav rotar fiender och får gräs att växa slumpmässigt i explosionsområdet.
items.wands.wandofregrowth$dewcatcher.name=daggfångare
items.wands.wandofregrowth$dewcatcher.desc=Daggfångare är förunderliga växter som fyller sig med magisk dagg. De försöker kamouflera sig som gräs för att undgå uppmärksamhet, men utbuktningarna av insamlad dagg avslöjar dem.
items.wands.wandofregrowth$dewcatcher.discover_hint=Du kan hitta den här växten med en specifik trollstav.
items.wands.wandofregrowth$seedpod.name=frökapsel
items.wands.wandofregrowth$seedpod.desc=Frökapslar är magiska växter som producerar frön från andra växtsorter i stället för egna frön. De lyckas ändå sprida sig trots att de saknar egna frön.
items.wands.wandofregrowth$seedpod.discover_hint=Du kan hitta den här växten med en specifik trollstav.
items.wands.wandofregrowth$lotus.name=Gyllene lotus
items.wands.wandofregrowth$lotus.desc=Den gyllene lotusen är en mystisk växt som bara kan frammanas med en kraftfull återväxtstav. Dess aura förstärker alla växter och växteffekter, men den bränner upp sin energi och dör efter en kort tid.
items.wands.wandofregrowth$lotus.wand_info=Den här lotusen skapades av en _+%1$d_ återväxtstav. Alla växter inom dess effektområde _aktiveras genast_ om de planteras på en karaktär. Växter har också _%2$d%% chans_ att lämna sitt frö och spetsade pilar använder _%3$d%% mindre hållbarhet_.
items.wands.wandofregrowth$lotus.discover_hint=Du kan hitta den här växten med en specifik trollstav, efter att ha uppgraderat den flera gånger.

items.wands.wandoftransfusion.name=transfusionsstav
items.wands.wandoftransfusion.staff_name=transfusionsstav
items.wands.wandoftransfusion.ondeath=Du dödade dig själv med din egen transfusionsstav…
items.wands.wandoftransfusion.charged=Din stav är laddad med din fiendes livsenergi!
items.wands.wandoftransfusion.desc=En ganska enkelt formad trollstav som utmärker sig genom sin magentafärgade ton och kolsvarta ädelsten i spetsen.
items.wands.wandoftransfusion.stats_desc=När den används på allierade eller charmade fiender dränerar den här trollstaven _%1$d av användarens hälsa_ för att läka eller ge den allierade _%2$d hälsa som sköld._ När den används på fiender charmar trollstaven dem kortvarigt och ger användaren _%3$d sköld._ Fientliga odöda tar i stället _%4$d-%5$d skada_.
items.wands.wandoftransfusion.upgrade_stat_name_1=Läkning av allierad
items.wands.wandoftransfusion.upgrade_stat_name_2=Självsköld
items.wands.wandoftransfusion.upgrade_stat_name_3=Skada på odöda
items.wands.wandoftransfusion.bmage_desc=När _Stridsmagikern_ träffar en charmad fiende med en transfusionsstav får han sköld och nästa avfyrning med staven kostar ingen hälsa.
items.wands.wandoftransfusion.eleblast_desc=En elementalexplosion med en transfusionsstav charmar fiender, läker allierade och orsakar 100 % skada på odöda fiender.

items.wands.wandofwarding.name=väktarstav
items.wands.wandofwarding.staff_name=väktarstav
items.wands.wandofwarding.no_more_wards=Din trollstav kan inte upprätthålla fler väktare.
items.wands.wandofwarding.bad_location=Du kan inte placera en väktare där.
items.wands.wandofwarding.desc=Den här korta metallstaven har en ljuslila ädelsten svävande ovanför spetsen.
items.wands.wandofwarding.stats_desc=I stället för att direkt skada en fiende frammanar den här trollstaven stationära väktare och vaktposter. Väktare kan frammanas var som helst, till och med genom väggar om du har sikt. Trollstaven kan upprätthålla väktare till ett värde av _%d energi_ åt gången.
items.wands.wandofwarding.upgrade_stat_name_1=Väktarskada
items.wands.wandofwarding.upgrade_stat_name_2=Väktarenergi
items.wands.wandofwarding.bmage_desc=När _Stridsmagikern_ träffar en fiende med en väktarstav kan alla aktiva väktare och vaktposter läkas.
items.wands.wandofwarding.eleblast_desc=En elementalexplosion med en väktarstav läker alla väktare och vaktposter i explosionsområdet.
items.wands.wandofwarding$ward.desc_generic_ward=Den här väktaren avfyrar automatiskt mot alla fiender som kommer inom synhåll.\n\nOm du avfyrar din väktarstav mot väktaren uppgraderas den.\n\nVäktare kan bara avfyra ett begränsat antal gånger innan de försvinner.
items.wands.wandofwarding$ward.desc_generic_sentry=Den här vaktposten har samma eldkraft som en väktare, men har hälsa i stället för ett bestämt antal laddningar. Den liknar ädelstenen på spetsen av din väktarstav.\n\nOm du avfyrar din väktarstav mot vaktposten uppgraderas och läks den.\n\nVaktposten förbrukar lite hälsa varje gång den avfyrar mot en fiende, men kan läkas genom att du använder väktarstaven på den.
items.wands.wandofwarding$ward.name_1=mindre väktare
items.wands.wandofwarding$ward.desc_1=Den här grundläggande warden zappar automatiskt alla fiender som kommer inom dess synfält och ger _%1$d-%2$d skada._\n\nZappa den här warden med din trollstav of warding för att uppgradera den.\n\nDen här warden zappar bara en gång innan den försvinner.\n\nDin trollstav of warding använder _%3$d energi_ för att upprätthålla den här warden.
items.wands.wandofwarding$ward.name_2=väktare
items.wands.wandofwarding$ward.desc_2=Den här uppgraderade warden har ett mer invecklat mönster och kan attackera flera gånger. Varje zapp från den här avdelningen ger _%1$d-%2$d skada._\n\nZappa den här avdelningen med din trollstav för förvaring för att uppgradera den.\n\nDen här avdelningen zappar tre gånger innan den försvinner.\n\nDin trollstav för förvaring använder _%3$d energi_ för att upprätthålla den här avdelningen.
items.wands.wandofwarding$ward.name_3=större väktare
items.wands.wandofwarding$ward.desc_3=Den här fullt uppgraderade avdelningen kan attackera fler gånger än sina föregångare. Varje zapp från den här avdelningen ger _%1$d-%2$d skada._\n\nZappa den här avdelningen med din trollstav för förvaring för att uppgradera den.\n\nDen här avdelningen zappar fem gånger innan den försvinner.\n\nDin trollstav för förvaring använder _%3$d energi_ för att upprätthålla den här avdelningen.
items.wands.wandofwarding$ward.name_4=mindre vaktpost
items.wands.wandofwarding$ward.desc_4=Den här mindre vaktposten har samma eldkraft som en större vaktpost, men har hälsa istället för ett visst antal laddningar. Det liknar ädelstenen på spetsen av din wardingstav. Varje zapp från det här vaktpostamentet ger _%1$d-%2$d skada._\n\nZappar du det här vaktpostamentet med din trollstav uppgraderas och läks det.\n\nDet här vaktpostamentet förbrukar lite hälsa varje gång det zappar en fiende, men kan läkas genom att du använder din trollstav på det.\n\nDin trollstav använder _%3$d energi_ för att upprätthålla det här vaktpostamentet.
items.wands.wandofwarding$ward.name_5=vaktpost
items.wands.wandofwarding$ward.desc_5=Detta uppgraderade vaktpostament är större och mer hållbart än ett mindre vaktpostament. Varje zapp från det här vaktpostamentet ger _%1$d-%2$d skada._\n\nZappa det här vaktpostamentet med din trollstav för förvaring uppgraderar och läker det.\n\nDet här vaktpostamentet gör av med lite hälsa varje gång det zappar en fiende, men kan läkas genom att använda din trollstav för förvaring på det.\n\nDin trollstav för förvaring använder _%3$d energi_ för att upprätthålla det här vaktpostamentet.
items.wands.wandofwarding$ward.name_6=större vaktpost
items.wands.wandofwarding$ward.desc_6=Den här fullt uppgraderade vaktposten är betydligt mer hållbar än sina föregångare. Varje zapp från denna vaktpost ger _%1$d-%2$d skada._\n\nZappa denna vaktpost med din trollstav för förvaring för att läka den.\n\nDenna vaktpost kommer att spendera lite hälsa varje gång den zappar en fiende, men kan läkas genom att använda din trollstav för förvaring på den.\n\nDin trollstav för förvaring använder _%3$d energi_ för att upprätthålla denna vaktpost.
items.wands.wandofwarding$ward.discover_hint=Du kan hitta den här karaktären med en specifik trollstav.
items.wands.wandofwarding$ward.dismiss_title=Avfärda den här väktaren?
items.wands.wandofwarding$ward.dismiss_body=Du kan skingra den här väktaren om du inte längre vill att din trollstav ska upprätthålla den. Då förstörs väktaren genast.\n\nAvfärda den här väktaren?
items.wands.wandofwarding$ward.dismiss_confirm=ja
items.wands.wandofwarding$ward.dismiss_cancel=nej

###weapon curses
items.weapon.curses.annoying.name=irriterande %s
items.weapon.curses.annoying.msg_1=ÅH, KÄMPAR VI MOT NÅGOT!?
items.weapon.curses.annoying.msg_2=JA, TA DEM!
items.weapon.curses.annoying.msg_3=HEJ, LYSSNA!
items.weapon.curses.annoying.msg_4=Är vi framme vid bossen än?
items.weapon.curses.annoying.msg_5=Öh, svinga mig inte så hårt!
items.weapon.curses.annoying.msg_6=Dö, insekt!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=Kan vi ta en paus!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.msg_10=VÄL TRÄFFAT!
items.weapon.curses.annoying.msg_11=Jag ville inte bli ett vapen, jag ville bli en skogshuggares yxa.
items.weapon.curses.annoying.msg_12=Kom ihåg att övermod är en långsam och försåtlig mördare.
items.weapon.curses.annoying.msg_13=ALLA DINA BASER TILLHÖR OSS!
items.weapon.curses.annoying.desc=Irriterande vapen kan tala, men de är lite för energiska. De drar ofta uppmärksamhet till dig utan att mena det.
items.weapon.curses.annoying.elestrike_desc=Ett elementarslag med en irriterande förbannelse har 20 % chans att få varje fiende inom räckhåll att gå amok i 6 turer.

items.weapon.curses.dazzling.name=bländande %s
items.weapon.curses.dazzling.desc=Bländande vapen blinkar ibland med bländande ljus och förblindar allt som kan se dem.
items.weapon.curses.dazzling.elestrike_desc=Ett elementarslag med en bländande förbannelse har 50 % chans att förblinda varje fiende inom räckhåll i 6 turer.

items.weapon.curses.displacing.name=förskjutande %s
items.weapon.curses.displacing.desc=Förskjutande vapen är fyllda med kaotisk teleporteringsmagi och kan slumpmässigt förflytta fiender runt på våningen.
items.weapon.curses.displacing.elestrike_desc=Ett elementarslag med en förskjutande förbannelse har 50 % chans att teleportera varje fiende inom räckhåll.

items.weapon.curses.explosive.name=explosiv %s
items.weapon.curses.explosive.warm=Varm…
items.weapon.curses.explosive.hot=Het!
items.weapon.curses.explosive.desc=Explosiva vapen bygger stadigt upp kraft och exploderar, vilket skadar allt i närheten.
items.weapon.curses.explosive.desc_cool=Ditt vapen är för närvarande svalt vid beröring.
items.weapon.curses.explosive.desc_warm=Ditt vapen bygger upp energi och blir varmt…
items.weapon.curses.explosive.desc_hot=Ditt vapen är hett! Det är på väg att explodera!
items.weapon.curses.explosive.elestrike_desc=Ett elementarslag med en explosiv förbannelse har 50 % chans att skapa en explosion på en slumpmässig fiende inom räckhåll.

items.weapon.curses.friendly.name=vänlig %s
items.weapon.curses.friendly.desc=Vänliga vapen passar bäst för pacifister och utlöser ibland magi som gör det omöjligt att slåss.
items.weapon.curses.friendly.elestrike_desc=Ett elementarslag med en vänlig förbannelse har 50 % chans att charma varje fiende inom räckhåll i 6 turer.

items.weapon.curses.polarized.name=polariserad %s
items.weapon.curses.polarized.desc=Ett polariserat vapen påverkas av magi som gör att dess attacker antingen orsakar 50 % mer skada eller ingen skada alls.
items.weapon.curses.polarized.elestrike_desc=Ett elementarslag med en polariserad förbannelse har 50 % chans att orsaka 24–36 skada på varje fiende inom räckhåll.

items.weapon.curses.pressurized.name=trycksatt %s
items.weapon.curses.pressurized.desc=Trycksatta vapen kan få en kraftig vattengejser att bryta ut som knuffar bort allt, även dig.
items.weapon.curses.pressurized.elestrike_desc=En elementär attack med en trycksatt förbannelse skapar en vattenvåg som förstör terräng och knuffar tillbaka varje fiende inom räckvidd.

items.weapon.curses.sacrificial.name=offer%s
items.weapon.curses.sacrificial.desc=Offervapen kräver blod från bäraren i utbyte mot att attackera fiender. Ju friskare bäraren är, desto mer blod tar förbannelsen.
items.weapon.curses.sacrificial.elestrike_desc=Ett elementarslag med en offerförbannelse får hjälten och varje fiende inom räckhåll att blöda i 12 HP.

items.weapon.curses.wayward.name=nyckfull %s
items.weapon.curses.wayward.desc=Nyckfulla vapen blir ibland extremt oprecisa. Magin varar en kort stund när den aktiveras, men kan skingras genom att du träffar med det nyckfulla vapnet.
items.weapon.curses.wayward.elestrike_desc=Ett elementarslag med en nyckfull förbannelse har 50 % chans att förhäxa varje fiende inom räckhåll i 6 turer.
items.weapon.curses.wayward$waywardbuff.name=nyckfull
items.weapon.curses.wayward$waywardbuff.desc=Magin i ditt nyckfulla vapen har aktiverats och gör det extremt oprecist en kort stund. Det påverkar inte attacker som garanterat träffar, exempelvis överraskningsattacker. Om du träffar med det nyckfulla vapnet försvinner effekten genast.\n\nÅterstående turer: %s.

items.weapon.curses.wondrous.name=förunderlig %s
items.weapon.curses.wondrous.desc=Förunderliga vapen innehåller samma kaotiska magi som finns i förbannade stavar. Det går inte att säga vad som händer när förbannelsen utlöses!
items.weapon.curses.wondrous.elestrike_desc=En elementär attack med en förunderlig förbannelse kan ge varje fiende inom räckvidd en annan förbannad stav-effekt.

###enchantments
items.weapon.enchantments.blazing.name=brinnande %s
items.weapon.enchantments.blazing.desc=Den här förtrollningen får lågor att spruta ut från ett vapen, antända fiender och ge bonusskada på fiender som redan står i lågor.
items.weapon.enchantments.blazing.elestrike_desc=Ett elementarslag med en brinnande förtrollning sprider eld till alla rutor inom räckhåll i 8 turer.

items.weapon.enchantments.blocking.name=skyddande %s
items.weapon.enchantments.blocking.desc=Skyddande vapen kan ge dig sköld en kort stund efter att du angripit med dem.
items.weapon.enchantments.blocking.elestrike_desc=Ett elementarslag med en skyddande förtrollning ger Duellanten ytterligare 6 sköld för varje fiende inom räckhåll.
items.weapon.enchantments.blocking$blockbuff.name=skydd
items.weapon.enchantments.blocking$blockbuff.desc=Ditt vapens skyddande förtrollning har tillfälligt förstärkt ditt försvar!\n\nÅterstående sköld: %d\n\nÅterstående turer: %s.

items.weapon.enchantments.blooming.name=blomstrande %s
items.weapon.enchantments.blooming.desc=Blomstrande vapen innehåller magi som får vegetation att gro på eller runt dem som träffas av vapnen.
items.weapon.enchantments.blooming.elestrike_desc=Ett elementarslag med en blomstrande förtrollning sprider gräs till upp till 8 rutor inom räckhåll och rotar alla fiender inom räckhåll i 6 turer.

items.weapon.enchantments.chilling.name=kylande %s
items.weapon.enchantments.chilling.desc=Fiender som träffas av denna förtrollning blir nedkylda, vilket saktar ner deras rörelser och attacker.
items.weapon.enchantments.chilling.elestrike_desc=Ett elementarslag med en kylande förtrollning sprider kylande luft till varje ruta inom räckhåll i 8 turer.

items.weapon.enchantments.crystal.name=kristall%s
items.weapon.enchantments.crystal.alert_fixed=Ditt kristallvapen är helt reparerat!
items.weapon.enchantments.crystal.alert_fixed_ghost=Spökets kristallvapen är helt reparerat!
items.weapon.enchantments.crystal.alert_noflaw=Ditt kristallvapen är inte längre felaktigt.
items.weapon.enchantments.crystal.alert_noflaw_ghost=Spökets kristallvapen är inte längre felaktigt.
items.weapon.enchantments.crystal.alert_nocrack=Ditt kristallvapen är inte längre sprucket.
items.weapon.enchantments.crystal.alert_nocrack_ghost=Spökets kristallvapen är inte längre sprucket.
items.weapon.enchantments.crystal.alert_flawed=Ditt kristallvapen har skadats lite.
items.weapon.enchantments.crystal.alert_flawed_ghost=Spökets kristallvapen har skadats lite.
items.weapon.enchantments.crystal.alert_cracked=Ditt kristallvapen spricker, det är på väg att gå sönder!
items.weapon.enchantments.crystal.alert_cracked_ghost=Spökets kristallvapen spricker, det är på väg att gå sönder!
items.weapon.enchantments.crystal.alert_shattered=Ditt kristallvapen splittras i bitar!
items.weapon.enchantments.crystal.alert_shattered_ghost=Spökets kristallvapen splittras i bitar!
items.weapon.enchantments.crystal.desc=Den här kraftfulla förtrollningen ger extra magisk skada och ökar ett vapens värde. Det förtrollade vapnet kan dock splittras om kristallerna inte repareras eller får tid att reparera sig själva.
items.weapon.enchantments.crystal.desc_thrown=Kristallkastvapen har mycket mindre hållbarhet, men återfår den långsamt med tiden.
items.weapon.enchantments.crystal.desc_perfect=Det här kristallvapnet är i perfekt skick just nu.
items.weapon.enchantments.crystal.desc_fine=Det här kristallvapnet är i gott skick just nu.
items.weapon.enchantments.crystal.desc_flawed=Det här kristallvapnet har ett fel, men är inte på väg att gå sönder.
items.weapon.enchantments.crystal.desc_cracked=Det här kristallvapnet spricker och riskerar att gå sönder permanent!
items.weapon.enchantments.crystal.elestrike_desc=En elementär attack med en kristallförtrollning ger 10–20 skada och reparerar vapnet för varje fiende inom räckvidd, utom huvudmålet.

items.weapon.enchantments.kinetic.name=kinetisk %s
items.weapon.enchantments.kinetic.desc=När en fiende dödas med ett kinetiskt vapen lagras överskottskraften i vapnet och används vid nästa lyckade attack.
items.weapon.enchantments.kinetic.elestrike_desc=Ett elementarslag med en kinetisk förtrollning ger varje fiende inom räckhåll, utom huvudmålet, 40 % av den lagrade skadan.
items.weapon.enchantments.kinetic$conserveddamage.name=bevarad skada
items.weapon.enchantments.kinetic$conserveddamage.desc=Ditt vapen har lagrat överskottskraften från ett tidigare dödande slag och ger den som bonusskada i din nästa attack. Energin avtar dock långsamt med tiden.\n\nBevarad skada: %d.

items.weapon.enchantments.corrupting.name=fördärvande %s
items.weapon.enchantments.corrupting.desc=Den här kraftfulla förtrollningen kan böja fiender till din vilja. När en fiende dödas med vapnet kan den bli korrumperad i stället för att dö.
items.weapon.enchantments.corrupting.elestrike_desc=Ett elementarslag med en fördärvande förtrollning har 5–25 % chans, beroende på saknad hälsa, att korrumpera varje fiende inom räckhåll utom huvudmålet.

items.weapon.enchantments.eldritch.name=kuslig %s
items.weapon.enchantments.eldritch.desc=Övernaturliga vapen skrämmer närliggande fiender som bevittnar deras attacker, vilket får dem att fly från angriparen.
items.weapon.enchantments.eldritch.elestrike_desc=Ett elementarslag med en kuslig förtrollning ger förlängd skräck till varje fiende inom räckhåll, även huvudmålet.

items.weapon.enchantments.elastic.name=fjädrande %s
items.weapon.enchantments.elastic.desc=Fjädrande vapen kan kasta tillbaka fiender en kort sträcka.
items.weapon.enchantments.elastic.elestrike_desc=Ett elementarslag med en fjädrande förtrollning knuffar alla fiender inom räckhåll 5 rutor bakåt.

items.weapon.enchantments.grim.name=dödlig %s
items.weapon.enchantments.grim.desc=Den här kraftfulla förtrollningen har förmågan att omedelbart avrätta en fiende. Effekten är mer sannolik att inträffa ju svagare fienden är.
items.weapon.enchantments.grim.elestrike_desc=Ett elementarslag med en dödlig förtrollning har 6–30 % chans, beroende på saknad hälsa, att döda varje fiende inom räckhåll utom huvudmålet.

items.weapon.enchantments.lucky.name=lyckosam %s
items.weapon.enchantments.lucky.desc=Fiender som dödas av ett lyckovapen har en chans att släppa extra byte.
items.weapon.enchantments.lucky.elestrike_desc=Ett elementarslag med en lyckosam förtrollning har 12,5 % chans att skapa byte under varje fiende inom räckhåll. Effekten kan bara utlösas en gång per fiende.

items.weapon.enchantments.projecting.name=genomträngande %s
items.weapon.enchantments.projecting.desc=Med den här förtrollningen får närstridsvapen extra räckvidd. Fjärrvapen tränger igenom väggar när de riktas mot mål i närheten.
items.weapon.enchantments.projecting.elestrike_desc=Ett elementarslag med en genomträngande förtrollning orsakar 30 % skada på varje fiende inom räckhåll utom huvudmålet.

items.weapon.enchantments.shocking.name=elektrisk %s
items.weapon.enchantments.shocking.desc=Elektricitet slår i bågar från ett elektriskt vapen och orsakar extra skada på alla fiender i närheten.
items.weapon.enchantments.shocking.elestrike_desc=Ett elementarslag med en elektrisk förtrollning sprider elektricitet till varje ruta inom räckhåll i 8 turer.

items.weapon.enchantments.unstable.name=instabil %s
items.weapon.enchantments.unstable.desc=Den här förtrollningen utstrålar kaotisk energi och fungerar som en annan förtrollning för varje träff.
items.weapon.enchantments.unstable.elestrike_desc=Ett elementarslag med en instabil förtrollning ger en slumpmässig förtrollningseffekt på varje fiende inom räckhåll, utom det primära målet.

items.weapon.enchantments.vampiric.name=vampyrisk %s
items.weapon.enchantments.vampiric.desc=Den här kraftfulla förtrollningen suger livskraft från fiender med varje slag och leder den tillbaka till bäraren. Effekten är starkare ju lägre bärarens hälsa är.
items.weapon.enchantments.vampiric.elestrike_desc=Ett elementarslag med en vampyrisk förtrollning läker Duellanten med 2,5 hälsa för varje fiende inom räckhåll.

items.weapon.enchantments.venomous.name=giftig %s
items.weapon.enchantments.venomous.desc=Giftiga vapen tillfogar ett fördröjt men dödligt gift som blir allvarligare för varje gång det tillämpas.
items.weapon.enchantments.venomous.elestrike_desc=Ett elementarslag med en giftig förtrollning tillämpar ytterligare fördröjt gift på varje fiende inom räckhåll utom huvudmålet.

items.weapon.enchantments.vorpal.name=vorpal %s
items.weapon.enchantments.vorpal.desc=Vorpalvapen är särskilt dödliga. De kan slå så rent att de orsakar blödning i stället för skada på fiender som kan blöda.
items.weapon.enchantments.vorpal.elestrike_desc=En elementär attack med en vorpalförtrollning ger ytterligare blödning till varje fiende inom räckvidd, utom huvudmålet.


###melee weapons
items.weapon.melee.assassinsblade.name=lönnmördarklinga
items.weapon.melee.assassinsblade.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.melee.assassinsblade.ability_name=smyg
items.weapon.melee.assassinsblade.typical_ability_desc=Duellanten kan _smyga_ med en lönnmördarklinga. Förmågan låter henne genast blinka upp till 3 rutor och ger vanligtvis _%d turer av osynlighet._
items.weapon.melee.assassinsblade.ability_desc=Duellanten kan _smyga_ med en lönnmördarklinga. Förmågan låter henne genast blinka upp till 3 rutor och ger _%d turer av osynlighet._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Förmågans varaktighet
items.weapon.melee.assassinsblade.desc=Ett litet vågigt blad gjort av obsidian, svårt att använda trots sin låga vikt, men dödligt om det träffar rätt.

items.weapon.melee.battleaxe.name=stridsyxa
items.weapon.melee.battleaxe.stats_desc=Det här är ett ganska exakt vapen.
items.weapon.melee.battleaxe.ability_name=tungt slag
items.weapon.melee.battleaxe.typical_ability_desc=Duellanten kan utföra ett _tungt slag_ med en stridsyxa. Den koncentrerade attacken orsakar vanligtvis _%1$d-%2$d skada_ om den överraskar fienden och gör den omtöcknad i 5 turer, vilket minskar träffsäkerhet och undvikandeförmåga med 50 %%. Tungt slag träffar alltid, men orsakar vanlig skada om det inte överraskar fienden.
items.weapon.melee.battleaxe.ability_desc=Duellanten kan utföra ett _tungt slag_ med en stridsyxa. Den koncentrerade attacken orsakar _%1$d-%2$d skada_ om den överraskar fienden och gör den omtöcknad i 5 turer, vilket minskar träffsäkerhet och undvikandeförmåga med 50 %%. Tungt slag träffar alltid, men orsakar vanlig skada om det inte överraskar fienden.
items.weapon.melee.battleaxe.desc=Det enorma stålhuvudet på denna stridsyxa ger avsevärd tyngd bakom varje brett slag.

items.weapon.melee.crossbow.name=armborst
items.weapon.melee.crossbow.typical_stats_desc=Vanligtvis förstärker det här vapnet kastade pilar, så att de orsakar _%1$d-%2$d skada_ när armborstet är utrustat. Det ger dem till och med sin förtrollning.
items.weapon.melee.crossbow.stats_desc=Det här vapnet förstärker kastade pilar, så att de orsakar _%1$d-%2$d skada_ när armborstet är utrustat. Det ger dem till och med sin förtrollning.
items.weapon.melee.crossbow.ability_name=laddat skott
items.weapon.melee.crossbow.typical_ability_desc=Duellanten kan _ladda_ sitt armborst, så att nästa vanliga attack alltid träffar och får en av tre effekter: närstridsattacker knuffar bort fiender, ospetsade pilar orsakar vanligtvis _+%1$d skada_ och spetsade pilar tillämpar sin effekt i ett område på 7×7 och får vanligtvis _%2$d fler användningar_.
items.weapon.melee.crossbow.ability_desc=Duellanten kan _ladda_ sitt armborst, så att nästa vanliga attack alltid träffar och får en av tre effekter: närstridsattacker knuffar bort fiender, ospetsade pilar orsakar _+%1$d skada_ och spetsade pilar tillämpar sin effekt i ett område på 7×7 och får _%2$d fler användningar_.
items.weapon.melee.crossbow.desc=Ett ganska avancerat vapen som skjuter projektiler med exceptionell hastighet. Det är inte konstruerat för närstrid, men armborstets tyngd och robusta konstruktion gör det även till ett bra närstridsvapen.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Förbättrad förmåga
items.weapon.melee.crossbow$chargedshot.name=laddat
items.weapon.melee.crossbow$chargedshot.desc=Duellanten fokuserar kraft i sitt armborst. Nästa attack med det träffar alltid och får en av tre effekter:\n- Närstridsattacker knuffar fiender några rutor bort.\n- Ospetsade pilar orsakar bonusskada.\n- Spetsade pilar får extra användningar och tillämpar sin effekt i ett område på 7×7. Positiva pileffekter påverkar bara allierade och skadliga effekter gäller bara fiender. Duellanten kan inte använda förmågan för att tillämpa positiva pileffekter på sig själv.

items.weapon.melee.cudgel.name=stridsklubba
items.weapon.melee.cudgel.stats_desc=Det här är ett ganska exakt vapen.
items.weapon.melee.cudgel.ability_name=tungt slag
items.weapon.melee.cudgel.typical_ability_desc=Duellanten kan utföra ett _tungt slag_ med en stridsklubba. Den koncentrerade attacken orsakar vanligtvis _%1$d-%2$d skada_ om den överraskar fienden och gör den omtöcknad i 5 turer, vilket minskar träffsäkerhet och undvikandeförmåga med 50 %%. Tungt slag träffar alltid, men orsakar vanlig skada om det inte överraskar fienden.
items.weapon.melee.cudgel.ability_desc=Duellanten kan utföra ett _tungt slag_ med en stridsklubba. Den koncentrerade attacken orsakar _%1$d-%2$d skada_ om den överraskar fienden och gör den omtöcknad i 5 turer, vilket minskar träffsäkerhet och undvikandeförmåga med 50 %%. Tungt slag träffar alltid, men orsakar vanlig skada om det inte överraskar fienden.
items.weapon.melee.cudgel.desc=En liten mässingsklubba, tillverkad mer som ett självförsvarsverktyg för adelsmän än som ett äventyrsvapen.
items.weapon.melee.cudgel.discover_hint=En av hjältarna börjar med det här föremålet.

items.weapon.melee.dagger.name=dolk
items.weapon.melee.dagger.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.melee.dagger.ability_name=smyg
items.weapon.melee.dagger.typical_ability_desc=Duellanten kan _smyga_ med en dolk. Förmågan låter henne genast blinka upp till 5 rutor och ger vanligtvis _%d turer av osynlighet._
items.weapon.melee.dagger.ability_desc=Duellanten kan _smyga_ med en dolk. Förmågan låter henne genast blinka upp till 5 rutor och ger _%d turer av osynlighet._
items.weapon.melee.dagger.upgrade_ability_stat_name=Förmågans varaktighet
items.weapon.melee.dagger.desc=En enkel järndolk med ett slitet trähandtag.
items.weapon.melee.dagger.discover_hint=En av hjältarna börjar med detta föremål.

items.weapon.melee.dirk.name=dirk
items.weapon.melee.dirk.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.melee.dirk.ability_name=smyg
items.weapon.melee.dirk.typical_ability_desc=Duellanten kan _smyga_ med en dirk. Förmågan låter henne genast blinka upp till 4 rutor och ger vanligtvis _%d turer av osynlighet._
items.weapon.melee.dirk.ability_desc=Duellanten kan _smyga_ med en dirk. Förmågan låter henne genast blinka upp till 4 rutor och ger _%d turer av osynlighet._
items.weapon.melee.dirk.upgrade_ability_stat_name=Förmågans varaktighet
items.weapon.melee.dirk.desc=En längre stickdolk som ger lite mer stål att stöta in i fienden.

items.weapon.melee.flail.name=slaga
items.weapon.melee.flail.stats_desc=Detta är ett ganska oprecist vapen.\nDetta vapen kan inte överraskningsattackera.
items.weapon.melee.flail.ability_name=snurra
items.weapon.melee.flail.spin_warn=Du kan inte snurra slagan mer.
items.weapon.melee.flail.typical_ability_desc=Duellanten kan _snurra_ en slaga för att bygga upp kraft en kort stund. Varje tur slagan snurras orsakar den vanligtvis _+%d skada_ i nästa vanliga attack, upp till tre gånger. En snurrande slaga träffar också garanterat. Endast när du börjar snurra förbrukas en laddning.
items.weapon.melee.flail.ability_desc=Duellanten kan _snurra_ en slaga för att bygga upp kraft en kort stund. Varje tur slagan snurras orsakar den _+%d skada_ i nästa vanliga attack, upp till tre gånger. En snurrande slaga träffar också garanterat. Endast när du börjar snurra förbrukas en laddning.
