items.weapon.melee.gauntlet.typical_ability_desc=Duelisten kan utföra en _kombinationsattack_ med en stenhandske. Attacken träffar garanterat och ger vanligtvis _+%d skada_ för varje gång duellisten har träffat med en vanlig närstrids- eller kastvapenattack. Om du inte träffar på 5 turer (15 efter ett dödande) återställs kombinationen.
