items.weapon.melee.sickle.stats_desc=Det här är ett ganska oprecist vapen.
items.weapon.melee.sickle.ability_name=skörda
items.weapon.melee.sickle.typical_ability_desc=Duellanten kan _skörda_ en fiende med en skära. Denna förödande attack träffar garanterat och ger vanligtvis _%d skada_. Skadan orsakar blödning om målet inte är immunt.
items.weapon.melee.sickle.ability_desc=Duellanten kan _skörda_ en fiende med en skära. Denna förödande attack träffar garanterat och ger _%d skada_. Skadan orsakar blödning om målet inte är immunt.
items.weapon.melee.sickle.desc=Ett handhållet jordbruksverktyg som även kan fungera som ett starkt men otympligt vapen.

items.weapon.melee.spear.name=spjut
items.weapon.melee.spear.stats_desc=Det här är ett ganska långsamt vapen.\nDet här vapnet har extra räckvidd.
items.weapon.melee.spear.ability_name=spetsa
items.weapon.melee.spear.typical_ability_desc=Duellanten kan använda spetsen på ett spjut för att _spetsa_ en fiende inom räckhåll som inte står intill. Detta ger vanligtvis _%1$d–%2$d skada_, knuffar tillbaka fienden och träffar garanterat.
items.weapon.melee.spear.ability_desc=Duellanten kan använda spetsen på ett spjut för att _spetsa_ en fiende inom räckhåll som inte står intill. Detta ger _%1$d–%2$d skada_, knuffar tillbaka fienden och träffar garanterat.
items.weapon.melee.spear.desc=En smal trästav med en spets av vässat järn.

items.weapon.melee.sword.name=svärd
items.weapon.melee.sword.ability_name=klyva
items.weapon.melee.sword.typical_ability_desc=Duellanten kan _klyva_ en fiende med ett svärd. Detta ger vanligtvis _%1$d–%2$d skada_ och träffar garanterat. Om klyvning dödar en fiende sker den omedelbart och duellanten kan använda klyvning igen utan kostnad inom 5 turer.
items.weapon.melee.sword.ability_desc=Duellanten kan _klyva_ en fiende med ett svärd. Detta ger _%1$d–%2$d skada_ och träffar garanterat. Om klyvning dödar en fiende sker den omedelbart och duellanten kan använda klyvning igen utan kostnad inom 5 turer.
items.weapon.melee.sword.desc=Ett snyggt balanserat svärd. Inte för stort, men ändå betydligt längre än ett kortsvärd.
items.weapon.melee.sword$cleavetracker.name=klyva
items.weapon.melee.sword$cleavetracker.desc=Duellanten är redo att följa upp sin tidigare klyvning. Nästa användning av klyvning kostar ingen laddning för vapenförmåga.\n\nÅterstående turer: %s.

items.weapon.melee.warhammer.name=krigshammare
items.weapon.melee.warhammer.stats_desc=Det här är ett ganska exakt vapen.
items.weapon.melee.warhammer.ability_name=tungt slag
items.weapon.melee.warhammer.typical_ability_desc=Duellanten kan utföra ett _tungt slag_ med en krigshammare. Denna koncentrerade attack ger vanligtvis _%1$d–%2$d skada_ om den överraskar fienden och gör fienden omtöcknad i 5 turer, vilket minskar träffsäkerhet och undvikande med 50%%. Tungt slag träffar alltid men ger vanlig skada om det inte överraskar fienden.
items.weapon.melee.warhammer.ability_desc=Duellanten kan utföra ett _tungt slag_ med en krigshammare. Denna koncentrerade attack ger _%1$d–%2$d skada_ om den överraskar fienden och gör fienden omtöcknad i 5 turer, vilket minskar träffsäkerhet och undvikande med 50%%. Tungt slag träffar alltid men ger vanlig skada om det inte överraskar fienden.
items.weapon.melee.warhammer.desc=Få varelser kan motstå det förkrossande slaget från denna enorma massa av bly och stål, men det krävs stor styrka för att använda den effektivt.

items.weapon.melee.warscythe.name=krigslie
items.weapon.melee.warscythe.stats_desc=Det här är ett ganska oprecist vapen.
items.weapon.melee.warscythe.ability_name=skörda
items.weapon.melee.warscythe.typical_ability_desc=Duellanten kan _skörda_ en fiende med en krigslie. Denna förödande attack träffar garanterat och ger vanligtvis _%d skada_. Skadan orsakar blödning om målet inte är immunt.
items.weapon.melee.warscythe.ability_desc=Duellanten kan _skörda_ en fiende med en krigslie. Denna förödande attack träffar garanterat och ger _%d skada_. Skadan orsakar blödning om målet inte är immunt.
items.weapon.melee.warscythe.desc=Det här stora och otympliga verktyget har förstärkts så att det är bättre på att skära fiender än grödor.

items.weapon.melee.whip.name=piska
items.weapon.melee.whip.stats_desc=Det här vapnet har en enorm räckvidd.
items.weapon.melee.whip.ability_name=piskslag
items.weapon.melee.whip.typical_ability_desc=Duellanten kan _piska_ alla fiender omkring sig med en piska. Denna förmåga ger vanligtvis _%1$d–%2$d skada_, angriper alla fiender inom räckvidd och träffar garanterat.
items.weapon.melee.whip.ability_desc=Duellanten kan _piska_ alla fiender omkring sig med en piska. Denna förmåga ger _%1$d–%2$d skada_, angriper alla fiender inom räckvidd och träffar garanterat.
items.weapon.melee.whip.desc=Det taggiga repstycket i änden av vapnet ger dålig skada, men dess räckvidd kan inget annat vapen mäta sig med.

items.weapon.melee.wornshortsword.name=slitet kortsvärd
items.weapon.melee.wornshortsword.ability_name=klyva
items.weapon.melee.wornshortsword.typical_ability_desc=Duellanten kan _klyva_ en fiende med ett slitet kortsvärd. Detta ger vanligtvis _%1$d–%2$d skada_ och träffar garanterat. Om klyvning dödar en fiende sker den omedelbart och duellanten kan använda klyvning igen utan kostnad inom 5 turer.
items.weapon.melee.wornshortsword.ability_desc=Duellanten kan _klyva_ en fiende med ett slitet kortsvärd. Detta ger _%1$d–%2$d skada_ och träffar garanterat. Om klyvning dödar en fiende sker den omedelbart och duellanten kan använda klyvning igen utan kostnad inom 5 turer.
items.weapon.melee.wornshortsword.desc=Ett ganska kort svärd, nerslitet av hårt bruk. Det är både svagare och lite lättare än ett kortsvärd i bättre skick.
items.weapon.melee.wornshortsword.discover_hint=En av hjältarna börjar med detta föremål.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=adrenalinpil
items.weapon.missiles.darts.adrenalinedart.desc=Dessa pilar är spetsade med en blandning baserad på kvicktistel som ökar allierades rörelse- och attackhastighet eller tillfälligt sänker fienders rörelsehastighet. Pilen skadar fortfarande fiender, men inte allierade.

items.weapon.missiles.darts.blindingdart.name=bländande pil
items.weapon.missiles.darts.blindingdart.desc=Dessa pilar är spetsade med en blandning baserad på blindogräs som förblindar målet en kort stund. De desorienterar dock inte, så en fiende vet fortfarande var den senast såg dig.

items.weapon.missiles.darts.chillingdart.name=frostpil
items.weapon.missiles.darts.chillingdart.desc=Dessa pilar är spetsade med en blandning baserad på ishatt som kyler ned målet avsevärt.

items.weapon.missiles.darts.cleansingdart.name=rengöringspil
items.weapon.missiles.darts.cleansingdart.desc=Dessa pilar är spetsade med en blandning baserad på mageroyal som tillfälligt gör allierade immuna mot alla negativa effekter eller tar bort positiva effekter från fiender. Fiender kan till och med en kort stund glömma att de attackerar eller flyr från dig. Pilen skadar fortfarande fiender, men inte allierade.

items.weapon.missiles.darts.dart.name=pil
items.weapon.missiles.darts.dart.ac_tip=SPETSA
items.weapon.missiles.darts.dart.prompt=Välj ett frö
items.weapon.missiles.darts.dart.tip_title=Spetsa pilar
items.weapon.missiles.darts.dart.tip_desc=Ett frö kan kombineras med en eller två pilar för att förse dem med spetsar. Varje frötyp ger sin egen sorts spetsade pil med en unik engångseffekt.\n\nOm du spetsar en pil med dessa frön får du en _%s._
items.weapon.missiles.darts.dart.tip_all=spetsa %1$d pilar med %2$d frön
items.weapon.missiles.darts.dart.tip_two=spetsa 2 pilar med 1 frö
items.weapon.missiles.darts.dart.tip_one=spetsa 1 pil med 1 frö
items.weapon.missiles.darts.dart.tip_cancel=avbryt
items.weapon.missiles.darts.dart.desc=Dessa enkla träpilar med spetsar är balanserade för att flyga rakt och sticka sitt byte med en handledsrörelse. De kan spetsas med frön för att få bonuseffekter när de kastas.
items.weapon.missiles.darts.dart.unlimited_uses=Tack vare sin enkla konstruktion håller pilarna i praktiken för evigt.

items.weapon.missiles.darts.displacingdart.name=förskjutande pil
items.weapon.missiles.darts.displacingdart.desc=Dessa pilar är spetsade med en blandning baserad på flyktlöv som teleporterar målet en kort sträcka bort.

items.weapon.missiles.darts.healingdart.name=läkande pil
items.weapon.missiles.darts.healingdart.desc=Dessa pilar är spetsade med en blandning baserad på solgräs som ger målet en omgång läkande. Pilen skadar fortfarande fiender, men inte allierade.

items.weapon.missiles.darts.holydart.name=helig pil
items.weapon.missiles.darts.holydart.desc=Dessa pilar är spetsade med en blandning baserad på stjärnblomma som genomsyrar målet med helig energi. Allierade och vanliga fiender blir välsignade, men odöda och demoniska fiender tar stor skada. Pilen skadar fortfarande fiender, men inte allierade.

items.weapon.missiles.darts.incendiarydart.name=brännande pil
items.weapon.missiles.darts.incendiarydart.desc=Dessa pilar är spetsade med en blandning baserad på eldblomma som exploderar i starka lågor vid träff.

items.weapon.missiles.darts.paralyticdart.name=paralytisk pil
items.weapon.missiles.darts.paralyticdart.desc=Dessa pilar är spetsade med en blandning baserad på jordrot som förlamar målet en kort stund.

items.weapon.missiles.darts.poisondart.name=giftpil
items.weapon.missiles.darts.poisondart.desc=Dessa pilar är spetsade med en blandning baserad på vemossa som förgiftar målet.

items.weapon.missiles.darts.rotdart.name=rotpil
items.weapon.missiles.darts.rotdart.desc=Dessa illasinnade pilar är spetsade med en sur blandning baserad på rötbär som fräter på allt pilen kommer i kontakt med. Mäktiga fiender står emot merparten av effekten, men frätningen är tillräckligt kraftig för att enkelt döda de flesta vanliga fiender. De håller längre än andra spetsade pilar, men deras hållbarhet kan inte förbättras.
items.weapon.missiles.darts.rotdart.discover_hint=Du kan skapa det här föremålet med hjälp av ett frö från ett specifikt uppdrag.

items.weapon.missiles.darts.shockingdart.name=shockpil
items.weapon.missiles.darts.shockingdart.desc=Dessa pilar är spetsade med en blandning baserad på stormranka som ger målet en kraftig stöt.

items.weapon.missiles.darts.tippeddart.ac_clean=REN
items.weapon.missiles.darts.tippeddart.clean_title=Rengör pilar
items.weapon.missiles.darts.tippeddart.clean_desc=Åtgärden tar bort fröspetsarna från dina pilar och återställer dem till vanliga pilar.
items.weapon.missiles.darts.tippeddart.clean_all=rengör alla
items.weapon.missiles.darts.tippeddart.clean_one=rengör en
items.weapon.missiles.darts.tippeddart.cancel=avbryt
items.weapon.missiles.darts.tippeddart.uses_left=Den här högen med pilar har _%d/%d_ användningar kvar innan en spets slits ut.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Men de här är av så hög kvalitet att de i praktiken håller för evigt._
items.weapon.missiles.darts.tippeddart.about_to_break=Spetsen på din pil är på väg att ta slut.
items.weapon.missiles.darts.tippeddart.has_broken=Spetsen på din pil har tagit slut.
items.weapon.missiles.darts.tippeddart.discover_hint=Du kan köpa det här föremålet i en butik eller skapa det med ett frö.


items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Det här vapnet gör målet krympling.
items.weapon.missiles.bolas.desc=Dessa ovanliga distansvapen är inte särskilt skadliga, men är utmärkta för att sakta ner målet.

items.weapon.missiles.boomerang.name=boomerang
items.weapon.missiles.boomerang.desc=När denna platta, böjda träprojektil kastas mot en fiende återvänder den till kastarens hand.
items.weapon.missiles.boomerang.durability=Tack vare sin solida konstruktion går den här bumerangen inte sönder av användning.

items.weapon.missiles.fishingspear.name=fiskespjut
items.weapon.missiles.fishingspear.desc=Små kastspjut som fungerar bra som improviserade vapen trots att de är avsedda för fiske.

items.weapon.missiles.forcecube.name=kraftkub
items.weapon.missiles.forcecube.ondeath=Du dödade dig själv med din egen kraftkub …
items.weapon.missiles.forcecube.stats_desc=Det här vapnet sprider kraften från nedslaget över ett litet område och träffar allt i närheten.
items.weapon.missiles.forcecube.desc=Dessa magiska kuber med udda form är tillräckligt små för att rymmas i handen, men otroligt tunga.

items.weapon.missiles.heavyboomerang.name=tung bumerang
items.weapon.missiles.heavyboomerang.stats_desc=Detta vapen återvänder till den plats det kastades från efter fem turer.
items.weapon.missiles.heavyboomerang.desc=Denna stora bumerang är svår att hantera effektivt, men orsakar betydande skada.

items.weapon.missiles.javelin.name=spjut
items.weapon.missiles.javelin.desc=Dessa större kastspjut är viktade så att spetsen hålls främst när de flyger genom luften.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.missiles.kunai.desc=Dessa små knivar är mycket kraftfulla i händerna på en skicklig användare.

items.weapon.missiles.missileweapon.stats_known=Den här uppsättningen kastvapen av _nivå %1$d_ ger _%2$d–%3$d skada_ och kräver _%4$d styrka_ för att användas.
items.weapon.missiles.missileweapon.stats_unknown=Den här uppsättningen kastvapen av _nivå %1$d_ ger vanligtvis _%2$d–%3$d skada_ och kräver _%4$d styrka_ för att användas.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Det här vapnet är troligen för tungt för dig.
items.weapon.missiles.missileweapon.distance=Kastvapen har bättre träffsäkerhet på avstånd, men sämre på nära håll.
items.weapon.missiles.missileweapon.durability=Kastvapen slits och går sönder när de används.
items.weapon.missiles.missileweapon.uses_left=Denna uppsättning kastvapen har _%d/%d_ användningar kvar innan ett går sönder.
items.weapon.missiles.missileweapon.unlimited_uses=Denna uppsättning är av så hög kvalitet att den i praktiken kommer att hålla för evigt.
items.weapon.missiles.missileweapon.unknown_uses=Vanligtvis kan denna uppsättning kastvapen användas _%d_ gånger innan ett av dem går sönder.
items.weapon.missiles.missileweapon.curse_discover=Detta kastvapen är förhäxat!
items.weapon.missiles.missileweapon.about_to_break=Ditt kastvapen är på väg att gå sönder.
items.weapon.missiles.missileweapon.has_broken=Ett av dina kastade vapen har gått sönder.
items.weapon.missiles.missileweapon.dust=Det kastade vapnet smulas sönder till damm när du rör vid det.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Om det sista kastvapnet i din förbättrade uppsättning kastvapen går sönder förlorar du uppsättningen permanent. Är du säker på att du vill kasta det?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ja
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Nej
items.weapon.missiles.missileweapon$placeholder.name=kastvapen

items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shuriken kan kastas omedelbart med 20 turers nedkylning.
items.weapon.missiles.shuriken.desc=Dessa stjärnformade metallbitar med rakbladsvassa blad kan kastas snabbt medan man är i rörelse.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Nedkylningstid för shuriken
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Du har nyligen kastat en shuriken omedelbart och måste vänta innan du kan göra det igen. Shuriken kan fortfarande kastas, men med vanlig vapenhastighet.\n\nÅterstående turer: %s.

items.weapon.missiles.throwingclub.name=kastklubba
items.weapon.missiles.throwingclub.stats_desc=Detta vapen fastnar inte på fiender och kan samlas upp direkt.
items.weapon.missiles.throwingclub.desc=Ett ganska enkelt men hållbart kastvapen, i princip en stor sten fäst vid en pinne.

items.weapon.missiles.throwinghammer.name=kasthammare
items.weapon.missiles.throwinghammer.stats_desc=Detta vapen fastnar inte på fiender och kan samlas upp direkt.
items.weapon.missiles.throwinghammer.desc=Dessa tunga hammare är avsedda att kastas mot en fiende. Den släta konstruktionen helt i metall gör dem mycket hållbara.

items.weapon.missiles.throwingknife.name=kastkniv
items.weapon.missiles.throwingknife.stats_desc=Det här vapnet är starkare mot ovetande fiender.
items.weapon.missiles.throwingknife.desc=Dessa lätta knivar är balanserade så att de flyger genom luften och träffar sitt mål.
items.weapon.missiles.throwingknife.discover_hint=En av hjältarna börjar med detta föremål.

items.weapon.missiles.throwingspear.name=kastspjut
items.weapon.missiles.throwingspear.desc=Dessa lätta spjut har tunna skaft och är avsedda att kastas, inte stötas med.

items.weapon.missiles.throwingspike.name=kastspets
items.weapon.missiles.throwingspike.desc=Dessa hållbara, spetsiga metallstänger är avsedda att kastas mot fiender på avstånd.
items.weapon.missiles.throwingspike.discover_hint=En av hjältarna börjar med detta föremål.

items.weapon.missiles.throwingstone.name=kaststen
items.weapon.missiles.throwingstone.desc=Dessa stenar slipas ned så att de kan kastas med större kraft än vanliga stenar.
items.weapon.missiles.throwingstone.discover_hint=En av hjältarna börjar med det här föremålet.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Det här vapnet tillfogar målet _%1$d–%2$d blödning_.
items.weapon.missiles.tomahawk.typical_stats_desc=Det här vapnet tillfogar vanligtvis målet _%1$d–%2$d blödning_.
items.weapon.missiles.tomahawk.desc=Dessa kastyxor har en tandad egg som sliter sönder när de fastnar i fienden.

items.weapon.missiles.trident.name=treudd
items.weapon.missiles.trident.desc=Massiva kastspjut med tre dödliga spetsar i änden. De är kraftfulla, men ganska tunga.


items.weapon.spiritbow.name=andebåge
items.weapon.spiritbow.ac_shoot=SKJUT
items.weapon.spiritbow.prompt=Välj ett mål
items.weapon.spiritbow.stats=Bågen kan inte uppgraderas direkt utan blir i stället stadigt starkare när du går upp i nivå. På din nuvarande nivå ger pilar från bågen _%1$d–%2$d skada_ och kräver _%3$d styrka_ för att användas korrekt.
items.weapon.spiritbow.desc=En båge gjord av uråldrigt magiskt trä. Bågens sträng och etsningar lyser med ett blekt blått ljus. När man drar i strängen frammanar bågen en magisk pil som kan avfyras mot en fiende.
items.weapon.spiritbow.discover_hint=En av hjältarna börjar med det här föremålet.

items.weapon.weapon.identify=Du är nu tillräckligt bekant med ditt vapen för att identifiera det.
items.weapon.weapon.too_heavy=Din otillräckliga styrka gör att det här vapnet försämrar attackhastigheten, träffsäkerheten och din förmåga till överraskningsattacker.
items.weapon.weapon.excess_str=Din överskjutande styrka gör att du ger _0–%d bonusskada_ med det här vapnet.
items.weapon.weapon.hardening_gone=Härdningen på det här vapnet har försvunnit!
items.weapon.weapon.incompatible=Olika sorters magi har samverkat och upphävt vapnets förtrollning!
items.weapon.weapon.cursed_worn=Eftersom det här vapnet är förbannat kan du inte ta bort det.
items.weapon.weapon.cursed=Du känner illvillig magi lura i det här vapnet.
items.weapon.weapon.weak_cursed=Trots förbannelsen kan du ta av dig det här vapnet.
items.weapon.weapon.not_cursed=Detta vapen är fritt från illvillig magi.
items.weapon.weapon.faster=Det är förstärkt för att förbättra _hastigheten._
items.weapon.weapon.stronger=Det är förstärkt för att öka _skadan._
items.weapon.weapon.enchanted=Det har en _%s._
items.weapon.weapon.enchant_hardened=Det har blivit _härdat._
items.weapon.weapon.hardened_no_enchant=Det här vapnet har blivit _härdat,_ men är för närvarande inte förtrollat.
items.weapon.weapon$enchantment.enchant=förtrollning
items.weapon.weapon$enchantment.rankings_desc=Dödades av en förtrollning
items.weapon.weapon$enchantment.discover_hint=Du kan hitta ett föremål med den här effekten slumpmässigt i fängelsehålan eller försöka använda den på ett föremål själv.


###misc items
items.amulet.name=Yendors amulett
items.amulet.ac_end=AVSLUTA SPELET
items.amulet.desc=Yendors amulett är den mest kraftfulla artefakt som människor och dvärgar känner till. Dess skimrande kristaller innehåller otrolig och förunderlig kraft.
items.amulet.desc_origins=Amulettens ursprung är okänt. Historien säger att dvärgarnas kung skröt med att ha upptäckt artefakten strax innan dvärgarnas civilisation bröt all kontakt. Hur hittade han den? Hur tog Yog-Dzewa den från honom? Det får bli frågor för en annan gång; allt som betyder något nu är att amuletten är din!
items.amulet.desc_ascent=Amulettens ursprung är okänt, men den är tydligt starkt påverkad av Yog-Dzewas kraft. Fängelsehålan tycks böja sig efter Yogs vilja när du rör dig genom den, så fienderna blir mycket fler och starkare! Du kan inte längre aktivera eller kasta bort amuletten, nästan som om den vore förbannad.
items.amulet.ascent_title=Uppstigning
items.amulet.ascent_desc=Du börjar känna Yog-Dzewas stora och fruktansvärda kraft stråla från amuletten. Att ta sig upp genom fängelsehålan igen som dödlig kan vara svårare än du trodde!\n\nOm du fortsätter uppåt med amuletten blir fängelsehålan farligare, teleportering mellan våningar stängs av och du kan bara vinna genom att besegra fiender medan du tar dig upp genom fängelsehålan!\n\nDu kan lämna amuletten här tills vidare om du vill ta dig upp utan att påbörja utmaningen, eller aktivera amuletten före uppstigningen för att avsluta spelet på vanligt sätt.
items.amulet.ascent_yes=Fortsätt!
items.amulet.ascent_no=Avbryt för tillfället
items.amulet.discover_hint=Du hittar det här föremålet längst ned i fängelsehålan …

items.ankh.name=ankh
items.ankh.ac_bless=VÄLSIGNA
items.ankh.bless=Du välsignar ankhen med magiskt vatten.
items.ankh.desc=Den här uråldriga symbolen för odödlighet låter dig återvända till livet efter döden. De flesta föremål lämnas kvar där du dog, men du kan hämta dem om du återvänder dit. Med ett fullt vattenskinn kan ankhen välsignas och bli starkare.
items.ankh.desc_blessed=Den här uråldriga symbolen för odödlighet låter dig återvända till livet efter döden. Ankhen har välsignats och är nu mycket starkare. Den offrar sig för att rädda dig i ett ögonblick av dödlig fara.
items.ankh.discover_hint=Du kan köpa det här föremålet i en butik.

items.arcaneresin.name=arkanskt harts
items.arcaneresin.prompt=Välj en trollstav
items.arcaneresin.ac_apply=ANVÄND
items.arcaneresin.level_too_high=Den trollstaven är för kraftfull för att hartset ska kunna förbättra den.
items.arcaneresin.not_enough=Du har inte tillräckligt med harts för det!
items.arcaneresin.apply=Du täcker trollstaven med harts, vilket ökar dess kraft!
items.arcaneresin.desc=Det här fina pulvret skimrar i nyanser av lila och vitt. Det kan förstärka magiska energier och höjer nivån på trollstavar när det appliceras på dem!\n\nAtt uppgradera en trollstav kostar 1, 2 eller 3 harts beroende på trollstavens ursprungliga nivå. Harts kan uppgradera trollstavar till högst +3.\n\nHartsuppgraderingar _åsidosätts dock av andra uppgraderingskällor_ (till exempel uppgraderingsskriftrullar) och gäller inte när en trollstav ingjuts i Magikerns stav.
items.arcaneresin.discover_hint=Du kan tillverka detta föremål via alkemi.

items.brokenseal.name=bruten försegling
items.brokenseal.ac_affix=FÄST
items.brokenseal.prompt=Välj en rustning
items.brokenseal.unknown_armor=Du måste först identifiera om rustningen är förbannad eller inte.
items.brokenseal.cursed_armor=Sigillet kan inte fästas på förbannad rustning.
items.brokenseal.affix=Du fäster sigillet på din rustning!
items.brokenseal.desc=Ett vaxsigill som fästs på rustning som en symbol för tapperhet. I mitten är en bleknad skyddsruna ingraverad och sigillet är sprucket mitt itu.\n\nSigillet är ett minne från hans hem och hjälper krigaren att hålla ut. När krigaren bär sigillet får han genast sköld när hans hälsa är på väg ned till hälften eller lägre.\n\nSigillet kan _fästas på rustning_ och flyttas mellan rustningar. Det kan bära med sig en uppgradering, förutsatt att uppgraderingen gjordes på rustningen medan sigillet var fäst vid den.
items.brokenseal.inscribed=Sigillet är inskrivet med en _%s._
items.brokenseal.choose_title=Välj en glyf
items.brokenseal.choose_desc=Både den här rustningen och det brutna sigillet har en glyf. Välj vilken glyf som ska behållas.\n\nRustningens glyf: %1$s\nDet brutna sigillets glyf: %2$s\n\nObservera att om du väljer glyfen som finns på rustningen nu kan sigillet inte överföra den senare.
items.brokenseal.discover_hint=En av hjältarna börjar med det här föremålet.
items.brokenseal$warriorshield.name=Krigarsköld
items.brokenseal$warriorshield.desc_active=Krigarens brutna sigill hjälper honom just nu att hålla ut och ger honom sköld ovanpå hans hälsa. När skölden först aktiveras uppstår en nedkylning innan den kan användas igen.\n\nSkölden avtar inte med tiden, men upphör om inga fiender finns i närheten under några turer. När den upphör minskar oanvänd sköld nedkylningen med upp till 50%%.\n\nÅterstående sköld: %1$d.\n\nAktuell nedkylning: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Krigaren har nyligen fått sköld från sitt brutna sigill och måste vänta innan han kan dra nytta av sköldeffekten igen.\n\nÅterstående turer: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Nedkylningen för Krigarens sköld är just nu negativ. När skölden aktiveras blir nedkylningen då kortare än de vanliga 150 turerna. Sköldens nedkylning kan minskas till så lite som −150 turer, vilket gör den tillgänglig igen direkt efter aktivering.\n\nAktuell nedkylning: %d.

items.dewdrop.name=daggdroppe
items.dewdrop.already_full=Du har redan full hälsa.
items.dewdrop.desc=En kristallklar daggdroppe.\n\nPå grund av platsens magi har rent vatten en svag återställande verkan.

items.equipableitem.curse_detected=Du känner att det vilar en förbannelse över föremålet precis innan du utrustar det!
items.equipableitem.unequip_cursed=Du kan inte ta bort ett förbannat föremål!
items.equipableitem.ac_equip=UTRUSTA
items.equipableitem.ac_unequip=TA AV

items.energycrystal.name=energikristall
items.energycrystal.desc=En samling små magiska kristaller fyllda med alkemisk energi.\n\nKristallerna är den vanligaste ingrediensen i alkemirecept och kan framställas i en alkemikruka genom att skrota förbrukningsföremål.

items.gold.name=guld
items.gold.desc=En hög med guldmynt. Samla guldmynt för att använda dem i en butik senare.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Kista
items.heap.chest_desc=Du vet inte vad som finns i den förrän du öppnar den!
items.heap.locked_chest=Låst kista
items.heap.locked_chest_desc=Du vet inte vad som finns i den förrän du öppnar den! Men du behöver en gyllene nyckel för att öppna den.
items.heap.crystal_chest=Kristallkista
items.heap.crystal_chest_desc=Du kan se _%s_ inuti, men du behöver en kristallnyckel för att öppna kistan.
items.heap.artifact=en artefakt
items.heap.wand=en trollstav
items.heap.ring=en ring
items.heap.tomb=Grav
items.heap.tomb_desc=Den här uråldriga graven kan innehålla något användbart, men dess ägare protesterar säkert om du undersöker den.
items.heap.skeleton=Skelettrester
items.heap.skeleton_desc=Det här är allt som finns kvar av en olycklig äventyrare. Det kanske är värt att leta efter värdesaker.
items.heap.remains=Hjältens kvarlevor
items.heap.remains_desc=Det här är allt som finns kvar av en av dina föregångare. Det kanske är värt att leta efter värdesaker.

items.honeypot.name=honeypot
items.honeypot.ac_shatter=KROSSA
items.honeypot.desc=Den här stora honungskrukan är inte bara fodrad med honung, utan rymmer också ett jättebi! Sådana enorma bin håller sig vanligen i sina kupor, så kanske är krukan en särskild fångstbur? Biet verkar rätt belåtet med sin honung i krukan och surrar vaksamt åt dig när du tittar på det.
items.honeypot$shatteredpot.name=krossad honungskruka
items.honeypot$shatteredpot.desc=Krukan har krossats. Bara den klibbiga honungen på insidan håller ihop den och den faller långsamt isär.\n\nTrots skicket verkar biet fortfarande vilja skydda krukan.

items.item.prompt=Välj kastriktning
items.item.ac_drop=SLÄPP
items.item.ac_throw=KASTA
items.item.rankings_desc=Dödad av: %s
items.item.curse=förbanna
items.item.custom_note_type=Den här typen av föremål har en egen anteckning: "_%s_"
items.item.custom_note="Det här föremålet har en egen anteckning: ""_%s_"""
items.item.discover_hint=Du kan hitta det här föremålet slumpmässigt i fängelsehålan.

items.kindofmisc.unequip_title=Ta av ett föremål
items.kindofmisc.unequip_message=Du måste först ta av ett av de här föremålen. Välj ett föremål att byta med.

items.kindofweapon.swift_equip=Du utrustar snabbt ditt vapen.
items.kindofweapon.equip_cursed=Ditt grepp stramas ofrivilligt åt runt vapnet.
items.kindofweapon.which_equip_msg=Vilken vapenplats vill du utrusta det här föremålet på?\n\nMästaren attackerar direkt med sitt primära vapen, men kan använda förmågan hos vilket vapen som helst. Båda vapnen delar samma antal laddningar.\n\nMästaren kan också omedelbart byta mellan sitt primära och sekundära vapen.
items.kindofweapon.which_equip_primary=Primär (%s)
items.kindofweapon.which_equip_secondary=Sekundär (%s)
items.kindofweapon.empty=tom

items.kingscrown.name=Dvärgkungens krona
items.kingscrown.ac_wear=BÄR
items.kingscrown.naked=Olyckligtvis kan inte kronan förvandla dina underkläder.
items.kingscrown.upgraded=Kronan lyser starkt och sönderfaller sedan när din rustning förvandlas!
items.kingscrown.ratgraded=Råttkungens tassar lyser starkt när din rustning förvandlas!
items.kingscrown.desc=Den siste dvärgkungens krona lyser med enorm magisk energi.\n\nNär du bär den flödar kronans magi in i rustningen du har på dig och förvandlar den till en _unik episk rustning med särskilda förmågor._ Den nya rustningen behåller alla egenskaper från den ursprungliga rustningen.
items.kingscrown.discover_hint=Du kan få det här föremålet som byte från vissa fiender.

items.liquidmetal.name=flytande metall
items.liquidmetal.ac_apply=ANVÄND
items.liquidmetal.prompt=Välj ett kastat vapen
items.liquidmetal.already_fixed=Det där kastvapnet är redan i perfekt skick!
items.liquidmetal.apply=Du använder %d flytande metall för att reparera ditt kastvapen.
items.liquidmetal.desc=Den här magiska vätskan kan fylla sprickor och revor i ett kastvapen och återställa det till perfekt skick! Om en vapenuppsättning saknar ett vapen men i övrigt är helt reparerad kan flytande metall till och med ersätta det saknade vapnet.\n\nEtt vapen på nivå 1 kräver 10 flytande metall för att repareras helt, medan ett vapen på nivå 5 kräver 30. Varje uppgradering ökar också mängden metall som behövs med 35 %.\n\nFlytande metall kan inte reparera spetsarna på spetsade pilar.
items.liquidmetal.discover_hint=Du kan tillverka detta föremål via alkemi.

items.lostbackpack.name=förlorad ryggsäck
items.lostbackpack.desc=Det här är din förlorade packning. Samla upp den för att få tillbaka alla föremål du förlorade!

items.merchantsbeacon.name=handlarens fyr
items.merchantsbeacon.ac_use=ANVÄND
items.merchantsbeacon.desc=Den här märkliga dvärgiska tekniken låter dig kommunicera över stora avstånd.\n\nNär fyren har aktiverats kan du sälja föremål till Pixel Mart var du än är i fängelsehålan.\n\nMagin i fyren varar dock bara under en omgång, så använd den klokt.

items.stylus.name=arkansk griffel
items.stylus.ac_inscribe=INSKRIBERA
items.stylus.prompt=Välj en rustning
items.stylus.identify=Du måste först identifiera om rustningen är förbannad.
items.stylus.cursed=Griffelns magi fungerar inte på förbannad rustning.
items.stylus.inscribed=Du har inskriberat en glyf på rustningen med griffeln.
items.stylus.desc=Den här arkanska griffeln är gjord av en mörk, mycket hård sten. Med den kan du inskribera en magisk glyf på rustningen, men du kan inte välja vilken glyf det blir – griffeln väljer åt dig.

items.tengusmask.name=Tengus mask
items.tengusmask.ac_wear=BÄR
items.tengusmask.used=Masken upplöses när dess kraft flödar in i dig!
items.tengusmask.desc=Den här masken föll från Tengus ansikte när han dog. Du känner stor magisk kraft stråla från den. Var masken Tengus källa till styrka?\n\nNär du bär masken överförs dess enorma kraft till dig, så att du kan _välja en underklass för din hjälte._\n\nVilken underklass väljer du?
items.tengusmask.discover_hint=Du kan få det här föremålet som byte från vissa fiender.

items.torch.name=fackla
items.torch.ac_light=TÄND
items.torch.desc=En självklar del av äventyrsutrustningen: när fängelsehålan blir mörk kan en fackla visa vägen.

items.waterskin.name=vattenskinn
items.waterskin.ac_drink=DRICK
items.waterskin.collected=Du samlar daggdroppen i ditt vattenskinn.
items.waterskin.full=Ditt vattenskinn är fullt!
items.waterskin.empty=Ditt vattenskinn är tomt!
items.waterskin.desc=En behållare för vätska, tillverkad av läder och snöre, förseglad med en korkpropp.
items.waterskin.desc_water=Just nu innehåller vattenskinnet bara vanligt dricksvatten. Det finns säkert något i fängelsehålan som vattenskinnet kan lagra i stället.
items.waterskin.desc_heal=Vattenskinnet används just nu för att lagra läkande vatten. Ju fylligare vattenskinnet är, desto mer läks du omedelbart när du dricker ur det. Du dricker bara så mycket som du behöver.
items.waterskin.desc_full=Det fulla vattenskinnet verkar utstråla energi. Kanske kan det användas för att välsigna ett annat överlevnadsföremål?
items.waterskin.discover_hint=En av hjältarna börjar med det här föremålet.
items.quest.escapecrystal.injure_confirm=Okej (det här meddelandet visas inte igen i framtida omgångar)
