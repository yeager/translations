journal.document.adventurers_guide.title=Fängelsehålans mästarhandbok
journal.document.adventurers_guide.intro.title=Introduktion
journal.document.adventurers_guide.intro.body=Hälsningar, äventyrare! Du läser Fängelsehålans mästarhandbok. Den här guideboken används bäst som uppslagsbok och meddelar dig magiskt när det är lämpligt att läsa varje sida.\n\n(När dagboksknappen blinkar väljer du den för att läsa vad guideboken vill berätta. Vissa sidor saknas dock; kanske kan du hitta dem i fängelsehålan?)
journal.document.adventurers_guide.examining.title=Undersöka
journal.document.adventurers_guide.examining.body=Det är viktigt att studera fiender och omgivning i stället för att rusa in blint! Gör det till en vana att undersöka allt som är nytt.\n\n(Du kan undersöka genom att använda förstoringsglasknappen och sedan välja det du vill undersöka. Du kan också undersöka positiva och negativa effekter genom att välja deras ikoner.)
journal.document.adventurers_guide.surprise_attacks.title=Överraskningsattacker
journal.document.adventurers_guide.surprise_attacks.body=Överraskningsattacker träffar garanterat, vilket gör dem särskilt användbara mot undvikande fiender som ormar och vålnader.\n\nDu kan överraska fiender direkt efter att de passerat genom en dörröppning medan de jagar dig eller när de på annat sätt förlorar dig ur sikte.
journal.document.adventurers_guide.identifying.title=Identifiering av föremål
journal.document.adventurers_guide.identifying.body=Färgerna på drycker och symbolerna på skriftrullar skiljer sig åt i varje fängelsehåla. Oidentifierad utrustning kan uppgraderas eller förtrollas om du har tur, men den kan också vara förbannad!\n\nSkriftrullar för identifiering, uppgradering eller borttagning av förbannelser är mycket användbara om du vill minska risken med oidentifierad utrustning.\n\n(Du hittar en förteckning över alla föremål du identifierat på katalogfliken i dagboken.)
journal.document.adventurers_guide.food.title=Hantering av hunger
journal.document.adventurers_guide.food.body=Att ransonera effektivt är ett av de bästa sätten att förbättra dina överlevnadschanser. Du behöver inte alltid äta så fort du blir hungrig!\n\nNär du inte svälter återhämtar du hälsa långsamt, så om du äter när du har full hälsa går återhämtningen till spillo!\n\nOm du anpassar när du äter efter din hälsa räcker maten mycket längre.
journal.document.adventurers_guide.alchemy.title=Alkemi & prydnadssaker
journal.document.adventurers_guide.alchemy.body=Om du inte har nytta av ett förbrukningsföremål kan du använda det som alkemisk ingrediens eller omvandla det till universell alkemisk energi. Energigivande drycker och skriftrullar identifierar också föremålen!\n\nPrydnadssaker är en unik sorts utrustning som skapas och uppgraderas med alkemi. De tillverkas av en magisk prydnadssakskatalysator och lite alkemisk energi.\n\n(Den första alkemikrukan finns på fängelsehålans tredje eller fjärde våning. I närheten av krukorna finns även sidor från alkemireceptboken.)
journal.document.adventurers_guide.dieing.title=Hantera nederlag
journal.document.adventurers_guide.dieing.body=Att utforska fängelsehålor är farligt och de flesta äventyrare möter till slut sin död.\n\nTur hjälper, men de bästa äventyrarna använder varje litet knep för att öka sina chanser.\n\n(Bli inte nedstämd om du dör ofta; det här spelet är svårt! Fokusera på att lära dig spelet och stadigt bli bättre i stället för att vinna direkt.)
journal.document.adventurers_guide.searching.title=Söka
journal.document.adventurers_guide.searching.body=Fängelsehålor är fulla av hemliga dörrar och fällor som verkar osynliga vid första anblicken. Du kan lägga lite tid på att noggrant söka om du misstänker att en dörr eller fälla är gömd i närheten.\n\n(Du kan söka igenom alla rutor omkring dig genom att använda förstoringsglasknappen två gånger. Kanske finns det dolda dörrar nära platsen där du hittade den här sidan!)
journal.document.adventurers_guide.strength.title=Styrka
journal.document.adventurers_guide.strength.body=Det finns inte tid att träna med vapen och rustning du hittar i fängelsehålan, så du behöver råstyrka för att använda dem effektivt.\n\nStyrkedrycker och uppgraderingsskriftrullar är det effektivaste sättet att uppfylla styrkekraven för utrustning på högre nivåer.\n\nDet är viktigt att så småningom använda föremål på högre nivåer, men bortse inte från utrustning du kan använda redan nu.
journal.document.adventurers_guide.upgrades.title=Uppgraderingar
journal.document.adventurers_guide.upgrades.body=Ju djupare du går i fängelsehålan, desto viktigare blir det att använda magiskt uppgraderad utrustning på hög nivå, men du behöver också styrkan för att använda den effektivt.\n\nTrollstavar, ringar och artefakter kräver ingen styrka, men har begränsade användningar eller hjälper inte lika direkt i strid.\n\nAtt välja vad du uppgraderar väl är mycket viktigt för att överleva i början av fängelsehålan och skapa förutsättningar för framgång senare.
journal.document.adventurers_guide.looting.title=Effektiv plundring
journal.document.adventurers_guide.looting.body=Rum bakom låsta dörrar eller med hinder innehåller vanligen bättre byte. När ett hinder blockerar vägen kan du vanligen hitta ett föremål som hjälper på samma våning.\n\nI varje region med fem våningar finns alltid två styrkedrycker och tre uppgraderingsskriftrullar, så de visar hur väl du utforskar.\n\n(Du kan se en förteckning över landmärken och oanvända nycklar på dagboksfönstrets anteckningsflik.)
journal.document.adventurers_guide.levelling.title=Få erfarenhet
journal.document.adventurers_guide.levelling.body=När du går upp i nivå förbättras dina värden och du får talangpoäng, vilket kan göra stor skillnad i strid. Det är bäst att ha minst en nivå för varje våning i fängelsehålan.\n\nDet kan vara frestande att skynda fram och undvika utforskning eller strid, men då går du miste om förnödenheter och erfarenhet.\n\n(Du ser information om hjälten, inklusive erfarenhetspoäng, i statusrutan i spelgränssnittets hörn. Välj hjälteporträttet för ännu mer information.)
journal.document.adventurers_guide.positioning.title=Positionering
journal.document.adventurers_guide.positioning.body=Strategi är lika viktigt som utrustning. Svåra situationer, som att bli omringad, kan vanligen undvikas med god positionering.\n\nDe flesta fängelsehålor har till exempel smala korridorer som tvingar fienderna att slåss mot dig en i taget. Korridorerna har ofta också dörröppningar för överraskningsattacker!\n\nDu kan även använda miljödetaljer som gräs, vatten, gropar och fällor på många små sätt till din fördel.
journal.document.adventurers_guide.magic.title=Magiska attacker
journal.document.adventurers_guide.magic.body=Magiska attacker går rakt genom rustning och är svåra att undvika. Skada från trollstavar är därför mycket pålitlig, men magiska fiender är också mycket farliga!\n\nMagiska attacker har dock alltid en nackdel. Trollstavar har begränsade laddningar och magiska fiender kan vanligtvis inte använda sin magi på nära håll.\n\nNär du möter fiender som använder magi är det viktigt att lära sig hindra dem från att använda den mot dig.

journal.document.alchemy_guide.title=Alkemiguide
journal.document.alchemy_guide.potions.title=Introduktion och drycker
journal.document.alchemy_guide.potions.body=Välkommen till Alkemins praktiska tillämpningar! Den här boken är en uppslagsbok med recept för att tillverka föremål vid en alkemikruka.\n\nVi börjar med det mest klassiska receptet: drycker!\n\nAnvänd tre frön för att brygga en slumpmässig dryck. Varje frö har en motsvarande dryck; använd flera av samma frö för att öka chansen att drycken hör ihop med fröna du använde.
journal.document.alchemy_guide.stones.title=Skapa runstenar
journal.document.alchemy_guide.stones.body=Om du blandar en skriftrulle i en alkemikruka överförs dess magi till två stenar i krukan. Detta skapar runstenar och identifierar skriftrullen!
journal.document.alchemy_guide.energy_food.title=Energi och mat
journal.document.alchemy_guide.energy_food.body=Många recept kräver kristallisk alkemisk energi, som framställs genom att demontera förbrukningsföremål i en alkemikruka. Energigivande drycker eller skriftrullar identifierar också föremålen.\n\nVissa recept som kräver energi är magiska, men de här liknar traditionell matlagning.
journal.document.alchemy_guide.exotic_potions.title=Exotiska brygder
journal.document.alchemy_guide.exotic_potions.body=Drycker kan blandas med energi för att skapa exotiska drycker. De har kraftfullare effekter, men är ofta användbara på andra sätt.
journal.document.alchemy_guide.exotic_scrolls.title=Exotiska skriftrullar
journal.document.alchemy_guide.exotic_scrolls.body=Exotiska skriftrullar kan tillverkas med lite energi och en skriftrulle. De är lite starkare och dyrare än exotiska drycker.
journal.document.alchemy_guide.bombs.title=Förstärkta bomber
journal.document.alchemy_guide.bombs.body=En vanlig svartkrutsbomb kan blandas med ett specifikt ämne för att skapa en förstärkt bomb.
journal.document.alchemy_guide.weapons.title=Förbättra vapen
journal.document.alchemy_guide.weapons.body=Vissa lättare eller mer magiska vapen kan användas i alkemi!\n\nVarje uppsättning kastvapen ger tillräckligt med flytande metall för att helt reparera en annan uppsättning med samma nivå och rang. Observera att om du omvandlar en uppsättning med alkemi förstörs hela uppsättningen, även om den inte är komplett!\n\nEn trollstav ger tillräckligt med arkanskt harts för att uppgradera två trollstavar på samma nivå, dock högst till +3.
journal.document.alchemy_guide.brews_elixirs.title=Brygder och elixir
journal.document.alchemy_guide.brews_elixirs.body=Brygder och elixir är avancerade drycker med olika effekter, som vanligtvis bara kan användas en gång.
journal.document.alchemy_guide.spells.title=Trollformler
journal.document.alchemy_guide.spells.body=Trollformler finns i kristaller och ger olika effekter, oftast med flera användningsområden.

journal.document.intros.title=Regionsintroduktioner
journal.document.intros.discover_hint=Du hittar den här texten när du går in i en viss region för första gången.
journal.document.intros.dungeon.title=Fängelsehåla
journal.document.intros.dungeon.body=Många hjältar från staden ovanför har vågat sig in i fängelsehålan före dig, men de flesta har aldrig hörts av igen.\n\nDet sägs att en uråldrig ondska lurar i djupet och vaktar den allsmäktiga Yendors amulett. Än i dag strålar mörk energi upp från djupet mot staden.\n\nKommer du att erövra fängelsehålan och ta amuletten? Det är dags att börja ditt eget äventyr!
journal.document.intros.sewers.title=Kloaker
journal.document.intros.sewers.body=De övre våningarna i fängelsehålan utgör faktiskt stadens kloaksystem.\n\nEftersom mörk energi har sipprat upp från underjorden har de vanligtvis ofarliga kloakvarelserna blivit allt mer aggressiva. Staden har varit tvungen att skicka vaktpatruller hit för att försöka upprätthålla säkerheten för dem som befinner sig ovan jord.\n\nDet här är en farlig plats, men åtminstone är den onda magin som verkar här svag.
journal.document.intros.prison.title=Fängelse
journal.document.intros.prison.body=För många år sedan byggdes här ett fängelse för farliga brottslingar. Det var strängt reglerat och säkert; fångar från hela landet fördes hit för att avtjäna sina straff.\n\nMen snart började ett mörkt miasma stiga från underjorden och förvränga såväl vakters som fångars sinnen.\n\nSom svar på det växande kaoset spärrade staden av hela fängelset. Ingen vet vad som hände dem som lämnades att dö inom murarna …
journal.document.intros.caves.title=Grottor
journal.document.intros.caves.body=De här glest befolkade grottorna sträcker sig ned under det övergivna fängelset. De är rika på mineraler och var en gång ett centrum för livlig handel och industri i dvärgsamhället nedanför, men övergavs när dvärgarna blev besatta av mörk magi.\n\nGrottorna bebos nu mest av underjordiska djur, gnoller och övergivna maskiner, troligen fördärvade av samma kraft som påverkat regionerna ovanför.
journal.document.intros.city.title=Dvärgarnas metropol
journal.document.intros.city.body=Dvärgarnas metropol var en gång den största av alla dvärgstäder. Under sin storhetstid byggde dvärgarna fantastiska maskiner av metall och magi som gjorde att deras stad kunde expandera snabbt.\n\nMen en dag stängdes stadens portar och ingen hörde mer från dvärgarna. De få som lyckades fly från staden berättade om en galen häxmästare som stulit tronen och om den fruktansvärda magi han lärt sig att använda.
journal.document.intros.halls.title=Demonhallarna
journal.document.intros.halls.body=De djupa salarna i dvärgarnas metropol har förvrängts av mörk magi. Förr hyste regionerna dvärgkungens hov av elithäxmästare, men nu verkar något ännu mer ondskefullt ha tagit över …\n\nAlla slags fasansfulla demoniska varelser bebor salarna och leds av någon fruktansvärd mörk kraft. Om dvärgkungen inte är källan till den spridande fördärvningen måste något här nere vara det.\n\nGå försiktigt; mycket få äventyrare har någonsin kommit så här långt ned …
journal.document.intros.halls.discover_hint=Du hittar den här texten i en viss region, men först efter att du har hittat alla tidigare texter i uppsättningen.

journal.document.sewers_guard.title=Vaktens brev
journal.document.sewers_guard.discover_hint=Du hittar den här texten i en viss region, men först efter att du har hittat alla tidigare texter i uppsättningen.
journal.document.sewers_guard.new_position.title=Min nya tjänst!
journal.document.sewers_guard.new_position.body=85:e höstmånaden, 375\nKära mamma och pappa,\n\nJag sa ju att allt hårt arbete hos stadsvakten skulle löna sig. Jag har just blivit befordrad!\n\nJag har blivit inbjuden att gå med i ett specialteam som arbetar i kloakerna. Tydligen finns det problem med skadedjur och laglösa där nere och det är vårt jobb att rensa ut dem. Det är ett smutsigt arbete, men kloakerna är varma på vintern och lönen är tre gånger högre än för vanlig vakttjänst!\n\nAllt är dock lite hemligt, så jag kan egentligen inte skicka brevet. Det känns konstigt att inte skriva till er, så jag fortsätter ändå. Kanske kan jag visa breven för er en dag.\n\nHälsningar\n– Sonya
journal.document.sewers_guard.dangerous.title=En farlig tjänst …
journal.document.sewers_guard.dangerous.body=88:e höstmånaden, 375\nKära mamma och pappa,\n\nNu förstår jag varför lönen är så bra: kloakerna kryllar av monster! ”Skadedjuren” och ”de laglösa” är gigantiska blodtörstiga råttor och flockar av arga gnoller.\n\nSom tur är vet resten av teamet verkligen vad de gör. Vår lagkapten Thomas är expert på det här. Jag försöker lära mig snabbt så att jag inte blir alltför betungande.\n\nArbetet är mycket farligare än jag trodde. Jag är glad att jag inte kan skicka breven nu; jag vill inte att ni ska oroa er.\n\nJag ska vara försiktig,\n– Sonya
journal.document.sewers_guard.crabs.title=Jättekrabbor!
journal.document.sewers_guard.crabs.body=11:e vinterdagen, 376\nKära mamma och pappa,\n\nSom om råttorna inte var nog finns det jättekrabbor längre ned! En av dem rusade förbi mig och skadade Lee ganska svårt innan vi dödade den. Thomas säger att det inte är mitt fel, men jag vet att han bara försöker vara snäll.\n\nSom tur var mötte vi på vägen ut en äventyrare som hade lite överbliven solgrässalva. Lee hade kanske inte klarat sig utan den.\n\nJag såg att äventyraren stirrade på en ros innan hen gick. Hen sa att den var en gåva. Varför skulle hen riskera livet här nere om någon bryr sig så mycket om hen?\n\nDet är precis vad jag gör, eller hur? Jag känner mig helt överväldigad.
journal.document.sewers_guard.guild.title=Tjuvarnas gille
journal.document.sewers_guard.guild.body=23:e vinterdagen, 376\nKära mamma och pappa,\n\nInga nya monster den här gången. I stället stötte vi på en liten grupp från tjuvgillet under patrullen.\n\nAllt jag hört om gillet är dåligt, men resten av teamet verkade nästan vänskapligt inställda till dem. Thomas utbytte information och förnödenheter med en av dem innan vi gick skilda vägar.\n\nJag förstår inte. Skulle vi inte göra oss av med laglösa? Thomas sa till och med att vi inte skulle nämna det för någon i befälet. Informationen och förnödenheterna var dock mycket användbara, och vi klarade inte fler strider.\n\nJag antar att vi alla sitter i samma båt här nere.
journal.document.sewers_guard.lost.title=Vi är vilse
journal.document.sewers_guard.lost.body=40:e vinterdagen, 376\n\nThomas och jag har gått vilse. Vi drevs bort från resten av teamet när vi stred mot några gnoller. Ingen av oss är skadad, men de nedre kloakerna är som en labyrint.\n\nThomas säger att han känner till en väg ut, men den börjar vid den gamla fängelseingången längst ned i kloakerna. Jag vill verkligen inte gå djupare, men vi har inga ransoner och det går mycket snabbare att gå ned än att vandra runt och leta efter patrullen.\n\nDet kommer att gå bra. Thomas vet vad han gör.
journal.document.sewers_guard.not_worth.title=Det är inte värt det
journal.document.sewers_guard.not_worth.body=Thomas och jag stötte på någon sorts enormt slemmonster vid fängelseingången. Innan vi hann reagera besköts vi med magi. Thomas tog merparten av det. Han är borta.\n\nInga pengar i världen är värda det här. Jag tänker ge mig av via vägen Thomas berättade om. Sedan ska jag använda det jag tjänat som vakt till att flytta bort mina föräldrar och mig från den här förbannade staden. En del av mig vill hoppas att kungen har en plan, men jag tvivlar.\n\nJag lämnar de här breven som en varning till andra. Det är mer än bara jätteråttor och krabbor; något är mycket fel här nere.

journal.document.prison_warden.title=Vaktchefens dagbok
journal.document.prison_warden.discover_hint=Du hittar den här texten i en viss region, men först efter att du har hittat alla tidigare texter i uppsättningen.
journal.document.prison_warden.journal.title=Föra en dagbok
journal.document.prison_warden.journal.body=1:a vårdagen, 362\n\nDetta är första anteckningen i fängelsechef Kiana Smiths arbetsdagbok. Med tanke på allt som hänt på sistone har jag beslutat att börja föra dagbok för att hålla ordning på tankarna.\n\nDet har aldrig varit lätt att sköta ett fängelse en halv engelsk mil under jord, men på sistone verkar någon sorts organiserade störningar förekomma. Fångarna har börjat agera ut utan anledning och vägrar sedan förklara varför.\n\nNågra vakter börjar säga att platsen är hemsökt. Jag kan inte låta min egen personal sprida rykten, men jag kan inte direkt klandra dem för att känna oro.\n– Smith
journal.document.prison_warden.recruits.title=Nya rekryter
journal.document.prison_warden.recruits.body=80:e vårdagen, 362\n\nSom utlovat anlände en grupp nya rekryter i dag. Det verkar vara som vanligt: några lovande och många grobianer som bara vill ha lönen. All denna nya muskelkraft borde ändå hjälpa mycket med våra besvärliga fångar.\n\nI ett arbete som detta är det viktigt att veta vem man kan lita på. En nyanställd, Thomas, verkar särskilt lovande. Jag behöver all hjälp jag kan få just nu, så om han sköter sig väl ska jag se till att han snabbt blir befordrad.\n– Smith
journal.document.prison_warden.mines.title=Försegling av gruvorna
journal.document.prison_warden.mines.body=54:e vinterdagen, 363\n\nEn grupp ingenjörer från staden kom i dag och sa att de var här för att spärra av den gamla ingången till gruvorna nedanför. Jag antar att staden inte längre vill underhålla passagen. Jag blev som vanligt inte informerad i förväg.\n\nDeras chefsingenjör berättade också nonsens om att dvärgisk magi läcker in från gruvorna. Jag tror inte ett ord på det.\n\nSituationen är mycket mer under kontroll med vår nya personal, men grundorsaken har fortfarande inte åtgärdats. Något påverkar definitivt fångarna här, och att riva några väggar ändrar inte på det.\n– Smith
journal.document.prison_warden.rotberry.title=Rotbärväxt
journal.document.prison_warden.rotberry.body=23:e höstmånaden, 363\n\nJag fick en fin present av Felix i dag. Det är en slags klarröd buske som kallas ”rötbär”.\n\nJag har tidigare nämnt för honom hur trist det är här, och han verkar ha lyssnat. Enligt honom ogillar växten både ljus och vatten, så jag behöver bara beskära den ungefär en gång i månaden. Beskärningen måste vara viktig, för han nämnde den ett dussin gånger i brevet.\n\nFelix gör förstås aldrig något gratis. Han säger att fröna växten ger är utmärkta för att göra trollstavar, så jag är naturligtvis skyldig honom några varje gång växten ger frön.\n– Smith
journal.document.prison_warden.no_support.title=Inget stöd
journal.document.prison_warden.no_support.body=11:e vårdagen, 364\n\nVad i helvete tänker staden på? Efter att skyndsamt ha begärt hjälp har jag inte hört ett ljud, inte ens en tom ursäkt som de brukar skicka när mina begäranden avslås.\n\nUnder tiden fortsätter fångarna att bli värre och några av vakterna har till och med börjat ställa till problem. Tänker de bara låta det här förvärras tills vi måste hantera ett upplopp?!\n\nThomas har åtminstone varit pålitlig som alltid. Hans organisatoriska hjälp har varit ovärderlig och hans idé att aktivera de gamla DM-100-enheterna var beklaglig, men nödvändig. Jag är säker på att jag kan få kontroll över situationen igen. Jag behöver bara lite förbannat stöd!\n– Smith
journal.document.prison_warden.letter.title=Brev till Thomas
journal.document.prison_warden.letter.body=Thomas,\n\nDu har varit en god vän, så jag gör dig en tjänst.\n\nNär du börjar kvällspasset låser och förstärker du Tengus cell, kastar nyckeln i en nisch och ger dig av. Det spelar ingen roll om de andra fångarna lämnas utan uppsikt; snart kan ändå ingen lämna platsen. Den där galningen måste hållas inlåst, för om han flyr finns det ingen gräns för vad han kan göra.\n\nBerätta inte detta för någon och bry dig inte om att leta efter mig. En kapten måste gå under med sitt skepp.\n– Kiana

journal.document.caves_explorer.title=Upptäckarens loggbok
journal.document.caves_explorer.discover_hint=Du hittar den här texten i en viss region, men först efter att du har hittat alla tidigare texter i uppsättningen.
journal.document.caves_explorer.expedition.title=Expeditionen börjar!
journal.document.caves_explorer.expedition.body=1:a sommardagen, 308\n\nI dag börjar vår fyra veckor långa expedition till de övergivna dvärggruvorna! Kungen själv har gett mig i uppdrag att utforska regionen. Mina främsta mål är att hitta outnyttjade naturresurser och undersöka grottorna för ett möjligt fängelsebygge.\n\nJag kan försvara mig själv, men på kungens insisterande har jag accepterat en eskort från stadsvakten. De är en samling enfaldiga typer, men så länge de inte sinkar mig är deras närvaro uthärdlig.\n\nVi förväntas rensa kloakerna och nå gruvorna före kvällen.\n– Archibald Drummond, ärkemagiker vid södra trollkarlsinstitutet.
journal.document.caves_explorer.gold.title=Så mycket guld!
journal.document.caves_explorer.gold.body=4:e sommardagen, 308\n\nVåra första dagar har verkligen varit mycket givande! Efter att ha upprättat ett basläger gav vi oss ut för att utforska några av de övre delarna av den övergivna gruvan. Dvärgarna har lämnat efter sig gott om värdelöst skräp, men många grottväggar är också fulla av guld!\n\nTyvärr är vi inte de första här. Grottorna kryllar av aggressiva vilda djur, och flockar av gnoller verkar också vara intresserade av guldet. Jag erkänner att jag varit orättvis mot vakteskorten; de har visat sig vara mycket skickligare upptäcktsresande och livvakter än jag väntade mig.\n\nTrots framgången har vi fortfarande mycket av gruvorna kvar att utforska.\n– Archibald
journal.document.caves_explorer.troll.title=Träffade ett troll
journal.document.caves_explorer.troll.body=11:e sommardagen, 308\n\nEfter att ha påbörjat utforskningen av gruvornas mittparti stötte vi på ett vänligt ansikte! Nåja … relativt vänligt. Ett grottroll har inrättat en liten smedja där. Han är burdus och fåordig, men reparerade vår utrustning i utbyte mot lite guld.\n\nTyvärr har trollsmeden också berättat att allt det vackra guldet inte är så bra som det verkar. Han kallar det ”mörkt guld”, och tydligen bryts det snabbt ned i solljus. Det förklarar säkert varför det aldrig funnits konflikter om resurserna här.\n\nJag antar att vi måste undersöka lite djupare om det finns något mer värdefullt.\n– Archibald
journal.document.caves_explorer.city.title=Stadsporten
journal.document.caves_explorer.city.body=21:a sommardagen, 308\n\nVi har nu varit här i tre veckor, och efter att ha ägnat större delen av de senaste tio dagarna åt att kartlägga allt djupare har vi äntligen nått gruvornas botten. Vi fann olika metallkonstruktioner och en stor port som blockerar ingången till den gamla dvärgmetropolen.\n\nSmeden varnade oss för en del av maskineriet. Det var tydligen avsett för områdesförsvar och har en tendens att aktiveras när det störs. Vi har inget att göra i staden och metallen har ringa skrotvärde, så vi ansåg det bäst att följa hans varning och vända tillbaka.\n\nJag måste erkänna att jag var nyfiken, men att undersöka det där nere var sannerligen inte värt risken.\n– Archibald
journal.document.caves_explorer.alive.title=Den lever!
journal.document.caves_explorer.alive.body=23:e sommardagen, 308\n\nEn av dvärgarnas maskiner vaknade på något sätt till liv! Vi var bara på väg förbi när den rusade fram och nästan krossade två av våra gruppmedlemmar med sina enorma metallnävar. Turligt nog hade jag min upplösningsstav med mig. Några välriktade skott från den och den bestialiska varelsen förvandlades till skrot.\n\nDet som oroar mig är att vi inte gjorde något som helst för att provocera maskinen. Dvärgarna kan omöjligen ha konstruerat maskinerna så aggressiva, det var som om den försökte överraska oss!\n\nÅtminstone kunde jag hjälpa mina kamrater för en gångs skull.\n- Archibald
journal.document.caves_explorer.report.title=Slutrapport
journal.document.caves_explorer.report.body=28:e sommardagen, 308\n\nI dag avslutar vi packningen och förbereder avfärden. Det är också på tiden, eftersom flera i gruppen har börjat få hemska mardrömmar efter incidenten med den aggressiva maskinen. Det är nog bara utmattning, men mardrömmarna är oroväckande lika.\n\nSammanfattningsvis är gruvans övre delar ganska säkra. Om mörkt guld kan användas till något kan brytningen bli ganska lönsam. De stora öppna utrymmena passar också väl för stadens byggplaner. De nedre gruvorna är däremot farligare och bör undvikas.\n\nJag skriver in allt detta i slutrapporten under de kommande dagarna.\n– Archibald

journal.document.city_warlock.title=Häxmästarens dagbok
journal.document.city_warlock.discover_hint=Du hittar den här texten i en viss region, men först efter att du har hittat alla tidigare texter i uppsättningen.
journal.document.city_warlock.old_king.title=Kungen är död
journal.document.city_warlock.old_king.body=Det är magins tidsålders 33:e års andra månads femte dag. Om någon från övervärlden läser detta är det någon gång under vintern år 264. Jag heter Thymor Zahir, och såvitt jag vet är jag den siste överlevande medlemmen av dvärgarnas hov.\n\nVår kung är död och har ersatts av en av mina tidigare kollegor som blivit maktgalen. Resten av hovet underkastade sig honom som de dårar de är, och förlorade sin fria vilja i processen. Jag var den ende som förutsåg detta och flydde innan hans ritual kunde fullbordas.\n\nDen inre kretsen har fallit, men den nya kungens makt har ännu inte nått alla. Jag måste organisera ett motstånd så fort som möjligt. Jag vägrar låta vår strålande civilisation falla för den här megalomanen!
journal.document.city_warlock.resistance.title=Ett motstånd
journal.document.city_warlock.resistance.body=Rykten verkar ha spridits snabbt. Det har bara gått några dagar och jag har redan samlat en liten armé av dem som är lojala mot den gamle kungen. Få är skickliga i magi, men nästan hela orden av krigarmunkar är med oss. Vi borde vara mer än en match för en galen dvärg och hans hov av slavar.\n\nUnder tiden har den nye kungen gömt sig i de inre kamrarna i vår stad. Han har säkert förbrukat större delen av sin makt och hoppas återhämta sig innan han möter mer motstånd.\n\nVi inleder attacken om ett par timmar. Med tur kan vi bilda ett övergångsråd och återföra vår fantastiska stad till stabilitet innan natten är slut.
journal.document.city_warlock.failure.title=Misslyckande
journal.document.city_warlock.failure.body=Det verkar som att även jag är en dåre. Jag antog att den nye kungen behövde att hovet underkastade sig frivilligt, men nu ser jag att han har makt att kontrollera även dem som står emot honom.\n\nJag förde blint alla de starkaste motståndarna till hans dörr, så att han personligen kunde förvandla dem till sina slavar. Nu sköljer vågor av hans nekrotiska energi över staden och förvandlar de flesta till hans underdåniga.\n\nDe få som fortfarande har fri vilja flyr. Jag har valt att stanna kvar för att observera så gott jag kan och leta efter en öppning. Med min magiska kraft borde jag kunna hålla mig gömd och säker ett tag.
journal.document.city_warlock.more_powerful.title=Mer kraftfull
journal.document.city_warlock.more_powerful.body=Det har blivit svårt att hålla reda på tiden, men det har gått ungefär en vecka sedan mitt senaste inlägg. Vår civilisation har verkligen kollapsat. Portarna är stängda, alla funktioner i vårt samhälle har upphört och tomma dvärgskal vandrar omkring i hallarna.\n\nMitt i allt detta blir den nye kungen på något sätt ännu mäktigare. Varje dag blir hans vilja starkare, men den förändras också. Jag kan inte beskriva det, men det känns som om han inte längre är en dvärg.\n\nJag börjar acceptera att det bästa jag kan hoppas på är att dokumentera dessa händelser. Jag kommer att stanna här så länge jag kan och sedan dra mig tillbaka när min vilja börjar svikta.
journal.document.city_warlock.new_power.title=En ny kraft
journal.document.city_warlock.new_power.body=Vad är det som händer här? Den kraft som utstrålar från den nye kungen är verkligen annorlunda än först, men det är något annat också. Denna nya kraft verkar stråla ut från de innersta salarna i vår stad.\n\nÄnnu mer förbryllande är att aktiviteten i den övre delen av metropolen också har minskat. Jag vet inte vad som händer där nere, men det är något som nästan helt upptar den nye kungens uppmärksamhet.\n\nDet är farligt att återvända till de djupa salarna, men jag måste ta reda på vad som orsakar denna förändring. Kanske har den nye kungen trots allt en svaghet?
journal.document.city_warlock.seen_it.title=Jag har sett den
journal.document.city_warlock.seen_it.body=Jag har sett vad som finns där nere, men kan inte beskriva det. Händerna skakar okontrollerat när jag försöker skriva ned mina tankar.\n\nVarför händer detta? Gjorde den nye kungen det? Det är obegripligt. Kanske lockade hans hänsynslösa maktutövning till sig det? Jag hoppades kunna rädda vår civilisation, men nu förstår jag att hela världen står på spel.\n\nPå något vis är kungen det mindre onda. Jag har inget annat val: för det större godas skull överlämnar jag mig själv. Vägled mig, min kung; använd mig som ett redskap för att hålla Yog-Dzewa på avstånd!

journal.document.halls_king.title=???s dagbok
journal.document.halls_king.discover_hint=Du hittar den här texten i en viss region, men först efter att du har hittat alla tidigare texter i uppsättningen.
journal.document.halls_king.rejection.title=Avvisande
journal.document.halls_king.rejection.body=IDIOTER!\n\nUnder de senaste 33 åren har vårt kungarike blomstrat tack vare vår nya magiska teknik. Vi har lärt oss att frammana elementarandar och böja dem efter vår vilja, men på något vis är fortsatt experimenterande nu ”för farligt”.\n\nJag vet vad som verkligen pågår. Avvisandet av mina teorier har inget med deras värde att göra, utan allt med personen som föreslår dem. De skrattar säkert åt mig bakom min rygg.\n\nMen inte längre! Jag bryr mig inte om vad de säger. Jag ska ensam utforska de yttersta delarna av universum och behålla allt jag upptäcker för mig själv!\n– R.
journal.document.halls_king.amulet.title=Amuletten
journal.document.halls_king.amulet.body=JAG HAR GJORT DET!\n\nJag visste inte exakt vad jag skulle finna, men upptäckten där ute överträffade mina vildaste spekulationer. Så mycket makt, bara liggande där, redo att tas. Allt är mitt!\n\nMed den vågar ingen av dårarna vid hovet motsätta sig mig. Jag blir alldeles yr av att tänka på alla sätt jag kan förödmjuka dem. Fan, varför stanna där? Jag har makt nog att förgöra varenda en om jag vill! Det kanske är överdrivet, men jag får inte ta för lång tid på mig att bestämma mig, annars blir de misstänksamma.\n\nJag tror att jag kallar den här stora makten Yendors amulett!\n– R.
journal.document.halls_king.ritual.title=Ritualen
journal.document.halls_king.ritual.body=Thymor konfronterade mig offentligt tidigare i dag och krävde att jag skulle förklara min nya maktkälla. Jag avfärdade honom så gott jag kunde, men återigen känner jag resten av hovets dömande blickar.\n\nJag hade hoppats att få njuta lite längre av lugnet före stormen, men det spelar egentligen ingen roll. Jag har bestämt mig. Jag påstår att jag fått makten genom en ny ritual och erbjuder mig att utföra den på de andra häxmästarna och kungen. När ritualen är över är jag kung!\n\nThymor protesterar förstås, men med så mycket makt att vinna tvivlar jag på att de lyssnar på honom!\n\nALLA SKA BÖJA SIG FÖR MIG!\n– Dvärgarnas blivande kung
journal.document.halls_king.new_king.title=En ny kung
journal.document.halls_king.new_king.body=JAG ÄR KUNG, AHAHAHAHAAA!\n\nDe lät mig bara göra det! Utan mycket övertalning gick de med på att låta mig ”dela” makten med dem i en storslagen ritual. På ett ögonblick förvandlades de från en kör av hånfulla röster till mitt nya hov av tysta undersåtar!\n\nSom väntat flydde Thymor som en fegis vid första tecknet på problem. Jag känner redan motståndet han bygger upp. Jag låter honom nog fortsätta, så att han kan leverera alla sina sammansvurna direkt till min dörr!\n\nKungariket respekterar uppenbarligen inte mig heller, så det ska jag åtgärda.\n– Dvärgarnas kung
journal.document.halls_king.thing.title=Varelsen
journal.document.halls_king.thing.body=Det finns ett problem. Thymor oskadliggjordes utan ansträngning, men mitt letande i de yttre planen gick tydligen inte obemärkt förbi.\n\nNågon … ”varelse” … har dragits till min värld och börjar tränga igenom vid botten av de nedre salarna. Som om inte det vore nog förvarade jag amuletten just där! Vilken illvillig varelse. Varför måste den försöka beröva mig min makt när det fortfarande finns så mycket där ute att ta?\n\nTrots min makt tror jag inte att jag bara kan storma in och bekämpa den. Dess sanna kraft är ofattbar, men det måste finnas ett sätt att begränsa den. JAG SKA FÖRSVARA MIN SKATT!
journal.document.halls_king.attrition.title=Utnötning
journal.document.halls_king.attrition.body=Jag har en plan för att hantera varelsen. Dess makt är oändlig, men inte dess förmåga att tränga in i den här världen. Den förlitar sig på hantlangare och avatarer för att utföra sin vilja medan den försöker bygga upp tillräcklig kraft för att ta amuletten.\n\nÄven om jag inte har amuletten fysiskt har jag fortfarande full kontroll över dess makt. Med hela dvärgstaden till mitt förfogande har jag dessutom ett numerärt överläge. Jag kan helt enkelt fortsätta sända soldater för att hindra den från att ta amuletten och sakta vinna kriget genom utnötning!\n\nJAG, RODNEY, DVÄRGARNAS KUNG, SKA ÖVERLEVA DIG, YOG-DZEWA!

