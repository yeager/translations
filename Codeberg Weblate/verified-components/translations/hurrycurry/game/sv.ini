i.abstract = {_b}Skynda dig Curry!{_b_end} är ett samarbetsspel för flera spelare om matlagning. Du arbetar på en restaurang och tar emot beställningar, lagar olika rätter och serverar mat till kunder. Men dröj inte för länge, kunderna kan bli otåliga.
i.gameplay_overview = Kunder kommer in i din restaurang och beställer olika måltider. Din uppgift är att sätta ihop dessa måltider genom att skära, laga mat, baka, bryna och kombinera resurser i köket. Multitasking är avgörande, men kan leda till att maten bränns vid eller att kunderna lämnar om du tar för lång tid. Det finns många olika restaurang-/kökslayouter att välja mellan.
i.short_description = Ett spel om matlagning
