i.download = Hämta
i.features.par_1 = Avancerade matlagningssimuleringar i framkant, med {_num_recipes} olika recept! Laga mat, baka och hacka så mycket du vill. Låt inte kunderna svälta!
i.features.par_2 = Ju fler kockar, desto bättre! Hantera kaoset med samordning och kommunikation. Har du inga vänner? Inga problem! Hurry Curry har olika botar som gärna spelar med dig i stället.
i.features.par_3 = Utforska fler än 20 unika restaurangplaner, alla med olika utmaningar och hinder. Från bänkar som blockerar din väg till transportband som automatiskt levererar rätterna – de olika kartorna håller dig säkert på tårna!
i.features.par_4 = Punktliga matleveranser belönas! Varje karta har en topplista som visar de bästa resultaten hittills, så att du enkelt kan jämföra din prestation med andra lags. Om du vill, förstås.
