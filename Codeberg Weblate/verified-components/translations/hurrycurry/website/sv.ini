i.gameplay_overview.par = Kunder kommer in på din restaurang och beställer olika måltider. Din uppgift är att sätta ihop dem genom att skära, laga, baka, steka och kombinera råvaror i köket. Att göra flera saker samtidigt är avgörande, men kan leda till att maten bränns eller kunderna lämnar om du dröjer för länge. Det finns många olika restaurang- och köksplaner att välja mellan.
i.gameplay_overview = Översikt över spelupplägget
i.have_fun = Ha så kul!
i.how_it_works.step_1 = Gå fram till kunderna för att ta deras beställningar.
i.how_it_works.step_2 = Tillaga de begärda rätterna i köket.
i.how_it_works.step_3 = Servera maten och samla poäng.
i.how_it_works = Så fungerar det
i.how_to_play.par_1 = Installera först spelet med något av alternativen nedan. Anslut sedan till en server i spelet. För att få ut mest av spelet bör du nu bjuda in några vänner att spela med.
i.how_to_play.par_2 = När alla är redo väljer du en karta att spela på och startar spelet. Om du är ensam rekommenderas kartan ”Sophomore”. Fler instruktioner om kontroller och recept visas i spelet medan du spelar.
i.how_to_play = Så spelar du
