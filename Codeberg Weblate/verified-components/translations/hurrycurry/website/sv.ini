i.abstract = {_b}Hurry Curry!{_b_end} är ett samarbetsspel för flera spelare om matlagning. Du arbetar på en restaurang, tar emot beställningar, lagar olika rätter och serverar måltider till kunder. Men dröj inte för länge, eftersom kunderna kan bli otåliga. Spelet är fri programvara och licensieras endast under AGPL 3.0.
i.alt.cover_centered = Hurry Curry!-logotyp med fyrkantiga spelbrickor som bänkar, stolar och lådor svävande bakom.
i.alt.screenshot_1 = Två spelare i ett kök. Den ena bär mjöl, den andra tittar på en skärbräda.
i.alt.screenshot_2 = Närbild av två spelare som står bakom en bänk med sallad, tomat och hamburgare på. I bakgrunden steks en burgare i en panna, en tomat bearbetas i en mixer och två ugnar bakar.
i.alt.screenshot_3 = Vy ovanifrån av en karta med ett delat kök, sammankopplat med transportband. Det finns en spelare på vardera sidan.
i.alt.screenshot_4 = En spelare står i ett stort, öppet kök. Flera rätter tillagas i bakgrunden.
i.alt.step1 = En kock står bredvid en kund.
i.alt.step2 = En kock håller en stekpanna över en spis.
i.alt.step3 = En kock serverar mat till en kund. Kunden har stjärnpartiklar över sig.
