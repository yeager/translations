i.contribute.par = Du kan hjälpa till att göra spelet bättre genom att bidra med kod via pull requests på {_a_codeberg}Codeberg{_a_end}.
i.contribute.translate = Du kan också översätta spelet till ditt språk på {_a_weblate}Codebergs Weblate{_a_end}.
